n evento y qué acciones se realizaron. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Config — registra configuraciones de recursos", "Amazon Rekognition — analiza imágenes y videos", "AWS CloudTrail — registra quién hizo qué acción en qué servicio de AWS y cuándo, ideal para auditorías", "Amazon SNS — notificaciones y mensajería"], "correct": [2], "multi": false}, {"id": 559, "text": "¿Qué principios de diseño están incluidos en el pilar de fiabilidad (Reliability) del Marco de Buena Arquitectura de AWS? (Seleccione dos.)", "options": ["Recuperarse automáticamente de los fallos — detecta y recupera fallos sin intervención manual.", "Otorgar acceso a todos para aumentar las cuotas de servicio de AWS.", "Dejar de adivinar la capacidad — usa escalado automático para aprovisionar exactamente lo necesario.", "Diseñar aplicaciones para ejecutarse en una sola Zona de Disponibilidad.", "Planificar primero el aumento de cuotas de servicio en una región secundaria."], "correct": [0, 2], "multi": true}, {"id": 560, "text": "Una empresa necesita usar tecnología de AWS para desplegar un sitio web estático. ¿Qué solución cumple con este requisito con la MENOR cantidad de sobrecarga operativa?", "options": ["Desplegar el sitio web en Amazon EC2 — requiere gestionar instancias.", "Alojar el sitio web en AWS Elastic Beanstalk — más configuración que S3.", "Desplegar el sitio web con Amazon Lightsail — plataforma simplificada pero con más gestión que S3.", "Alojar el sitio web en Amazon S3 — alojamiento estático sin servidores, sin gestión de infraestructura."], "correct": [3], "multi": false}, {"id": 561, "text": "¿Qué recomendación puede proporcionar AWS Cost Explorer para ayudar a reducir costos?", "options": ["Usar un motor de base de datos específico.", "Cambiar el lenguaje de programación de una aplicación.", "Desplegar un sistema operativo específico.", "Terminar una instancia inactiva — Cost Explorer identifica instancias subutilizadas o inactivas para reducir costos."], "correct": [3], "multi": false}, {"id": 562, "text": "Una empresa quiere desplegar una aplicación en múltiples Zonas de Disponibilidad en una sola región de AWS. ¿Qué beneficio proporcionará este despliegue a la empresa?", "options": ["Mejor rendimiento de conexión para clientes globales", "Arquitectura resiliente y solución de alta disponibilidad — si una AZ falla, las otras siguen operando.", "Reducción de costos generales de almacenamiento de datos", "Capacidad de apagar una Zona de Disponibilidad durante períodos de baja demanda"], "correct": [1], "multi": false}, {"id": 563, "text": "¿Qué servicio de AWS pueden usar las empresas para suscribirse a feeds RSS para actualizaciones sobre todos los problemas del servicio de AWS?", "options": ["Amazon SNS — notificaciones y mensajería", "AWS Health Dashboard — proporciona feeds RSS con el estado de los servicios de AWS y actualizaciones de incidentes", "AWS Config — registra configuraciones de recursos", "AWS CodeCommit — repositorio Git gestionado"], "correct": [1], "multi": false}, {"id": 564, "text": "¿Qué término de compromiso de Instancias Reservadas de Amazon EC2 dará a los usuarios el MAYOR ahorro de costos?", "options": ["1 año — descuento menor", "2 años — no disponible en EC2", "3 años — el compromiso más largo disponible proporciona el mayor descuento", "5 años — no disponible en EC2"], "correct": [2], "multi": false}, {"id": 565, "text": "Una empresa ejecuta análisis de big data y cómputos paralelos masivos en sus servidores de prueba y desarrollo de AWS. La empresa puede tolerar interrupciones ocasionales. ¿Cuál es la opción de compra de Amazon EC2 MÁS rentable para que use la empresa?", "options": ["Instancias Bajo Demanda — sin descuento", "Instancias Spot — hasta 90% de descuento, toleran interrupciones, ideales para big data y cómputo paralelo", "Instancias Reservadas — compromiso a largo plazo", "Savings Plans — descuento por compromiso de uso"], "correct": [1], "multi": false}, {"id": 566, "text": "Una empresa ejecuta instancias de Amazon EC2 en un laboratorio de investigación. Las instancias se ejecutan durante 3 horas cada semana y no pueden ser interrumpidas. ¿Cuál es la opción de compra de instancias MÁS rentable para cumplir con estos requisitos?", "options": ["Compute Savings Plan — compromiso de uso a largo plazo (no rentable para 3 horas/semana)", "Instancias Bajo Demanda — pago por hora sin compromiso, ideal para uso semanal breve e ininterrumpible", "Instancias Reservadas Convertibles — compromiso de 1 o 3 años (no rentable para 3 h/semana)", "Instancias Spot — pueden interrumpirse (no adecuado)"], "correct": [1], "multi": false}, {"id": 567, "text": "Un nuevo usuario de AWS necesita interactuar con el soporte de AWS usando llamadas a la API. ¿Qué plan de AWS Support cumplirá con este requisito de la forma MÁS rentable?", "options": ["AWS Basic Support — no incluye acceso a soporte por API", "AWS Developer Support — incluye acceso al soporte de AWS a través de la API al menor costo posible", "AWS Business Support — incluye acceso a la API pero a mayor costo", "AWS Enterprise Support — el plan más completo pero también el más costoso"], "correct": [1], "multi": false}, {"id": 568, "text": "Una empresa migró a la nube de AWS. Ahora la empresa paga por los servicios según las necesita. ¿De qué ventaja de la computación en la nube se está beneficiando la empresa?", "options": ["Dejar de gastar dinero en ejecutar y mantener centros de datos", "Aumentar la velocidad y la agilidad", "Despliegue global en minutos", "Intercambiar gasto fijo por gasto variable — paga solo por lo que usa en lugar de grandes inversiones fijas."], "correct": [3], "multi": false}, {"id": 569, "text": "Una empresa ejecutará una carga de trabajo de cómputo predecible en instancias de Amazon EC2 durante los próximos 3 años. La carga de trabajo es crítica para la empresa. La empresa quiere optimizar los costos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Instancias Spot — pueden interrumpirse (no adecuado para carga crítica)", "Hosts Dedicados — mayor costo", "Savings Plans — descuento flexible por compromiso de uso a largo plazo para cargas predecibles", "Instancias Bajo Demanda — sin descuento por compromiso"], "correct": [2], "multi": false}, {"id": 570, "text": "Una empresa quiere estimar el costo de su solución de arquitectura de AWS antes de la migración. ¿Qué servicio o característica de AWS cumplirá con este requisito?", "options": ["Amazon Detective — investiga incidentes de seguridad", "AWS Budgets — alertas de presupuesto para costos actuales", "AWS Resource Explorer — busca recursos de AWS", "AWS Pricing Calculator — estima el costo de una solución de arquitectura antes de desplegarla"], "correct": [3], "multi": false}, {"id": 571, "text": "Una empresa quiere gestionar centralmente el acceso de sus empleados a múltiples cuentas de AWS. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS IAM Access Analyzer — identifica recursos compartidos externamente", "AWS Secrets Manager — gestiona credenciales", "AWS IAM Identity Center — gestiona centralmente el acceso a múltiples cuentas de AWS para todos los empleados", "AWS Security Token Service (STS) — genera credenciales temporales"], "correct": [2], "multi": false}, {"id": 572, "text": "Una universidad recibe una subvención para realizar investigación usando servicios de AWS. El equipo de investigación necesita asegurarse de que el dinero de la subvención dure todo el año escolar. El equipo ha decidido una asignación mensual que suma el monto total de la subvención. ¿Qué servicio o característica de AWS notificará al equipo si el gasto supera el monto planificado?", "options": ["AWS Budgets — configura alertas cuando el gasto supera los umbrales mensuales definidos", "Cost Explorer — analiza costos históricos (no envía alertas proactivas)", "Etiquetas de asignación de costos — categoriza costos (no envía alertas)", "Categorías de costos — agrupa costos (no envía alertas)"], "correct": [0], "multi": false}, {"id": 573, "text": "Una empresa ha migrado su carga de trabajo a la nube de AWS. La empresa quiere optimizar los recursos existentes de Amazon EC2. ¿Qué servicios o herramientas de AWS proporcionan esta funcionalidad? (Seleccione dos.)", "options": ["AWS Elastic Beanstalk — despliega y gestiona apps", "AWS Cost Explorer — incluye recomendaciones de rightsizing para instancias EC2", "Amazon Detective — investiga incidentes de seguridad", "AWS Compute Optimizer — analiza métricas de uso y recomienda el tipo e tamaño óptimo de instancias EC2", "AWS Billing Conductor — personaliza la facturación"], "correct": [1, 3], "multi": true}, {"id": 574, "text": "Una empresa con múltiples cuentas y equipos quiere configurar un nuevo entorno AWS multi-cuenta. ¿Qué servicio de AWS respalda este requisito?", "options": ["AWS CloudFormation — infraestructura como código", "AWS Control Tower — configura y gobierna entornos multi-cuenta de forma automatizada con mejores prácticas", "AWS Config — registra configuraciones de recursos", "Amazon VPC — red virtual privada"], "correct": [1], "multi": false}, {"id": 575, "text": "Una empresa necesita acceso a verificaciones y recomendaciones que ayuden a seguir las mejores prácticas de AWS para optimización de costos, seguridad, tolerancia a fallos, rendimiento y cuotas de servicio. ¿Qué combinación de un servicio de AWS y un plan de AWS Support cumplirá con estos requisitos?", "options": ["AWS Trusted Advisor con AWS Developer Support — acceso limitado a verificaciones", "AWS Health Dashboard con AWS Enterprise Support", "AWS Trusted Advisor con AWS Business Support — acceso al conjunto completo de verificaciones de Trusted Advisor", "AWS Health Dashboard con AWS Enterprise On-Ramp Support"], "correct": [2], "multi": false}, {"id": 576, "text": "¿Qué servicio de AWS ayuda a los usuarios a planificar y rastrear los datos de inventario de servidores y migración de aplicaciones a AWS?", "options": ["Amazon CloudWatch — monitoreo y observabilidad", "AWS DataSync — transfiere datos entre almacenamiento", "AWS Migration Hub — panel centralizado para planificar y rastrear el progreso de migraciones a AWS", "AWS Application Migration Service — migra aplicaciones a AWS"], "correct": [2], "multi": false}, {"id": 577, "text": "¿Qué equipo u oferta de AWS ayuda a los usuarios a acelerar la adopción de la nube a través de compromisos pagados en varias áreas de práctica especializadas?", "options": ["AWS Enterprise Support — plan de soporte técnico", "Arquitectos de soluciones de AWS — equipo de ventas técnicas", "AWS Professional Services — equipo de consultoría especializada para acelerar la adopción de la nube", "Gestores de cuentas de AWS — equipo de ventas"], "correct": [2], "multi": false}, {"id": 578, "text": "Una empresa necesita comprar instancias de Amazon EC2 para soportar una aplicación que se ejecutará continuamente durante más de 1 año. ¿Qué opción de compra de instancias EC2 cumple con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Dedicadas — hardware dedicado con mayor costo", "Instancias Spot — pueden interrumpirse", "Instancias Reservadas — hasta 72% de descuento con compromiso de 1 año para uso continuo", "Instancias Bajo Demanda — sin descuento por compromiso"], "correct": [2], "multi": false}, {"id": 579, "text": "¿Qué lenguajes de programación soporta actualmente AWS Cloud Development Kit (AWS CDK)? (Seleccione dos.)", "options": ["Python — lenguaje soportado por AWS CDK", "Swift — no soportado por AWS CDK", "TypeScript — lenguaje soportado por AWS CDK", "Ruby — no soportado por AWS CDK", "PHP — no soportado por AWS CDK"], "correct": [0, 2], "multi": true}, {"id": 580, "text": "¿Qué servicio o característica de AWS le da a los usuarios la capacidad de aprovisionar infraestructura de AWS de forma programática?", "options": ["AWS Cloud Development Kit (AWS CDK) — define y aprovisiona infraestructura de AWS usando lenguajes de programación como Python y TypeScript", "Amazon CodeGuru — revisa código y detecta problemas de rendimiento", "AWS Config — registra configuraciones de recursos", "AWS CodeCommit — repositorio Git gestionado"], "correct": [0], "multi": false}, {"id": 581, "text": "¿Qué servicio o característica de AWS permite a una empresa tener su propia sección lógicamente aislada de la nube de AWS?", "options": ["AWS VPN — conexión segura entre empresa y AWS", "Zonas de Disponibilidad — centros de datos físicamente separados", "Amazon VPC (Virtual Private Cloud) — sección de la nube de AWS lógicamente aislada y personalizable", "Regiones de AWS — áreas geográficas"], "correct": [2], "multi": false}, {"id": 582, "text": "¿Cuáles de las siguientes acciones se controlan con AWS IAM? (Seleccione dos.)", "options": ["Controlar el acceso a las APIs de servicios de AWS y a otros recursos específicos.", "Proporcionar detección inteligente de amenazas y monitoreo continuo.", "Proteger el entorno de AWS usando autenticación multifactor (MFA).", "Otorgar a los usuarios acceso a los centros de datos de AWS.", "Proporcionar protección de firewall para aplicaciones contra ataques web comunes."], "correct": [0, 2], "multi": true}, {"id": 583, "text": "¿Por qué se usan las plantillas de AWS CloudFormation?", "options": ["Para reducir el tiempo de aprovisionamiento mediante el uso de automatización — define la infraestructura como código y despliega de forma repetible.", "Para transferir la infraestructura existente a otra empresa.", "Para reutilizar infraestructura local en la nube de AWS.", "Para desplegar infraestructura de gran escala sin implicaciones de costos."], "correct": [0], "multi": false}, {"id": 584, "text": "Una empresa usa AWS IAM. ¿Quién puede gestionar las claves de acceso del usuario raíz de la cuenta de AWS?", "options": ["Usuarios de IAM en la misma cuenta que hayan recibido permiso.", "Roles de IAM en cualquier cuenta que hayan recibido permiso.", "Usuarios y roles de IAM que hayan recibido permiso.", "El propietario de la cuenta de AWS — solo el usuario raíz puede gestionar sus propias claves de acceso."], "correct": [3], "multi": false}, {"id": 585, "text": "¿Qué grupo comparte la responsabilidad con AWS en cuanto a seguridad y cumplimiento de las cuentas y recursos de AWS?", "options": ["Proveedores de terceros", "Clientes — el Modelo de Responsabilidad Compartida establece que los clientes comparten la responsabilidad de seguridad con AWS.", "Socios revendedores", "Proveedores de internet"], "correct": [1], "multi": false}], [{"id": 586, "text": "Una empresa necesita un historial de eventos sobre qué recursos de AWS ha creado la empresa. ¿Qué servicio de AWS proporcionará esta información?", "options": ["Amazon CloudWatch — monitoreo de métricas y logs", "AWS CloudTrail — registra todas las llamadas a la API incluyendo qué recursos se crearon, cuándo y por quién", "Amazon Aurora — base de datos relacional", "Amazon EventBridge — bus de eventos para automatización"], "correct": [1], "multi": false}, {"id": 587, "text": "Una empresa quiere ejecutar bases de datos relacionales en la nube de AWS. La empresa quiere usar un servicio gestionado que instale la base de datos y ejecute actualizaciones de software regulares. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon S3 — almacenamiento de objetos", "Amazon RDS — base de datos relacional completamente gestionada con actualizaciones automáticas del motor", "Amazon EBS — almacenamiento de bloques para EC2", "Amazon DynamoDB — base de datos NoSQL"], "correct": [1], "multi": false}, {"id": 588, "text": "¿Qué servicio de AWS proporciona una base de datos de grafos completamente gestionada para conjuntos de datos altamente conectados?", "options": ["Amazon DynamoDB — base de datos NoSQL", "Amazon RDS — base de datos relacional gestionada", "Amazon Neptune — base de datos de C2?", "options": ["AWS CloudTrail — registra llamadas a la API", "AWS Health Dashboard — estado de los servicios de AWS", "AWS Trusted Advisor — recomendaciones de optimización", "Amazon CloudWatch — monitorea métricas como escritura en disco de instancias EC2 en tiempo real"], "correct": [3], "multi": false}, {"id": 600, "text": "Una empresa tiene aplicaciones que controlan equipos de fábrica locales. ¿Qué servicio de AWS debe usar la empresa para ejecutar estas aplicaciones con la MENOR latencia?", "options": ["AWS Outposts — infraestructura AWS instalada en las instalaciones propias, proporcionando la menor latencia posible", "Amazon EC2 — instancias en la nube (mayor latencia que local)", "AWS Lambda — funciones en la nube (mayor latencia)", "AWS Fargate — contenedores en la nube (mayor latencia)"], "correct": [0], "multi": false}, {"id": 601, "text": "¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) se enfoca en organizar un inventario de productos de datos en un catálogo de datos?", "options": ["Operaciones (Operations)", "Gobernanza (Governance) — incluye gestión del portafolio de datos y catálogos de datos", "Negocio (Business)", "Plataforma (Platform)"], "correct": [1], "multi": false}, {"id": 602, "text": "Una empresa ejecuta su carga de trabajo de producción en la nube de AWS. La empresa necesita elegir uno de los planes de AWS Support. ¿Cuál de los planes de AWS Support cumplirá con estos requisitos al MENOR costo?", "options": ["Developer — solo para desarrollo, no producción", "Enterprise On-Ramp — mayor costo", "Enterprise — el más costoso", "Business — plan de soporte más básico recomendado para producción, con soporte 24/7 al menor costo de los planes para producción"], "correct": [3], "multi": false}, {"id": 603, "text": "¿Cuál es el caso de uso principal de Amazon GuardDuty?", "options": ["Prevención de ataques DDoS", "Protección contra ataques de inyección SQL", "Monitoreo automático de amenazas a cargas de trabajo de AWS — detecta actividad maliciosa y comportamientos anómalos", "Aprovisionamiento automático de recursos de AWS"], "correct": [2], "multi": false}, {"id": 604, "text": "¿Qué componente de VPC puede usar una empresa para configurar un firewall virtual a nivel de instancia de Amazon EC2?", "options": ["ACL de red — opera a nivel de subred", "Grupo de seguridad (Security group) — firewall virtual a nivel de instancia EC2", "Tabla de rutas — controla el enrutamiento del tráfico", "NAT Gateway — permite tráfico saliente desde subredes privadas"], "correct": [1], "multi": false}, {"id": 605, "text": "Un desarrollador necesita interactuar con AWS usando la AWS CLI. ¿Qué característica de seguridad o servicio de AWS debe aprovisionarse en la cuenta del desarrollador para cumplir con este requisito?", "options": ["Nombre de usuario y contraseña — para la consola web, no para la CLI", "AWS Systems Manager — gestiona infraestructura", "Acceso por contraseña root", "Clave de acceso de AWS (AWS access key) — par de clave de acceso y clave secreta para autenticar llamadas a la CLI y API"], "correct": [3], "multi": false}, {"id": 606, "text": "Una empresa de entrega de alimentos necesita bloquear a los usuarios de ciertos países para que no accedan a su sitio web. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS WAF — firewall de aplicaciones web con reglas geográficas para bloquear países específicos", "AWS Control Tower — configura entornos multi-cuenta", "Amazon Fraud Detector — detecta fraude en transacciones", "Amazon Pinpoint — comunicaciones de marketing"], "correct": [0], "multi": false}, {"id": 607, "text": "Una empresa necesita usar Amazon S3 para almacenar archivos de audio de 5 MB cada uno. La empresa raramente accederá a los archivos, pero debe poder recuperarlos inmediatamente. ¿Qué clase de almacenamiento S3 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["S3 Standard — para acceso frecuente, mayor costo", "S3 Standard-IA — acceso infrecuente con recuperación inmediata y menor costo que Standard", "S3 Glacier Flexible Retrieval — recuperación en horas (no inmediata)", "S3 Glacier Deep Archive — recuperación en 12 horas (no inmediata)"], "correct": [1], "multi": false}, {"id": 608, "text": "Una empresa quiere configurar una conexión de red segura desde instalaciones propias a la nube de AWS en menos de 1 semana. ¿Qué solución cumplirá con estos requisitos?", "options": ["AWS Direct Connect — requiere meses de aprovisionamiento de la conexión física", "Amazon VPC — red virtual privada en AWS", "AWS Site-to-Site VPN — se configura en minutos usando internet, ideal para conexión rápida", "Ubicación de borde (Edge location) — punto de presencia de CloudFront"], "correct": [2], "multi": false}, {"id": 609, "text": "¿Cuál es una responsabilidad del cliente bajo el Modelo de Responsabilidad Compartida de AWS cuando usa AWS Lambda?", "options": ["Mantenimiento del hardware subyacente de Lambda.", "Mantenimiento de la infraestructura de red de Lambda.", "El código y las bibliotecas que se ejecutan en las funciones Lambda — el cliente escribe y mantiene el código de sus funciones.", "El software del servidor Lambda."], "correct": [2], "multi": false}, {"id": 610, "text": "¿Cuáles tareas son responsabilidad de AWS de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Configurar AWS IAM.", "Configurar grupos de seguridad en instancias de Amazon EC2.", "Asegurar el acceso a las instalaciones físicas de AWS — AWS es responsable de la seguridad física de sus centros de datos.", "Parchear aplicaciones que se ejecutan en instancias de Amazon EC2.", "Realizar parches y mantenimiento de la infraestructura — AWS gestiona el hardware y la capa de infraestructura."], "correct": [2, 4], "multi": true}, {"id": 611, "text": "El oficial de cumplimiento de una empresa quiere revisar los informes de Control de Organización de Servicios (SOC) de AWS. ¿Qué servicio o característica de AWS debe usar el oficial de cumplimiento para completar esta tarea?", "options": ["AWS Artifact — portal para descargar informes de cumplimiento como SOC 1, SOC 2 y SOC 3", "AWS Concierge Support — soporte para facturación y cuentas (solo Enterprise)", "AWS Support — soporte técnico", "AWS Trusted Advisor — recomendaciones de optimización"], "correct": [0], "multi": false}, {"id": 612, "text": "Una empresa tiene un requisito de cumplimiento para registrar y evaluar cambios de configuración y realizar acciones de remediación en recursos de AWS. ¿Qué servicio de AWS debe usar la empresa?", "options": ["AWS Config — registra cambios de configuración, evalúa el cumplimiento y puede activar acciones de remediación automáticas", "AWS Secrets Manager — gestiona credenciales", "AWS CloudTrail — registra llamadas a la API (no evalúa cumplimiento de configuración)", "AWS Trusted Advisor — recomendaciones de optimización"], "correct": [0], "multi": false}, {"id": 613, "text": "Una empresa planea realizar una migración única de un gran conjunto de datos con millones de archivos desde su centro de datos local a la nube de AWS. ¿Qué servicio de AWS debe usar la empresa para la migración?", "options": ["AWS Database Migration Service (DMS) — migra bases de datos, no archivos genéricos", "AWS DataSync — transfiere grandes volúmenes de archivos de forma eficiente desde almacenamiento local a AWS", "AWS Migration Hub — rastrea el progreso de migraciones (no transfiere datos)", "AWS Application Migration Service — migra aplicaciones completas"], "correct": [1], "multi": false}, {"id": 614, "text": "¿Qué servicios o características de red de AWS permiten la notación de bloque CIDR al especificar un rango de direcciones IP? (Seleccione dos.)", "options": ["Grupos de seguridad (Security groups) — usan notación CIDR para especificar rangos de IP permitidos", "Amazon Machine Image (AMI) — plantilla de instancia EC2 (no usa CIDR)", "Lista de control de acceso de red (Network ACL) — usa notación CIDR para reglas de acceso a nivel de subred", "AWS Budgets — alertas de presupuesto", "Amazon EBS — almacenamiento de bloques"], "correct": [0, 2], "multi": true}, {"id": 615, "text": "Una empresa quiere desarrollar una aplicación de accesibilidad que convierta texto en voz audible. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon MQ — intermediario de mensajes gestionado", "Amazon Polly — convierte texto en voz (Text-to-Speech) con voces naturales en múltiples idiomas", "Amazon Neptune — base de datos de grafos", "Amazon Timestream — base de datos de series temporales"], "correct": [1], "multi": false}, {"id": 616, "text": "Una empresa necesita configurar conectividad de red dedicada entre su centro de datos local y la nube de AWS. La red no puede usar internet público. ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["AWS Transit Gateway — conecta VPCs y redes locales", "AWS VPN — usa internet (no cumple el requisito)", "Amazon CloudFront — CDN", "AWS Direct Connect — conexión de red dedicada y privada sin usar internet"], "correct": [3], "multi": false}, {"id": 617, "text": "Una empresa necesita usar dashboards y gráficos para analizar perspectivas de los datos del negocio. ¿Qué servicio de AWS proporcionará los dashboards y gráficos para estas perspectivas?", "options": ["Amazon Macie — detecta datos sensibles", "Amazon Aurora — base de datos relacional", "Amazon QuickSight — dashboards interactivos y gráficos de BI para analizar datos del negocio", "AWS CloudTrail — registra llamadas a la API"], "correct": [2], "multi": false}, {"id": 618, "text": "Una empresa quiere migrar su infraestructura local a la nube de AWS. ¿Qué ventaja de la computación en la nube ayudará a la empresa a reducir los costos iniciales?", "options": ["Despliegue global en minutos", "Aumentar la velocidad y la agilidad", "Beneficiarse de masivas economías de escala", "Intercambiar gasto fijo por gasto variable — elimina las grandes inversiones de capital iniciales en hardware."], "correct": [3], "multi": false}, {"id": 619, "text": "Una empresa está diseñando cargas de trabajo en la nube de AWS. La empresa quiere que las cargas de trabajo realicen su función prevista correctamente y de manera consistente a lo largo de su ciclo de vida. ¿Qué pilar del Marco de Buena Arquitectura de AWS representa este objetivo?", "options": ["Excelencia operativa", "Seguridad", "Fiabilidad (Reliability) — las cargas de trabajo realizan su función prevista correctamente y de manera consistente.", "Eficiencia en el rendimiento"], "correct": [2], "multi": false}, {"id": 620, "text": "¿Qué servicio de AWS se usa para proporcionar temporalmente credenciales de seguridad federadas para acceder a recursos de AWS?", "options": ["Amazon GuardDuty — detección de amenazas", "AWS Security Token Service (AWS STS) — genera credenciales de seguridad temporales para acceso federado a AWS", "AWS Secrets Manager — gestiona credenciales de aplicaciones", "AWS Certificate Manager — gestiona certificados SSL/TLS"], "correct": [1], "multi": false}, {"id": 621, "text": "¿Cuál es un beneficio de usar un balanceador de carga de Elastic Load Balancing (ELB) con aplicaciones que se ejecutan en la nube de AWS?", "options": ["Un ELB escalará automáticamente los recursos para satisfacer las necesidades de capacidad.", "Un ELB puede balancear el tráfico entre múltiples recursos de cómputo — distribuye el tráfico entrante entre instancias para mayor disponibilidad.", "Un ELB puede abarcar múltiples regiones de AWS.", "Un ELB puede balancear el tráfico entre múltiples internet gateways."], "correct": [1], "multi": false}, {"id": 622, "text": "Una empresa necesita convertir archivos de video y audio a un formato que se reproduzca en smartphones. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Comprehend — análisis de texto con NLP", "Amazon Rekognition — analiza imágenes y videos", "Amazon Elastic Transcoder — convierte archivos de video y audio a formatos compatibles con smartphones y tablets", "Amazon Polly — convierte texto en voz"], "correct": [2], "multi": false}, {"id": 623, "text": "Una empresa quiere almacenar credenciales de base de datos de Amazon RDS de forma segura y rotar automáticamente las contraseñas de usuarios periódicamente. ¿Qué servicio o capacidad de AWS cumplirá con estos requisitos?", "options": ["Amazon S3 — almacenamiento de objetos", "AWS Systems Manager Parameter Store — almacena configuración y secretos (rotación manual)", "AWS Secrets Manager — almacena credenciales y las rota automáticamente de forma periódica", "AWS CloudTrail — registra llamadas a la API"], "correct": [2], "multi": false}, {"id": 624, "text": "Una empresa necesita tener la capacidad de configurar infraestructura para nuevas aplicaciones en minutos. ¿Qué ventaja de la computación en la nube ayudará a la empresa a cumplir con este requisito?", "options": ["Intercambiar gasto fijo por gasto variable", "Despliegue global en minutos", "Aumentar la velocidad y la agilidad — aprovisiona recursos e infraestructura en minutos sin procesos lentos.", "Dejar de adivinar la capacidad"], "correct": [2], "multi": false}, {"id": 625, "text": "Una empresa necesita un sistema de archivos NFS gestionado que pueda usar con sus recursos de cómputo de AWS. ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["Amazon EBS — almacenamiento de bloques para EC2 (no NFS compartido)", "AWS Storage Gateway Tape Gateway — extiende bibliotecas de cintas (no NFS)", "Amazon S3 Glacier Flexible Retrieval — archivado (no sistema de archivos NFS)", "Amazon EFS (Elastic File System) — sistema de archivos NFS completamente gestionado para uso con recursos de cómputo de AWS"], "correct": [3], "multi": false}, {"id": 626, "text": "Una empresa planea migrar a la nube de AWS. La empresa quiere recopilar información sobre su centro de datos local. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Application Discovery Service — recopila información de servidores locales (hostname, IP, configuración, uso) para planificar migraciones", "AWS DataSync — transfiere datos", "AWS Storage Gateway — conecta almacenamiento local con AWS", "AWS Database Migration Service (DMS) — migra bases de datos"], "correct": [0], "multi": false}, {"id": 627, "text": "¿Cuáles tareas son responsabilidades del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Asegurar la capa de virtualización.", "Cifrar datos y mantener la integridad de los datos — el cliente es responsable de cifrar sus propios datos.", "Parchear el sistema operativo de Amazon RDS.", "Mantener los controles de gestión de identidades y accesos — el cliente configura IAM, usuarios, roles y permisos.", "Asegurar las Zonas de Disponibilidad."], "correct": [1, 3], "multi": true}, {"id": 628, "text": "Una empresa minorista en línea quiere migrar su carga de trabajo local a AWS. La empresa necesita manejar automáticamente un aumento estacional de la carga de trabajo de manera rentable. ¿Qué características de la nube de AWS ayudarán a la empresa a cumplir con este requisito? (Seleccione dos.)", "options": ["Despliegue de carga de trabajo entre regiones", "Precios de pago por uso — pagas solo por los recursos utilizados durante los picos de demanda.", "Capacidades de auditoría integradas de AWS CloudTrail", "Políticas de Auto Scaling — escala automáticamente los recursos durante los aumentos estacionales.", "Registro centralizado"], "correct": [1, 3], "multi": true}, {"id": 629, "text": "Un desarrollador necesita usar una plantilla estandarizada para crear copias de la arquitectura de AWS de una empresa para entornos de desarrollo, prueba y producción. ¿Qué servicio de AWS debe usar el desarrollador para cumplir con este requisito?", "options": ["AWS Cloud Map — registro de servicios de aplicaciones", "AWS CloudFormation — infraestructura como código con plantillas estandarizadas y reutilizables", "Amazon CloudFront — CDN global", "AWS CloudTrail — registra llamadas a la API"], "correct": [1], "multi": false}, {"id": 630, "text": "¿Qué servicio de AWS puede crear una conexión de red privada desde instalaciones propias a la nube de AWS?", "options": ["AWS Config — registra configuraciones de recursos", "Amazon VPC — red virtual privada en AWS", "AWS Direct Connect — crea una conexión de red privada y dedicada desde instalaciones propias a AWS", "Amazon Route 53 — servicio de DNS"], "correct": [2], "multi": false}, {"id": 631, "text": "Bajo el Modelo de Responsabilidad Compartida de AWS, ¿cuál de los siguientes es responsabilidad del cliente?", "options": ["Triturar los discos duros antes de que salgan de un centro de datos.", "Evitar que los clientes recopilen paquetes o tráfico a nivel del hipervisor.", "Parchear el sistema operativo invitado con los últimos parches de seguridad — el cliente gestiona el SO de sus instancias EC2.", "Mantener sistemas de seguridad que proporcionen monitoreo físico de los centros de datos."], "correct": [2], "multi": false}, {"id": 632, "text": "¿Qué servicio de AWS usa conversión de voz a texto para ayudar a los usuarios a crear notas de reuniones?", "options": ["Amazon Polly — convierte texto en voz (Text-to-Speech)", "Amazon Textract — extrae texto de documentos escaneados", "Amazon Rekognition — analiza imágenes y videos", "Amazon Transcribe — convierte voz a texto (Speech-to-Text), útil para transcribir reuniones"], "correct": [3], "multi": false}, {"id": 633, "text": "¿Qué servicio o herramienta de AWS proporciona a los usuarios una interfaz gráfica para gestionar servicios de AWS?", "options": ["AWS Copilot — herramienta de línea de comandos para contenedores", "AWS CLI — interfaz de línea de comandos", "AWS Management Console — interfaz web gráfica para gestionar todos los servicios de AWS", "AWS Software Development Kits (SDKs) — bibliotecas de programación"], "correct": [2], "multi": false}, {"id": 634, "text": "Una empresa tiene una carga de trabajo que se ejecutará continuamente durante 1 año. La carga de trabajo no puede tolerar interrupciones del servicio. ¿Qué opción de compra de Amazon EC2 será la MÁS rentable?", "options": ["Instancias Reservadas con pago completo por adelantado (All Upfront) — el mayor descuento al pagar todo por adelantado por 1 año", "Instancias Reservadas con pago parcial (Partial Upfront) — descuento ligeramente menor", "Instancias Dedicadas — mayor costo", "Instancias Bajo Demanda — sin descuento"], "correct": [0], "multi": false}, {"id": 635, "text": "Una empresa migró sus sistemas a la nube de AWS. Los sistemas están dimensionados correctamente y no hay problemas de seguridad. La empresa debe asegurarse de que los desarrollos, integraciones y cambios futuros no comprometan esta infraestructura optimizada. ¿Qué servicio de AWS debe usar la empresa para reportar optimización y seguridad continuas?", "options": ["AWS Trusted Advisor — monitorea continuamente y reporta recomendaciones de optimización de costos, seguridad, rendimiento y tolerancia a fallos", "AWS Health Dashboard — estado de los servicios de AWS", "Amazon Connect — centro de contacto en la nube", "AWS Systems Manager — gestiona infraestructura"], "correct": [0], "multi": false}, {"id": 636, "text": "¿Qué servicio de AWS se integra con otros servicios de AWS para proporcionar la capacidad de cifrar datos en reposo?", "options": ["AWS KMS (Key Management Service) — gestiona claves de cifrado e integra con S3, EBS, RDS y otros servicios para cifrar datos en reposo", "AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS", "AWS IAM — gestión de identidades y accesos", "AWS Security Hub — agrega alertas de seguridad"], "correct": [0], "multi": false}, {"id": 637, "text": "Una empresa quiere rastrear el costo y uso mensual de todas las instancias de Amazon EC2 en un entorno específico de AWS. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["AWS Cost Anomaly Detection — detecta anomalías en el gasto", "AWS Budgets — rastrea el costo y uso mensual de servicios específicos y envía alertas", "AWS Compute Optimizer — recomienda el tamaño óptimo de instancias", "AWS Trusted Advisor — recomendaciones de optimización"], "correct": [1], "multi": false}, {"id": 638, "text": "Una empresa quiere la capacidad de adquirir recursos automáticamente según sea necesario y liberar los recursos cuando ya no se necesiten. ¿Qué concepto de la nube describe esta funcionalidad?", "options": ["Disponibilidad — sistema disponible cuando se necesita", "Elasticidad — adquiere y libera recursos dinámicamente según la demanda", "Durabilidad — capacidad de preservar datos a largo plazo", "Fiabilidad — recuperación ante fallos"], "correct": [1], "multi": false}, {"id": 639, "text": "Una empresa quiere una opción rentable al ejecutar sus aplicaciones en una instancia de Amazon EC2 durante períodos cortos. Las aplicaciones pueden ser interrumpidas. ¿Qué tipo de instancia EC2 cumplirá con estos requisitos?", "options": ["Instancias Spot — hasta 90% de descuento, toleran interrupciones, ideales para uso corto y aplicaciones que pueden reiniciarse", "Instancias Bajo Demanda — sin descuento", "Instancias Reservadas — compromiso de 1 o 3 años", "Instancias Dedicadas — hardware exclusivo con mayor costo"], "correct": [0], "multi": false}, {"id": 640, "text": "Una empresa tiene un plan de AWS Business Support. La empresa necesita acceder al Equipo de Respuesta DDoS de AWS (DRT) para mitigar eventos DDoS. ¿Qué servicio o recurso de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Shield Standard — protección básica sin acceso al DRT", "AWS Enterprise Support — plan de soporte (no proporciona acceso al DRT)", "AWS WAF — firewall de aplicaciones web", "AWS Shield Advanced — proporciona acceso al DRT y protección mejorada contra DDoS"], "correct": [3], "multi": false}, {"id": 641, "text": "¿Qué servicio o herramienta de AWS proporciona una visualización de los patrones históricos de gasto en AWS y proyecciones de costos futuros?", "options": ["AWS Cost and Usage Report — reporte detallado de costos históricos", "AWS Budgets — alertas de presupuesto", "Cost Explorer — visualiza patrones históricos de gasto y proyecta costos futuros con gráficos interactivos", "Amazon CloudWatch — monitoreo de métricas"], "correct": [2], "multi": false}, {"id": 642, "text": "Una empresa está migrando a la nube de AWS en lugar de ejecutar su infraestructura local. ¿Cuáles de las siguientes son ventajas de esta migración? (Seleccione dos.)", "options": ["Eliminación de la necesidad de realizar auditorías de seguridad.", "Mayor alcance global y agilidad — acceso a infraestructura en regiones de todo el mundo con mayor velocidad de cambio.", "Capacidad de despliegue global en minutos — lanza recursos en cualquier región rápidamente.", "Eliminación del costo del personal de TI.", "Redundancia por defecto para todos los servicios de cómputo."], "correct": [1, 2], "multi": true}, {"id": 643, "text": "¿Qué servicio de AWS usa ubicaciones de borde para cachear contenido?", "options": ["Amazon Kinesis — procesamiento de datos en streaming", "Amazon SQS — cola de mensajes", "Amazon CloudFront — CDN que cachea contenido en ubicaciones de borde globales para entrega rápida", "Amazon Route 53 — servicio de DNS"], "correct": [2], "multi": false}, {"id": 644, "text": "Una empresa quiere acceder de forma segura a un bucket de Amazon S3 desde una instancia de Amazon EC2 sin acceder a internet. ¿Qué debe usar la empresa para lograr este objetivo?", "options": ["Conexión VPN — usa internet", "Internet Gateway — permite acceso a internet", "VPC Endpoint — permite acceso privado a S3 desde EC2 sin pasar por internet", "NAT Gateway — permite tráfico saliente a internet desde subredes privadas"], "correct": [2], "multi": false}, {"id": 645, "text": "Una empresa quiere un servicio de AWS que pueda automatizar el despliegue de software en instancias de Amazon EC2 y en instancias locales. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS CodeCommit — repositorio Git gestionado", "AWS CodeBuild — compila y prueba código", "AWS CodeDeploy — automatiza el despliegue de aplicaciones en EC2, Lambda, ECS y servidores locales", "AWS CodePipeline — orquesta pipelines CI/CD"], "correct": [2], "multi": false}, {"id": 646, "text": "¿Qué servicios de AWS son sin servidor (serverless)? (Seleccione dos.)", "options": ["AWS Fargate — ejecuta contenedores sin gestionar servidores subyacentes", "Amazon Managed Streaming for Apache Kafka — servicio gestionado de Kafka (no serverless)", "Amazon EMR — procesamiento de big data en clústeres", "Amazon S3 — almacenamiento de objetos completamente gestionado sin servidores que gestionar", "Amazon EC2 — instancias virtuales (requiere gestionar servidores)"], "correct": [0, 3], "multi": true}, {"id": 647, "text": "Una empresa quiere mejorar continuamente los procesos y procedimientos para entregar valor al negocio. ¿Qué pilar del Marco de Buena Arquitectura de AWS representa este objetivo?", "options": ["Eficiencia en el rendimiento", "Excelencia operativa (Operational Excellence) — mejora continua de procesos y procedimientos para entregar valor del negocio", "Fiabilidad", "Sostenibilidad"], "correct": [1], "multi": false}, {"id": 648, "text": "¿Cuál de las siguientes es responsabilidad del cliente de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Aplicar parches de seguridad a los dispositivos de infraestructura de Amazon S3.", "Proporcionar seguridad física para los centros de datos de AWS.", "Instalar actualizaciones del sistema operativo en Lambda@Edge.", "Implementar la autenticación multifactor (MFA) para las cuentas de usuarios de IAM — el cliente configura y gestiona la seguridad de sus cuentas de IAM."], "correct": [3], "multi": false}, {"id": 649, "text": "¿Qué servicio de AWS debe usar una empresa para organizar, caracterizar y buscar grandes cantidades de imágenes?", "options": ["Amazon Transcribe — convierte voz a texto", "Amazon Rekognition — analiza, organiza y busca imágenes usando ML para detectar objetos, escenas y rostros", "Amazon Aurora — base de datos relacional", "Amazon QuickSight — dashboards de BI"], "correct": [1], "multi": false}, {"id": 650, "text": "¿Qué servicio de AWS siempre está disponible de forma gratuita para los usuarios?", "options": ["Amazon Athena — consultas SQL sobre datos en S3 (tiene costo)", "AWS Identity and Access Management (IAM) — siempre gratuito, no tiene costo por usar el servicio de IAM", "AWS Secrets Manager — gestión de credenciales (tiene costo)", "Amazon ElastiCache — caché en memoria (tiene costo)"], "correct": [1], "multi": false}], [{"id": 651, "text": "Una empresa necesita ejecutar algunas de sus cargas de trabajo en instalaciones propias para cumplir con directrices regulatorias. La empresa quiere usar la nube de AWS para cargas de trabajo que no deben estar en instalaciones propias. La empresa también quiere usar las mismas llamadas a la API para las cargas de trabajo locales y las cargas de trabajo en la nube. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Hosts Dedicados — hardware dedicado en la nube de AWS", "AWS Outposts — infraestructura AWS en instalaciones propias que usa las mismas APIs que la nube", "Zonas de Disponibilidad — centros de datos en la nube", "AWS Wavelength — apps de baja latencia en redes 5G"], "correct": [1], "multi": false}, {"id": 652, "text": "¿Cuál es el caso de uso recomendado para las instancias Bajo Demanda (On-Demand) de Amazon EC2?", "options": ["Una carga de trabajo estable que requiere una configuración específica de EC2 por un largo período", "Una carga de trabajo que puede interrumpirse para un proyecto que requiere el menor costo posible", "Una carga de trabajo impredecible que no requiere un compromiso a largo plazo — ideal para uso a corto plazo e impredecible.", "Una carga de trabajo que se espera ejecutar durante más de 1 año"], "correct": [2], "multi": false}, {"id": 653, "text": "Una empresa quiere una solución de red de AWS que pueda actuar como gateway centralizado entre múltiples VPCs y redes locales. ¿Qué servicio o característica de AWS cumplirá con este requisito?", "options": ["Gateway VPC endpoint — conectividad privada entre VPC y servicios de AWS", "AWS Direct Connect — conexión dedicada entre empresa y AWS", "AWS Transit Gateway — hub central que actúa como gateway entre múltiples VPCs y redes locales", "AWS PrivateLink — conectividad privada entre servicios"], "correct": [2], "multi": false}, {"id": 654, "text": "Un administrador observó que múltiples recursos de AWS fueron eliminados ayer. ¿Qué servicio de AWS ayudará a identificar la causa y determinar qué usuario eliminó los recursos?", "options": ["AWS CloudTrail — registra todas las llamadas a la API, incluyendo quién eliminó recursos y cuándo", "Amazon Inspector — detecta vulnerabilidades", "Amazon GuardDuty — detecta amenazas", "AWS Trusted Advisor — recomendaciones de optimización"], "correct": [0], "multi": false}, {"id": 655, "text": "Para ayudar a las empresas con el cumplimiento del Estándar de Seguridad de Datos para la Industria de Tarjetas de Pago (PCI DSS) en la nube, AWS proporciona:", "options": ["Inspecciones físicas de los centros de datos con cita previa.", "Certificaciones de cumplimiento PCI requeridas para cualquier aplicación que se ejecute en AWS.", "Un informe de Attestation of Compliance (AOC) de AWS para servicios específicos de AWS — certifica que AWS cumple con PCI DSS.", "Servicios profesionales de cumplimiento PCI."], "correct": [2], "multi": false}, {"id": 656, "text": "¿En qué situaciones debe una empresa crear un usuario de IAM en lugar de un rol de IAM?", "options": ["Cuando una aplicación que se ejecuta en instancias EC2 requiere acceso a otros servicios de AWS", "Cuando la empresa crea credenciales de acceso de AWS para personas individuales — cada empleado tiene su propia identidad IAM.", "Cuando la empresa crea una aplicación que se ejecuta en un teléfono móvil y realiza solicitudes a AWS", "Cuando la empresa necesita agregar usuarios a grupos de IAM", "Cuando los usuarios están autenticados en la red corporativa y quieren usar AWS sin iniciar sesión nuevamente"], "correct": [1], "multi": false}, {"id": 657, "text": "Una empresa aloja una aplicación web en AWS. La empresa ha mejorado la disponibilidad aprovisionando múltiples instancias EC2 y quiere distribuir el tráfico mientras proporciona un único punto de contacto a los clientes web. ¿Qué servicio de AWS puede distribuir el tráfico a múltiples instancias EC2?", "options": ["Endpoints de VPC — conectividad privada", "Application Load Balancer — distribuye tráfico HTTP/HTTPS a múltiples instancias EC2 como punto único de contacto", "NAT Gateway — permite tráfico saliente desde subredes privadas", "Internet Gateway — permite acceso a internet"], "correct": [1], "multi": false}, {"id": 658, "text": "¿Cuál es el volumen total de datos que puede almacenarse en Amazon S3?", "options": ["10 PB", "50 PB", "100 PB", "Virtualmente ilimitado — Amazon S3 puede almacenar cantidades prácticamente ilimitadas de datos."], "correct": [3], "multi": false}, {"id": 659, "text": "¿Qué principio de diseño está relacionado con el pilar de fiabilidad según el Marco de Buena Arquitectura de AWS?", "options": ["Probar los procedimientos de recuperación — simula fallos para verificar que los sistemas se recuperan correctamente.", "Experimentar con más frecuencia", "Despliegue global en minutos", "Analizar y atribuir el gasto"], "correct": [0], "multi": false}, {"id": 660, "text": "Una empresa almacena datos en un bucket de Amazon S3. ¿Cuál tarea es responsabilidad de AWS?", "options": ["Configurar una política de ciclo de vida de S3.", "Activar S3 Versioning.", "Configurar políticas de bucket de S3.", "Proteger la infraestructura que soporta el almacenamiento S3 — AWS es responsable de la seguridad de la infraestructura subyacente."], "correct": [3], "multi": false}, {"id": 661, "text": "Una empresa quiere transferir un servidor Windows Server 2022 virtual que actualmente se ejecuta en su propio centro de datos a AWS. La empresa quiere convertir automáticamente el servidor existente para que se ejecute directamente en la infraestructura de AWS en lugar de en hardware virtualizado. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS DataSync — transfiere datos entre almacenamiento", "AWS Database Migration Service (DMS) — migra bases de datos", "AWS Application Discovery Service — descubre y recopila información de servidores locales", "AWS Application Migration Service — convierte automáticamente servidores para ejecutarlos en la infraestructura nativa de AWS"], "correct": [3], "multi": false}, {"id": 662, "text": "¿Qué servicio de AWS es un servicio de base de datos NoSQL completamente gestionado?", "options": ["Amazon RDS — base de datos relacional", "Amazon Redshift — data warehouse", "Amazon DynamoDB — base de datos NoSQL completamente gestionada y serverless", "Amazon Aurora — base de datos relacional de alto rendimiento"], "correct": [2], "multi": false}, {"id": 663, "text": "Una empresa desplegó una aplicación en múltiples regiones de AWS alrededor del mundo. La empresa quiere mejorar el rendimiento y la disponibilidad de la aplicación. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Global Accelerator — mejora el rendimiento y la disponibilidad global enrutando el tráfico por la red de AWS", "Amazon DataZone — gestión de datos", "AWS Cloud Map — registro de recursos de aplicaciones", "AWS Auto Scaling — ajusta automáticamente la capacidad"], "correct": [0], "multi": false}, {"id": 664, "text": "Una empresa quiere migrar su base de datos SQL Server local a la nube de AWS. La empresa quiere que AWS maneje la administración diaria de la base de datos. ¿Qué servicio de AWS cumplirá con los requisitos de la empresa?", "options": ["Amazon EC2 para Microsoft SQL Server — requiere gestionar la base de datos manualmente", "Amazon DynamoDB — base de datos NoSQL (no SQL Server)", "Amazon RDS — base de datos relacional completamente gestionada con soporte para SQL Server", "Amazon Aurora — no compatible con SQL Server"], "correct": [2], "multi": false}, {"id": 665, "text": "Una empresa necesita filtrado de red sin estado para su VPC. ¿Qué servicio, herramienta o característica de AWS cumplirá con este requisito?", "options": ["AWS PrivateLink — conectividad privada entre servicios", "Grupo de seguridad — firewall con estado (stateful) a nivel de instancia", "Lista de control de acceso de red (ACL) — firewall sin estado (stateless) a nivel de subred en una VPC", "AWS WAF — firewall de aplicaciones web"], "correct": [2], "multi": false}, {"id": 666, "text": "¿Cuál opción es una ventaja de la computación en la nube de AWS que minimiza los costos variables?", "options": ["Alta disponibilidad", "Economías de escala — el volumen masivo de AWS permite ofrecer precios más bajos, reduciendo los costos variables para los clientes.", "Alcance global", "Agilidad"], "correct": [1], "multi": false}, {"id": 667, "text": "Una empresa quiere migrar sus aplicaciones basadas en servidores a la nube de AWS. La empresa necesita determinar el costo total de propiedad (TCO) de sus recursos de cómputo en la nube de AWS. ¿Qué combinación de servicios o herramientas de AWS cumplirá con estos requisitos? (Seleccione dos.)", "options": ["AWS Pricing Calculator — estima los costos de ejecutar recursos específicos en AWS", "Migration Evaluator — evalúa el entorno local y estima el TCO de migrar a AWS", "AWS Support Center — portal de soporte técnico", "AWS Application Discovery Service — descubre recursos locales (no estima TCO)", "AWS Database Migration Service (DMS) — migra bases de datos"], "correct": [0, 1], "multi": true}, {"id": 668, "text": "Una empresa tiene data lakes diseñados para cargas de trabajo de computación de alto rendimiento (HPC). ¿Qué tipo de instancia de Amazon EC2 debe usar la empresa para cumplir con estos requisitos?", "options": ["Instancias de propósito general — balance entre cómputo, memoria y red", "Instancias optimizadas para cómputo (Compute optimized) — CPUs de alto rendimiento para cargas de trabajo HPC intensivas en CPU", "Instancias optimizadas para memoria — gran RAM para procesar grandes conjuntos de datos", "Instancias optimizadas para almacenamiento — alto rendimiento de I/O"], "correct": [1], "multi": false}, {"id": 669, "text": "¿Qué beneficios obtiene una empresa cuando pasa de una arquitectura de TI local a la nube de AWS? (Seleccione dos.)", "options": ["Reducción o eliminación de las tareas de solución de problemas de hardware, planificación de capacidad y adquisición.", "Eliminación de la necesidad de personal de TI capacitado.", "Configuración automática de seguridad de todas las aplicaciones migradas a la nube.", "Eliminación de la necesidad de planificación de recuperación ante desastres.", "Despliegue más rápido de nuevas características y aplicaciones."], "correct": [0, 4], "multi": true}, {"id": 670, "text": "Una empresa está planificando migrar a la nube de AWS y quiere ser más receptiva a las consultas de los clientes. ¿Qué tareas debe realizar la empresa, según el AWS CAF? (Seleccione dos.)", "options": ["Realinear los equipos para enfocarse en productos y flujos de valor.", "Crear nuevas propuestas de valor con nuevos productos y servicios.", "Usar métodos ágiles para iterar y evolucionar rápidamente.", "Usar una plataforma de datos y análisis para crear perspectivas accionables.", "Migrar y modernizar la infraestructura heredada."], "correct": [0, 2], "multi": true}, {"id": 671, "text": "Una empresa que planea migrar a la nube de AWS está en un área aislada con conectividad a internet limitada. Necesita realizar procesamiento de datos localmente sin conectividad estable. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon S3 — almacenamiento de objetos en la nube (requiere internet)", "AWS Snowball Edge — dispositivo físico con capacidad de cómputo y almacenamiento que opera sin internet", "AWS Storage Gateway — conecta almacenamiento local con AWS (requiere conectividad)", "AWS Backup — servicio de respaldo en la nube (requiere internet)"], "correct": [1], "multi": false}, {"id": 672, "text": "Una empresa quiere crear consultas de grafos para detección de patrones de fraude en tiempo real. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Neptune — base de datos de grafos para analizar relaciones complejas, ideal para detección de fraude en tiempo real", "Amazon DynamoDB — base de datos NoSQL", "Amazon Timestream — base de datos de series temporales", "Amazon Forecast — predicciones con ML"], "correct": [0], "multi": false}, {"id": 673, "text": "Una empresa quiere migrar a la nube de AWS y necesita la capacidad de adquirir recursos cuando los necesita y liberarlos cuando ya no los necesita. ¿Qué concepto arquitectónico de la nube de AWS cumple con estos requisitos?", "options": ["Elasticidad — adquiere y libera recursos dinámicamente según la demanda", "Disponibilidad", "Fiabilidad", "Durabilidad"], "correct": [0], "multi": false}, {"id": 674, "text": "Una empresa quiere desplegar una aplicación web como aplicación en contenedores. La empresa quiere usar un servicio gestionado que cree imágenes de contenedores automáticamente desde el código fuente y despliegue la aplicación. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Elastic Beanstalk — despliega apps sin gestionar infraestructura (no crea imágenes de contenedor automáticamente)", "Amazon ECS — orquestación de contenedores (requiere gestionar imágenes)", "AWS App Runner — crea imágenes de contenedor automáticamente desde el código fuente y despliega la app sin gestionar infraestructura", "Amazon EC2 — instancias virtuales (manual)"], "correct": [2], "multi": false}, {"id": 675, "text": "Una empresa ha migrado toda su infraestructura a la nube de AWS. El equipo de finanzas quiere rastrear el costo y uso de todos los recursos de meses anteriores y generar informes automáticamente. ¿Qué servicio o característica de AWS debe usar el equipo de finanzas para cumplir con estos requisitos?", "options": ["Amazon Detective — investiga incidentes de seguridad", "AWS Pricing Calculator — estima costos futuros", "AWS Budgets — rastrea costos actuales y genera alertas, puede generar informes automáticamente", "AWS Savings Plans — descuentos por compromiso de uso"], "correct": [2], "multi": false}, {"id": 676, "text": "¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) se enfoca en perspectivas en tiempo real y responde preguntas sobre estrategia?", "options": ["Operaciones (Operations)", "Personas (People)", "Negocio (Business) — se enfoca en resultados de negocio, estrategia y perspectivas en tiempo real", "Plataforma (Platform)"], "correct": [2], "multi": false}, {"id": 677, "text": "Una empresa quiere migrar sistemas de producción críticos a instancias de Amazon EC2. Las instancias de producción se usarán por al menos 3 años. La empresa quiere una opción de precios que minimice el costo. ¿Qué solución cumplirá con estos requisitos?", "options": ["Instancias Bajo Demanda — sin descuento por compromiso", "Instancias Reservadas — hasta 72% de descuento con compromiso de 1 o 3 años para uso continuo crítico", "Instancias Spot — pueden interrumpirse (no adecuado para producción crítica)", "AWS Free Tier — solo para los primeros 12 meses con limitaciones"], "correct": [1], "multi": false}, {"id": 678, "text": "¿Qué concepto del Marco de Buena Arquitectura de AWS representa la capacidad de un sistema para permanecer funcional cuando el sistema encuentra problemas operativos?", "options": ["Consistencia", "Elasticidad", "Durabilidad — capacidad de un sistema de permanecer funcional y preservar datos ante problemas operativos", "Latencia"], "correct": [2], "multi": false}, {"id": 679, "text": "¿Qué pilar del Marco de Buena Arquitectura de AWS se enfoca en la capacidad de recuperarse automáticamente de las interrupciones del servicio?", "options": ["Seguridad", "Eficiencia en el rendimiento", "Excelencia operativa", "Fiabilidad (Reliability) — incluye la recuperación automática ante interrupciones del servicio"], "correct": [3], "multi": false}, {"id": 680, "text": "Una empresa tiene múltiples bases de datos SQL en un centro de datos. La empresa necesita migrar todos los servidores de base de datos a la nube de AWS para reducir el costo de operar servidores físicos. ¿Qué servicio o recurso de AWS cumplirá con estos requisitos con la MENOR sobrecarga operativa?", "options": ["Instancias de Amazon EC2 — requiere gestionar el SO, la base de datos y los parches", "Amazon RDS — base de datos relacional completamente gestionada que soporta múltiples motores SQL con mínima sobrecarga", "Amazon DynamoDB — base de datos NoSQL (no SQL)", "OpenSearch — motor de búsqueda y análisis"], "correct": [1], "multi": false}, {"id": 681, "text": "Una empresa quiere construir, entrenar y desplegar modelos de Machine Learning (ML). ¿Qué servicio de AWS puede usar la empresa para cumplir con este requisito?", "options": ["Amazon Personalize — recomendaciones personalizadas", "Amazon Comprehend — análisis de texto con NLP", "Amazon Forecast — predicciones de series temporales", "Amazon SageMaker — plataforma integral para construir, entrenar y desplegar modelos de ML"], "correct": [3], "multi": false}, {"id": 682, "text": "¿Qué servicio o herramienta de AWS proporciona recomendaciones para ayudar a los usuarios a obtener instancias de Amazon EC2 con el tamaño correcto basándose en datos históricos de uso de carga de trabajo?", "options": ["AWS Pricing Calculator — estima costos futuros", "AWS Compute Optimizer — analiza el uso histórico y recomienda el tipo e tamaño óptimo de instancias EC2", "AWS App Runner — despliegue de apps en contenedores", "AWS Systems Manager — gestiona infraestructura"], "correct": [1], "multi": false}, {"id": 683, "text": "Una empresa quiere explorar y analizar datos en Amazon S3 usando un lenguaje de programación. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Kendra — motor de búsqueda empresarial", "Amazon Athena — permite ejecutar consultas SQL sobre datos en S3 (compatible con lenguajes como Python a través de APIs y drivers)", "Amazon Comprehend — análisis de texto con NLP", "Amazon SageMaker — plataforma de ML"], "correct": [1], "multi": false}, {"id": 684, "text": "Una empresa necesita ejecutar una aplicación en instancias de Amazon EC2 sin interrupciones. ¿Qué opción de compra de instancias EC2 cumplirá con este requisito de la forma MÁS rentable?", "options": ["Instancias Reservadas Estándar (Standard Reserved) — mayor descuento con compromiso fijo, sin interrupciones", "Instancias Reservadas Convertibles — menor descuento que las estándar", "Instancias Bajo Demanda — sin descuento", "Instancias Spot — pueden interrumpirse (no adecuado)"], "correct": [0], "multi": false}, {"id": 685, "text": "Una empresa quiere un servicio completamente gestionado que centralice y automatice la protección de datos en servicios de AWS y cargas de trabajo híbridas. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Artifact — informes de cumplimiento", "AWS Backup — servicio centralizado y completamente gestionado para protección de datos en AWS y entornos híbridos", "AWS Batch — procesamiento por lotes", "AWS Shield — protección contra DDoS"], "correct": [1], "multi": false}, {"id": 686, "text": "Una empresa planea migrar su aplicación desde instalaciones propias a la nube de AWS. La empresa necesita recopilar datos de uso y configuración de los componentes de la aplicación. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Database Migration Service (DMS) — migra bases de datos", "AWS Transfer Family — transfiere archivos con SFTP/FTP", "AWS Application Discovery Service — recopila datos de uso y configuración de servidores locales para planificar migraciones", "AWS Global Accelerator — mejora el rendimiento global"], "correct": [2], "multi": false}, {"id": 687, "text": "¿Qué principio de diseño se alinea con el pilar de eficiencia en el rendimiento (Performance Efficiency) del Marco de Buena Arquitectura de AWS?", "options": ["Usar arquitecturas sin servidor", "Escalar horizontalmente (Scaling horizontally) — añade más instancias en lugar de hacer una más grande, mejora el rendimiento y la disponibilidad", "Medir el costo de las cargas de trabajo", "Usar servicios gestionados"], "correct": [1], "multi": false}, {"id": 688, "text": "Una empresa quiere proporcionar baja latencia a sus usuarios en todo el mundo. ¿Qué característica de la nube de AWS cumple con este requisito?", "options": ["Infraestructura global — AWS tiene regiones y ubicaciones de borde en todo el mundo para entrega de contenido con baja latencia", "Precios de pago por uso", "Servicios gestionados", "Economías de escala"], "correct": [0], "multi": false}, {"id": 689, "text": "¿Qué tipo de carga de trabajo debe ejecutar una empresa en instancias Spot de Amazon EC2?", "options": ["Una carga de trabajo estable que requiere una configuración específica de EC2 por un largo período", "Una carga de trabajo que puede interrumpirse y puede controlar costos — las instancias Spot toleran interrupciones y ofrecen grandes descuentos.", "Una carga de trabajo estable que no requiere un compromiso a largo plazo", "Una carga de trabajo que no puede interrumpirse y puede controlar costos"], "correct": [1], "multi": false}, {"id": 690, "text": "Una empresa tiene múltiples cuentas de AWS. La empresa necesita recibir una factura consolidada de AWS y gestionar centralmente la seguridad y el cumplimiento. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Cost and Usage Report — reporte detallado de costos", "AWS Organizations — consolida la facturación y permite gestionar centralmente seguridad y cumplimiento en múltiples cuentas", "AWS Config — registra configuraciones", "AWS Security Hub — agrega alertas de seguridad"], "correct": [1], "multi": false}, {"id": 691, "text": "¿Para qué caso de uso son MÁS rentables las instancias Bajo Demanda de Amazon EC2?", "options": ["Transcodificación de video intensiva en cómputo que puede reiniciarse si es necesario", "Una instancia en uso continuo durante 1 mes para realizar pruebas de calidad — uso continuo por período conocido y corto sin compromiso", "Una instancia que ejecuta un servidor web que funcionará durante 1 año", "Una instancia que ejecuta una base de datos que funcionará durante 3 años"], "correct": [1], "multi": false}, {"id": 692, "text": "Una empresa ha desarrollado una nueva aplicación interna. La empresa no tiene forma de determinar o predecir la demanda de uso que creará la aplicación. ¿Qué beneficio de la computación en la nube de AWS está buscando la empresa?", "options": ["Fácil de usar", "Rentable", "Seguro", "Escalable y de alto rendimiento — escala automáticamente para manejar demanda impredecible sin sobreprovisionar."], "correct": [3], "multi": false}, {"id": 693, "text": "¿Qué oferta de AWS puede analizar el entorno de AWS de una empresa para descubrir vulnerabilidades de seguridad en instancias de Amazon EC2?", "options": ["Amazon Inspector — escanea instancias EC2 para detectar vulnerabilidades de software y configuraciones incorrectas", "Amazon Macie — detecta datos sensibles en S3", "AWS Shield Standard — protección básica contra DDoS", "Grupos de seguridad — controlan el tráfico de red (no detectan vulnerabilidades)"], "correct": [0], "multi": false}, {"id": 694, "text": "Una empresa planea incorporar nuevos empleados que trabajarán de forma remota. La empresa necesita configurar escritorios virtuales Windows para los nuevos empleados. Los empleados deben poder acceder al entorno de trabajo desde cualquier lugar usando su computadora o un navegador web. ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["Hosts Dedicados — hardware dedicado en la nube", "AWS Global Accelerator — mejora el rendimiento global", "Amazon WorkSpaces — escritorios virtuales Windows/Linux en la nube accesibles desde cualquier dispositivo o navegador", "Amazon CloudFront — CDN global"], "correct": [2], "multi": false}, {"id": 695, "text": "Una empresa quiere visualizar y gestionar los costos y el uso de la nube de AWS durante un período de tiempo específico. ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["Cost Explorer — visualiza, analiza y gestiona costos y uso de AWS en períodos de tiempo específicos con gráficos interactivos", "Facturación consolidada — combina facturas de múltiples cuentas", "AWS Organizations — gestiona múltiples cuentas", "AWS Budgets — alertas de presupuesto"], "correct": [0], "multi": false}, {"id": 696, "text": "¿Qué servicio de AWS soporta motores de base de datos MySQL?", "options": ["Amazon DynamoDB — base de datos NoSQL", "Amazon RDS — soporta múltiples motores relacionales incluyendo MySQL", "Amazon DocumentDB — compatible con MongoDB", "Amazon ElastiCache — caché en memoria"], "correct": [1], "multi": false}, {"id": 697, "text": "Una empresa compró Instancias Reservadas Estándar de Amazon EC2 para una carga de trabajo. La empresa necesita mover parte de la carga a una familia de instancias diferente. ¿Cómo puede la empresa aprovechar las Instancias Reservadas Estándar que ya no necesita?", "options": ["Contactar al equipo de AWS Support para que venda las RIs.", "Vender las Instancias Reservadas Estándar en el Amazon EC2 Reserved Instance Marketplace — mercado donde los clientes pueden comprar y vender RIs no utilizadas.", "Vender las RIs como vendedor de terceros en AWS Marketplace.", "Convertir las RIs Estándar a Savings Plans."], "correct": [1], "multi": false}, {"id": 698, "text": "Una empresa está lanzando una aplicación crítica para el negocio. Antes del lanzamiento, necesita asistencia de planificación estratégica de AWS. Durante el lanzamiento, necesita gestión de eventos de infraestructura de AWS y soporte en tiempo real. ¿Qué debe hacer la empresa para cumplir con estos requisitos?", "options": ["Acceder a AWS Trusted Advisor", "Contactar a la Red de Socios de AWS (APN)", "Suscribirse a AWS Enterprise Support — incluye gestión de eventos de infraestructura (IEM) y soporte en tiempo real", "Contactar a AWS Professional Services"], "correct": [2], "multi": false}, {"id": 699, "text": "Una empresa quiere mejorar la productividad de los empleados proporcionando una forma de buscar preguntas y recuperar respuestas específicas mediante una única interfaz de búsqueda inteligente. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Connect — centro de contacto en la nube", "Amazon Kendra — motor de búsqueda empresarial inteligente que usa ML para encontrar respuestas precisas en documentos corporativos", "Amazon Lex — chatbots conversacionales", "Amazon Comprehend — análisis de texto"], "correct": [1], "multi": false}, {"id": 700, "text": "Una empresa quiere una solución de Amazon S3 que proporcione acceso a almacenamiento de objetos en milisegundos de un solo dígito. ¿Qué solución cumplirá con estos requisitos?", "options": ["S3 Express One Zone — clase de almacenamiento de muy alta velocidad (single-digit milliseconds)", "S3 Standard — acceso en milisegundos, alta disponibilidad", "S3 Glacier Flexible Retrieval — recuperación en horas", "S3 Glacier Instant Retrieval — recuperación en milisegundos pero mayor costo"], "correct": [1], "multi": false}, {"id": 701, "text": "Una empresa ejecuta una carga de trabajo ininterrumpible de Amazon EC2 24/7. La empresa requerirá la misma familia e tipo de instancia durante los próximos 12 meses. ¿Qué combinación de opciones de compra debe elegir la empresa para optimizar los costos? (Seleccione dos.)", "options": ["Instancia Reservada Estándar (Standard Reserved) — mayor descuento fijo para la misma familia e tipo de instancia", "Instancia Reservada Convertible — menor descuento", "Compute Savings Plan — descuento flexible (menor que Reservada Estándar para misma instancia)", "Instancia Spot — puede interrumpirse", "Pago completo por adelantado (All Upfront) — maximiza el descuento de las Instancias Reservadas al pagar todo de una vez"], "correct": [0, 4], "multi": true}, {"id": 702, "text": "Una empresa quiere ejecutar el código de su aplicación sin tener que aprovisionar y gestionar servidores. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Glue — ETL sin servidor (pero para datos)", "AWS Lambda — ejecuta código sin servidor sin aprovisionar ni gestionar infraestructura", "AWS CodeDeploy — automatiza despliegues", "Amazon CodeGuru — revisa código"], "correct": [1], "multi": false}, {"id": 703, "text": "Una empresa planea migrar a la nube de AWS y necesita entender el uso y la configuración existente en instalaciones propias, sin replicar aún las cargas de trabajo a AWS. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["AWS Application Discovery Service — recopila información de servidores locales sin replicar cargas de trabajo a AWS", "AWS Application Migration Service — replica y migra aplicaciones a AWS", "Cloud Migration Factory — automatiza migraciones", "AWS Transfer Family — transfiere archivos"], "correct": [0], "multi": false}, {"id": 704, "text": "Una empresa quiere permitir que sus empleados trabajen de forma remota desde casa. Los empleados usan escritorios Windows o Linux. Los empleados necesitan acceso desde cualquier lugar y en cualquier momento usando cualquier dispositivo compatible. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon WorkSpaces — escritorios virtuales Windows y Linux en la nube accesibles desde cualquier dispositivo", "Amazon AppStream 2.0 — transmite aplicaciones (no escritorios completos)", "Amazon Keyspaces — base de datos Apache Cassandra gestionada", "AWS Cloud9 — IDE basado en la nube para desarrolladores"], "correct": [0], "multi": false}, {"id": 705, "text": "Una empresa quiere probar una nueva aplicación. ¿Qué principio de AWS ayudará a la empresa a probar la aplicación?", "options": ["Hacer compromisos a largo plazo a cambio de un descuento de costos.", "Escalar hacia arriba y hacia abajo cuando sea necesario sin compromisos a largo plazo — experimenta sin riesgos de inversión fija.", "Tener control total sobre la infraestructura de la aplicación.", "Gestionar todas las tareas de mantenimiento asociadas con la nube."], "correct": [1], "multi": false}, {"id": 706, "text": "Una empresa planea lanzar un sitio web de comercio electrónico con muchas imágenes. La empresa quiere mantener el costo de ejecución dentro de un presupuesto específico. ¿Qué servicio o herramienta de AWS debe usar la empresa para monitorear los costos continuos del sitio web?", "options": ["AWS Cost Explorer — visualiza y analiza los costos continuos del sitio web con gráficos históricos", "AWS SDKs — bibliotecas de desarrollo", "EC2 Image Builder — crea imágenes de EC2", "AWS CloudFormation — infraestructura como código"], "correct": [0], "multi": false}, {"id": 707, "text": "Una empresa ha desplegado varias aplicaciones públicas detrás de Application Load Balancers. La empresa quiere mejorar el rendimiento de las aplicaciones. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Global Accelerator — mejora el rendimiento de aplicaciones globales enrutando el tráfico por la red global de AWS", "Amazon Connect — centro de contac let allQ = [].concat(...MODULES);
let curMod = 0;

function showHome() {
  document.getElementById('home').style.display='block';
  document.getElementById('reading').style.display='none';
  renderGrid();
}

function renderGrid() {
  const g = document.getElementById('modules-grid');
  g.innerHTML = '';
  MODULES.forEach((mod, i) => {
    const d = document.createElement('div');
    d.className = 'mod-card';
    d.innerHTML = `
      <div class="esp-badge">✅ ESP</div>
      <h3>Módulo ${i+1}</h3>
      <p>Q${mod[0].id} – Q${mod[mod.length-1].id}</p>
      <p style="margin-top:4px;color:var(--text2)">${mod.length} preguntas</p>
    `;
    d.onclick = () => startReading(i);
    g.appendChild(d);
  });
}

function startReading(modIdx) {
  curMod = modIdx;
  document.getElementById('home').style.display='none';
  document.getElementById('reading').style.display='block';
  const mod = MODULES[modIdx];
  document.getElementById('from-q').value = mod[0].id;
  document.getElementById('to-q').value = mod[mod.length-1].id;
  renderReading(mod);
}

function applyFilter() {
  const from = parseInt(document.getElementById('from-q').value) || 1;
  const to = parseInt(document.getElementById('to-q').value) || 719;
  const filtered = allQ.filter(q => q.id >= from && q.id <= to);
  renderReading(filtered);
}

function clearFilter() {
  const mod = MODULES[curMod];
  document.getElementById('from-q').value = mod[0].id;
  document.getElementById('to-q').value = mod[mod.length-1].id;
  renderReading(mod);
}

function renderReading(qs) {
  const letters = ['A','B','C','D','E'];
  document.getElementById('r-counter').textContent = `${qs.length} preguntas`;
  document.getElementById('r-area').innerHTML = qs.map(q => {
    const opts = q.options.map((opt,i) => {
      const isCor = q.correct.includes(i);
      return `<div class="opt${isCor?' correct':''}">
        <div class="opt-letter">${letters[i]}</div>
        <div class="opt-text">${opt}</div>
      </div>`;
    }).join('');
    return `<div class="q-card">
      <div class="q-header">
        <span class="q-num-badge">Q${q.id}</span>
        ${q.multi ? '<span class="multi-hint">Múltiples respuestas</span>' : ''}
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options">${opts}</div>
    </div>`;
  }).join('');
}

renderGrid();
</script>
