VPC en la nube de AWS? (Seleccione dos.)", "options": ["Amazon API Gateway — servicio de APIs (no componente directo de VPC)", "Buckets y objetos de Amazon S3 — almacenamiento de objetos (no componente de VPC)", "AWS Storage Gateway — conecta almacenamiento local con AWS", "Internet Gateway — permite la comunicación entre la VPC e internet", "Subred (Subnet) — segmento de red dentro de una VPC"], "correct": [3, 4], "multi": true}, {"id": 415, "text": "Una empresa está construyendo una nueva aplicación en AWS. La empresa necesita que la aplicación permanezca disponible si un componente individual falla. ¿Qué principio de diseño debe usar la empresa para cumplir con este requisito?", "options": ["Recursos desechables — reemplaza recursos en lugar de repararlos", "Automatización — automatiza los procesos para reducir errores", "Dimensionamiento correcto — ajusta recursos al tamaño exacto", "Acoplamiento débil (Loose coupling) — aísla los fallos para que no se propaguen entre componentes"], "correct": [3], "multi": false}, {"id": 416, "text": "Una empresa quiere usar un servicio gestionado para identificar y proteger datos sensibles almacenados en Amazon S3. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS IAM Access Analyzer — identifica recursos compartidos externamente", "Amazon GuardDuty — detección de amenazas", "Amazon Inspector — detecta vulnerabilidades en EC2", "Amazon Macie — usa ML para identificar y proteger datos sensibles (PII) en S3"], "correct": [3], "multi": false}, {"id": 417, "text": "¿Qué servicio o característica de AWS puede configurar un usuario para limitar el acceso a la red a nivel de subred?", "options": ["AWS Shield — protección contra DDoS", "AWS WAF — firewall de aplicaciones web", "ACL de red (Network ACL) — reglas de acceso a nivel de subred dentro de una VPC", "Grupo de seguridad — firewall a nivel de instancia"], "correct": [2], "multi": false}, {"id": 418, "text": "¿Qué servicio de AWS puede usar una empresa para gestionar claves de cifrado en la nube?", "options": ["AWS License Manager — gestiona licencias de software", "AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS", "AWS CloudHSM — módulo de seguridad de hardware dedicado para gestionar claves criptográficas", "AWS Directory Service — conecta AWS con Microsoft Active Directory"], "correct": [2], "multi": false}, {"id": 419, "text": "Una empresa quiere mejorar la seguridad lanzando un sistema de detección de intrusiones de un proveedor ISP de terceros desde su cuenta de AWS. ¿Qué servicio o recurso de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS Security Hub — agrega alertas de seguridad de servicios de AWS", "AWS Marketplace — tienda con soluciones de seguridad de terceros, incluyendo sistemas de detección de intrusiones", "AWS Quick Starts — plantillas de despliegue rápido de soluciones", "AWS Security Center — no es un servicio de AWS"], "correct": [1], "multi": false}, {"id": 420, "text": "¿Cómo ayuda la nube de AWS a las empresas a incorporar agilidad en sus procesos e infraestructura de nube?", "options": ["Las empresas pueden evitar aprovisionar demasiada capacidad cuando no saben cuánta capacidad necesitan.", "Las empresas pueden expandirse a nuevas regiones geográficas.", "Las empresas pueden acceder a una variedad de tecnologías para experimentar e innovar rápidamente.", "Las empresas pueden pagar los recursos de TI solo cuando los usan."], "correct": [2], "multi": false}, {"id": 421, "text": "¿Qué servicio o herramienta de AWS le da a una empresa la capacidad de lanzar cambios en la aplicación de forma automatizada?", "options": ["Amazon AppFlow — integración de datos entre aplicaciones SaaS", "AWS CodeDeploy — automatiza el despliegue de aplicaciones en EC2, Lambda, ECS y servidores locales", "AWS PrivateLink — conectividad privada entre servicios", "Amazon EKS Distro — distribución de Kubernetes de AWS"], "correct": [1], "multi": false}, {"id": 422, "text": "¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) se enfoca en gestionar identidades y permisos a escala?", "options": ["Operaciones (Operations)", "Plataforma (Platform)", "Gobernanza (Governance)", "Seguridad (Security) — incluye gestión de identidades y accesos (IAM) como capacidad central"], "correct": [3], "multi": false}, {"id": 423, "text": "¿Qué servicio o característica de AWS permite a los usuarios almacenar credenciales cifradas de forma segura y recuperarlas cuando se requieran?", "options": ["AWS Encryption SDK — biblioteca de cifrado del lado del cliente", "AWS Security Hub — agrega alertas de seguridad", "AWS Secrets Manager — almacena, cifra y recupera credenciales de forma segura bajo demanda", "AWS Artifact — informes de cumplimiento"], "correct": [2], "multi": false}, {"id": 424, "text": "¿Qué pilar del Marco de Buena Arquitectura de AWS se alinea con la capacidad de realizar cambios frecuentes, pequeños y reversibles en la arquitectura de la nube de AWS?", "options": ["Seguridad", "Optimización de costos", "Excelencia operativa (Operational Excellence) — realiza cambios frecuentes, pequeños y reversibles para mejorar continuamente", "Eficiencia en el rendimiento"], "correct": [2], "multi": false}, {"id": 425, "text": "¿Qué servicio o recurso de AWS puede usar una empresa para desplegar reglas de AWS WAF?", "options": ["Amazon EC2 — instancias virtuales", "Application Load Balancer — distribuye tráfico HTTP/HTTPS y permite adjuntar reglas de AWS WAF", "AWS Trusted Advisor — recomendaciones de optimización", "Network Load Balancer — distribuye tráfico TCP/UDP de baja latencia (no compatible con WAF)"], "correct": [1], "multi": false}, {"id": 426, "text": "Una empresa aloja su sitio web en instancias de Amazon EC2. La empresa necesita asegurarse de que el sitio web llegue a una audiencia global y proporcione mínima latencia a los usuarios. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon Route 53 — DNS escalable (ayuda pero no reduce latencia como CDN)", "Amazon CloudFront — CDN global que entrega contenido desde ubicaciones de borde cercanas a los usuarios", "Elastic Load Balancing — distribuye tráfico dentro de una región", "AWS Lambda — funciones sin servidor"], "correct": [1], "multi": false}, {"id": 427, "text": "¿Qué principio de diseño de AWS enfatiza la reducción de interdependencias entre los componentes de una aplicación?", "options": ["Escalabilidad", "Acoplamiento débil (Loose coupling) — reduce las dependencias entre componentes para aislar fallos y facilitar el escalado", "Automatización", "Caché"], "correct": [1], "multi": false}, {"id": 428, "text": "Una empresa quiere darle a uno de sus empleados acceso a Amazon RDS. La empresa también quiere limitar la interacción solo a la AWS CLI y los SDKs de AWS. ¿Qué combinación de acciones debe tomar la empresa para cumplir con estos requisitos siguiendo los principios de mínimo privilegio? (Seleccione dos.)", "options": ["Crear un usuario de IAM y proporcionar solo acceso a la Consola de Administración de AWS.", "Crear un usuario de IAM y proporcionar solo acceso programático — permite el uso de CLI y SDKs sin acceso a la consola.", "Crear un rol de IAM y proporcionar solo acceso a la Consola de Administración de AWS.", "Crear una política de IAM con acceso de administrador y adjuntarla al usuario.", "Crear una política de IAM con acceso a Amazon RDS y adjuntarla al usuario — limita los permisos solo a RDS."], "correct": [1, 4], "multi": true}, {"id": 429, "text": "Una empresa ejecuta una aplicación web de informes en instancias de Amazon EC2. La aplicación se ejecuta una vez cada semana y nuevamente a fin de mes. Las instancias EC2 pueden apagarse cuando no están en uso. ¿Cuál es el modelo de facturación MÁS rentable para este caso de uso?", "options": ["Instancias Reservadas Estándar — compromiso de 1 o 3 años (no rentable para uso semanal ocasional)", "Instancias Reservadas Convertibles — compromiso flexible pero sigue siendo de 1 o 3 años", "Reservaciones de capacidad Bajo Demanda — reserva capacidad sin compromiso de uso a largo plazo", "Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso, ideal para uso ocasional e impredecible"], "correct": [3], "multi": false}, {"id": 430, "text": "Una empresa quiere descubrir, preparar, mover e integrar datos de múltiples fuentes para análisis de datos y Machine Learning. ¿Qué servicio de integración de datos sin servidor de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Glue — servicio ETL sin servidor para descubrir, preparar e integrar datos de múltiples fuentes", "AWS Data Exchange — suscripción y compartición de datos de terceros", "Amazon Athena — consultas SQL sobre datos en S3", "Amazon EMR — procesamiento de big data con Hadoop/Spark (no serverless por defecto)"], "correct": [0], "multi": false}, {"id": 431, "text": "Una empresa está migrando sus entornos de desarrollo y prueba a AWS para aumentar la agilidad y reducir costos. Dado que estas no son cargas de trabajo de producción y los servidores no están completamente utilizados, la disponibilidad ocasional es aceptable. ¿Cuál es el modelo de precios de Amazon EC2 MÁS rentable que cumplirá con estos requisitos?", "options": ["Instancias Reservadas — compromiso de 1 o 3 años (no rentable para dev/test con uso variable)", "Instancias Bajo Demanda — sin descuento por compromiso", "Instancias Spot — hasta 90% de descuento, toleran interrupciones, ideal para entornos de desarrollo y prueba", "Hosts Dedicados — hardware dedicado con mayor costo"], "correct": [2], "multi": false}, {"id": 432, "text": "Una empresa despliega su aplicación en instancias de Amazon EC2. La aplicación experimenta ocasionalmente aumentos repentinos en la demanda. La empresa quiere asegurarse de que su aplicación pueda responder a los cambios en la demanda al menor costo posible. ¿Qué servicio o concepto de AWS cumplirá con estos requisitos?", "options": ["AWS Auto Scaling — agrega o elimina instancias EC2 automáticamente según la demanda, al menor costo", "AWS Compute Optimizer — recomienda el tamaño óptimo de instancias", "AWS Cost Explorer — analiza costos históricos", "AWS Well-Architected Framework — guía de mejores prácticas de arquitectura"], "correct": [0], "multi": false}, {"id": 433, "text": "Una empresa quiere organizar a sus usuarios para poder otorgar permisos como grupo. ¿Qué servicio o herramienta de AWS puede usar la empresa para cumplir con este requisito?", "options": ["Grupos de seguridad — controlan tráfico de red, no permisos de usuarios", "AWS Identity and Access Management (IAM) — permite crear grupos de usuarios y asignar permisos como grupo", "Grupos de recursos — organiza recursos de AWS con etiquetas", "AWS Security Hub — agrega alertas de seguridad"], "correct": [1], "multi": false}, {"id": 434, "text": "Una empresa quiere construir una aplicación que use AWS Lambda para ejecutar código Python. Bajo el Modelo de Responsabilidad Compartida de AWS, ¿cuáles tareas serán responsabilidad de la empresa? (Seleccione dos.)", "options": ["Gestión de la infraestructura subyacente — responsabilidad de AWS.", "Gestión del sistema operativo — responsabilidad de AWS.", "Escribir el código de la lógica de negocio — el cliente escribe las funciones Lambda.", "Instalación del entorno de ejecución del lenguaje — responsabilidad de AWS.", "Proporcionar acceso de AWS IAM al servicio Lambda — el cliente configura los permisos IAM para su función."], "correct": [2, 4], "multi": true}, {"id": 435, "text": "Una empresa necesita identificar quién accedió a un servicio de AWS y qué acción se realizó durante un período de tiempo determinado. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["Amazon CloudWatch — monitoreo de métricas y logs", "AWS CloudTrail — registra quién hizo qué acción en qué servicio de AWS y cuándo", "AWS Security Hub — agrega alertas de seguridad", "Amazon Inspector — detecta vulnerabilidades"], "correct": [1], "multi": false}, {"id": 436, "text": "Una empresa quiere usar un servicio centralizado de AWS para hacer cumplir los estándares de negocio organizacionales. La empresa quiere usar un servicio de AWS que pueda gobernar y controlar quién puede desplegar, gestionar y retirar recursos de AWS. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon CloudWatch — monitoreo y observabilidad", "AWS Service Catalog — catálogo de servicios aprobados que controla qué recursos pueden desplegarse y por quién", "Amazon GuardDuty — detección de amenazas", "AWS Security Hub — agrega alertas de seguridad"], "correct": [1], "multi": false}, {"id": 437, "text": "¿A qué se refiere «seguridad de la nube» en el Modelo de Responsabilidad Compartida de AWS?", "options": ["Disponibilidad de servicios de AWS como Amazon EC2", "Seguridad de la infraestructura de nube que ejecuta todos los servicios de AWS — AWS es responsable de proteger la infraestructura global", "Implementación de políticas de contraseñas para usuarios de IAM", "Seguridad de los entornos del cliente usando socios de AWS Network Firewall"], "correct": [1], "multi": false}, {"id": 438, "text": "Una empresa tiene una aplicación que produce datos no estructurados de forma continua. La empresa necesita almacenar los datos de manera que sean duraderos y fáciles de consultar. ¿Qué servicio de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["Amazon RDS — base de datos relacional (no ideal para datos no estructurados)", "Amazon Aurora — base de datos relacional de alto rendimiento", "Amazon QuickSight — dashboards de BI", "Amazon DynamoDB — base de datos NoSQL durable y fácil de consultar para datos no estructurados"], "correct": [3], "multi": false}, {"id": 439, "text": "¿Cuáles de las siguientes son perspectivas del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Fluidez en la nube — no es una perspectiva del AWS CAF", "Seguridad (Security) — perspectiva del AWS CAF", "Aceleración del cambio — no es una perspectiva del AWS CAF", "Arquitectura — no es una perspectiva del AWS CAF", "Negocio (Business) — perspectiva del AWS CAF"], "correct": [1, 4], "multi": true}, {"id": 440, "text": "Una empresa quiere migrar su infraestructura de contenedores local a la nube de AWS. La empresa quiere evitar costos de administración y operación no planificados y adaptarse a una arquitectura sin servidor. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Connect — centro de contacto en la nube", "AWS Fargate — ejecuta contenedores sin gestionar servidores, arquitectura serverless para contenedores", "Amazon Lightsail — plataforma simplificada para apps y sitios web", "Amazon EC2 — instancias virtuales (requiere gestionar servidores)"], "correct": [1], "multi": false}, {"id": 441, "text": "Una empresa quiere que sus instancias de Amazon EC2 estén en diferentes ubicaciones pero compartan la misma área geográfica. La empresa también quiere usar múltiples redes eléctricas y conectividad de red independiente para las instancias EC2. ¿Qué solución cumple con estos requisitos?", "options": ["Usar instancias EC2 en múltiples ubicaciones de borde en la misma región de AWS.", "Usar instancias EC2 en múltiples Zonas de Disponibilidad en la misma región de AWS — cada AZ tiene instalaciones físicas separadas con energía y red independientes.", "Usar instancias EC2 en múltiples ubicaciones de Amazon Connect en la misma región de AWS.", "Usar instancias EC2 en múltiples ubicaciones de AWS Artifact en la misma región de AWS."], "correct": [1], "multi": false}, {"id": 442, "text": "Una empresa de comercio electrónico ha desplegado una nueva aplicación web en instancias de Amazon EC2. La empresa quiere distribuir el tráfico HTTP entrante de manera uniforme entre todas las instancias en ejecución. ¿Qué servicio o recurso de AWS cumplirá con este requisito?", "options": ["Amazon EC2 Auto Scaling — agrega o elimina instancias según la demanda", "Application Load Balancer — distribuye tráfico HTTP/HTTPS de manera uniforme entre múltiples instancias EC2", "Gateway Load Balancer — distribuye tráfico hacia appliances de seguridad de terceros", "Network Load Balancer — distribuye tráfico TCP/UDP de ultra baja latencia"], "correct": [1], "multi": false}, {"id": 443, "text": "¿Qué servicio o característica de AWS le da a los usuarios la capacidad de conectar VPCs y redes locales a un hub central?", "options": ["Puerta de enlace privada virtual (Virtual private gateway) — conecta una VPC con una red local por VPN", "AWS Transit Gateway — hub central que conecta múltiples VPCs y redes locales de forma simplificada", "Internet Gateway — permite comunicación entre VPC e internet", "Customer Gateway — componente del lado del cliente para una conexión VPN"], "correct": [1], "multi": false}, {"id": 444, "text": "Una empresa quiere ejecutar cargas de trabajo intensivas en CPU en múltiples instancias de Amazon EC2. ¿Qué tipo de instancia EC2 debe usar la empresa para cumplir con este requisito?", "options": ["Instancias de propósito general — balance entre cómputo, memoria y red", "Instancias optimizadas para cómputo (Compute optimized) — CPUs de alto rendimiento para cargas de trabajo intensivas en CPU", "Instancias optimizadas para memoria — gran cantidad de RAM para cargas de trabajo que procesan grandes conjuntos de datos", "Instancias optimizadas para almacenamiento — alto rendimiento de I/O"], "correct": [1], "multi": false}, {"id": 445, "text": "Una empresa conecta múltiples VPCs y redes locales. La empresa necesita usar un servicio de AWS como enrutador en la nube para simplificar las relaciones de emparejamiento. ¿Qué servicio de AWS puede usar la empresa para cumplir con este requisito?", "options": ["AWS Direct Connect — conexión dedicada entre instalaciones propias y AWS", "AWS Transit Gateway — actúa como enrutador central (cloud router) que simplifica la conectividad entre múltiples VPCs y redes locales", "Amazon Connect — centro de contacto en la nube", "Amazon Route 53 — servicio de DNS escalable"], "correct": [1], "multi": false}, {"id": 446, "text": "Una empresa almacena una gran cantidad de datos a los que los auditores acceden solo dos veces al año. ¿Qué clase de almacenamiento de Amazon S3 debe usar la empresa para almacenar los datos con el MENOR costo?", "options": ["Amazon S3 Outposts — almacenamiento S3 en instalaciones propias", "Amazon S3 Glacier Instant Retrieval — archivado de bajo costo con recuperación en milisegundos, ideal para datos de acceso rarísimo (anual)", "Amazon S3 Standard — acceso frecuente, mayor costo", "Amazon S3 Intelligent-Tiering — mueve objetos automáticamente entre niveles"], "correct": [1], "multi": false}, {"id": 447, "text": "¿Qué acción debe tomar una empresa para mejorar la seguridad en su cuenta de AWS?", "options": ["Requerir autenticación multifactor (MFA) para usuarios privilegiados — añade una capa adicional de seguridad al inicio de sesión.", "Eliminar la cuenta de usuario raíz.", "Crear una clave de acceso para el usuario raíz de la cuenta de AWS.", "Crear una clave de acceso para cada usuario privilegiado."], "correct": [0], "multi": false}, {"id": 448, "text": "¿Cuáles de las siguientes son formas de mejorar la seguridad en AWS? (Seleccione dos.)", "options": ["Usar AWS Artifact — proporciona informes de cumplimiento (no mejora la seguridad directamente)", "Otorgar los permisos más amplios a todos los roles de IAM", "Ejecutar el código de la aplicación con la nube de AWS", "Habilitar la autenticación multifactor (MFA) con Amazon Cognito — añade verificación adicional al inicio de sesión", "Usar las verificaciones de seguridad de AWS Trusted Advisor — identifica configuraciones de seguridad que no siguen las mejores prácticas"], "correct": [3, 4], "multi": true}, {"id": 449, "text": "¿Qué servicio de AWS puede usar una empresa para gestionar claves de cifrado en la nube?", "options": ["AWS License Manager — gestiona licencias de software", "AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS", "AWS CloudHSM — módulo de seguridad de hardware dedicado para crear y gestionar claves criptográficas", "AWS Directory Service — conecta AWS con Microsoft Active Directory"], "correct": [2], "multi": false}, {"id": 450, "text": "Una empresa quiere almacenar sus archivos en la nube de AWS. Los usuarios necesitan poder descargar estos archivos directamente usando una URL pública. ¿Qué servicio o característica de AWS cumplirá con este requisito?", "options": ["Amazon Redshift — data warehouse para análisis", "Amazon EBS — almacenamiento de bloques para EC2", "Amazon EFS — sistema de archivos compartido", "Amazon S3 — almacenamiento de objetos que permite acceso público mediante URL para descarga directa"], "correct": [3], "multi": false}, {"id": 451, "text": "Una empresa usa AWS para toda su infraestructura de TI. Los desarrolladores de la empresa tienen permitido desplegar aplicaciones por su cuenta. Los desarrolladores quieren desplegar sus aplicaciones sin tener que aprovisionar la infraestructura ellos mismos. ¿Qué servicio de AWS deben usar los desarrolladores para cumplir con estos requisitos?", "options": ["AWS CloudFormation — infraestructura como código (requiere definir plantillas)", "AWS CodeBuild — compila y prueba código", "AWS Elastic Beanstalk — despliega aplicaciones automáticamente sin que el desarrollador aprovisione infraestructura", "AWS CodeDeploy — automatiza despliegues de aplicaciones"], "correct": [2], "multi": false}, {"id": 452, "text": "Una empresa quiere obtener información de sus datos y construir dashboards interactivos de visualización de datos. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon SageMaker — construye y entrena modelos de ML", "Amazon Rekognition — analiza imágenes y videos", "Amazon QuickSight — servicio de BI para crear dashboards interactivos de visualización de datos", "Amazon Kinesis — procesamiento de datos en streaming"], "correct": [2], "multi": false}, {"id": 453, "text": "Un ingeniero de nube quiere almacenar datos en Amazon S3. El ingeniero accederá a algunos datos anualmente y a otros datos diariamente. ¿Qué clase de almacenamiento S3 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["S3 Standard — acceso frecuente, mayor costo para datos de acceso anual", "S3 Glacier Deep Archive — archivado a largo plazo con recuperación de 12 horas (no ideal para acceso diario)", "S3 One Zone-IA — acceso infrecuente en una sola AZ", "S3 Intelligent-Tiering — mueve automáticamente los objetos al nivel más rentable según el patrón de acceso real"], "correct": [3], "multi": false}, {"id": 454, "text": "¿Cuáles de los siguientes son beneficios económicos de usar la nube de AWS? (Seleccione dos.)", "options": ["Precios basados en consumo (Consumption-based pricing) — pagas solo por lo que usas, sin compromisos fijos.", "Licencias perpetuas — compra licencias de por vida (modelo opuesto al cloud).", "Economías de escala — el masivo volumen de AWS se traduce en precios más bajos para los clientes.", "AWS Enterprise Support sin costo adicional — el Enterprise Support tiene costo adicional.", "Modelo de traer tu propio hardware — en la nube usas el hardware de AWS."], "correct": [0, 2], "multi": true}, {"id": 455, "text": "Un usuario está moviendo una carga de trabajo desde un centro de datos local a una arquitectura distribuida entre el centro de datos local y la nube de AWS. ¿Qué tipo de migración es esta?", "options": ["Local a nativo de la nube — migración completa a la nube", "Híbrido a nativo de la nube — ya tenía algo en la nube", "Local a híbrido — empieza con infraestructura local y añade la nube de AWS, resultado: arquitectura híbrida", "Nativo de la nube a híbrido — estaría bajando de la nube a local"], "correct": [2], "multi": false}], [{"id": 456, "text": "Una empresa necesita almacenar datos de uso infrecuente para archivos de datos y copias de seguridad a largo plazo. ¿Qué servicio o clase de almacenamiento de AWS cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Amazon FSx for Lustre — sistema de archivos de alto rendimiento para HPC", "Amazon EBS — almacenamiento de bloques para EC2 (costoso para datos de archivado)", "Amazon EFS — sistema de archivos compartido (mayor costo para archivado)", "Amazon S3 Glacier Flexible Retrieval — archivado de bajo costo con recuperación en horas, ideal para archivos y backups a largo plazo"], "correct": [3], "multi": false}, {"id": 457, "text": "¿Qué servicio de AWS proporciona a los usuarios informes, certificaciones, acreditaciones y attestaciones de terceros emitidos por AWS?", "options": ["AWS Artifact — portal para descargar informes de cumplimiento, certificaciones y acuerdos de AWS", "AWS Trusted Advisor — recomendaciones de optimización", "AWS Health Dashboard — estado de los servicios de AWS", "AWS Config — registra configuraciones de recursos"], "correct": [0], "multi": false}, {"id": 458, "text": "Una empresa necesita crear y publicar dashboards interactivos de inteligencia de negocios. Los dashboards requieren perspectivas impulsadas por Machine Learning. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["AWS Glue Studio — interfaz visual para pipelines ETL", "Amazon QuickSight — crea dashboards interactivos de BI con perspectivas de ML", "Amazon Redshift — data warehouse para análisis", "Amazon Athena — consultas SQL sobre datos en S3"], "correct": [1], "multi": false}, {"id": 459, "text": "Una empresa quiere usar AWS. La empresa tiene requisitos estrictos sobre acceso de baja latencia a sistemas locales y residencia de datos. ¿Qué servicio de AWS debe usar la empresa para diseñar una solución que cumpla con estos requisitos?", "options": ["AWS Wavelength — apps de baja latencia en redes 5G", "AWS Transit Gateway — conecta VPCs y redes locales", "AWS Ground Station — controla satélites desde la nube", "AWS Outposts — infraestructura de AWS instalada físicamente en las instalaciones propias para baja latencia y residencia de datos"], "correct": [3], "multi": false}, {"id": 460, "text": "Una empresa ejecuta un centro de contacto local para sus clientes. La empresa necesita migrar a una solución basada en la nube que pueda ofrecer características de inteligencia artificial para mejorar la experiencia del usuario. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Wavelength — apps de baja latencia en redes 5G", "AWS IAM Identity Center — inicio de sesión único", "AWS Direct Connect — conexión de red dedicada", "Amazon Connect — centro de contacto en la nube con capacidades de IA para mejorar la experiencia del cliente"], "correct": [3], "multi": false}, {"id": 461, "text": "Una empresa necesita la capacidad de adquirir recursos cuando los necesita y también liberar los recursos cuando ya no los necesita. ¿Qué concepto de AWS representa los objetivos de la empresa?", "options": ["Escalabilidad — capacidad de crecer para manejar mayor carga", "Sostenibilidad — minimizar el impacto ambiental", "Elasticidad — adquiere y libera recursos dinámicamente según la demanda", "Excelencia operativa — mejora continua de procesos"], "correct": [2], "multi": false}, {"id": 462, "text": "Una empresa quiere usar instancias de Amazon EC2 para una carga de trabajo de producción estable que durará 1 año. ¿Qué opción de compra de instancias cumple con estos requisitos de la forma MÁS rentable?", "options": ["Hosts Dedicados — hardware exclusivo con mayor costo", "Instancias Reservadas — descuento de hasta 72% con compromiso de 1 año para uso estable y continuo", "Instancias Bajo Demanda — sin descuento por compromiso", "Instancias Spot — pueden interrumpirse, no adecuadas para producción estable"], "correct": [1], "multi": false}, {"id": 463, "text": "Una empresa quiere iniciar sesión de forma segura en instancias de Amazon EC2 Linux. ¿Cómo puede lograr esto la empresa?", "options": ["Usar claves SSH — método estándar para conexión segura a instancias Linux en AWS.", "Usar una VPN — proporciona conectividad de red, no autenticación de instancias.", "Usar cifrado de extremo a extremo — concepto de seguridad, no un método de inicio de sesión.", "Usar Amazon Route 53 — servicio de DNS."], "correct": [0], "multi": false}, {"id": 464, "text": "Una empresa quiere usar un servicio de cómputo sin servidor para una aplicación. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Lambda — servicio de cómputo sin servidor que ejecuta código sin gestionar servidores", "AWS CloudFormation — infraestructura como código", "AWS Elastic Beanstalk — despliega apps gestionando la infraestructura subyacente", "Elastic Load Balancing — distribuye tráfico entre instancias"], "correct": [0], "multi": false}, {"id": 465, "text": "Una empresa quiere una solución que ajuste automáticamente el número de instancias de Amazon EC2 en uso según la carga actual. ¿Qué oferta de AWS cumplirá con estos requisitos?", "options": ["Hosts Dedicados — hardware exclusivo sin escalado automático", "Grupos de ubicación (Placement groups) — controlan la ubicación física de instancias", "Grupos de Auto Scaling — ajustan automáticamente el número de instancias EC2 según la demanda", "Instancias Reservadas — descuento por compromiso, sin escalado automático"], "correct": [2], "multi": false}, {"id": 466, "text": "Una empresa está construyendo arquitectura de AWS para entregar feeds de datos en tiempo real desde un centro de datos local a una aplicación que se ejecuta en AWS. La empresa necesita una conexión de red consistente con latencia mínima. ¿Qué debe usar la empresa para conectar la aplicación y el centro de datos?", "options": ["AWS Direct Connect — conexión de red dedicada y privada con latencia mínima y consistente", "Internet público — latencia variable e inconsistente", "AWS VPN — conexión cifrada por internet con mayor latencia", "Amazon Connect — centro de contacto en la nube"], "correct": [0], "multi": false}, {"id": 467, "text": "Una empresa planea migrar su aplicación de marketing personalizada y su aplicación de procesamiento de pedidos a AWS. La empresa necesita desplegar las aplicaciones en diferentes tipos de instancias con varias configuraciones de CPU, memoria, almacenamiento y capacidad de red. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Lambda — funciones sin servidor (no permite configurar CPU/memoria libremente)", "Amazon Cognito — autenticación de usuarios", "Amazon Athena — consultas SQL sobre datos en S3", "Amazon EC2 — instancias virtuales con amplia variedad de tipos y configuraciones de CPU, memoria, almacenamiento y red"], "correct": [3], "multi": false}, {"id": 468, "text": "Una empresa quiere monitorear y bloquear solicitudes HTTP y HTTPS maliciosas que reciben sus distribuciones de Amazon CloudFront. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa en cuentas", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS WAF — firewall de aplicaciones web que monitorea y bloquea solicitudes HTTP/HTTPS maliciosas", "Amazon Detective — investiga incidentes de seguridad"], "correct": [2], "multi": false}, {"id": 469, "text": "¿Qué servicios de AWS pueden alojar bases de datos PostgreSQL? (Seleccione dos.)", "options": ["Amazon S3 — almacenamiento de objetos (no base de datos)", "Amazon Aurora — base de datos relacional compatible con PostgreSQL", "Amazon EC2 — permite instalar y gestionar PostgreSQL manualmente en la instancia", "Amazon OpenSearch Service — motor de búsqueda y análisis", "Amazon EFS — sistema de archivos compartido (no base de datos)"], "correct": [1, 2], "multi": true}, {"id": 470, "text": "¿Qué servicio de AWS puede generar información que puede ser utilizada por auditores externos?", "options": ["Amazon Cognito — autenticación de usuarios", "Amazon FSx — sistemas de archivos gestionados", "AWS Config — registra el historial de configuraciones de recursos, útil para auditorías de cumplimiento", "Amazon Inspector — detecta vulnerabilidades"], "correct": [2], "multi": false}, {"id": 471, "text": "¿Qué servicio o característica de AWS requiere un proveedor de servicios de internet (ISP) y una instalación de colocation para ser implementado?", "options": ["AWS VPN — usa internet, no requiere colocation", "Amazon Connect — centro de contacto en la nube", "AWS Direct Connect — requiere un ISP y una instalación de colocation para la conexión física dedicada", "Internet Gateway — componente de VPC para acceso a internet"], "correct": [2], "multi": false}, {"id": 472, "text": "Una empresa quiere que sus instancias de Amazon EC2 operen en un entorno de alta disponibilidad, incluso si ocurre un desastre natural en una zona geográfica particular. ¿Qué solución logra este objetivo?", "options": ["Usar instancias EC2 en múltiples regiones de AWS — protege contra desastres que afectan a una región geográfica completa.", "Usar instancias EC2 en múltiples ubicaciones de borde.", "Usar instancias EC2 en la misma Zona de Disponibilidad pero en diferentes regiones de AWS.", "Usar Amazon CloudFront con las instancias EC2 configuradas como origen."], "correct": [0], "multi": false}, {"id": 473, "text": "¿Qué servicio de AWS permite el intercambio de archivos entre múltiples instancias de Amazon EC2?", "options": ["AWS Direct Connect — conexión de red dedicada", "AWS Snowball Edge — dispositivo físico para migrar datos", "AWS Backup — servicio centralizado de respaldo", "Amazon EFS (Elastic File System) — sistema de archivos compartido que permite el acceso simultáneo desde múltiples instancias EC2"], "correct": [3], "multi": false}, {"id": 474, "text": "Una empresa necesita gestionar múltiples inicios de sesión en cuentas de AWS dentro de la misma organización en AWS Organizations. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["Amazon VPC — red virtual privada", "Amazon GuardDuty — detección de amenazas", "Amazon Cognito — autenticación de usuarios de aplicaciones", "AWS IAM Identity Center — gestiona inicios de sesión y accesos en múltiples cuentas de AWS dentro de una organización"], "correct": [3], "multi": false}, {"id": 475, "text": "Una empresa usa Amazon WorkSpaces. ¿Cuál tarea es responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Configurar la autenticación multifactor (MFA) para cada cuenta de usuario de WorkSpaces.", "Garantizar la seguridad ambiental y física de la infraestructura de AWS que aloja WorkSpaces.", "Proporcionar seguridad para las cuentas de usuarios de WorkSpaces mediante IAM.", "Configurar AWS CloudTrail para registrar las llamadas a la API y la actividad de los usuarios."], "correct": [1], "multi": false}, {"id": 476, "text": "Una empresa está migrando su sitio web público a AWS. La empresa quiere alojar el nombre de dominio del sitio web en AWS. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS Lambda — funciones sin servidor", "Amazon Route 53 — servicio de DNS escalable para registrar y gestionar nombres de dominio", "Amazon CloudFront — red de distribución de contenido (CDN)", "AWS Direct Connect — conexión de red dedicada"], "correct": [1], "multi": false}, {"id": 477, "text": "Una empresa usa un proveedor de identidad (IdP) de terceros. La empresa quiere proporcionar a sus empleados acceso a cuentas y servicios de AWS sin requerir otro conjunto de credenciales de inicio de sesión. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Directory Service — conecta AWS con Microsoft Active Directory", "Amazon Cognito — autenticación para usuarios de aplicaciones", "AWS IAM Identity Center — permite federar el IdP externo para que los empleados usen sus credenciales existentes para acceder a AWS", "AWS Resource Access Manager (RAM) — comparte recursos entre cuentas de AWS"], "correct": [2], "multi": false}, {"id": 478, "text": "¿Qué combinación de servicios de AWS puede usarse para mover una base de datos relacional comercial a una base de datos de código abierto gestionada por Amazon? (Seleccione dos.)", "options": ["AWS Database Migration Service (AWS DMS) — migra los datos de la base de datos comercial a la base de datos de destino", "AWS Software Development Kits (SDKs) — bibliotecas para desarrollo de aplicaciones", "AWS Schema Conversion Tool — convierte el esquema y el código de la base de datos comercial al formato de la base de datos de destino", "AWS Systems Manager — gestiona y opera infraestructura", "Amazon EMR — procesamiento de big data"], "correct": [0, 2], "multi": true}, {"id": 479, "text": "¿Qué servicio de AWS proporciona a los usuarios acceso de autoservicio bajo demanda a informes de control de cumplimiento de AWS?", "options": ["AWS Config — registra configuraciones de recursos", "Amazon GuardDuty — detección de amenazas", "AWS Trusted Advisor — recomendaciones de optimización", "AWS Artifact — acceso de autoservicio a informes de cumplimiento, certificaciones y acuerdos de AWS"], "correct": [3], "multi": false}, {"id": 480, "text": "Una empresa ejecuta una carga de trabajo heredada en un centro de datos local. La empresa quiere migrar la carga de trabajo a AWS. La empresa no quiere realizar ningún cambio en la carga de trabajo. ¿Qué estrategia de migración debe usar la empresa?", "options": ["Recomprar (Repurchase) — migrar a un producto diferente como SaaS", "Replataformar (Replatform) — optimizaciones pequeñas durante la migración", "Realojar (Rehost) — migración lift-and-shift sin cambios en la aplicación", "Refactorizar (Refactor) — rediseñar la arquitectura"], "correct": [2], "multi": false}, {"id": 481, "text": "Una empresa está planificando migrar aplicaciones a la nube de AWS. Durante una auditoría del sistema, la empresa descubre que su aplicación de sistema de gestión de contenidos (CMS) es incompatible con entornos de nube. ¿Qué estrategias de migración ayudarán a la empresa a migrar la aplicación CMS con el MENOR esfuerzo? (Seleccione dos.)", "options": ["Retirar (Retire) — descontinuar la aplicación", "Realojar (Rehost) — migración lift-and-shift sin cambios, mínimo esfuerzo si la app puede ejecutarse en EC2", "Recomprar (Repurchase) — reemplazar por una solución SaaS compatible con la nube, mínimo esfuerzo de migración", "Replataformar (Replatform) — optimizaciones durante la migración", "Refactorizar (Refactor) — rediseño completo de la arquitectura"], "correct": [1, 2], "multi": true}, {"id": 482, "text": "¿Cuáles de las siguientes son recomendaciones de mejores prácticas de AWS para el uso de AWS IAM? (Seleccione dos.)", "options": ["Usar el usuario raíz de la cuenta de AWS para el acceso diario.", "Usar claves de acceso y claves secretas en Amazon EC2.", "Rotar las credenciales regularmente — reduce el riesgo si una credencial se ve comprometida.", "Crear un conjunto compartido de claves de acceso para administradores del sistema.", "Configurar la autenticación multifactor (MFA) — añade seguridad adicional al inicio de sesión."], "correct": [2, 4], "multi": true}, {"id": 483, "text": "¿Cuál de las siguientes es responsabilidad de AWS bajo el Modelo de Responsabilidad Compartida de AWS?", "options": ["Configuración de red y firewall", "Cifrado de datos del lado del cliente", "Gestión de permisos de usuarios", "Hardware e infraestructura — AWS es completamente responsable del hardware físico y la infraestructura global"], "correct": [3], "multi": false}, {"id": 484, "text": "Una empresa quiere ejecutar una consulta de grafos que proporcione nombres, direcciones y transacciones de usuarios de tarjetas de crédito. La empresa quiere que el grafo muestre si los nombres, direcciones y transacciones indican posible fraude. ¿Qué servicio de base de datos de AWS cumplirá con estos requisitos?", "options": ["Amazon DocumentDB — base de datos de documentos compatible con MongoDB", "Amazon Timestream — base de datos de series temporales", "Amazon DynamoDB — base de datos NoSQL", "Amazon Neptune — base de datos de grafos para analizar relaciones complejas entre entidades, ideal para detección de fraude"], "correct": [3], "multi": false}, {"id": 485, "text": "¿Qué servicio de AWS proporciona capacidad de Machine Learning para detectar y analizar contenido en imágenes y videos?", "options": ["Amazon Connect — centro de contacto en la nube", "Amazon Lightsail — plataforma simplificada para apps", "Amazon Personalize — recomendaciones personalizadas", "Amazon Rekognition — detecta y analiza objetos, texto, personas y contenido en imágenes y videos con ML"], "correct": [3], "multi": false}, {"id": 486, "text": "Una empresa quiere hacer su uso de AWS más sostenible. La empresa quiere rastrear, medir, revisar y pronosticar las emisiones contaminantes que resultan de sus aplicaciones de AWS. ¿Qué servicio o herramienta de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["AWS Health Dashboard — estado de los servicios de AWS", "AWS Customer Carbon Footprint Tool — rastrea y reporta las emisiones de carbono asociadas con el uso de AWS", "AWS Support Center — portal de soporte técnico", "Amazon QuickSight — dashboards de BI"], "correct": [1], "multi": false}, {"id": 487, "text": "¿Qué servicio de AWS da a los usuarios la capacidad de desplegar configuraciones de infraestructura altamente repetibles?", "options": ["AWS CloudFormation — infraestructura como código (IaC) para desplegar configuraciones repetibles de forma consistente", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "AWS CodeBuild — compila y prueba código", "AWS Systems Manager — gestiona y opera infraestructura"], "correct": [0], "multi": false}, {"id": 488, "text": "Una empresa necesita proporcionar servicio al cliente mediante llamadas de voz y características de chat web. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon Aurora — base de datos relacional", "Amazon Connect — centro de contacto en la nube con capacidades de voz y chat", "Amazon WorkSpaces — escritorios virtuales", "AWS Organizations — gestión de múltiples cuentas"], "correct": [1], "multi": false}, {"id": 489, "text": "¿Qué servicio de AWS está diseñado para ayudar a los usuarios a manejar grandes cantidades de datos en un entorno de data warehouse?", "options": ["Amazon RDS — base de datos relacional gestionada", "Amazon DynamoDB — base de datos NoSQL serverless", "Amazon Redshift — data warehouse de petabytes diseñado para análisis a gran escala", "Amazon Aurora — base de datos relacional de alto rendimiento"], "correct": [2], "multi": false}, {"id": 490, "text": "Una empresa está construyendo una aplicación web usando AWS. ¿Qué servicio de AWS ayudará a prevenir ataques DDoS de capa de red contra la aplicación web?", "options": ["AWS WAF — firewall de aplicaciones web (capa 7)", "AWS Firewall Manager — gestión centralizada de reglas de firewall", "Amazon GuardDuty — detección de amenazas", "AWS Shield — protección contra ataques DDoS a nivel de red y aplicación"], "correct": [3], "multi": false}, {"id": 491, "text": "¿Cuáles de las siguientes son ventajas de moverse a la nube de AWS? (Seleccione dos.)", "options": ["Los usuarios pueden implementar todos los servicios de AWS en segundos.", "AWS asume toda la responsabilidad de la seguridad de la infraestructura y las aplicaciones.", "Los usuarios experimentan mayor velocidad y agilidad — despliegan recursos rápidamente para innovar.", "Los usuarios se benefician de masivas economías de escala — precios más bajos gracias al volumen de AWS.", "Los usuarios pueden mover hardware de su centro de datos a la nube de AWS."], "correct": [2, 3], "multi": true}, {"id": 492, "text": "¿Qué servicio de cómputo de AWS le da a los usuarios la capacidad de ejecutar contenedores de forma segura y confiable a escala?", "options": ["Amazon ECS (Elastic Container Service) — orquestación de contenedores gestionada para ejecutar contenedores a escala", "Amazon Aurora — base de datos relacional", "Amazon Athena — consultas SQL sobre datos en S3", "Amazon Polly — convierte texto en voz"], "correct": [0], "multi": false}, {"id": 493, "text": "¿Qué herramienta o característica de AWS actúa como firewall de VPC a nivel de subred?", "options": ["Grupo de seguridad — firewall a nivel de instancia", "ACL de red (Network ACL) — firewall stateless que opera a nivel de subred dentro de una VPC", "Traffic Mirroring — duplica el tráfico de red para análisis", "Internet Gateway — permite comunicación entre VPC e internet"], "correct": [1], "multi": false}, {"id": 494, "text": "Una empresa ejecuta una aplicación en AWS que realiza trabajos por lotes. La aplicación es tolerante a fallos y puede manejar interrupciones. La empresa quiere optimizar el costo de ejecución de la aplicación. ¿Qué oferta de AWS cumplirá con estos requisitos?", "options": ["Amazon Macie — detecta datos sensibles en S3", "Amazon Neptune — base de datos de grafos", "Instancias Spot de Amazon EC2 — hasta 90% de descuento, pueden interrumpirse, ideales para trabajos por lotes tolerantes a fallos", "Instancias Bajo Demanda de Amazon EC2 — sin descuento por compromiso"], "correct": [2], "multi": false}, {"id": 495, "text": "¿Qué servicio de AWS puede usarse para enviar alertas cuando se activa una alarma específica de Amazon CloudWatch?", "options": ["AWS CloudTrail — registra llamadas a la API", "Amazon SNS (Simple Notification Service) — envía alertas y notificaciones cuando se activan alarmas de CloudWatch", "Amazon SQS — cola de mensajes", "Amazon EventBridge — bus de eventos para automatizar flujos de trabajo"], "correct": [1], "multi": false}, {"id": 496, "text": "Un profesional de la nube quiere usar un servicio de DNS altamente disponible y escalable para su carga de trabajo de AWS. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Route 53 — servicio de DNS altamente disponible, escalable y con 100% de SLA de disponibilidad", "Amazon Lightsail — plataforma simplificada para apps", "AWS Amplify Hosting — alojamiento de sitios web estáticos y apps", "Amazon S3 — almacenamiento de objetos"], "correct": [0], "multi": false}, {"id": 497, "text": "De acuerdo con el Modelo de Responsabilidad Compartida de AWS, ¿cuál tarea es responsabilidad del cliente?", "options": ["Mantener la infraestructura necesaria para ejecutar AWS Lambda.", "Actualizar el sistema operativo de las instancias de Amazon DynamoDB.", "Mantener la infraestructura de Amazon S3.", "Actualizar el sistema operativo invitado en instancias de Amazon EC2 — el cliente es responsable del SO y parches en EC2."], "correct": [3], "multi": false}, {"id": 498, "text": "Una empresa está aprendiendo sobre sus responsabilidades relacionadas con la gestión de instancias de Amazon EC2. ¿Cuáles tareas para instancias EC2 son responsabilidad de la empresa, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Instalar y parchear el hipervisor de la máquina.", "Parchear el sistema operativo invitado — el cliente es responsable del SO en sus instancias EC2.", "Cifrar datos en reposo en el almacenamiento asociado — el cliente decide y configura el cifrado de sus datos.", "Instalar el hardware físico y el cableado.", "Proporcionar seguridad física para las instancias EC2."], "correct": [1, 2], "multi": true}, {"id": 499, "text": "Una empresa ejecuta cargas de trabajo de bases de datos MySQL en servidores autogestionados en un centro de datos local. La empresa quiere migrar las cargas de trabajo a un servicio gestionado de AWS. ¿Qué estrategia de migración debe usar la empresa?", "options": ["Realojar (Rehost) — migración lift-and-shift sin cambios (se mantendría en EC2 autogestionado)", "Recomprar (Repurchase) — reemplazar por SaaS", "Refactorizar (Refactor) — rediseño completo", "Replataformar (Replatform) — migrar a un servicio gestionado como Amazon RDS, con optimizaciones mínimas"], "correct": [3], "multi": false}, {"id": 500, "text": "Una empresa está planificando migrar una aplicación monolítica a AWS. La empresa quiere modernizar la aplicación dividiéndola en microservicios. La empresa desplegará los microservicios en AWS. ¿Qué estrategia de migración debe usar la empresa?", "options": ["Realojar (Rehost) — migración lift-and-shift sin cambios arquitectónicos", "Recomprar (Repurchase) — reemplazar por SaaS", "Replataformar (Replatform) — optimizaciones pequeñas", "Refactorizar (Refactor) — rediseña la arquitectura para microservicios nativos de la nube"], "correct": [3], "multi": false}, {"id": 501, "text": "Una empresa quiere implementar un seguimiento detallado de sus costos en la nube por departamento y proyecto. ¿Qué característica o servicio de AWS debe usar la empresa?", "options": ["Facturación consolidada — combina facturas de múltiples cuentas", "Etiquetas de asignación de costos (Cost allocation tags) — etiqueta recursos por departamento y proyecto para rastrear costos detalladamente", "AWS Marketplace — tienda de software de terceros", "AWS Budgets — alertas de presupuesto"], "correct": [1], "multi": false}, {"id": 502, "text": "Un usuario quiere invocar una función de AWS Lambda cuando una instancia de Amazon EC2 entra en el estado 'stopping'. ¿Qué servicio de AWS es apropiado para este caso de uso?", "options": ["Amazon EventBridge — bus de eventos que detecta cambios de estado en EC2 y dispara acciones como invocar funciones Lambda", "AWS Config — registra configuraciones de recursos", "Amazon SNS — notificaciones y mensajería", "AWS CloudFormation — infraestructura como código"], "correct": [0], "multi": false}, {"id": 503, "text": "Una empresa tiene una base de datos MariaDB local. La empresa quiere mover los datos a la nube de AWS. ¿Qué servicio de AWS alojará esta base de datos con la MENOR cantidad de sobrecarga operativa?", "options": ["Amazon RDS — base de datos relacional completamente gestionada que soporta MariaDB, con mínima sobrecarga operativa", "Amazon Neptune — base de datos de grafos", "Amazon S3 — almacenamiento de objetos", "Amazon DynamoDB — base de datos NoSQL (no compatible con MariaDB)"], "correct": [0], "multi": false}, {"id": 504, "text": "¿Qué servicio o característica de AWS respalda la gobernanza, el cumplimiento y la auditoría de riesgos de las cuentas de AWS?", "options": ["Autenticación multifactor (MFA)", "AWS Lambda — funciones sin servidor", "Amazon SNS — notificaciones y mensajería", "AWS CloudTrail — registra todas las acciones de la API para gobernanza, cumplimiento y auditoría de seguridad"], "correct": [3], "multi": false}, {"id": 505, "text": "¿Qué principio de diseño de la nube de AWS está usando una empresa cuando implementa AWS CloudTrail?", "options": ["Activar la trazabilidad (Activate traceability) — CloudTrail registra quién hizo qué y cuándo, habilitando la trazabilidad completa.", "Usar arquitecturas de cómputo sin servidor.", "Realizar operaciones como código.", "Despliegue global en minutos."], "correct": [0], "multi": false}, {"id": 506, "text": "Una empresa necesita un servicio de detección de amenazas que monitoree continuamente sus cuentas de AWS, cargas de trabajo y buckets de Amazon S3 en busca de actividad maliciosa y comportamiento no autorizado. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["AWS Shield — protección contra ataques DDoS", "AWS Firewall Manager — gestión centralizada de reglas de firewall", "Amazon GuardDuty — servicio de detección de amenazas que monitorea continuamente cuentas, cargas de trabajo y S3", "Amazon Inspector — detecta vulnerabilidades en aplicaciones"], "correct": [2], "multi": false}, {"id": 507, "text": "Una empresa está planificando migrar a la nube de AWS. La empresa está realizando una transformación organizacional y quiere ser más receptiva a las consultas y comentarios de los clientes. ¿Qué tarea debe realizar la empresa para cumplir con estos requisitos, según el Marco de Adopción de la Nube de AWS (AWS CAF)?", "options": ["Realinear los equipos para enfocarse en productos y flujos de valor — reorganiza los equipos hacia la entrega de valor centrada en el cliente.", "Crear nuevas propuestas de valor con nuevos productos y servicios.", "Usar una nueva plataforma de datos y análisis para crear perspectivas accionables.", "Migrar y modernizar la infraestructura heredada."], "correct": [0], "multi": false}, {"id": 508, "text": "Una empresa quiere dimensionar correctamente (rightsize) sus instancias de Amazon EC2. ¿Qué cambio de configuración cumplirá con este requisito con la MENOR sobrecarga operativa?", "options": ["Agregar instancias EC2 en otra Zona de Disponibilidad.", "Cambiar el tamaño y tipo de las instancias EC2 según la utilización — ajusta directamente el tamaño al uso real.", "Convertir el método de pago de Bajo Demanda a Savings Plans.", "Reaprovisionar las instancias EC2 con un tipo de instancia más grande."], "correct": [1], "multi": false}, {"id": 509, "text": "¿Qué servicio de AWS soporta la funcionalidad de registro de usuarios y autenticación en aplicaciones móviles y web?", "options": ["Amazon Cognito — gestiona el registro de usuarios, inicio de sesión y autenticación para apps móviles y web", "AWS Config — registra configuraciones de recursos", "Amazon GuardDuty — detección de amenazas", "AWS Systems Manager — gestiona infraestructura"], "correct": [0], "multi": false}, {"id": 510, "text": "¿Qué beneficio de la nube de AWS ayuda a las empresas a lograr menores costos de uso gracias al uso agregado de todos los usuarios de AWS?", "options": ["No necesidad de adivinar la capacidad", "Capacidad de despliegue global en minutos", "Economías de escala — el volumen masivo de AWS se traduce en menores precios para todos los usuarios", "Mayor velocidad y agilidad"], "correct": [2], "multi": false}, {"id": 511, "text": "¿Cuál tarea es responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Parchear el sistema operativo de Amazon DynamoDB.", "Asegurar las ubicaciones de borde de Amazon CloudFront permitiendo acceso físico según el principio de mínimo privilegio.", "Proteger el hardware que ejecuta los servicios de AWS.", "Usar AWS IAM según el principio de mínimo privilegio — el cliente define y gestiona los permisos de sus usuarios."], "correct": [3], "multi": false}, {"id": 512, "text": "Una empresa quiere gestionar sus recursos en la nube usando plantillas de infraestructura como código (IaC). La empresa necesita cumplir con requisitos de cumplimiento. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Artifact — informes de cumplimiento", "AWS Resource Explorer — busca recursos en AWS", "AWS License Manager — gestiona licencias de software", "AWS Service Catalog — gestiona plantillas de IaC aprobadas para cumplimiento y gobernanza"], "correct": [3], "multi": false}, {"id": 513, "text": "Un administrador de sistemas quiere monitorear la utilización de CPU de las instancias de Amazon EC2 de una empresa. ¿Qué servicio de AWS puede proporcionar esta información?", "options": ["AWS Config — registra configuraciones de recursos", "AWS Trusted Advisor — recomendaciones de optimización", "AWS CloudTrail — registra llamadas a la API", "Amazon CloudWatch — monitorea métricas como la utilización de CPU de instancias EC2 en tiempo real"], "correct": [3], "multi": false}, {"id": 514, "text": "Una empresa quiere migrar toda su infraestructura local a la nube de AWS. Antes de la migración, la empresa quiere una estimación de costos para ejecutar su infraestructura tal como está. ¿Qué servicio o principio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS Pricing Calculator — estima los costos de ejecutar infraestructura en AWS antes de la migración", "Marco de Buena Arquitectura de AWS (Well-Architected Framework)", "Modelo de Responsabilidad Compartida de AWS", "Marco de Adopción de la Nube de AWS (AWS CAF)"], "correct": [0], "multi": false}, {"id": 515, "text": "Un proveedor de software independiente quiere entregar y compartir sus Amazon Machine Images (AMIs) personalizadas a clientes potenciales. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Marketplace — plataforma para distribuir y vender AMIs y software de terceros a clientes de AWS", "AWS Data Exchange — suscripción y compartición de datos", "Amazon EC2 — instancias virtuales", "AWS Organizations — gestión de múltiples cuentas"], "correct": [0], "multi": false}, {"id": 516, "text": "¿Qué componente debe adjuntarse a una VPC para habilitar el acceso a internet entrante?", "options": ["NAT Gateway — permite tráfico saliente desde subredes privadas (no entrante)", "VPC Endpoint — conectividad privada con servicios de AWS", "Conexión VPN — conecta VPC con redes locales", "Internet Gateway — permite la comunicación bidireccional entre la VPC e internet"], "correct": [3], "multi": false}, {"id": 517, "text": "¿Qué servicio de AWS soporta la capacidad de una empresa para tratar la infraestructura como código?", "options": ["AWS CodeDeploy — automatiza despliegues", "AWS Elastic Beanstalk — despliega apps sin gestionar infraestructura", "Amazon API Gateway — gestiona APIs", "AWS CloudFormation — define y despliega infraestructura como código (IaC)"], "correct": [3], "multi": false}, {"id": 518, "text": "Una empresa está construyendo una aplicación que recibirá millones de consultas de base de datos por segundo. La empresa necesita que el almacén de datos de la aplicación escale para satisfacer estas necesidades. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon DynamoDB — base de datos NoSQL sin servidor que escala automáticamente para manejar millones de solicitudes por segundo", "AWS Cloud9 — entorno de desarrollo en la nube", "Amazon ElastiCache for Memcached — caché en memoria para acelerar consultas", "Amazon Neptune — base de datos de grafos"], "correct": [0], "multi": false}, {"id": 519, "text": "Un usuario de AWS quiere detectar de forma proactiva cuando una instancia o cuenta podría estar comprometida o si hay amenazas de ataques. ¿Qué servicio de AWS debe elegir el usuario?", "options": ["Amazon GuardDuty — detecta proactivamente amenazas y comportamientos anómalos en cuentas, instancias y buckets de S3", "AWS WAF — filtra solicitudes web maliciosas", "AWS Shield — protección contra DDoS", "Amazon Inspector — detecta vulnerabilidades (no monitorea amenazas en tiempo real)"], "correct": [0], "multi": false}, {"id": 520, "text": "¿Qué plan de AWS Support proporciona el conjunto completo de verificaciones de AWS Trusted Advisor al MENOR costo?", "options": ["AWS Developer Support — acceso limitado a verificaciones de Trusted Advisor", "AWS Business Support — incluye el conjunto completo de verificaciones de Trusted Advisor al menor costo posible", "AWS Enterprise On-Ramp Support — también incluye el conjunto completo pero a mayor costo", "AWS Enterprise Support — incluye el conjunto completo pero es el plan más costoso"], "correct": [1], "multi": false}], [{"id": 521, "text": "La aplicación de una empresa se ejecuta en instancias de Amazon EC2. La empresa planea una migración parcial a una arquitectura sin servidor el próximo año y quiere pagar por los recursos por adelantado. ¿Qué opción de compra de AWS optimizará los costos de la empresa?", "options": ["Instancias Reservadas Convertibles — flexibles pero limitadas a EC2", "Instancias Spot — precio variable, pueden interrumpirse", "EC2 Instance Savings Plans — descuento solo para EC2", "Compute Savings Plans — descuento flexible aplicable a EC2 y Lambda, ideal para migración parcial a serverless"], "correct": [3], "multi": false}, {"id": 522, "text": "Una empresa minorista está construyendo una nueva app móvil. La empresa evalúa si construirla en un centro de datos local o en la nube de AWS. ¿Cuáles de los siguientes son beneficios de construir esta app en la nube de AWS? (Seleccione dos.)", "options": ["Un gran gasto de capital inicial y bajos gastos variables.", "Mayor velocidad para probar nuevos proyectos — experimenta e itera rápidamente sin inversión inicial.", "Control completo sobre la seguridad física de la infraestructura.", "Flexibilidad para escalar en minutos a medida que la aplicación se vuelve popular.", "Capacidad de elegir los centros de datos específicos que alojarán los servidores de la aplicación."], "correct": [1, 3], "multi": true}, {"id": 523, "text": "Una empresa debe archivar sus documentos usando un modelo de escritura única, lectura múltiple (WORM) para cumplir con obligaciones legales y de cumplimiento. ¿Qué característica de Amazon S3 puede usar la empresa para cumplir con este requisito?", "options": ["S3 Versioning — conserva múltiples versiones de objetos", "S3 Bucket Policy — controla el acceso al bucket", "S3 Glacier Vault Lock — implementa el modelo WORM para archivado cumplimiento legal", "S3 MFA Delete — requiere MFA para eliminar versiones de objetos"], "correct": [2], "multi": false}, {"id": 524, "text": "Una empresa tiene cargas de trabajo por lotes que deben ejecutarse durante períodos cortos en Amazon EC2. Las cargas de trabajo pueden manejar interrupciones y pueden reiniciarse desde donde terminaron. ¿Cuál es la opción de compra de instancias EC2 MÁS rentable para cumplir con estos requisitos?", "options": ["Instancias Reservadas — compromiso de 1 o 3 años (no rentable para cargas cortas)", "Instancias Spot — hasta 90% de descuento, toleran interrupciones y pueden reiniciarse, ideal para trabajos por lotes", "Instancias Dedicadas — hardware dedicado con mayor costo", "Instancias Bajo Demanda — sin descuento por compromiso"], "correct": [1], "multi": false}, {"id": 525, "text": "Una empresa necesita desplegar una base de datos PostgreSQL en Amazon RDS. La base de datos debe ser altamente disponible y tolerante a fallos. ¿Qué solución de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon RDS con una sola Zona de Disponibilidad — sin alta disponibilidad", "Snapshots de Amazon RDS — respaldos puntuales (no alta disponibilidad continua)", "Amazon RDS con múltiples Zonas de Disponibilidad (Multi-AZ) — replica sincrónicamente en otra AZ para alta disponibilidad y tolerancia a fallos", "AWS Database Migration Service (DMS) — migra bases de datos (no las hace altamente disponibles)"], "correct": [2], "multi": false}, {"id": 526, "text": "¿Cuál es la forma MÁS segura de almacenar contraseñas en AWS?", "options": ["Almacenar contraseñas en un bucket de Amazon S3.", "Almacenar contraseñas como parámetros de AWS CloudFormation.", "Almacenar contraseñas en AWS Storage Gateway.", "Almacenar contraseñas en AWS Secrets Manager — cifra y gestiona las credenciales de forma segura con rotación automática."], "correct": [3], "multi": false}, {"id": 527, "text": "¿Cuáles afirmaciones describen con precisión las relaciones entre los componentes de la infraestructura global de AWS? (Seleccione dos.)", "options": ["Hay más regiones de AWS que Zonas de Disponibilidad.", "Hay más ubicaciones de borde (edge locations) que regiones de AWS — CloudFront tiene cientos de PoPs globales.", "Una ubicación de borde es una Zona de Disponibilidad.", "Hay más regiones de AWS que ubicaciones de borde.", "Hay más Zonas de Disponibilidad que regiones de AWS — cada región tiene múltiples AZs."], "correct": [1, 4], "multi": true}, {"id": 528, "text": "¿Qué servicio de AWS proporciona resolución de DNS?", "options": ["Amazon CloudFront — red de distribución de contenido (CDN)", "Amazon VPC — red virtual privada", "Amazon Route 53 — servicio de DNS escalable y altamente disponible", "AWS Direct Connect — conexión de red dedicada"], "correct": [2], "multi": false}, {"id": 529, "text": "Una empresa necesita alojar una aplicación en una zona geográfica específica para cumplir con regulaciones. ¿Qué característica de la infraestructura global de AWS ayudará a la empresa a cumplir con este requisito?", "options": ["Escalabilidad", "Presencia global (Global footprint) — AWS tiene regiones en todo el mundo, permitiendo elegir la ubicación geográfica específica", "Disponibilidad", "Rendimiento"], "correct": [1], "multi": false}, {"id": 530, "text": "Una empresa de comercio electrónico planea mover sus cargas de trabajo del centro de datos a la nube de AWS para soportar patrones de uso altamente dinámicos. ¿Qué beneficios hacen rentable la migración de este tipo de carga de trabajo a la nube de AWS? (Seleccione dos.)", "options": ["Fiabilidad", "Seguridad", "Elasticidad — escala hacia arriba o abajo dinámicamente para adaptarse a patrones de uso variables.", "Recursos de pago por uso (pay-as-you-go) — pagas solo por los recursos que consumes, sin costos fijos.", "Alta disponibilidad"], "correct": [2, 3], "multi": true}, {"id": 531, "text": "Al diseñar cargas de trabajo de AWS para que funcionen incluso cuando hay fallos de componentes, ¿cuál es la mejor práctica de AWS?", "options": ["Realizar pruebas de recuperación ante desastres trimestrales.", "Colocar el componente principal en la región us-east-1.", "Diseñar para conmutación por error automática a recursos saludables — recuperación automática sin intervención manual.", "Diseñar cargas de trabajo para que quepan en una sola instancia de Amazon EC2."], "correct": [2], "multi": false}, {"id": 532, "text": "¿Cuál de las siguientes opciones puede hacer la Calculadora de Precios de AWS (AWS Pricing Calculator)?", "options": ["Proyectar costos mensuales de AWS — estima los costos antes del despliegue.", "Calcular los costos históricos de AWS.", "Proporcionar información detallada sobre las estrategias de precios de AWS.", "Proporcionar a los usuarios acceso a sus facturas mensuales."], "correct": [0], "multi": false}, {"id": 533, "text": "¿Qué solución de AWS le da a las empresas la capacidad de usar protocolos como NFS para almacenar y recuperar objetos en Amazon S3?", "options": ["Amazon FSx for Lustre — sistema de archivos de alto rendimiento para HPC", "AWS Storage Gateway Volume Gateway — proporciona volúmenes de almacenamiento en bloque", "AWS Storage Gateway File Gateway — proporciona acceso NFS/SMB local a objetos almacenados en Amazon S3", "Amazon EFS — sistema de archivos NFS compartido en la nube"], "correct": [2], "multi": false}, {"id": 534, "text": "Un usuario ha recibido permiso para cambiar su propia contraseña de usuario de IAM. ¿Qué servicios de AWS puede usar el usuario para cambiar la contraseña? (Seleccione dos.)", "options": ["AWS CLI — interfaz de línea de comandos que permite cambiar la contraseña de IAM mediante comandos", "AWS KMS — gestión de claves de cifrado (no contraseñas de IAM)", "AWS Management Console — interfaz web donde el usuario puede cambiar su propia contraseña de IAM", "AWS Resource Access Manager — comparte recursos entre cuentas", "AWS Secrets Manager — gestiona contraseñas de aplicaciones (no contraseñas de usuarios IAM)"], "correct": [0, 2], "multi": true}, {"id": 535, "text": "¿Cuál tarea es responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Parchear un sistema operativo invitado desplegado en una instancia de Amazon EC2 — el cliente gestiona el SO y las aplicaciones en EC2.", "Controlar el acceso físico a un centro de datos de AWS.", "Controlar el acceso al hardware subyacente de AWS.", "Parchear un sistema operativo host desplegado en Amazon S3."], "correct": [0], "multi": false}, {"id": 536, "text": "¿Qué servicio o característica de AWS proporciona un firewall a nivel de subred dentro de una VPC?", "options": ["Grupo de seguridad — firewall a nivel de instancia", "ACL de red (Network ACL) — firewall stateless a nivel de subred dentro de una VPC", "Interfaz de red elástica (ENI) — interfaz de red virtual", "AWS WAF — firewall de aplicaciones web"], "correct": [1], "multi": false}, {"id": 537, "text": "Una empresa quiere usar análisis de video automatizado para identificar a los empleados que acceden a sus oficinas. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Rekognition — detecta y reconoce rostros, personas y objetos en imágenes y videos con ML", "Amazon Polly — convierte texto en voz", "Amazon Cognito — gestiona autenticación de usuarios", "AWS Lambda — funciones sin servidor"], "correct": [0], "multi": false}, {"id": 538, "text": "Una empresa necesita alojar un servidor web en instancias de Amazon EC2 durante al menos 1 año. El servidor web no puede tolerar interrupciones. ¿Qué opción de compra de instancias EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Bajo Demanda — sin descuento", "Instancias Reservadas con pago parcial por adelantado (Partial Upfront) — descuento significativo pagando parte por adelantado, sin interrupciones", "Instancias Spot — pueden interrumpirse (no adecuado)", "Instancias Reservadas sin pago por adelantado (No Upfront) — descuento menor que Partial Upfront"], "correct": [1], "multi": false}, {"id": 539, "text": "¿Cuáles directrices son mejores prácticas para usar AWS IAM? (Seleccione dos.)", "options": ["Compartir claves de acceso.", "Crear usuarios de IAM individuales — cada persona tiene su propia identidad para mayor seguridad y trazabilidad.", "Usar políticas en línea en lugar de políticas administradas por el cliente.", "Otorgar los máximos privilegios a los usuarios de IAM.", "Usar grupos para asignar permisos a los usuarios de IAM — simplifica la gestión de permisos a escala."], "correct": [1, 4], "multi": true}, {"id": 540, "text": "¿Qué ventaja de la computación en la nube permite a los usuarios escalar los recursos hacia arriba o hacia abajo según la cantidad de carga que soporta una aplicación?", "options": ["Despliegue global en minutos", "Dejar de adivinar la capacidad — ajusta los recursos según la demanda real sin sobreprovisionar.", "Beneficiarse de masivas economías de escala", "Intercambiar gasto fijo por gasto variable"], "correct": [1], "multi": false}, {"id": 541, "text": "Una empresa solicita informes de la Industria de Tarjetas de Pago (PCI) que validan la efectividad operativa de los controles de seguridad de AWS. ¿Cómo debe obtener la empresa estos informes?", "options": ["Contactar a AWS Support.", "Descargar informes desde AWS Artifact — portal de autoservicio para informes de cumplimiento como PCI.", "Descargar informes desde AWS Security Hub.", "Contactar a un Technical Account Manager (TAM) de AWS."], "correct": [1], "multi": false}, {"id": 542, "text": "Una empresa de comercio electrónico quiere distribuir el tráfico entre las instancias de Amazon EC2 que alojan su sitio web. ¿Qué servicio o recurso de AWS cumplirá con estos requisitos?", "options": ["Application Load Balancer — distribuye tráfico HTTP/HTTPS de manera inteligente entre instancias EC2", "AWS WAF — firewall de aplicaciones web", "AWS CloudHSM — módulo de seguridad de hardware para claves criptográficas", "AWS Direct Connect — conexión dedicada entre empresa y AWS"], "correct": [0], "multi": false}, {"id": 543, "text": "¿Qué servicios o características de AWS forman la infraestructura global de la nube de AWS? (Seleccione dos.)", "options": ["Zonas de Disponibilidad (Availability Zones) — centros de datos físicamente separados dentro de una región", "Amazon ElastiCache — servicio de caché en memoria", "Regiones de AWS (AWS Regions) — áreas geográficas que contienen múltiples Zonas de Disponibilidad", "Amazon S3 — almacenamiento de objetos", "Amazon VPC — red virtual privada"], "correct": [0, 2], "multi": true}, {"id": 544, "text": "De acuerdo con el Modelo de Responsabilidad Compartida de AWS, ¿cuáles de los siguientes son responsabilidades de AWS? (Seleccione dos.)", "options": ["Infraestructura de red y virtualización de infraestructura — AWS gestiona todos los componentes de red y el hipervisor.", "Seguridad de los datos de la aplicación.", "Sistemas operativos invitados.", "Seguridad física del hardware — AWS es responsable de la seguridad física de todos sus centros de datos.", "Credenciales y políticas."], "correct": [0, 3], "multi": true}, {"id": 545, "text": "Una empresa usa Amazon Aurora como servicio de base de datos. La empresa quiere cifrar sus bases de datos y respaldos. ¿Quién gestiona el cifrado de los clusters y los snapshots de base de datos, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["AWS", "La empresa — el cliente decide habilitar el cifrado y gestiona las opciones de cifrado de sus datos.", "Socios de AWS Marketplace", "Socios de terceros"], "correct": [1], "multi": false}, {"id": 546, "text": "Una empresa aloja una aplicación web en instancias de Amazon EC2. La empresa quiere implementar condiciones personalizadas para filtrar y controlar el tráfico web entrante. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon GuardDuty — detección de amenazas", "AWS WAF — firewall de aplicaciones web con condiciones personalizadas para filtrar tráfico web entrante", "Amazon Macie — detecta datos sensibles en S3", "AWS Shield — protección contra DDoS"], "correct": [1], "multi": false}, {"id": 547, "text": "Una empresa quiere mantener el rendimiento del ancho de banda y proporcionar una experiencia de red más consistente que las conexiones basadas en internet público. ¿Qué servicio de AWS debe elegir la empresa?", "options": ["AWS VPN — cifrada pero usa internet (mayor variabilidad)", "AWS Direct Connect — conexión de red dedicada con ancho de banda consistente y baja latencia", "Amazon Connect — centro de contacto en la nube", "Amazon CloudFront — CDN para distribución de contenido"], "correct": [1], "multi": false}, {"id": 548, "text": "Una empresa tiene una carga de trabajo temporal y variable. La empresa necesita usar instancias de Amazon EC2 para la carga de trabajo. Las instancias EC2 necesitan manejar ráfagas cortas de trabajo que no pueden detenerse antes de terminar. ¿Qué opción de compra cumplirá con estos requisitos?", "options": ["Instancias Spot — pueden interrumpirse (no adecuado para trabajos que no pueden detenerse)", "Instancias Bajo Demanda — pago por hora sin compromiso, no pueden interrumpirse, ideal para cargas temporales que deben completarse", "Savings Plan — compromiso de uso a largo plazo", "Instancias Reservadas — compromiso de 1 o 3 años (no rentable para carga temporal)"], "correct": [1], "multi": false}, {"id": 549, "text": "Los empleados de una empresa trabajan desde casa. La empresa quiere que sus empleados usen sus dispositivos personales para conectarse a un puesto de trabajo gestionado en la nube de AWS. ¿Qué servicio de AWS debe usar la empresa para proporcionar el entorno remoto?", "options": ["Amazon WorkSpaces — escritorios virtuales gestionados en la nube a los que los empleados acceden desde dispositivos personales", "AWS Cloud9 — entorno de desarrollo integrado en la nube", "AWS Outposts — infraestructura AWS en instalaciones propias", "Amazon Lightsail — plataforma simplificada para apps y sitios web"], "correct": [0], "multi": false}, {"id": 550, "text": "Una empresa necesita usar sintaxis SQL para realizar consultas directas sobre objetos en un bucket de Amazon S3. ¿Qué servicio de AWS puede usar la empresa para cumplir con este requisito?", "options": ["AWS Glue — servicio ETL para preparar e integrar datos", "Amazon Athena — permite ejecutar consultas SQL directamente sobre datos en S3 sin necesidad de servidores", "AWS Lambda — funciones sin servidor", "Amazon Kinesis — procesamiento de datos en streaming"], "correct": [1], "multi": false}, {"id": 551, "text": "Una empresa usa Amazon RDS para una base de datos de productos. La empresa quiere asegurarse de que la base de datos sea altamente disponible. ¿Qué característica de Amazon RDS cumplirá con este requisito?", "options": ["Réplicas de lectura — para distribuir cargas de lectura (no alta disponibilidad automática)", "Despliegue azul/verde — actualiza aplicaciones con mínima interrupción", "Despliegue Multi-AZ — crea una instancia standby sincrónica en otra AZ con conmutación automática", "Instancias Reservadas — descuento por compromiso"], "correct": [2], "multi": false}, {"id": 552, "text": "¿Qué servicio de AWS proporciona cómputo sin servidor para usar con contenedores?", "options": ["Amazon SQS — cola de mensajes", "AWS Fargate — ejecuta contenedores sin gestionar la infraestructura subyacente, arquitectura serverless", "AWS Elastic Beanstalk — despliega apps web gestionando la infraestructura", "Amazon SageMaker — plataforma de ML"], "correct": [1], "multi": false}, {"id": 553, "text": "Una empresa usa múltiples cuentas de AWS para diferentes equipos de negocio. El equipo de finanzas quiere recibir una sola factura para todas las cuentas de la empresa. ¿Qué servicio o herramienta de AWS debe usar el equipo de finanzas para cumplir con este requisito?", "options": ["AWS Organizations — consolida la facturación de múltiples cuentas en una sola factura", "AWS Trusted Advisor — recomendaciones de optimización", "Cost Explorer — analiza costos históricos", "AWS Budgets — alertas de presupuesto"], "correct": [0], "multi": false}, {"id": 554, "text": "Una empresa necesita un firewall que controle las conexiones de red hacia y desde una sola instancia de Amazon EC2. Este firewall no controlará las conexiones de red hacia y desde otras instancias en la misma subred. ¿Qué servicio o característica de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["ACL de red — opera a nivel de subred (afecta a todas las instancias de la subred)", "AWS WAF — firewall de aplicaciones web", "Tabla de rutas — controla el enrutamiento del tráfico", "Grupo de seguridad (Security group) — firewall a nivel de instancia individual, controla el tráfico solo de esa instancia"], "correct": [3], "multi": false}, {"id": 555, "text": "Una empresa planea usar instancias de Amazon EC2 como servidores web. Los clientes de todo el mundo usarán los servidores web. La mayoría de los clientes solo usarán los servidores web durante ciertas horas del día. ¿Cómo debe desplegar la empresa las instancias EC2 para lograr el MENOR costo operativo?", "options": ["En múltiples Zonas de Disponibilidad", "En un grupo de Auto Scaling — escala automáticamente el número de instancias según la demanda, pagando solo por lo que se usa", "En un grupo de ubicación (placement group)", "En subredes privadas"], "correct": [1], "multi": false}, {"id": 556, "text": "¿Qué beneficio siempre es gratuito con AWS, independientemente del plan de AWS Support del usuario?", "options": ["AWS Developer Support — plan de soporte con costo", "Foros de desarrolladores de AWS (AWS Developer Forums) — comunidad gratuita disponible para todos los usuarios", "Gestión programática de casos", "Technical Account Manager (TAM) de AWS — solo en planes Enterprise"], "correct": [1], "multi": false}, {"id": 557, "text": "Una empresa usa instancias de Amazon EC2 para ejecutar su aplicación. La aplicación necesita estar disponible y en funcionamiento continuamente durante tres o más años. ¿Qué tipo de instancia EC2 debe comprar la empresa para obtener un descuento en el precio de EC2?", "options": ["Instancias Reservadas — hasta 72% de descuento con compromiso de 1 o 3 años para uso continuo", "Instancias Spot — pueden interrumpirse", "Instancias Bajo Demanda — sin descuento", "EC2 Fleet — administra grupos de instancias (no una opción de compra con descuento)"], "correct": [0], "multi": false}, {"id": 558, "text": "Una empresa necesita realizar una auditoría de la actividad reciente de la cuenta de AWS. La auditoría investigará quién inició u
