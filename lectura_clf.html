<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS CLF-C02 Lectura — 719 Preguntas</title>
<style>
:root {
  --bg: #f6f8fa; --surface: #ffffff; --surface2: #f0f4f8;
  --border: #d0d7de; --text: #1c2128; --text2: #57606a;
  --primary: #e37700; --primary-d: #b45f00;
  --green: #1a7f37; --red: #cf222e; --blue: #0550ae;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

/* HOME */
#home { padding: 32px 20px; max-width: 900px; margin: 0 auto; }
.home-header { text-align: center; margin-bottom: 40px; }
.home-header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 8px; }
.home-header p { color: var(--text2); }
.modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.mod-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all .2s; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mod-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.mod-card h3 { color: var(--primary); font-size: 1rem; margin-bottom: 6px; }
.mod-card p { color: var(--text2); font-size: 0.85rem; }
.esp-badge { position: absolute; top: 10px; right: 10px; background: var(--green); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

/* READING */
#reading { display: none; padding: 20px; max-width: 860px; margin: 0 auto; }
.reading-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: background .2s; }
.btn:hover { background: var(--primary-d); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.q-num-badge { background: var(--primary); color: #fff; font-size: 0.8rem; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
.q-text { font-size: 1rem; line-height: 1.7; color: var(--text); margin-bottom: 16px; font-weight: 500; }
.multi-hint { color: var(--blue); font-size: 0.82rem; margin-bottom: 10px; background: #dbeafe; padding: 4px 10px; border-radius: 6px; display: inline-block; }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; }
.opt.correct { border-color: var(--green); background: #f0fdf4; }
.opt-letter { width: 26px; height: 26px; min-width: 26px; border: 2px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: var(--text2); }
.opt.correct .opt-letter { border-color: var(--green); color: var(--green); background: #dcfce7; }
.opt-text { flex: 1; line-height: 1.5; font-size: 0.9rem; color: var(--text); }

.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filter-bar span { color: var(--text2); font-size: 0.85rem; }
input[type="number"] { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 70px; color: var(--text); font-size: 0.9rem; }

@media(max-width:600px) {
  .home-header h1 { font-size: 1.5rem; }
  .q-card { padding: 16px; }
  .q-text { font-size: 0.9rem; }
}
</style>
</head>
<body>

<div id="home">
  <div class="home-header">
    <h1>📖 AWS CLF-C02 Lectura</h1>
    <p>719 preguntas · 12 módulos · Todas las respuestas visibles</p>
  </div>
  <div class="modules-grid" id="modules-grid"></div>
</div>

<div id="reading">
  <div class="reading-header">
    <button class="btn btn-ghost" onclick="showHome()">← Inicio</button>
    <div class="filter-bar">
      <span>Preguntas:</span>
      <input type="number" id="from-q" placeholder="Desde" min="1" max="719">
      <span>–</span>
      <input type="number" id="to-q" placeholder="Hasta" min="1" max="719">
      <button class="btn btn-ghost" onclick="applyFilter()" style="padding:6px 12px">Filtrar</button>
      <button class="btn btn-ghost" onclick="clearFilter()" style="padding:6px 12px">Todo</button>
    </div>
    <span id="r-counter" style="color:var(--text2);font-size:.85rem;margin-left:auto;"></span>
  </div>
  <div id="r-area"></div>
</div>

<script>
const MODULES = [[{"id": 1, "text": "Una empresa planea usar un dispositivo Amazon Snowball Edge para transferir archivos a la nube de AWS. ¿Qué actividades relacionadas con el dispositivo Snowball Edge están disponibles para la empresa sin costo?", "options": ["Uso del dispositivo Snowball Edge por un período de 10 días", "La transferencia de datos desde Amazon S3 hacia el dispositivo Snowball Edge", "La transferencia de datos desde el dispositivo Snowball Edge hacia Amazon S3", "Uso diario del dispositivo Snowball Edge después de 10 días"], "correct": [2], "multi": false}, {"id": 2, "text": "Una empresa ha desplegado aplicaciones en instancias de Amazon EC2. La empresa necesita evaluar vulnerabilidades en las aplicaciones e identificar despliegues de infraestructura que no cumplen con las mejores prácticas. ¿Qué servicio de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias", "AWS Config — registra y evalúa configuraciones de recursos AWS", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [1], "multi": false}, {"id": 3, "text": "Una empresa tiene un grupo centralizado de usuarios con grandes requisitos de almacenamiento de archivos que han excedido el espacio disponible en instalaciones propias. La empresa desea ampliar sus capacidades de almacenamiento de archivos para este grupo conservando el beneficio de rendimiento de compartir contenido localmente. ¿Cuál es la solución de AWS MÁS eficiente operacionalmente para este escenario?", "options": ["Crear un bucket de Amazon S3 para cada usuario. Montar cada bucket usando una utilidad de montaje del sistema de archivos de S3.", "Configurar y desplegar una puerta de enlace de archivos de AWS Storage Gateway. Conectar la estación de trabajo de cada usuario a la puerta de enlace de archivos.", "Mover el entorno de trabajo de cada usuario a Amazon WorkSpaces. Configurar una cuenta de Amazon WorkDocs para cada usuario.", "Desplegar una instancia de Amazon EC2 y adjuntar un volumen Amazon Elastic Block Store (EBS) con IOPS aprovisionadas. Compartir el volumen EBS directamente con los usuarios."], "correct": [1], "multi": false}, {"id": 4, "text": "De acuerdo con las mejores prácticas de seguridad, ¿cómo debe otorgarse acceso a una instancia de Amazon EC2 hacia un bucket de Amazon S3?", "options": ["Codificar directamente la clave secreta y la clave de acceso del usuario de IAM en la aplicación y subir el archivo.", "Almacenar la clave secreta y la clave de acceso del usuario de IAM en un archivo de texto en la instancia EC2, leer las claves y luego subir el archivo.", "Hacer que la instancia EC2 asuma un rol de IAM para obtener los privilegios necesarios para subir el archivo.", "Modificar la política del bucket de S3 para que cualquier servicio pueda subir archivos en cualquier momento."], "correct": [2], "multi": false}, {"id": 5, "text": "¿Cuál de las siguientes opciones es responsabilidad del cliente al usar Amazon DynamoDB, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Seguridad física de DynamoDB", "Aplicación de parches de DynamoDB", "Gestión del acceso a las tablas de DynamoDB", "Cifrado de datos en reposo en DynamoDB"], "correct": [2], "multi": false}, {"id": 6, "text": "¿Cuál de las siguientes opciones es una perspectiva que incluye capacidades fundamentales del Marco de Adopción de la Nube de AWS (AWS CAF)?", "options": ["Sostenibilidad", "Eficiencia en el rendimiento", "Gobernanza (Governance)", "Fiabilidad"], "correct": [2], "multi": false}, {"id": 7, "text": "Una empresa ejecuta y gestiona su propio entorno Docker en instancias de Amazon EC2. La empresa desea una alternativa para gestionar el tamaño del clúster, la programación de tareas y el mantenimiento del entorno. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["AWS Lambda — funciones sin servidor (serverless)", "Amazon RDS — base de datos relacional gestionada", "AWS Fargate — ejecuta contenedores sin gestionar servidores", "Amazon Athena — consultas SQL sobre datos en S3"], "correct": [2], "multi": false}, {"id": 8, "text": "Una empresa desea ejecutar una base de datos NoSQL en instancias de Amazon EC2. ¿Cuál de las siguientes tareas es responsabilidad de AWS en este escenario?", "options": ["Actualizar el sistema operativo invitado de las instancias EC2.", "Mantener la alta disponibilidad en la capa de base de datos.", "Aplicar parches a la infraestructura física que aloja las instancias EC2.", "Configurar el firewall del grupo de seguridad."], "correct": [2], "multi": false}, {"id": 9, "text": "¿Qué servicios o herramientas de AWS pueden identificar oportunidades de dimensionamiento correcto (rightsizing) para instancias de Amazon EC2? (Seleccione dos.)", "options": ["AWS Cost Explorer — analiza y visualiza costos de AWS", "AWS Billing Conductor — personaliza la facturación para múltiples cuentas", "Amazon CodeGuru — revisa código y detecta problemas de rendimiento", "Amazon SageMaker — plataforma completa de Machine Learning", "AWS Compute Optimizer — recomienda el tamaño óptimo de recursos"], "correct": [0, 4], "multi": true}, {"id": 10, "text": "¿Cuáles de las siguientes son ventajas de usar AWS Trusted Advisor? (Seleccione dos.)", "options": ["Proporcionar orquestación de contenedores de alto rendimiento", "Crear y rotar claves de cifrado", "Detectar recursos subutilizados para reducir costos", "Mejorar la seguridad mediante monitoreo proactivo del entorno de AWS", "Implementar etiquetado obligatorio en recursos de AWS"], "correct": [2, 3], "multi": true}, {"id": 11, "text": "¿Cuál de las siguientes es una ventaja que experimentan los usuarios cuando migran cargas de trabajo locales a la nube de AWS?", "options": ["Eliminación de gastos por operar y mantener centros de datos propios", "Descuentos de precios idénticos a los de los proveedores de hardware", "Transferencia de todos los controles operativos a AWS", "Eliminación de todos los gastos operacionales"], "correct": [0], "multi": false}, {"id": 12, "text": "Una empresa desea gestionar los servicios de TI desplegados y gobernar sus plantillas de infraestructura como código (IaC). ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Resource Explorer — busca y descubre recursos de AWS", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Organizations — gestiona múltiples cuentas de AWS", "AWS Systems Manager — gestiona y opera infraestructura de AWS"], "correct": [1], "multi": false}, {"id": 13, "text": "¿Qué servicio o herramienta de AWS ayuda a los usuarios a visualizar, comprender y gestionar el gasto y el uso de AWS a lo largo del tiempo?", "options": ["AWS Organizations — gestiona múltiples cuentas de AWS", "AWS Pricing Calculator — estima costos antes del despliegue", "AWS Cost Explorer — analiza y visualiza costos de AWS", "AWS Service Catalog — catálogo de servicios de TI aprobados"], "correct": [2], "multi": false}, {"id": 14, "text": "Una empresa usa una plataforma central de datos para gestionar múltiples tipos de datos de sus clientes. La empresa desea usar servicios de AWS para descubrir, transformar y visualizar los datos. ¿Qué combinación de servicios de AWS debe usar la empresa para cumplir con estos requisitos? (Seleccione dos.)", "options": ["AWS Glue — servicio ETL sin servidor para integración de datos", "Amazon Elastic File System (Amazon EFS) — sistema de archivos compartido y escalable", "Amazon Redshift — data warehouse para análisis a gran escala", "Amazon QuickSight — dashboards y visualización de datos con IA", "Amazon QLDB — base de datos de libro mayor inmutable y transparente"], "correct": [0, 3], "multi": true}, {"id": 15, "text": "Una empresa global desea migrar sus aplicaciones de terceros a la nube de AWS. La empresa requiere la ayuda de un equipo global de expertos para completar la migración de forma más rápida y confiable, siguiendo las mejores prácticas internas de AWS. ¿Qué servicio o recurso de AWS cumplirá con estos requisitos?", "options": ["AWS Support — planes de soporte técnico de AWS", "AWS Professional Services — equipo experto de AWS para migraciones y proyectos", "AWS Launch Wizard — guía el despliegue de aplicaciones empresariales", "AWS Managed Services (AMS) — operaciones gestionadas para entornos AWS"], "correct": [1], "multi": false}, {"id": 16, "text": "Una plataforma de e-learning necesita ejecutar una aplicación durante 2 meses al año en instancias de Amazon EC2. No se puede permitir ningún tiempo de inactividad durante esos 2 meses. ¿Qué opción de compra de EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años con descuento", "Hosts Dedicados (Dedicated Hosts) — servidor físico exclusivo para la empresa", "Instancias Spot — precio variable, pueden interrumpirse", "Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso"], "correct": [3], "multi": false}, {"id": 17, "text": "Un desarrollador desea desplegar una aplicación rápidamente en AWS sin crear manualmente los recursos necesarios. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon EC2 — servidores virtuales en la nube", "AWS Elastic Beanstalk — despliega apps sin gestionar infraestructura", "AWS CodeBuild — compila y prueba código en la nube", "Amazon Personalize — recomendaciones personalizadas con ML"], "correct": [1], "multi": false}, {"id": 18, "text": "Una empresa almacena datos sensibles de clientes en un bucket de Amazon S3. La empresa desea proteger los datos contra eliminación o sobreescritura accidental. ¿Qué característica de S3 debe usar la empresa para cumplir con estos requisitos?", "options": ["Reglas de ciclo de vida de S3 (S3 Lifecycle rules) — mueve objetos entre clases de almacenamiento automáticamente", "Versionado de S3 (S3 Versioning) — conserva múltiples versiones de cada objeto", "Políticas de bucket de S3 (S3 bucket policies) — controla el acceso al bucket", "Cifrado del lado del servidor de S3 (S3 server-side encryption) — cifra datos en reposo"], "correct": [1], "multi": false}, {"id": 19, "text": "¿Qué servicio de AWS proporciona la capacidad de gestionar infraestructura como código (IaC)?", "options": ["AWS CodePipeline — automatiza pipelines de CI/CD", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "AWS Direct Connect — conexión dedicada entre empresa y AWS", "AWS CloudFormation — infraestructura como código (IaC)"], "correct": [3], "multi": false}, {"id": 20, "text": "Una empresa de juegos en línea necesita elegir una opción de compra para ejecutar sus instancias de Amazon EC2 durante 1 año. El tráfico web es constante y cualquier incremento es predecible. Las instancias EC2 deben estar en línea sin interrupciones. ¿Qué opción de compra de instancias EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso", "Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años con descuento", "Instancias Spot — precio variable, pueden interrumpirse", "Spot Fleet — grupo de instancias Spot gestionadas automáticamente"], "correct": [1], "multi": false}, {"id": 21, "text": "¿Qué servicio o característica de AWS permite a un usuario establecer una conexión de red dedicada entre el centro de datos local de una empresa y la nube de AWS?", "options": ["AWS Direct Connect — conexión de red dedicada entre empresa y AWS", "VPC Peering — conecta dos VPCs de forma privada", "AWS VPN — conexión segura por internet entre empresa y AWS", "Amazon Route 53 — servicio de DNS escalable"], "correct": [0], "multi": false}, {"id": 22, "text": "¿Cuál de las siguientes opciones es una ubicación física de la infraestructura global de AWS?", "options": ["AWS DataSync — transfiere datos entre almacenamiento local y AWS", "Región de AWS (AWS Region) — ubicación geográfica con múltiples zonas de disponibilidad", "Amazon Connect — centro de contacto en la nube", "AWS Organizations — gestiona múltiples cuentas de AWS"], "correct": [1], "multi": false}, {"id": 23, "text": "Una empresa desea proteger su información, sistemas y activos en la nube de AWS mientras realiza tareas de evaluación y mitigación de riesgos. ¿Qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) respalda estos objetivos?", "options": ["Fiabilidad (Reliability)", "Seguridad (Security)", "Excelencia operativa (Operational Excellence)", "Eficiencia en el rendimiento (Performance Efficiency)"], "correct": [1], "multi": false}, {"id": 24, "text": "¿Cuál es el propósito de tener un Internet Gateway (puerta de enlace de internet) dentro de una VPC?", "options": ["Crear una conexión VPN hacia la VPC", "Permitir la comunicación entre la VPC e internet", "Limitar el ancho de banda del tráfico de internet", "Balancear el tráfico de internet entre instancias de Amazon EC2"], "correct": [1], "multi": false}, {"id": 25, "text": "Una empresa ejecuta una aplicación monolítica local que no escala y es difícil de mantener. La empresa planea migrar la aplicación a AWS y dividirla en microservicios. ¿Qué mejor práctica del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) está siguiendo la empresa con este plan?", "options": ["Integrar pruebas funcionales como parte del despliegue en AWS.", "Usar automatización para desplegar cambios.", "Desplegar la aplicación en múltiples ubicaciones.", "Implementar dependencias débilmente acopladas (loosely coupled)."], "correct": [3], "multi": false}, {"id": 26, "text": "Una empresa tiene una cuenta de AWS y desea auditar los detalles de rotación de contraseñas y claves de acceso para fines de cumplimiento normativo. ¿Qué servicio o herramienta de AWS cumplirá con este requisito?", "options": ["IAM Access Analyzer — identifica recursos compartidos con entidades externas", "AWS Artifact — informes de cumplimiento y certificaciones de AWS", "Informe de credenciales de IAM (IAM credential report) — lista todos los usuarios y el estado de sus credenciales", "AWS Audit Manager — automatiza la recopilación de evidencias para auditorías"], "correct": [2], "multi": false}, {"id": 27, "text": "Una empresa desea recibir una notificación cuando se alcance un umbral específico de costos de AWS. ¿Qué servicios o herramientas de AWS puede usar la empresa para cumplir con este requisito? (Seleccione dos.)", "options": ["Amazon SQS — cola de mensajes gestionada", "AWS Budgets — alertas de presupuesto y costos de AWS", "Cost Explorer — analiza y visualiza costos de AWS", "Amazon CloudWatch — monitoreo y observabilidad de recursos AWS", "AWS Cost and Usage Report — reporte detallado de costos y uso"], "correct": [1, 3], "multi": true}, {"id": 28, "text": "¿Qué servicio o recurso de AWS proporciona respuestas a las preguntas de seguridad más frecuentes que AWS recibe de sus usuarios?", "options": ["AWS Artifact — informes de cumplimiento y certificaciones", "Amazon Connect — centro de contacto en la nube", "AWS Chatbot — notificaciones de AWS en canales de chat", "AWS Knowledge Center — base de conocimientos con preguntas frecuentes de AWS"], "correct": [3], "multi": false}, {"id": 29, "text": "¿Cuáles de las siguientes son responsabilidades del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Configurar el firewall del grupo de seguridad proporcionado por AWS.", "Clasificar los activos de la empresa en la nube de AWS.", "Determinar qué Zonas de Disponibilidad usar para los buckets de Amazon S3.", "Aplicar parches o actualizar Amazon DynamoDB.", "Seleccionar instancias de Amazon EC2 para ejecutar AWS Lambda."], "correct": [0, 1], "multi": true}, {"id": 30, "text": "¿Cuáles de las siguientes son pilares del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework)? (Seleccione dos.)", "options": ["Disponibilidad", "Fiabilidad (Reliability)", "Escalabilidad", "Diseño responsivo", "Excelencia operativa (Operational Excellence)"], "correct": [1, 4], "multi": true}, {"id": 31, "text": "¿Qué servicio o característica de AWS se usa para enviar mensajes de texto y correos electrónicos desde aplicaciones distribuidas?", "options": ["Amazon SNS (Simple Notification Service) — notificaciones y mensajería pub/sub", "Amazon SES (Simple Email Service) — envío de correos electrónicos a escala", "Alertas de Amazon CloudWatch — notificaciones basadas en métricas", "Amazon SQS (Simple Queue Service) — cola de mensajes gestionada"], "correct": [0], "multi": false}, {"id": 32, "text": "Un usuario necesita acceso programático a recursos de AWS a través de la AWS CLI o la API de AWS. ¿Qué opción proporcionará al usuario el acceso adecuado?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones", "Claves de acceso (Access keys) — ID de clave y clave secreta para acceso programático", "Claves públicas SSH — para conexión a instancias EC2", "Claves de AWS KMS — gestión de claves de cifrado"], "correct": [1], "multi": false}, {"id": 33, "text": "Una empresa ejecuta miles de simulaciones simultáneas usando AWS Batch. Cada simulación no tiene estado, es tolerante a fallos y se ejecuta hasta 3 horas. ¿Qué modelo de precios permite a la empresa optimizar costos y cumplir con estos requisitos?", "options": ["Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años con descuento", "Instancias Spot — precio variable con gran descuento, pueden interrumpirse", "Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado a un solo cliente"], "correct": [1], "multi": false}, {"id": 34, "text": "¿Qué significa el concepto de agilidad en la computación en la nube de AWS? (Seleccione dos.)", "options": ["La velocidad con la que se implementan los recursos de AWS", "La velocidad con la que AWS crea nuevas regiones de AWS", "La capacidad de experimentar rápidamente", "La eliminación de capacidad desperdiciada", "El bajo costo de entrada a la computación en la nube"], "correct": [0, 2], "multi": true}, {"id": 35, "text": "Una empresa necesita bloquear ataques de inyección SQL. ¿Qué servicio o característica de AWS puede cumplir con este requisito?", "options": ["AWS WAF — firewall de aplicaciones web que filtra tráfico malicioso", "AWS Shield — protección contra ataques DDoS", "ACLs de red (Network ACLs) — filtrado de tráfico a nivel de subred", "Grupos de seguridad (Security groups) — filtrado de tráfico a nivel de instancia"], "correct": [0], "multi": false}, {"id": 36, "text": "¿Qué servicio o característica de AWS identifica si un bucket de Amazon S3 o un rol de IAM ha sido compartido con una entidad externa?", "options": ["AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS IAM Access Analyzer — identifica recursos compartidos con entidades externas", "AWS Organizations — gestiona múltiples cuentas de AWS"], "correct": [2], "multi": false}, {"id": 37, "text": "Un profesional de la nube necesita obtener informes de cumplimiento normativo de AWS antes de migrar un entorno a la nube de AWS. ¿Cómo puede obtener estos informes?", "options": ["Contactar al equipo de Cumplimiento Normativo de AWS.", "Descargar los informes desde AWS Artifact.", "Abrir un caso con el Soporte de AWS.", "Generar los informes con Amazon Macie."], "correct": [1], "multi": false}, {"id": 38, "text": "Una empresa de comercio electrónico ha migrado su infraestructura de TI desde un centro de datos local a la nube de AWS. ¿Cuál de los siguientes costos es responsabilidad directa de la empresa?", "options": ["Costo de las licencias de software de aplicaciones", "Costo de la infraestructura de hardware en AWS", "Costo de energía eléctrica para los servidores de AWS", "Costo de seguridad física del centro de datos de AWS"], "correct": [0], "multi": false}, {"id": 39, "text": "Una empresa está configurando AWS Identity and Access Management (IAM) en una cuenta de AWS. ¿Qué recomendación cumple con las mejores prácticas de seguridad de IAM?", "options": ["Usar las claves de acceso del usuario raíz (root) para tareas administrativas.", "Otorgar permisos amplios para que todos los empleados puedan acceder a los recursos que necesitan.", "Activar la autenticación multifactor (MFA) para mayor seguridad durante el proceso de inicio de sesión.", "Evitar la rotación de credenciales para prevenir problemas en aplicaciones en producción."], "correct": [2], "multi": false}, {"id": 40, "text": "La elasticidad en la nube de AWS hace referencia a cuáles de los siguientes conceptos? (Seleccione dos.)", "options": ["La velocidad con la que una instancia de Amazon EC2 puede reiniciarse", "La capacidad de ajustar el tamaño de los recursos según cambia la demanda", "La cantidad máxima de RAM que puede usar una instancia de Amazon EC2", "El modelo de facturación de pago por uso (pay-as-you-go)", "La facilidad con la que se pueden aprovisionar recursos cuando se necesitan"], "correct": [1, 4], "multi": true}, {"id": 41, "text": "¿Qué servicio permite a los clientes auditar las llamadas a la API en sus cuentas de AWS?", "options": ["AWS CloudTrail — registra todas las llamadas a la API de AWS", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS X-Ray — rastrea y analiza solicitudes en aplicaciones distribuidas"], "correct": [0], "multi": false}, {"id": 42, "text": "¿Cuál es una responsabilidad del cliente al usar AWS Lambda, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Gestionar el código dentro de la función Lambda", "Verificar que el hardware funciona correctamente en el centro de datos", "Aplicar parches al sistema operativo", "Apagar las funciones Lambda cuando ya no están en uso"], "correct": [0], "multi": false}, {"id": 43, "text": "Una empresa tiene 5 TB de datos almacenados en Amazon S3. La empresa planea ejecutar consultas ocasionales sobre los datos para análisis. ¿Qué servicio de AWS debe usar la empresa para ejecutar estas consultas de la forma MÁS rentable?", "options": ["Amazon Redshift — data warehouse para análisis a gran escala", "Amazon Athena — consultas SQL directamente sobre datos en S3, sin servidor", "Amazon Kinesis — procesamiento de datos en streaming", "Amazon RDS — base de datos relacional gestionada"], "correct": [1], "multi": false}, {"id": 44, "text": "¿Qué servicio de AWS puede usarse sin costo adicional?", "options": ["Amazon SageMaker — plataforma de Machine Learning (con costo)", "AWS Config — registra configuraciones de recursos (con costo)", "AWS Organizations — gestiona múltiples cuentas de AWS (sin costo adicional)", "Amazon CloudWatch — monitoreo de recursos AWS (tiene nivel gratuito limitado)"], "correct": [2], "multi": false}, {"id": 45, "text": "¿Qué capacidad del Marco de Adopción de la Nube de AWS (AWS CAF) pertenece a la perspectiva de personas (People)?", "options": ["Arquitectura de datos (Data architecture)", "Gestión de eventos (Event management)", "Fluidez en la nube (Cloud fluency)", "Alianza estratégica (Strategic partnership)"], "correct": [2], "multi": false}, {"id": 46, "text": "Una empresa desea asumir un compromiso anticipado por el uso continuo de sus instancias de producción de Amazon EC2 a cambio de un costo total reducido. ¿Qué opciones de precios cumplen con estos requisitos al MENOR costo? (Seleccione dos.)", "options": ["Instancias Spot — precio variable, pueden interrumpirse", "Instancias Bajo Demanda (On-Demand) — pago por hora sin descuento", "Instancias Reservadas (Reserved Instances) — descuento hasta el 72% con compromiso", "Planes de Ahorro (Savings Plans) — descuento flexible con compromiso de uso", "Hosts Dedicados (Dedicated Hosts) — servidor físico exclusivo con mayor costo"], "correct": [2, 3], "multi": true}, {"id": 47, "text": "Una empresa desea migrar sus bases de datos relacionales locales a la nube de AWS. La empresa quiere usar infraestructura lo más cercana posible a su ubicación geográfica actual. ¿Qué servicio o recurso de AWS debe usar la empresa para seleccionar el área de despliegue de Amazon RDS?", "options": ["Amazon Connect — centro de contacto en la nube", "AWS Wavelength — despliegue de apps en redes 5G", "Regiones de AWS (AWS Regions) — ubicaciones geográficas donde AWS opera", "AWS Direct Connect — conexión dedicada entre empresa y AWS"], "correct": [2], "multi": false}, {"id": 48, "text": "Una empresa está explorando el uso de la nube de AWS y necesita crear una estimación de costos para un proyecto antes de aprovisionar la infraestructura. ¿Qué servicio o característica de AWS puede usarse para estimar costos antes del despliegue?", "options": ["Nivel gratuito de AWS (AWS Free Tier) — servicios con uso gratuito limitado", "AWS Pricing Calculator — herramienta para estimar costos de AWS antes del despliegue", "AWS Billing and Cost Management — gestiona facturación y costos actuales", "AWS Cost and Usage Report — reporte detallado de costos y uso histórico"], "correct": [1], "multi": false}, {"id": 49, "text": "Una empresa está desarrollando una aplicación que necesita entregar imágenes y videos globalmente con latencia mínima. ¿Qué enfoque puede usar la empresa para lograrlo de forma rentable?", "options": ["Entregar el contenido a través de Amazon CloudFront — red de distribución de contenido (CDN) global.", "Almacenar el contenido en Amazon S3 y habilitar la replicación entre regiones de S3.", "Implementar una VPN a través de múltiples regiones de AWS.", "Entregar el contenido a través de AWS PrivateLink — conectividad privada entre servicios de AWS."], "correct": [0], "multi": false}, {"id": 50, "text": "¿Cuál de las siguientes es una ventaja de las economías de escala basada en las ventajas de la computación en la nube?", "options": ["La capacidad de intercambiar gastos variables por gastos fijos", "Mayor velocidad y agilidad", "Menores costos variables comparados con los costos fijos", "Mayor costo operativo entre centros de datos"], "correct": [2], "multi": false}, {"id": 51, "text": "¿Cuál de las siguientes es un framework de desarrollo de software que una empresa puede usar para definir recursos de la nube como código y aprovisionarlos a través de AWS CloudFormation?", "options": ["AWS CLI — interfaz de línea de comandos para interactuar con servicios de AWS", "AWS Developer Center — centro de recursos para desarrolladores de AWS", "AWS Cloud Development Kit (AWS CDK) — define infraestructura con código de programación", "AWS CodeStar — gestiona proyectos de desarrollo de software en AWS"], "correct": [2], "multi": false}, {"id": 52, "text": "Una empresa está desarrollando una aplicación que usa múltiples servicios de AWS. La aplicación necesita usar credenciales temporales con privilegios limitados para autenticarse con otras APIs de AWS. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con estos requisitos de autenticación?", "options": ["Amazon API Gateway — crea y gestiona APIs REST y WebSocket", "Usuarios de IAM — identidades permanentes con credenciales de largo plazo", "AWS Security Token Service (AWS STS) — genera credenciales temporales y de privilegio limitado", "Perfiles de instancia de IAM — asigna roles a instancias EC2"], "correct": [2], "multi": false}, {"id": 53, "text": "¿Qué servicio de AWS es un servicio de gestión de postura de seguridad en la nube (CSPM) que agrega alertas de varios servicios de AWS y productos de socios en un formato estandarizado?", "options": ["AWS Security Hub — centro de seguridad que agrega alertas en formato estandarizado", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "Amazon EventBridge — bus de eventos sin servidor", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [0], "multi": false}, {"id": 54, "text": "¿Qué servicio de AWS se proporciona siempre sin costo?", "options": ["Amazon S3 — almacenamiento de objetos (con costo según uso)", "AWS Identity and Access Management (IAM) — gestión de identidades y accesos (siempre gratuito)", "Elastic Load Balancers — balanceadores de carga (con costo)", "AWS WAF — firewall de aplicaciones web (con costo)"], "correct": [1], "multi": false}, {"id": 55, "text": "Para reducir costos, una empresa planea migrar una base de datos NoSQL a AWS. ¿Qué servicio de AWS está completamente gestionado y puede escalar automáticamente la capacidad de rendimiento para satisfacer las demandas de la carga de trabajo de la base de datos?", "options": ["Amazon Redshift — data warehouse para análisis (no NoSQL)", "Amazon Aurora — base de datos relacional MySQL/PostgreSQL compatible", "Amazon DynamoDB — base de datos NoSQL serverless con escalado automático", "Amazon RDS — base de datos relacional gestionada (no NoSQL)"], "correct": [2], "multi": false}, {"id": 56, "text": "Una empresa usa Amazon DynamoDB. ¿Cuál de las siguientes tareas es responsabilidad de la empresa, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Aplicar parches al sistema operativo.", "Aprovisionar los servidores físicos.", "Gestionar los permisos de acceso a la base de datos.", "Asegurar el sistema operativo subyacente."], "correct": [2], "multi": false}, {"id": 57, "text": "Una empresa tiene un entorno de pruebas en AWS y planea probar una aplicación dentro de AWS. Las pruebas pueden interrumpirse y no necesitan ejecutarse de forma continua. ¿Qué opción de compra de Amazon EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado con mayor costo", "Instancias Spot — precio variable con gran descuento, pueden interrumpirse", "Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años"], "correct": [2], "multi": false}, {"id": 58, "text": "¿Qué servicio de AWS ofrece la capacidad de descubrir y proteger datos sensibles almacenados en buckets de Amazon S3?", "options": ["Amazon Macie — descubre y protege datos sensibles (PII) en Amazon S3", "Amazon Detective — investiga incidentes de seguridad", "Amazon GuardDuty — detecta amenazas y actividad maliciosa", "AWS IAM Access Analyzer — identifica recursos compartidos con entidades externas"], "correct": [0], "multi": false}, {"id": 59, "text": "¿Cuáles de los siguientes servicios pueden usarse para bloquear el tráfico de red hacia una instancia? (Seleccione dos.)", "options": ["Grupos de seguridad (Security groups) — filtrado de tráfico a nivel de instancia", "Logs de flujo de Amazon VPC (VPC flow logs) — registran el tráfico de red, no lo bloquean", "ACLs de red (Network ACLs) — filtrado de tráfico a nivel de subred", "Amazon CloudWatch — monitoreo y observabilidad", "AWS CloudTrail — auditoría de llamadas a la API"], "correct": [0, 2], "multi": true}, {"id": 60, "text": "¿Qué servicio de AWS puede identificar cuándo fue terminada una instancia de Amazon EC2?", "options": ["AWS Identity and Access Management (IAM) — gestión de identidades y accesos", "AWS CloudTrail — registra todas las llamadas a la API, incluyendo terminación de instancias", "AWS Compute Optimizer — recomienda el tamaño óptimo de recursos", "Amazon EventBridge — bus de eventos sin servidor"], "correct": [1], "multi": false}, {"id": 61, "text": "¿Cuál de las siguientes es una base de datos completamente gestionada y compatible con MySQL?", "options": ["Amazon S3 — almacenamiento de objetos (no es una base de datos)", "Amazon DynamoDB — base de datos NoSQL (no compatible con MySQL)", "Amazon Redshift — data warehouse para análisis (no MySQL)", "Amazon Aurora — base de datos relacional compatible con MySQL y PostgreSQL"], "correct": [3], "multi": false}, {"id": 62, "text": "¿Qué servicio de AWS soporta una arquitectura híbrida que permite a los usuarios extender la infraestructura, los servicios, las APIs y las herramientas de AWS a centros de datos, entornos de coubicación o instalaciones locales?", "options": ["AWS Snowmobile — camión de datos para migrar exabytes a AWS", "AWS Local Zones — extiende AWS a ciudades metropolitanas", "AWS Outposts — rack de infraestructura AWS instalado en instalaciones propias", "AWS Fargate — ejecuta contenedores sin gestionar servidores"], "correct": [2], "multi": false}, {"id": 63, "text": "¿Qué servicio de AWS puede ejecutar una base de datos PostgreSQL gestionada que proporciona procesamiento de transacciones en línea (OLTP)?", "options": ["Amazon DynamoDB — base de datos NoSQL (no PostgreSQL)", "Amazon Athena — consultas SQL sobre S3 (no es una base de datos transaccional)", "Amazon RDS — base de datos relacional gestionada compatible con PostgreSQL", "Amazon EMR — procesamiento de big data con Hadoop/Spark"], "correct": [2], "multi": false}, {"id": 64, "text": "Una empresa desea proporcionar escritorios virtuales Windows gestionados y aplicaciones a sus empleados remotos a través de conexiones de red seguras. ¿Qué servicios de AWS puede usar la empresa para cumplir con estos requisitos? (Seleccione dos.)", "options": ["Amazon Connect — centro de contacto en la nube (no escritorios virtuales)", "Amazon AppStream 2.0 — transmite aplicaciones de escritorio de forma segura", "Amazon WorkSpaces — escritorios virtuales Windows/Linux en la nube", "AWS Site-to-Site VPN — conexión VPN entre empresa y AWS (no escritorios)", "Amazon ECS — orquestación de contenedores (no escritorios virtuales)"], "correct": [1, 2], "multi": true}, {"id": 65, "text": "Una empresa desea monitorear la existencia de grupos de seguridad mal configurados que permiten acceso sin restricciones a puertos específicos. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Trusted Advisor — detecta grupos de seguridad con acceso irrestricto", "Amazon CloudWatch — monitoreo y observabilidad de métricas", "Amazon GuardDuty — detecta amenazas y actividad maliciosa", "AWS Health Dashboard — estado y eventos de servicios de AWS"], "correct": [0], "multi": false}], [{"id": 66, "text": "¿Qué servicio de AWS es una base de datos clave-valor que ofrece latencia de milisegundos en a gran escala?", "options": ["Amazon DynamoDB — base de datos NoSQL serverless con latencia de milisegundos", "Amazon Aurora — base de datos relacional compatible con MySQL y PostgreSQL", "Amazon DocumentDB — base de datos de documentos compatible con MongoDB", "Amazon Neptune — base de datos de grafos gestionada"], "correct": [0], "multi": false}, {"id": 67, "text": "Una empresa está desplegando un proyecto de investigación de Machine Learning (ML) que requerirá mucha capacidad de cómputo durante varios meses. Los trabajos de procesamiento de ML no necesitan ejecutarse en horarios específicos. ¿Qué opción de compra de instancias de Amazon EC2 cumplirá con estos requisitos al menor costo?", "options": ["Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso", "Instancias Spot — precio variable con gran descuento, tolerantes a interrupciones", "Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado a un solo cliente"], "correct": [1], "multi": false}, {"id": 68, "text": "¿Qué servicios o características de AWS proporcionan soluciones de recuperación ante desastres para instancias de Amazon EC2? (Seleccione dos.)", "options": ["Instancias Reservadas de EC2 (Reserved Instances)", "Amazon Machine Images (AMIs) de EC2 — capturas del estado completo de una instancia", "Snapshots de Amazon Elastic Block Store (EBS) — copias de seguridad de volúmenes EBS", "AWS Shield — protección contra ataques DDoS", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [1, 2], "multi": true}, {"id": 69, "text": "¿Qué servicio de AWS proporciona acceso por línea de comandos a herramientas y recursos de AWS directamente desde un navegador web?", "options": ["AWS CloudHSM — módulo de seguridad de hardware dedicado", "AWS CloudShell — terminal de línea de comandos en el navegador, preconfigurada con AWS CLI", "Amazon WorkSpaces — escritorios virtuales en la nube", "AWS Cloud Map — registro de recursos de aplicaciones en la nube"], "correct": [1], "multi": false}, {"id": 70, "text": "Un ingeniero de redes necesita construir una arquitectura de nube híbrida que conecte redes locales a la nube de AWS usando AWS Direct Connect. La empresa tiene algunas VPCs en una sola región de AWS y espera aumentar el número de VPCs a cientos con el tiempo. ¿Qué servicio o característica de AWS debe usar el ingeniero para simplificar y escalar esta conectividad a medida que aumenten las VPCs?", "options": ["Endpoints de VPC — conexión privada entre VPC y servicios de AWS", "AWS Transit Gateway — hub central que conecta múltiples VPCs y redes locales", "Amazon Route 53 — servicio de DNS escalable", "AWS Secrets Manager — gestiona y rota credenciales de forma segura"], "correct": [1], "multi": false}, {"id": 71, "text": "Una empresa desea evaluar su preparación operativa e identificar y mitigar riesgos operativos antes del lanzamiento de un nuevo producto. ¿Qué plan de soporte de AWS ofrece orientación y asistencia para este tipo de evento sin costo adicional?", "options": ["AWS Business Support — soporte 24/7 con tiempo de respuesta de 1 hora para casos críticos", "AWS Basic Support — soporte básico gratuito, sin acceso a ingenieros de soporte", "AWS Developer Support — soporte para desarrolladores con tiempo de respuesta de 12 horas", "AWS Enterprise Support — soporte empresarial con Technical Account Manager (TAM) dedicado"], "correct": [3], "multi": false}, {"id": 72, "text": "Una empresa desea establecer un cronograma para rotar las credenciales de usuarios de base de datos. ¿Qué servicio de AWS cumplirá con este requisito con la MENOR sobrecarga operativa?", "options": ["AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS Secrets Manager — gestiona, rota y recupera credenciales automáticamente", "AWS License Manager — gestiona licencias de software", "AWS Managed Services — operaciones gestionadas para entornos de AWS"], "correct": [1], "multi": false}, {"id": 73, "text": "¿Qué servicio o característica de AWS puede usarse para crear una conexión privada entre una carga de trabajo local y una carga de trabajo en la nube de AWS?", "options": ["Amazon Route 53 — servicio de DNS escalable", "Amazon Macie — detecta datos sensibles (PII) en Amazon S3", "AWS Direct Connect — conexión de red dedicada entre instalaciones propias y AWS", "AWS PrivateLink — conectividad privada entre servicios de AWS sin pasar por internet"], "correct": [2], "multi": false}, {"id": 74, "text": "¿Qué servicio de AWS se usa para proporcionar cifrado a Amazon EBS?", "options": ["AWS Certificate Manager — gestiona certificados SSL/TLS", "AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS KMS — servicio de gestión de claves de cifrado", "AWS Config — registra y evalúa configuraciones de recursos"], "correct": [2], "multi": false}, {"id": 75, "text": "Una empresa desea gestionar sus recursos de la nube de AWS a través de una interfaz web. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Management Console — interfaz web para gestionar todos los servicios de AWS", "AWS CLI — interfaz de línea de comandos para interactuar con AWS", "AWS SDK — kit de desarrollo para integrar AWS en aplicaciones", "AWS Cloud9 — entorno de desarrollo integrado (IDE) basado en la nube"], "correct": [0], "multi": false}, {"id": 76, "text": "¿Cuáles de las siguientes son ventajas de la nube de AWS? (Seleccione dos.)", "options": ["Intercambiar gastos variables por gastos de capital", "Altas economías de escala — precios más bajos gracias al volumen de uso de AWS", "Despliegue global en minutos — lanzar en cualquier región del mundo rápidamente", "Enfocarse en gestionar la infraestructura de hardware", "Sobreprovisionar para garantizar capacidad suficiente"], "correct": [1, 2], "multi": true}, {"id": 77, "text": "¿Qué beneficio de la nube de AWS se demuestra cuando una arquitectura puede tolerar fallas con un tiempo de inactividad mínimo?", "options": ["Agilidad — capacidad de experimentar e innovar rápidamente", "Elasticidad — capacidad de ajustar recursos según la demanda", "Escalabilidad — capacidad de crecer para manejar mayor carga", "Alta disponibilidad (High availability) — funciona con mínimo tiempo de inactividad ante fallas"], "correct": [3], "multi": false}, {"id": 78, "text": "Un desarrollador necesita mantener un entorno de desarrollo y un entorno de producción de infraestructura de forma repetible. ¿Qué servicio de AWS debe usar el desarrollador para cumplir con estos requisitos?", "options": ["AWS Ground Station — controla satélites desde la nube", "AWS Shield — protección contra ataques DDoS", "AWS IoT Device Defender — seguridad para dispositivos IoT", "AWS CloudFormation — infraestructura como código (IaC) para despliegues repetibles"], "correct": [3], "multi": false}, {"id": 79, "text": "¿Cuál tarea es responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Mantener la seguridad de la nube de AWS.", "Configurar firewalls y redes.", "Aplicar parches al sistema operativo de las instancias de Amazon RDS.", "Implementar controles físicos y ambientales."], "correct": [1], "multi": false}, {"id": 80, "text": "¿Qué servicio de AWS ayuda a entregar aplicaciones de alta disponibilidad con conmutación por error rápida para arquitecturas multi-región y Multi-AZ?", "options": ["AWS WAF — firewall de aplicaciones web", "AWS Global Accelerator — enruta tráfico por la red global de AWS para menor latencia y mayor disponibilidad", "AWS Shield — protección contra ataques DDoS", "AWS Direct Connect — conexión dedicada entre empresa y AWS"], "correct": [1], "multi": false}, {"id": 81, "text": "Una empresa tiene un conjunto de aplicaciones de comercio electrónico. Las aplicaciones necesitan poder enviarse mensajes entre sí. ¿Qué servicio de AWS cumple con este requisito?", "options": ["AWS Auto Scaling — ajusta automáticamente la capacidad de recursos", "Elastic Load Balancing — distribuye el tráfico entre múltiples instancias", "Amazon SQS (Simple Queue Service) — cola de mensajes gestionada para comunicación entre aplicaciones", "Amazon Kinesis Data Streams — procesamiento de datos en streaming en tiempo real"], "correct": [2], "multi": false}, {"id": 82, "text": "¿Cuáles son los beneficios de la facturación consolidada para servicios de la nube de AWS? (Seleccione dos.)", "options": ["Descuentos por volumen — mayor uso combinado de varias cuentas genera menores precios", "Una tarifa adicional mínima por uso", "Una sola factura para múltiples cuentas — simplifica la gestión de pagos", "Opciones de pago en cuotas", "Creación de presupuestos personalizados de costo y uso"], "correct": [0, 2], "multi": true}, {"id": 83, "text": "Un usuario desea revisar todos los buckets de Amazon S3 con ACLs y políticas de bucket de S3 en la consola de S3. ¿Qué servicio o recurso de AWS cumplirá con este requisito?", "options": ["S3 Multi-Region Access Points — punto de acceso único para buckets en múltiples regiones", "S3 Storage Lens — análisis y visibilidad del uso y actividad de almacenamiento en S3", "AWS IAM Identity Center — gestión de acceso centralizado para múltiples cuentas", "Access Analyzer para S3 — revisa ACLs y políticas para identificar acceso no deseado"], "correct": [3], "multi": false}, {"id": 84, "text": "¿Cuál es el mejor recurso para que un usuario encuentre información e informes relacionados con el cumplimiento normativo de AWS?", "options": ["AWS Artifact — portal para descargar informes de cumplimiento y certificaciones de AWS", "AWS Marketplace — tienda de software de terceros para AWS", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS Support — planes de soporte técnico de AWS"], "correct": [0], "multi": false}, {"id": 85, "text": "¿Qué servicio de AWS permite a las empresas desplegar una aplicación cerca de los usuarios finales?", "options": ["Amazon CloudFront — red de distribución de contenido (CDN) con ubicaciones de borde globales", "AWS Auto Scaling — ajusta automáticamente la capacidad de recursos", "AWS AppSync — API GraphQL gestionada", "Amazon Route 53 — servicio de DNS escalable"], "correct": [0], "multi": false}, {"id": 86, "text": "¿Qué servicio o característica de AWS mejora el rendimiento de la red enviando el tráfico a través de la infraestructura de red global de AWS?", "options": ["Tabla de rutas (Route table) — controla el enrutamiento del tráfico dentro de una VPC", "AWS Transit Gateway — hub central que conecta VPCs y redes locales", "AWS Global Accelerator — enruta tráfico por la red global de AWS para menor latencia", "Amazon VPC — red virtual privada aislada en AWS"], "correct": [2], "multi": false}, {"id": 87, "text": "¿Qué servicio de AWS proporciona almacenamiento de objetos de alta durabilidad?", "options": ["Amazon S3 — almacenamiento de objetos con 99.999999999% (11 nueves) de durabilidad", "Amazon Elastic File System (EFS) — sistema de archivos compartido y escalable", "Amazon Elastic Block Store (EBS) — almacenamiento de bloques para instancias EC2", "Amazon FSx — sistema de archivos gestionado de alto rendimiento"], "correct": [0], "multi": false}, {"id": 88, "text": "¿Cuál responsabilidad pertenece a AWS cuando una empresa aloja sus bases de datos en instancias de Amazon EC2?", "options": ["Respaldos de la base de datos", "Parches del software de la base de datos", "Parches del sistema operativo", "Instalaciones del sistema operativo — AWS es responsable de la infraestructura física subyacente"], "correct": [3], "multi": false}, {"id": 89, "text": "¿Cuáles de las siguientes son ventajas de migrar a la nube de AWS? (Seleccione dos.)", "options": ["La capacidad de transferir toda la responsabilidad de seguridad a AWS.", "La capacidad de usar el modelo de pago por uso (pay-as-you-go).", "La capacidad de tener control total sobre la infraestructura física.", "Ya no tener que adivinar qué capacidad se necesitará.", "Ya no preocuparse por los controles de acceso de usuarios."], "correct": [1, 3], "multi": true}, {"id": 90, "text": "¿Qué servicio de AWS es un servicio de almacenamiento en nube híbrida que proporciona a los usuarios locales acceso a almacenamiento en la nube prácticamente ilimitado?", "options": ["AWS DataSync — transfiere datos entre almacenamiento local y AWS de forma automatizada", "Amazon S3 Glacier — archivado de datos a bajo costo en la nube", "AWS Storage Gateway — conecta almacenamiento local con la nube de AWS de forma transparente", "Amazon Elastic Block Store (EBS) — almacenamiento de bloques para instancias EC2"], "correct": [2], "multi": false}, {"id": 91, "text": "Una empresa planea migrar a AWS y desea crear estimaciones de costos para sus casos de uso en AWS. ¿Qué servicio o herramienta de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["AWS Pricing Calculator — estima costos de servicios AWS antes del despliegue", "Amazon CloudWatch — monitoreo y observabilidad de recursos AWS", "AWS Cost Explorer — analiza y visualiza costos históricos de AWS", "AWS Budgets — configura alertas cuando los costos superan umbrales definidos"], "correct": [0], "multi": false}, {"id": 92, "text": "¿Qué herramienta debe usar un desarrollador para integrar directamente las características de los servicios de AWS en una aplicación?", "options": ["AWS Software Development Kit (SDK) — bibliotecas para integrar servicios AWS en aplicaciones", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "AWS Lambda — funciones sin servidor (serverless)", "AWS Batch — procesamiento por lotes a gran escala"], "correct": [0], "multi": false}, {"id": 93, "text": "¿Cuál de los siguientes es un principio de diseño recomendado del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework)?", "options": ["Reducir el tiempo de inactividad realizando cambios de infraestructura con poca frecuencia y en grandes incrementos.", "Invertir tiempo en configurar la infraestructura manualmente.", "Aprender a mejorar a partir de las fallas operativas.", "Usar diseño de aplicación monolítica para centralización."], "correct": [2], "multi": false}, {"id": 94, "text": "Usar AWS Identity and Access Management (IAM) para otorgar acceso únicamente a los recursos necesarios para realizar una tarea es un concepto conocido como:", "options": ["Acceso restringido.", "Acceso según necesidad.", "Acceso de mínimo privilegio (least privilege) — otorgar solo los permisos estrictamente necesarios.", "Acceso por token."], "correct": [2], "multi": false}, {"id": 95, "text": "¿Qué servicio o característica de AWS puede usarse para configurar un firewall que controle el tráfico entrante y saliente de una subred de Amazon VPC?", "options": ["Grupo de seguridad (Security group) — firewall a nivel de instancia EC2", "AWS WAF — firewall de aplicaciones web", "AWS Firewall Manager — gestión centralizada de reglas de firewall", "ACL de red (Network ACL) — firewall a nivel de subred dentro de una VPC"], "correct": [3], "multi": false}, {"id": 96, "text": "Una empresa desea operar un data warehouse para analizar datos sin gestionar la infraestructura del data warehouse. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Aurora — base de datos relacional de alto rendimiento", "Amazon Redshift Serverless — data warehouse sin servidor, sin gestionar infraestructura", "AWS Lambda — funciones sin servidor para código personalizado", "Amazon RDS — base de datos relacional gestionada"], "correct": [1], "multi": false}, {"id": 97, "text": "¿Cómo ayuda la computación en la nube de AWS a las empresas a reducir costos? (Seleccione dos.)", "options": ["AWS cobra los mismos precios por servicios en todas las regiones de AWS.", "AWS permite ajustar la capacidad según la demanda — sin pagar por capacidad no utilizada.", "AWS ofrece descuentos para instancias de Amazon EC2 que permanecen inactivas más de 1 semana.", "AWS no cobra por los datos enviados desde la nube de AWS hacia internet.", "AWS elimina muchos de los costos de construir y mantener centros de datos propios."], "correct": [1, 4], "multi": true}, {"id": 98, "text": "Una empresa desea otorgar a los usuarios en una cuenta de AWS acceso a los recursos en otra cuenta de AWS. Los usuarios actualmente no tienen permiso para acceder a esos recursos. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Grupo de IAM — agrupa usuarios con permisos comunes dentro de la misma cuenta", "Rol de IAM — permite a entidades asumir permisos, incluso entre cuentas de AWS diferentes", "Etiqueta de IAM — metadatos para organizar recursos", "IAM Access Analyzer — identifica recursos compartidos con entidades externas"], "correct": [1], "multi": false}, {"id": 99, "text": "¿Cuál tarea es responsabilidad de AWS cuando se usan servicios de AWS?", "options": ["Gestión de permisos de usuarios de IAM", "Creación de reglas de grupos de seguridad para acceso de salida", "Mantenimiento de controles físicos y ambientales — AWS es responsable de la seguridad física de los centros de datos", "Aplicación de parches al sistema operativo de instancias de Amazon EC2"], "correct": [2], "multi": false}, {"id": 100, "text": "Una empresa desea automatizar el despliegue de infraestructura usando infraestructura como código (IaC). La empresa quiere escalar los stacks de producción para que puedan desplegarse en múltiples regiones de AWS. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon CloudWatch — monitoreo y observabilidad de recursos AWS", "AWS Config — registra y evalúa configuraciones de recursos", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS CloudFormation — infraestructura como código (IaC) para despliegues repetibles en múltiples regiones"], "correct": [3], "multi": false}, {"id": 101, "text": "¿Cuál de las siguientes es una capacidad de la perspectiva de plataforma (Platform) del Marco de Adopción de la Nube de AWS (AWS CAF)?", "options": ["Arquitectura de datos (Data architecture) — diseña y gestiona la arquitectura de datos", "Protección de datos (Data protection) — implementa controles de seguridad para datos", "Gobernanza de datos (Data governance) — establece políticas de gestión de datos", "Ciencia de datos (Data science) — aplica técnicas de ML y análisis avanzado"], "correct": [0], "multi": false}, {"id": 102, "text": "Una empresa está ejecutando una carga de trabajo en la nube de AWS. ¿Qué mejor práctica de AWS garantiza la arquitectura MÁS rentable para la carga de trabajo?", "options": ["Acoplamiento débil (Loose coupling) — reduce dependencias entre componentes", "Dimensionamiento correcto (Rightsizing) — ajustar los recursos al tamaño exacto que necesitan", "Caché (Caching) — almacena datos frecuentes en memoria para acceso más rápido", "Redundancia — duplica componentes para alta disponibilidad"], "correct": [1], "multi": false}, {"id": 103, "text": "Una empresa usa un servicio de terceros para respaldar 10 TB de datos en una biblioteca de cintas. El servidor de respaldo local se está quedando sin espacio. La empresa desea usar servicios de AWS para los respaldos sin cambiar sus flujos de trabajo de respaldo existentes. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon Elastic Block Store (EBS) — almacenamiento de bloques para instancias EC2", "AWS Storage Gateway — conecta flujos de trabajo de respaldo locales con almacenamiento en la nube de AWS", "Amazon Elastic Container Service (ECS) — orquestación de contenedores", "AWS Lambda — funciones sin servidor para código personalizado"], "correct": [1], "multi": false}, {"id": 104, "text": "¿Qué herramienta de AWS otorga a los usuarios la capacidad de planificar el uso de servicios, costos y reservas de instancias, y también les permite establecer alertas personalizadas cuando sus costos o uso superen los umbrales establecidos?", "options": ["Cost Explorer — analiza y visualiza costos históricos de AWS", "AWS Budgets — planifica costos, uso y reservas con alertas personalizables", "AWS Cost and Usage Report — reporte detallado de costos y uso histórico", "Reporte de Instancias Reservadas — análisis de uso y cobertura de reservas"], "correct": [1], "multi": false}, {"id": 105, "text": "¿Cuáles tareas son responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Establecer la infraestructura global de AWS.", "Realizar el cifrado de datos del lado del cliente.", "Configurar las credenciales de IAM.", "Proteger las ubicaciones de borde (edge locations).", "Aplicar parches a las instancias de base de datos de Amazon RDS."], "correct": [1, 2], "multi": true}, {"id": 106, "text": "Una empresa ha contratado a un desarrollador y este necesita credenciales de AWS. ¿Cuáles son las mejores prácticas de seguridad que deben seguirse? (Seleccione dos.)", "options": ["Otorgar al desarrollador acceso solo a los recursos de AWS necesarios para realizar el trabajo.", "Compartir las credenciales del usuario raíz (root) de la cuenta AWS con el desarrollador.", "Agregar al desarrollador al grupo de administradores en AWS IAM.", "Configurar una política de contraseñas que garantice que la contraseña del desarrollador no pueda cambiarse.", "Asegurarse de que la política de contraseñas de la cuenta requiera una longitud mínima."], "correct": [0, 4], "multi": true}, {"id": 107, "text": "Una empresa tiene múltiples cuentas de AWS que incluyen cargas de trabajo de cómputo que no pueden interrumpirse. La empresa desea obtener descuentos en facturación basados en el uso total de servicios de AWS de la empresa. ¿Qué característica o opción de compra de AWS cumplirá con estos requisitos?", "options": ["Etiquetado de recursos (Resource tagging) — organiza recursos con etiquetas para seguimiento de costos", "Facturación consolidada (Consolidated billing) — combina el uso de múltiples cuentas para obtener descuentos por volumen", "Precios de pago por uso (Pay-as-you-go) — paga solo por lo que usas sin compromisos", "Instancias Spot — precio variable, pueden interrumpirse"], "correct": [1], "multi": false}, {"id": 108, "text": "Un usuario desea permitir que las aplicaciones que se ejecutan en una instancia de Amazon EC2 realicen llamadas a otros servicios de AWS. El acceso otorgado debe ser seguro. ¿Qué servicio o característica de AWS debe usarse?", "options": ["Grupos de seguridad — controlan el tráfico de red entrante y saliente", "AWS Firewall Manager — gestión centralizada de reglas de firewall", "Roles de IAM — otorgan permisos temporales y seguros a instancias EC2 para acceder a otros servicios AWS", "Claves SSH de usuarios de IAM — para conexión a instancias EC2"], "correct": [2], "multi": false}, {"id": 109, "text": "Una empresa desea un servidor de archivos Windows completamente gestionado para sus aplicaciones basadas en Windows. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon FSx — sistema de archivos Windows gestionado compatible con SMB y NTFS", "Amazon Elastic Kubernetes Service (EKS) — Kubernetes gestionado en AWS", "Amazon Elastic Container Service (ECS) — orquestación de contenedores", "Amazon EMR — procesamiento de big data con Hadoop/Spark"], "correct": [0], "multi": false}, {"id": 110, "text": "Una empresa desea migrar su carga de trabajo NFS local a AWS. ¿Qué tipo de AWS Storage Gateway debe usar la empresa para cumplir con este requisito?", "options": ["Tape Gateway — reemplaza bibliotecas de cintas físicas con cintas virtuales en la nube", "Volume Gateway — proporciona volúmenes de almacenamiento en bloque a aplicaciones locales", "Amazon FSx File Gateway — proporciona acceso local a sistemas de archivos Amazon FSx", "Amazon S3 File Gateway — proporciona acceso NFS/SMB local a objetos almacenados en Amazon S3"], "correct": [3], "multi": false}, {"id": 111, "text": "Una empresa necesita rastrear la actividad en sus cuentas de AWS y necesita saber cuándo se realiza una llamada a la API contra sus recursos de AWS. ¿Qué herramienta o servicio de AWS puede usarse para cumplir con estos requisitos?", "options": ["Amazon CloudWatch — monitoreo y observabilidad de métricas y logs", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS CloudTrail — registra todas las llamadas a la API y la actividad de la cuenta de AWS", "AWS IAM — gestión de identidades y accesos"], "correct": [2], "multi": false}, {"id": 112, "text": "Una empresa tiene una aplicación ininterrumpible que se ejecuta en instancias de Amazon EC2. La aplicación procesa constantemente un backlog de archivos en una cola de Amazon SQS. Se espera que este uso siga creciendo durante años. ¿Cuál es el modelo de compra de instancias EC2 MÁS rentable para cumplir con estos requisitos?", "options": ["Instancias Spot — precio variable, pueden interrumpirse (no adecuado para uso ininterrumpible)", "Instancias Bajo Demanda (On-Demand) — pago por hora sin descuento por compromiso", "Planes de Ahorro (Savings Plans) — descuento flexible con compromiso de uso constante a largo plazo", "Hosts Dedicados (Dedicated Hosts) — servidor físico exclusivo con mayor costo"], "correct": [2], "multi": false}, {"id": 113, "text": "Una empresa desea un servicio de AWS que proporcione recomendaciones de productos basadas en los datos de sus clientes. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Polly — convierte texto en voz (Text-to-Speech)", "Amazon Personalize — crea sistemas de recomendación personalizados con ML", "Amazon Comprehend — analiza texto con NLP (sentimientos, entidades, etc.)", "Amazon Rekognition — analiza imágenes y videos con IA"], "correct": [1], "multi": false}, {"id": 114, "text": "Una empresa está planificando su migración a la nube de AWS. La empresa está identificando sus brechas de capacidad usando las perspectivas del Marco de Adopción de la Nube de AWS (AWS CAF). ¿En qué fase del recorrido de transformación a la nube se incluyen estas actividades de identificación?", "options": ["Visión (Envision) — identifica oportunidades de transformación y define resultados de negocio", "Alinear (Align) — identifica brechas de capacidad y crea planes de acción para abordarlas", "Escalar (Scale) — expande iniciativas exitosas a toda la organización", "Lanzar (Launch) — implementa pilotos en producción y demuestra valor del negocio"], "correct": [1], "multi": false}, {"id": 115, "text": "Una empresa de redes sociales desea proteger su aplicación web de ataques comunes como inyecciones SQL y scripts entre sitios (cross-site scripting). ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2", "AWS WAF — firewall de aplicaciones web que filtra tráfico malicioso como SQL injection y XSS", "Amazon GuardDuty — detecta amenazas y actividad maliciosa en cuentas de AWS", "Amazon CloudWatch — monitoreo y observabilidad de recursos AWS"], "correct": [1], "multi": false}, {"id": 116, "text": "¿Qué servicio de AWS completamente gestionado ayuda en la creación, prueba y gestión de imágenes personalizadas de Amazon EC2?", "options": ["EC2 Image Builder — automatiza la creación, prueba y distribución de imágenes de EC2", "Amazon Machine Image (AMI) — plantilla con el estado de una instancia EC2", "AWS Launch Wizard — guía el despliegue de aplicaciones empresariales paso a paso", "AWS Elastic Beanstalk — despliega y gestiona aplicaciones sin gestionar infraestructura"], "correct": [0], "multi": false}, {"id": 117, "text": "Una empresa desea un proceso automatizado para escanear continuamente sus instancias de Amazon EC2 en busca de vulnerabilidades de software. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa (no escanea vulnerabilidades de software)", "Amazon Inspector — escanea continuamente instancias EC2 y funciones Lambda en busca de vulnerabilidades", "Amazon Detective — investiga y analiza incidentes de seguridad", "Amazon Cognito — gestiona autenticación y autorización de usuarios"], "correct": [1], "multi": false}, {"id": 118, "text": "Una empresa necesita realizar procesamiento de datos una vez a la semana, lo que generalmente tarda unas 5 horas en completarse. ¿Qué servicio de AWS debe usar la empresa para esta carga de trabajo?", "options": ["AWS Lambda — funciones sin servidor con límite de tiempo de ejecución de 15 minutos", "Amazon EC2 — instancias virtuales para cargas de trabajo de cualquier duración", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "AWS Wavelength — despliegue de apps en redes 5G"], "correct": [1], "multi": false}, {"id": 119, "text": "¿Qué servicio o característica de AWS proporciona información de logs sobre el tráfico entrante y saliente en las interfaces de red dentro de una VPC?", "options": ["Amazon CloudWatch Logs — almacena y analiza logs de aplicaciones y servicios", "AWS CloudTrail — registra llamadas a la API y actividad de la cuenta", "VPC Flow Logs — captura información del tráfico IP entrante y saliente de interfaces de red en una VPC", "AWS Identity and Access Management (IAM) — gestión de identidades y accesos"], "correct": [2], "multi": false}, {"id": 120, "text": "Una empresa desea diseñar un sistema de almacenamiento centralizado para gestionar los datos de configuración y las contraseñas de sus aplicaciones empresariales críticas. ¿Qué servicio o capacidad de AWS cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["AWS Systems Manager Parameter Store — almacena datos de configuración y secretos de forma segura y económica", "AWS Secrets Manager — gestiona y rota credenciales automáticamente (con costo adicional)", "AWS Config — registra y evalúa configuraciones de recursos AWS", "Amazon S3 — almacenamiento de objetos escalable (no especializado para secretos)"], "correct": [0], "multi": false}, {"id": 121, "text": "Una empresa planea desplegar contenedores en AWS. La empresa desea control total sobre los recursos de cómputo que alojan los contenedores. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon EKS (Elastic Kubernetes Service) — Kubernetes gestionado, comparte control con AWS", "AWS Fargate — ejecuta contenedores sin gestionar servidores (sin control del cómputo subyacente)", "Amazon EC2 — instancias virtuales con control total sobre el sistema operativo y los recursos de cómputo", "Amazon ECS (Elastic Container Service) — orquestación de contenedores, puede compartir infraestructura"], "correct": [2], "multi": false}, {"id": 122, "text": "¿Qué servicio o característica de AWS permite a los usuarios crear nuevas cuentas de AWS, agrupar múltiples cuentas para organizar flujos de trabajo y aplicar políticas a grupos de cuentas?", "options": ["AWS Identity and Access Management (IAM) — gestiona usuarios y permisos dentro de una cuenta", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS CloudFormation — infraestructura como código para despliegues repetibles", "AWS Organizations — gestiona y gobierna múltiples cuentas de AWS desde una cuenta central"], "correct": [3], "multi": false}, {"id": 123, "text": "Una empresa desea almacenar y recuperar archivos en Amazon S3 para sus aplicaciones locales existentes usando protocolos de sistema de archivos estándar del sector. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS DataSync — transfiere datos entre almacenamiento local y AWS de forma automatizada", "AWS Snowball Edge — dispositivo físico para migrar grandes volúmenes de datos a AWS", "Amazon S3 File Gateway — proporciona acceso NFS/SMB local a objetos almacenados en Amazon S3", "AWS Transfer Family — transfiere archivos con protocolos SFTP/FTP hacia Amazon S3 o EFS"], "correct": [2], "multi": false}, {"id": 124, "text": "Una empresa desea bloquear ataques de inyección SQL. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS WAF — firewall de aplicaciones web que bloquea inyecciones SQL y otros ataques web", "ACLs de red (Network ACLs) — filtrado de tráfico a nivel de subred (no específico para SQL injection)", "Grupos de seguridad (Security groups) — filtrado de tráfico a nivel de instancia (no específico para SQL injection)", "AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS (no bloquea ataques)"], "correct": [0], "multi": false}, {"id": 125, "text": "Una empresa desea una herramienta unificada que proporcione un método consistente para interactuar con los servicios de AWS. ¿Qué servicio o herramienta de AWS cumplirá con este requisito?", "options": ["AWS CLI — interfaz de línea de comandos unificada para interactuar con todos los servicios de AWS", "Amazon ECS — orquestación de contenedores Docker", "AWS Cloud9 — entorno de desarrollo integrado (IDE) basado en la nube", "AWS VPN — conexión segura entre empresa y AWS por internet"], "correct": [0], "multi": false}, {"id": 126, "text": "Una empresa necesita evaluar su entorno de AWS y recibir recomendaciones de mejores prácticas en cinco categorías: costo, rendimiento, límites de servicio, tolerancia a fallos y seguridad. ¿Qué servicio de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["AWS Shield — protección contra ataques DDoS", "AWS WAF — firewall de aplicaciones web", "AWS Trusted Advisor — evalúa el entorno AWS y da recomendaciones en costo, rendimiento, seguridad, tolerancia a fallos y límites de servicio", "AWS Service Catalog — catálogo de servicios de TI aprobados"], "correct": [2], "multi": false}, {"id": 127, "text": "¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) incluye capacidades para la gestión de la configuración y la gestión de parches?", "options": ["Plataforma (Platform) — incluye capacidades de arquitectura e ingeniería de plataforma", "Operaciones (Operations) — incluye gestión de eventos, configuración, parches, disponibilidad y rendimiento", "Seguridad (Security) — incluye controles de seguridad e identidad", "Gobernanza (Governance) — incluye gestión de portafolio y riesgos"], "correct": [1], "multi": false}, {"id": 128, "text": "Una empresa tiene una carga de trabajo de cómputo constante, predecible e ininterrumpible. ¿Qué opciones de compra de instancias de Amazon EC2 cumplen con estos requisitos de la forma MÁS rentable? (Seleccione dos.)", "options": ["Instancias Bajo Demanda (On-Demand) — sin descuento por compromiso", "Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso de 1 o 3 años", "Instancias Spot — precio variable, pueden interrumpirse (no adecuado para cargas ininterrumpibles)", "Planes de Ahorro (Savings Plans) — descuento flexible con compromiso de uso constante", "Hosts Dedicados (Dedicated Hosts) — hardware dedicado, mayor costo"], "correct": [1, 3], "multi": true}, {"id": 129, "text": "¿Qué modelo de precios de Amazon EC2 es el MÁS rentable para una carga de trabajo ininterrumpible que se ejecuta una vez al año durante 24 horas?", "options": ["Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso, ideal para uso ocasional y corto", "Instancias Reservadas (Reserved Instances) — requieren compromiso de 1 o 3 años (no rentable para uso anual de 24 h)", "Instancias Spot — precio variable, pueden interrumpirse (no adecuado para carga ininterrumpible)", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado con mayor costo"], "correct": [0], "multi": false}, {"id": 130, "text": "¿Cuál de las siguientes opciones es una responsabilidad compartida entre AWS y sus clientes bajo el Modelo de Responsabilidad Compartida de AWS?", "options": ["Configuración del sistema operativo de las instancias de Amazon EC2", "Cifrado del sistema de archivos de aplicaciones del lado del servidor", "Gestión de parches (Patch management) — AWS parchea la infraestructura; el cliente parchea el SO y las apps", "Seguridad de la infraestructura física"], "correct": [2], "multi": false}], [{"id": 131, "text": "Una empresa desea migrar sus cargas de trabajo locales a la nube de AWS. La empresa desea separar las cargas de trabajo para la imputación de costos (chargeback) a diferentes departamentos. ¿Qué servicios o características de AWS cumplirán con estos requisitos? (Seleccione dos.)", "options": ["Grupos de ubicación (Placement groups) — controlan la ubicación física de instancias EC2", "Facturación consolidada (Consolidated billing) — combina el uso de múltiples cuentas para descuentos", "Ubicaciones de borde (Edge locations) — puntos de presencia de Amazon CloudFront", "AWS Config — registra y evalúa configuraciones de recursos AWS", "Múltiples cuentas de AWS — permite separar cargas de trabajo y costos por departamento"], "correct": [1, 4], "multi": true}, {"id": 132, "text": "¿Cuál tarea es responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Habilitar el cifrado del lado del cliente para objetos almacenados en Amazon S3.", "Configurar políticas de seguridad de IAM para cumplir con el principio de mínimo privilegio.", "Aplicar parches al sistema operativo invitado en una instancia de Amazon EC2.", "Aplicar actualizaciones al hipervisor Nitro — AWS es responsable de la infraestructura subyacente."], "correct": [3], "multi": false}, {"id": 133, "text": "¿Cuál de las siguientes es una ventaja de usar AWS para computación en la nube?", "options": ["Intercambiar gasto variable por gasto fijo", "Precios de pago por uso (pay-as-you-go) — pagas solo por lo que consumes", "Menor velocidad y agilidad", "Gastar dinero en operar y mantener centros de datos propios"], "correct": [1], "multi": false}, {"id": 134, "text": "¿Cuál de las siguientes es una capacidad de la perspectiva de negocios (Business) del Marco de Adopción de la Nube de AWS (AWS CAF)?", "options": ["Evolución de la cultura (Culture evolution) — perspectiva de personas", "Gestión de eventos (Event management) — perspectiva de operaciones", "Monetización de datos (Data monetization) — genera valor económico a partir de los datos de la empresa", "Arquitectura de plataforma (Platform architecture) — perspectiva de plataforma"], "correct": [2], "multi": false}, {"id": 135, "text": "Una empresa está evaluando su plan de AWS Business Support para determinar si aún cumple con sus necesidades. La empresa considera cambiar a AWS Enterprise Support. ¿Qué beneficio adicional recibirá la empresa con AWS Enterprise Support?", "options": ["Acceso completo a todas las verificaciones de AWS Trusted Advisor", "Acceso telefónico, por correo electrónico y chat a ingenieros de soporte en la nube las 24 horas, los 7 días de la semana", "Un Technical Account Manager (TAM) designado para asistir en el monitoreo y la optimización", "Una revisión consultiva y orientación de arquitectura para las aplicaciones de la empresa"], "correct": [2], "multi": false}, {"id": 136, "text": "¿Qué modelo de precios interrumpirá una instancia de Amazon EC2 en ejecución si la capacidad queda temporalmente no disponible?", "options": ["Instancias Bajo Demanda (On-Demand) — sin interrupciones, pago por hora", "Instancias Reservadas Estándar (Standard Reserved) — compromiso de 1 o 3 años, sin interrupciones", "Instancias Spot — precio variable con gran descuento, pueden interrumpirse si AWS necesita la capacidad", "Instancias Reservadas Convertibles (Convertible
