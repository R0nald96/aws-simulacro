a la seguridad en la nube.", "AWS ofrece soporte gratuito de Technical Account Managers (TAMs).", "AWS ofrece alta disponibilidad — infraestructura diseñada con redundancia y tolerancia a fallos.", "AWS proporciona economías de escala — precios más bajos gracias al volumen masivo de AWS."], "correct": [3, 4], "multi": true}, {"id": 272, "text": "Una empresa ha decidido adoptar infraestructura de Amazon EC2 y quiere escalar varios servicios sin estado para uso a corto plazo. ¿Qué modelo de precios de EC2 es el MÁS rentable para cumplir con estos requisitos?", "options": ["Instancias Spot — precio variable con descuentos de hasta 90%, ideales para cargas sin estado tolerantes a interrupciones", "Instancias Bajo Demanda — sin descuento por compromiso", "Instancias Reservadas — compromiso de 1 o 3 años (no rentable para uso a corto plazo)", "Hosts Dedicados — hardware dedicado con mayor costo"], "correct": [0], "multi": false}, {"id": 273, "text": "¿Cuáles de los siguientes son beneficios de AWS Trusted Advisor? (Seleccione dos.)", "options": ["Acceso a Amazon SQS", "Recomendaciones de optimización de costos — identifica recursos subutilizados y oportunidades de ahorro", "Actualización por hora de las verificaciones de límites de servicio", "Verificaciones de seguridad — identifica configuraciones de seguridad que no siguen las mejores prácticas", "Gestión de aprobaciones de IAM"], "correct": [1, 3], "multi": true}, {"id": 274, "text": "Una empresa quiere ahorrar costos archivando datos a los que los usuarios finales ya no acceden con frecuencia. ¿Qué característica de Amazon S3 cumplirá con este requisito?", "options": ["S3 Versioning — conserva múltiples versiones de cada objeto", "S3 Lifecycle — mueve automáticamente objetos a clases de almacenamiento de menor costo o los elimina según reglas definidas", "S3 Object Lock — evita que los objetos sean eliminados o modificados", "S3 Inventory — genera informes sobre los objetos almacenados"], "correct": [1], "multi": false}, {"id": 275, "text": "¿Qué ventaja de la computación en la nube aplica una empresa cuando usa regiones de AWS para aumentar la disponibilidad de la aplicación para usuarios en diferentes países?", "options": ["Precios de pago por uso (pay-as-you-go)", "Previsión de capacidad", "Economías de escala", "Alcance global — despliega aplicaciones en regiones del mundo cercanas a los usuarios"], "correct": [3], "multi": false}, {"id": 276, "text": "Una empresa quiere un servicio de AWS para recopilar y procesar 10 TB de datos localmente y transferirlos a AWS. La empresa tiene conectividad intermitente. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Database Migration Service (DMS) — migra bases de datos a AWS", "AWS DataSync — transfiere datos por internet de forma automatizada (requiere conectividad estable)", "AWS Backup — servicio centralizado de respaldo para recursos de AWS", "AWS Snowball Edge — dispositivo físico con capacidad de cómputo y almacenamiento, funciona sin conectividad constante"], "correct": [3], "multi": false}, {"id": 277, "text": "¿Cuál de los siguientes es un principio de diseño del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) para la excelencia operativa en la nube de AWS?", "options": ["Despliegue global en minutos.", "Realizar cambios frecuentes, pequeños y reversibles — facilita detectar y corregir errores rápidamente.", "Implementar una base sólida de gestión de identidades y accesos.", "Dejar de gastar dinero en infraestructura de hardware para operaciones de centros de datos."], "correct": [1], "multi": false}, {"id": 278, "text": "¿Cuál es un beneficio de usar la computación sin servidor (serverless) de AWS?", "options": ["No se requiere despliegue ni gestión de aplicaciones.", "AWS gestionará completamente la seguridad de la aplicación.", "No se necesita monitoreo ni registro de logs.", "La gestión de la infraestructura se transfiere a AWS — el cliente solo se enfoca en el código."], "correct": [3], "multi": false}, {"id": 279, "text": "Un desarrollador quiere que los usuarios de AWS accedan a los servicios de AWS usando credenciales de seguridad temporales. ¿Qué servicio o característica de AWS debe usar el desarrollador para proporcionar estas credenciales?", "options": ["Políticas de IAM — definen permisos pero no generan credenciales temporales", "Grupos de usuarios de IAM — agrupa usuarios con permisos comunes", "AWS Security Token Service (AWS STS) — genera credenciales de seguridad temporales y de privilegio limitado", "AWS IAM Identity Center — inicio de sesión único para múltiples cuentas de AWS"], "correct": [2], "multi": false}, {"id": 280, "text": "Una empresa global desea usar un servicio de seguridad gestionado para protección contra ataques de inyección SQL. El servicio también debe proporcionar información detallada de logs sobre el acceso a las aplicaciones de comercio electrónico de la empresa. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Network Firewall — firewall gestionado para VPCs", "Amazon RDS for SQL Server — base de datos SQL Server gestionada", "Amazon GuardDuty — detecta amenazas y actividad maliciosa (no filtra SQL injection)", "AWS WAF — firewall de aplicaciones web que bloquea SQL injection y proporciona logs detallados"], "correct": [3], "multi": false}, {"id": 281, "text": "Una empresa está migrando su servidor local a una instancia de Amazon EC2. El servidor debe permanecer activo en todo momento durante los próximos 12 meses. ¿Qué opción de precios de EC2 es la MÁS rentable para la carga de trabajo de la empresa?", "options": ["Bajo Demanda (On-Demand) — sin descuento por compromiso", "Hosts Dedicados (Dedicated Hosts) — hardware dedicado con mayor costo", "Instancias Spot — pueden interrumpirse (no adecuado para disponibilidad 24/7)", "Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso de 1 año para uso continuo"], "correct": [3], "multi": false}, {"id": 282, "text": "¿Cuál de las siguientes es responsabilidad del cliente bajo el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Mantener la configuración de los dispositivos de infraestructura.", "Mantener los parches y actualizaciones dentro de la infraestructura de hardware.", "Mantener la configuración de los sistemas operativos invitados y las aplicaciones.", "Gestionar las decisiones relacionadas con las opciones de cifrado.", "Mantener la infraestructura de hardware."], "correct": [2, 3], "multi": true}, {"id": 283, "text": "Una empresa quiere verificar si la autenticación multifactor (MFA) está habilitada para todos los usuarios dentro de sus cuentas de AWS. ¿Qué servicio o recurso de AWS cumplirá con este requisito?", "options": ["AWS Cost and Usage Report — reporte detallado de costos y uso", "Informes de credenciales de IAM (IAM credential reports) — lista todos los usuarios e incluye si tienen MFA habilitado", "AWS Artifact — informes de cumplimiento y certificaciones de AWS", "Informes de Amazon CloudFront"], "correct": [1], "multi": false}, {"id": 284, "text": "Una empresa usa servicios y herramientas de seguridad de AWS. La empresa necesita un servicio para ayudar a gestionar las alertas de seguridad y debe organizar las alertas en un único dashboard. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "Amazon Macie — descubre y protege datos sensibles en S3", "AWS Security Hub — agrega y organiza alertas de múltiples servicios de seguridad en un dashboard centralizado"], "correct": [3], "multi": false}, {"id": 285, "text": "Una empresa quiere ejecutar sus cargas de trabajo en la nube de AWS de manera efectiva, reducir la sobrecarga de gestión y mejorar los procesos. ¿Qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) representa estos requisitos?", "options": ["Fiabilidad (Reliability)", "Excelencia operativa (Operational Excellence) — ejecuta y monitorea sistemas para entregar valor de negocio, mejorando continuamente los procesos", "Eficiencia en el rendimiento (Performance Efficiency)", "Optimización de costos (Cost Optimization)"], "correct": [1], "multi": false}, {"id": 286, "text": "Una empresa usa Amazon S3 para almacenar registros que pueden contener información de identificación personal (PII). La empresa desea una solución que pueda monitorear todos los buckets de S3 en busca de PII y alertar inmediatamente al personal sobre las vulnerabilidades. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa (no escanea datos sensibles)", "Amazon Detective — investiga incidentes de seguridad", "Amazon Macie — usa ML para monitorear S3 en busca de PII y genera alertas automáticas", "AWS Shield — protección contra ataques DDoS"], "correct": [2], "multi": false}, {"id": 287, "text": "¿Qué servicio de AWS permite a los usuarios descargar informes de seguridad y cumplimiento sobre la infraestructura de AWS bajo demanda?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa", "AWS Security Hub — agrega alertas de seguridad en un dashboard", "AWS Artifact — portal para descargar informes de seguridad y cumplimiento de AWS bajo demanda", "AWS Shield — protección contra ataques DDoS"], "correct": [2], "multi": false}, {"id": 288, "text": "Un auditor externo ha solicitado a una empresa que proporcione una lista de todos sus usuarios de IAM, incluyendo el estado de las credenciales y las claves de acceso. ¿Cuál es la forma MÁS SENCILLA de proporcionar esta información?", "options": ["Crear una cuenta de usuario de IAM para el auditor, otorgándole permisos de administrador.", "Tomar una captura de pantalla de la página de cada usuario en la Consola de Administración de AWS y proporcionarlas al auditor.", "Descargar el informe de credenciales de IAM y proporcionarlo al auditor — contiene todos los usuarios y el estado de sus credenciales en un archivo CSV.", "Descargar el informe de AWS Trusted Advisor y proporcionarlo al auditor."], "correct": [2], "multi": false}, {"id": 289, "text": "¿Qué tarea puede realizar una empresa usando grupos de seguridad en la nube de AWS?", "options": ["Permitir el acceso a una instancia de Amazon EC2 únicamente a través de un puerto específico.", "Denegar el acceso a direcciones IP maliciosas a nivel de subred.", "Proteger los datos almacenados en caché por Amazon CloudFront.", "Aplicar un firewall sin estado a una instancia de Amazon EC2."], "correct": [0], "multi": false}, {"id": 290, "text": "Una empresa planea ejecutar una carga de trabajo de cómputo intensivo que usa unidades de procesamiento gráfico (GPUs). ¿Qué tipo de instancia de Amazon EC2 debe usar la empresa?", "options": ["Cómputo acelerado (Accelerated computing) — instancias con GPUs o FPGAs para cargas de trabajo de procesamiento acelerado", "Optimizadas para cómputo (Compute optimized) — CPUs de alto rendimiento para cómputo intensivo sin GPU", "Optimizadas para almacenamiento (Storage optimized) — alto rendimiento de I/O para cargas de trabajo de almacenamiento", "Propósito general (General purpose) — balance entre cómputo, memoria y red"], "correct": [0], "multi": false}, {"id": 291, "text": "¿Cuáles de las siguientes son características de las ACLs de red (Network ACLs) en la nube de AWS? (Seleccione dos.)", "options": ["Son sin estado (stateless) — cada solicitud y respuesta se evalúa por separado sin recordar el estado de la conexión.", "Son con estado (stateful).", "Evalúan todas las reglas antes de permitir el tráfico.", "Procesan las reglas en orden, comenzando por la regla con el número más bajo, para decidir si permiten el tráfico.", "Operan a nivel de instancia."], "correct": [0, 3], "multi": true}, {"id": 292, "text": "¿Cuáles capacidades están en la perspectiva de plataforma (Platform) del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Gestión de rendimiento y capacidad — perspectiva de operaciones", "Ingeniería de datos (Data engineering) — construye pipelines y plataformas de datos en la nube", "Integración y entrega continua (CI/CD) — automatiza el desarrollo y despliegue de software en la nube", "Protección de infraestructura — perspectiva de seguridad", "Gestión de cambios y releases — perspectiva de operaciones"], "correct": [1, 2], "multi": true}, {"id": 293, "text": "De acuerdo con el Modelo de Responsabilidad Compartida de AWS, el cliente es responsable de aplicar las últimas actualizaciones de seguridad y parches para ¿cuál de los siguientes?", "options": ["Amazon DynamoDB — base de datos NoSQL completamente gestionada (AWS aplica los parches)", "Instancias de Amazon EC2 — el cliente es responsable del sistema operativo y las aplicaciones en EC2", "Instancias de Amazon RDS — AWS aplica los parches al motor de base de datos", "Amazon S3 — almacenamiento de objetos completamente gestionado (AWS aplica los parches)"], "correct": [1], "multi": false}, {"id": 294, "text": "¿Qué clase de almacenamiento de Amazon S3 es la MÁS rentable para patrones de acceso desconocidos?", "options": ["S3 Standard — acceso frecuente, mayor costo", "S3 Standard-IA — acceso infrecuente (requiere conocer el patrón de acceso)", "S3 One Zone-IA — acceso infrecuente en una sola AZ", "S3 Intelligent-Tiering — mueve automáticamente objetos entre niveles según el patrón de acceso real, ideal cuando el patrón es desconocido"], "correct": [3], "multi": false}, {"id": 295, "text": "¿Cuáles de las siguientes son capacidades de la perspectiva de seguridad (Security) del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Observabilidad — perspectiva de operaciones", "Gestión de incidentes y problemas — perspectiva de operaciones", "Respuesta a incidentes (Incident response) — gestiona y responde ante incidentes de seguridad", "Protección de infraestructura (Infrastructure protection) — implementa controles de seguridad en la infraestructura", "Disponibilidad y continuidad — perspectiva de operaciones"], "correct": [2, 3], "multi": true}, {"id": 296, "text": "Una empresa tiene una política de IAM gestionada que no otorga los permisos necesarios para que los usuarios realicen las tareas requeridas. ¿Cómo puede resolverse esto?", "options": ["Habilitar AWS Shield Advanced.", "Crear una política de IAM personalizada con los permisos específicos que necesitan los usuarios.", "Usar una regla gestionada de firewall de aplicaciones web (WAF) de terceros desde AWS Marketplace.", "Usar AWS Key Management Service (KMS) para crear una clave gestionada por el cliente."], "correct": [1], "multi": false}, {"id": 297, "text": "¿Quién es responsable de gestionar el acceso de usuarios de IAM y las claves secretas de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Las claves de acceso y secretas de IAM son estáticas, por lo que no es necesario rotarlas.", "El cliente es responsable de rotar las claves — es una responsabilidad del cliente proteger sus credenciales.", "AWS rotará las claves cuando sea necesario.", "El equipo de Soporte de AWS rotará las claves cuando el cliente lo solicite."], "correct": [1], "multi": false}, {"id": 298, "text": "Una empresa necesita ejecutar un firewall de terceros preinstalado en una instancia de Amazon EC2. ¿Qué servicio o característica de AWS puede proporcionar esta solución?", "options": ["ACLs de red — filtrado de tráfico a nivel de subred", "Grupos de seguridad — filtrado de tráfico a nivel de instancia", "AWS Marketplace — tienda con software de seguridad de terceros, incluyendo firewalls, listo para desplegar en EC2", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento"], "correct": [2], "multi": false}, {"id": 299, "text": "¿Qué beneficio de la nube de AWS le da a una empresa la capacidad de desplegar rápidamente recursos en la nube para acceder a infraestructura de cómputo, almacenamiento y base de datos en cuestión de minutos?", "options": ["Elasticidad — ajusta recursos según la demanda", "Ahorro de costos — reduce gastos operativos", "Agilidad — aprovisiona y desaprovisiona recursos rápidamente para experimentar e innovar", "Fiabilidad — recuperación ante fallos"], "correct": [2], "multi": false}, {"id": 300, "text": "¿Cuál de las siguientes es completamente responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Concienciación y formación en seguridad", "Desarrollo de una política de contraseñas de IAM", "Aplicación de parches al sistema operativo invitado", "Controles físicos y ambientales — AWS es completamente responsable de la seguridad física de sus centros de datos"], "correct": [3], "multi": false}, {"id": 301, "text": "¿Cuál de las siguientes es una característica del usuario raíz (root) de una cuenta de AWS?", "options": ["El usuario raíz es el único usuario que puede configurarse con autenticación multifactor (MFA).", "El usuario raíz es el único usuario que puede acceder a la Consola de Administración de AWS.", "El usuario raíz es la primera identidad de inicio de sesión disponible cuando se crea una cuenta de AWS.", "El usuario raíz tiene una contraseña que no puede cambiarse."], "correct": [2], "multi": false}, {"id": 302, "text": "Una instancia de Amazon EC2 utilizada anteriormente para desarrollo ahora es inaccesible y ya no aparece en la Consola de Administración de AWS. ¿Qué servicio de AWS debe usarse para determinar qué acción hizo que esta instancia EC2 fuera inaccesible?", "options": ["Amazon CloudWatch Logs — almacena y analiza logs de aplicaciones y servicios", "AWS Security Hub — agrega alertas de seguridad", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS CloudTrail — registra todas las llamadas a la API, incluyendo la terminación de instancias EC2"], "correct": [3], "multi": false}, {"id": 303, "text": "Los desarrolladores de aplicaciones de una empresa necesitan aprovisionar y gestionar rápidamente servicios de AWS usando scripts. ¿Qué oferta de AWS deben usar los desarrolladores para cumplir con estos requisitos?", "options": ["AWS CLI — interfaz de línea de comandos para interactuar con AWS mediante scripts", "AWS CodeBuild — compila y prueba código en la nube", "Marco de Adopción de la Nube de AWS (AWS CAF) — guía para la transformación a la nube", "AWS Systems Manager Session Manager — conexión segura a instancias sin SSH"], "correct": [0], "multi": false}, {"id": 304, "text": "Una empresa desea migrar datos no estructurados a AWS. Los datos deben moverse de forma segura con cifrado en tránsito y validación de datos de extremo a extremo. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Application Migration Service — migra aplicaciones completas a AWS", "Amazon Elastic File System (EFS) — sistema de archivos compartido en la nube", "AWS DataSync — transfiere datos de forma segura con cifrado en tránsito y validación de integridad automática", "AWS Migration Hub — rastrea el progreso de migraciones"], "correct": [2], "multi": false}, {"id": 305, "text": "Un equipo de desarrollo quiere desplegar múltiples entornos de prueba para una aplicación de forma rápida y repetible. ¿Qué servicio de AWS debe usar el equipo?", "options": ["Amazon EC2 — instancias virtuales (despliegue manual, no repetible automáticamente)", "AWS CloudFormation — infraestructura como código para desplegar entornos de forma rápida y repetible", "Amazon QuickSight — dashboards de BI", "Amazon ECS — orquestación de contenedores"], "correct": [1], "multi": false}, {"id": 306, "text": "Una empresa quiere implementar rápidamente un pipeline de integración continua/entrega continua (CI/CD). ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Config — registra configuraciones de recursos", "Amazon Cognito — autenticación de usuarios", "AWS DataSync — transfiere datos de forma segura", "AWS CodeStar — configura pipelines CI/CD completos rápidamente con herramientas integradas de AWS"], "correct": [3], "multi": false}, {"id": 307, "text": "¿Qué modelo de despliegue de la nube de AWS usa AWS Outposts como parte de la infraestructura de despliegue de la aplicación?", "options": ["Local (On-premises) — infraestructura completamente en instalaciones propias sin AWS", "Sin servidor (Serverless) — usa servicios sin gestionar servidores", "Nativo de la nube (Cloud-native) — arquitectura completamente en AWS", "Híbrido (Hybrid) — combina infraestructura local con la nube de AWS, como AWS Outposts"], "correct": [3], "multi": false}, {"id": 308, "text": "¿Cuál de los siguientes es un servicio de base de datos de grafos completamente gestionado en AWS?", "options": ["Amazon Aurora — base de datos relacional compatible con MySQL y PostgreSQL", "Amazon FSx — sistemas de archivos gestionados de alto rendimiento", "Amazon DynamoDB — base de datos NoSQL serverless", "Amazon Neptune — base de datos de grafos completamente gestionada para datos altamente conectados"], "correct": [3], "multi": false}, {"id": 309, "text": "¿Qué servicio de AWS podría usar un administrador para proporcionar entornos de escritorio a varios empleados?", "options": ["AWS Organizations — gestiona múltiples cuentas de AWS", "AWS Fargate — ejecuta contenedores sin gestionar servidores", "AWS WAF — firewall de aplicaciones web", "Amazon WorkSpaces — escritorios virtuales Windows/Linux en la nube para empleados remotos"], "correct": [3], "multi": false}, {"id": 310, "text": "¿Qué servicio o característica de AWS permite a los usuarios capturar información sobre el tráfico de red en una VPC?", "options": ["VPC Flow Logs — captura metadatos del tráfico IP en interfaces de red dentro de una VPC", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "Tablas de rutas de VPC — controlan el enrutamiento del tráfico", "AWS CloudTrail — registra llamadas a la API de AWS"], "correct": [0], "multi": false}, {"id": 311, "text": "¿Qué tipo de almacenamiento de AWS es efímero y se elimina cuando una instancia de Amazon EC2 se detiene o termina?", "options": ["Amazon Elastic Block Store (EBS) — almacenamiento de bloques persistente que sobrevive a las paradas de instancia", "Almacén de instancias de Amazon EC2 (Instance store) — almacenamiento temporal que se pierde al detener o terminar la instancia", "Amazon Elastic File System (EFS) — sistema de archivos compartido y persistente", "Amazon S3 — almacenamiento de objetos persistente y duradero"], "correct": [1], "multi": false}, {"id": 312, "text": "Una empresa desea proporcionar acceso a recursos compartidos de archivos de Windows en AWS desde sus cargas de trabajo locales. La empresa no quiere aprovisionar infraestructura ni aplicaciones adicionales en su centro de datos. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon FSx File Gateway — proporciona acceso local a recursos compartidos de archivos de Amazon FSx for Windows sin infraestructura adicional en el centro de datos", "AWS DataSync — transfiere datos entre almacenamiento local y AWS", "Amazon S3 — almacenamiento de objetos en la nube", "AWS Snow Family — dispositivos físicos para migración de datos"], "correct": [0], "multi": false}, {"id": 313, "text": "Una empresa desea almacenamiento duradero para contenido estático e infraestructura de almacenamiento de datos infinitamente escalable al menor costo. ¿Qué servicio de AWS debe elegir la empresa?", "options": ["Amazon EBS — almacenamiento de bloques para EC2 (no infinitamente escalable de forma automática)", "Amazon S3 — almacenamiento de objetos infinitamente escalable, durable y de bajo costo para contenido estático", "AWS Storage Gateway — conecta almacenamiento local con la nube de AWS", "Amazon EFS — sistema de archivos compartido (mayor costo que S3 para contenido estático)"], "correct": [1], "multi": false}, {"id": 314, "text": "Una empresa de comercio electrónico desea usar Amazon EC2 Auto Scaling para agregar y eliminar instancias EC2 según la utilización de CPU. ¿Qué servicio o característica de AWS puede iniciar una acción de Auto Scaling para lograr este objetivo?", "options": ["Amazon SQS — cola de mensajes gestionada", "Amazon SNS — notificaciones y mensajería pub/sub", "AWS Systems Manager — gestiona y opera infraestructura de AWS", "Alarma de Amazon CloudWatch — monitorea métricas como CPU y activa acciones de Auto Scaling cuando se superan umbrales"], "correct": [3], "multi": false}, {"id": 315, "text": "Una empresa desea transformar su fuerza laboral atrayendo y desarrollando una plantilla de alto rendimiento con fluidez digital. La empresa desea atraer una fuerza laboral diversa e inclusiva con una mezcla apropiada de habilidades técnicas y no técnicas. ¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) cumplirá con estos requisitos?", "options": ["Negocio (Business) — alinea inversiones en la nube con los resultados de negocio", "Personas (People) — atrae, desarrolla y retiene el talento necesario para la transformación a la nube", "Plataforma (Platform) — arquitectura e ingeniería de la plataforma cloud", "Operaciones (Operations) — monitorea y gestiona el rendimiento de los servicios"], "correct": [1], "multi": false}, {"id": 316, "text": "Una empresa desea mover sus bases de datos locales a servicios de base de datos en la nube gestionados mediante un proceso de migración simplificado. ¿Qué servicio o herramienta de AWS puede ayudar a la empresa a cumplir con este requisito?", "options": ["AWS Storage Gateway — conecta almacenamiento local con la nube de AWS", "AWS Application Migration Service — migra aplicaciones completas a AWS", "AWS DataSync — transfiere datos de forma segura", "AWS Database Migration Service (AWS DMS) — migra bases de datos a AWS con mínima interrupción del servicio"], "correct": [3], "multi": false}, {"id": 317, "text": "Una empresa necesita un servidor de archivos completamente gestionado que admita de forma nativa las cargas de trabajo y los sistemas de archivos de Microsoft. El servidor de archivos también debe admitir el protocolo SMB. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon EFS — sistema de archivos compatible con NFS (no SMB ni Windows nativo)", "Amazon FSx for Lustre — sistema de archivos de alto rendimiento para cargas de trabajo HPC y ML", "Amazon FSx for Windows File Server — servidor de archivos Windows nativo con soporte SMB y Active Directory", "Amazon EBS — almacenamiento de bloques para instancias EC2"], "correct": [2], "multi": false}, {"id": 318, "text": "Una empresa ha estado almacenando informes mensuales en un bucket de Amazon S3. La empresa exporta los datos del informe a archivos de valores separados por comas (.csv). Un desarrollador quiere escribir una consulta simple que pueda leer todos estos archivos y generar un informe de resumen. ¿Qué servicio o característica de AWS debe usar el desarrollador para cumplir con estos requisitos con la MENOR cantidad de sobrecarga operativa?", "options": ["Amazon S3 Select — ejecuta consultas SQL sobre un único objeto de S3", "Amazon Athena — ejecuta consultas SQL sobre múltiples archivos en S3 sin gestionar servidores, ideal para análisis ad hoc", "Amazon Redshift — data warehouse para análisis a gran escala (mayor configuración)", "Amazon EC2 — instancias virtuales (requiere gestionar el entorno de consultas manualmente)"], "correct": [1], "multi": false}, {"id": 319, "text": "¿Qué característica de AWS proporciona una plataforma sin costo para que los usuarios de AWS se unan a grupos de la comunidad, hagan preguntas, encuentren respuestas y lean artículos generados por la comunidad sobre mejores prácticas?", "options": ["AWS Knowledge Center — base de conocimientos con preguntas frecuentes y soluciones", "AWS re:Post — comunidad colaborativa donde los usuarios de AWS se ayudan mutuamente con preguntas técnicas", "AWS IQ — plataforma para contratar expertos certificados de AWS", "AWS Enterprise Support — plan de soporte empresarial con TAM dedicado"], "correct": [1], "multi": false}, {"id": 320, "text": "Una empresa necesita buscar texto en documentos almacenados en Amazon S3. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Kendra — motor de búsqueda empresarial inteligente que busca texto en documentos almacenados en S3 y otros repositorios", "Amazon Rekognition — analiza imágenes y videos con IA", "Amazon Polly — convierte texto en voz", "Amazon Lex — construye chatbots conversacionales"], "correct": [0], "multi": false}, {"id": 321, "text": "¿Qué servicios de AWS hacen uso de las ubicaciones de borde (edge locations) globales? (Seleccione dos.)", "options": ["AWS Fargate — ejecuta contenedores sin gestionar servidores (no usa edge locations)", "Amazon CloudFront — red de distribución de contenido que entrega contenido desde ubicaciones de borde cercanas a los usuarios", "AWS Global Accelerator — enruta tráfico por la red global de AWS usando ubicaciones de borde para menor latencia", "AWS Wavelength — despliegue de apps en redes 5G (no usa edge locations tradicionales)", "Amazon VPC — red virtual privada en una región específica (no usa edge locations)"], "correct": [1, 2], "multi": true}, {"id": 322, "text": "Un usuario necesita una base de datos relacional pero no tiene los recursos para gestionar el hardware, la resiliencia y la replicación. ¿Qué opción de servicio de AWS cumple con los requisitos del usuario?", "options": ["Ejecutar MySQL en Amazon ECS — requiere gestionar el motor de base de datos", "Ejecutar MySQL en Amazon EC2 — requiere gestionar el SO, la base de datos y los parches", "Elegir Amazon RDS for MySQL — base de datos relacional completamente gestionada, AWS gestiona el hardware y la replicación", "Elegir Amazon ElastiCache for Redis — caché en memoria, no es una base de datos relacional"], "correct": [2], "multi": false}, {"id": 323, "text": "Una empresa necesita desplegar aplicaciones en la nube de AWS lo más rápido posible. La empresa también necesita minimizar la complejidad relacionada con la gestión de recursos de AWS. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Config — registra y evalúa configuraciones de recursos", "AWS Elastic Beanstalk — despliega aplicaciones automáticamente sin gestionar infraestructura, mínima complejidad", "Amazon EC2 — instancias virtuales (requiere gestión manual de infraestructura)", "Amazon Personalize — recomendaciones personalizadas con ML"], "correct": [1], "multi": false}, {"id": 324, "text": "¿Qué mecanismo permite a los desarrolladores acceder a los servicios de AWS desde el código de la aplicación?", "options": ["AWS Software Development Kit (SDK) — bibliotecas para acceder programáticamente a servicios AWS desde el código de la aplicación", "AWS Management Console — interfaz web para gestionar servicios AWS manualmente", "AWS CodePipeline — automatiza pipelines de CI/CD", "AWS Config — registra y evalúa configuraciones de recursos"], "correct": [0], "multi": false}, {"id": 325, "text": "Una empresa está migrando a la nube de AWS. La empresa desea comprender e identificar posibles configuraciones incorrectas de seguridad o comportamientos inesperados. La empresa desea priorizar los controles de protección que podría necesitar. ¿Qué capacidad de la perspectiva de seguridad (Security) del Marco de Adopción de la Nube de AWS (AWS CAF) cumplirá con estos requisitos?", "options": ["Gestión de identidades y accesos", "Detección de amenazas (Threat detection) — identifica posibles riesgos de seguridad y comportamientos anómalos", "Ingeniería de plataforma", "Gestión de disponibilidad y continuidad"], "correct": [1], "multi": false}], [{"id": 326, "text": "Una empresa quiere establecer una conexión de red privada entre AWS y su red corporativa. ¿Qué servicio o característica de AWS cumplirá con este requisito?", "options": ["Amazon Connect — centro de contacto en la nube", "Amazon Route 53 — servicio de DNS escalable", "AWS Direct Connect — conexión de red dedicada y privada entre instalaciones propias y AWS", "VPC Peering — conecta dos VPCs de forma privada (no conecta redes corporativas locales)"], "correct": [2], "multi": false}, {"id": 327, "text": "¿Qué servicios o características de AWS ofrecen la capacidad de crear una conexión de red entre dos VPCs? (Seleccione dos.)", "options": ["Endpoints de VPC — conectividad privada entre VPC y servicios de AWS", "Amazon Route 53 — servicio de DNS escalable", "VPC Peering — conecta directamente dos VPCs de forma privada", "AWS Direct Connect — conexión dedicada entre instalaciones propias y AWS (no entre VPCs)", "AWS Transit Gateway — hub central que conecta múltiples VPCs entre sí"], "correct": [2, 4], "multi": true}, {"id": 328, "text": "¿Qué servicio de AWS convierte texto en voces naturales?", "options": ["Amazon Transcribe — convierte voz en texto (Speech-to-Text)", "Amazon Rekognition — analiza imágenes y videos con IA", "Amazon Polly — convierte texto en voz (Text-to-Speech) con voces naturales", "Amazon Textract — extrae texto de documentos escaneados"], "correct": [2], "multi": false}, {"id": 329, "text": "Una empresa desea usar stacks de aplicaciones para ejecutar una carga de trabajo en la nube de AWS. La empresa quiere usar instancias preconfiguradas. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Lightsail — plataforma simplificada con instancias preconfiguradas para apps, blogs y sitios web", "Amazon Athena — consultas SQL sobre datos en S3", "AWS Outposts — rack de infraestructura AWS en instalaciones propias", "Amazon EC2 — instancias virtuales que requieren configuración manual"], "correct": [0], "multi": false}, {"id": 330, "text": "¿Qué servicios de AWS son compatibles con los Planes de Ahorro (Savings Plans)? (Seleccione dos.)", "options": ["Amazon EC2 — Compute Savings Plans y EC2 Instance Savings Plans aplican a EC2", "Amazon RDS — base de datos relacional gestionada (no compatible con Savings Plans)", "Amazon SageMaker — SageMaker Savings Plans aplican a instancias de SageMaker", "Amazon Redshift — data warehouse (no compatible con Savings Plans)", "Amazon DynamoDB — base de datos NoSQL (no compatible con Savings Plans)"], "correct": [0, 2], "multi": true}, {"id": 331, "text": "¿Qué servicio o herramienta de AWS puede proporcionar recomendaciones de dimensionamiento correcto (rightsizing) para recursos de Amazon EC2 sin costo adicional?", "options": ["AWS Well-Architected Tool — evalúa arquitecturas contra mejores prácticas", "Amazon CloudWatch — monitoreo y observabilidad de recursos", "AWS Cost Explorer — incluye recomendaciones de rightsizing para EC2 sin costo adicional", "Amazon S3 Analytics — analiza patrones de acceso a datos en S3"], "correct": [2], "multi": false}, {"id": 332, "text": "Una empresa opera un data warehouse a escala de petabytes para analizar sus datos. La empresa quiere una solución que no requiera gestión manual de hardware y software. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon DocumentDB — base de datos de documentos compatible con MongoDB", "Amazon Redshift — data warehouse de petabytes completamente gestionado para análisis a gran escala", "Amazon Neptune — base de datos de grafos gestionada", "Amazon ElastiCache — caché en memoria (Redis/Memcached)"], "correct": [1], "multi": false}, {"id": 333, "text": "Una biblioteca quiere automatizar la clasificación de libros electrónicos basándose en el contenido de los libros. ¿Qué servicio de AWS debe usar la biblioteca para cumplir con este requisito?", "options": ["Amazon Redshift — data warehouse para análisis", "Amazon CloudSearch — motor de búsqueda gestionado", "Amazon Comprehend — usa NLP para analizar y clasificar texto, ideal para clasificar libros por contenido", "Amazon Aurora — base de datos relacional de alto rendimiento"], "correct": [2], "multi": false}, {"id": 334, "text": "¿Cuál tarea es responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Cifrado de datos de aplicaciones", "Autenticación de usuarios de aplicaciones", "Protección de la infraestructura de red física — AWS es responsable de los switches, routers y cableado de su infraestructura", "Configuración de firewalls"], "correct": [2], "multi": false}, {"id": 335, "text": "¿Cuáles de las siguientes son recomendaciones de las fases del recorrido de transformación a la nube del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Fase de Visión (Envision) — demuestra cómo la nube puede acelerar los resultados de negocio", "Fase de Alinear (Align) — identifica brechas de capacidad y crea planes de acción", "Fase de Evaluación (Assess) — no es una fase del AWS CAF", "Fase de Movilización (Mobilize) — no es una fase del AWS CAF", "Fase de Migrar y Modernizar — no es una fase oficial del AWS CAF"], "correct": [0, 1], "multi": true}, {"id": 336, "text": "Una empresa quiere generar una lista de usuarios de IAM. La empresa también quiere ver el estado de varias credenciales asociadas con los usuarios, como contraseñas, claves de acceso y dispositivos de autenticación multifactor (MFA). ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["Informe de credenciales de IAM (IAM credential report) — genera una lista de todos los usuarios y el estado de sus credenciales (contraseña, claves de acceso, MFA)", "AWS IAM Identity Center — inicio de sesión único para múltiples cuentas", "AWS IAM Access Analyzer — identifica recursos compartidos con entidades externas", "AWS Cost and Usage Report — reporte de costos y uso"], "correct": [0], "multi": false}, {"id": 337, "text": "Una empresa está diseñando sus cargas de trabajo de AWS para que los componentes puedan actualizarse regularmente y los cambios puedan realizarse en pequeños incrementos reversibles. ¿Qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) respalda este diseño?", "options": ["Seguridad (Security)", "Eficiencia en el rendimiento (Performance Efficiency)", "Excelencia operativa (Operational Excellence) — realiza cambios frecuentes, pequeños y reversibles para mejorar continuamente", "Fiabilidad (Reliability)"], "correct": [2], "multi": false}, {"id": 338, "text": "Una empresa quiere rastrear etiquetas, buckets y prefijos de sus objetos de Amazon S3. ¿Qué característica de S3 cumplirá con este requisito?", "options": ["Informe de inventario de S3 (S3 Inventory report) — genera informes sobre los objetos almacenados incluyendo etiquetas, clases de almacenamiento y metadatos", "S3 Lifecycle — mueve objetos automáticamente entre clases de almacenamiento", "S3 Versioning — conserva múltiples versiones de cada objeto", "S3 ACLs — controla el acceso a objetos y buckets"], "correct": [0], "multi": false}, {"id": 339, "text": "Una empresa quiere permitir que los usuarios se autentiquen y autoricen en múltiples cuentas de AWS usando un único conjunto de credenciales. ¿Qué servicio o recurso de AWS cumplirá con este requisito?", "options": ["AWS Organizations — gestiona múltiples cuentas (no proporciona SSO directamente)", "Usuario de IAM — identidad dentro de una sola cuenta", "AWS IAM Identity Center (Single Sign-On) — permite autenticarse una vez y acceder a múltiples cuentas de AWS", "AWS Control Tower — configura y gobierna entornos multi-cuenta"], "correct": [2], "multi": false}, {"id": 340, "text": "Una empresa creó una instancia de Amazon EC2. La empresa quiere controlar el tráfico de red entrante y saliente a nivel de instancia. ¿Qué recurso o servicio de AWS cumplirá con este requisito?", "options": ["AWS Shield — protección contra ataques DDoS", "Grupos de seguridad (Security groups) — firewall a nivel de instancia que controla tráfico entrante y saliente", "Network Access Analyzer — analiza el acceso a la red", "Endpoints de VPC — conectividad privada entre VPC y servicios de AWS"], "correct": [1], "multi": false}, {"id": 341, "text": "Una empresa quiere usar la nube de AWS para desplegar una aplicación globalmente. ¿Qué modelo de despliegue de arquitectura debe usar la empresa para cumplir con este requisito?", "options": ["Multi-Region — despliega la aplicación en múltiples regiones geográficas para alcance global", "Single-Region — una sola región, no es global", "Multi-AZ — alta disponibilidad dentro de una región, no cobertura global", "Single-AZ — una sola zona de disponibilidad, sin redundancia"], "correct": [0], "multi": false}, {"id": 342, "text": "Una empresa quiere que una aplicación web interactúe con varios servicios de AWS. ¿Qué servicio o recurso de AWS cumplirá con este requisito?", "options": ["AWS CloudShell — terminal en el navegador para la CLI", "AWS Marketplace — tienda de software de terceros", "AWS Management Console — interfaz web para gestionar e interactuar con todos los servicios de AWS", "AWS CLI — interfaz de línea de comandos"], "correct": [2], "multi": false}, {"id": 343, "text": "Una empresa está migrando sus aplicaciones desde instalaciones propias a la nube de AWS. La empresa quiere asegurarse de que las aplicaciones solo tengan los permisos mínimos necesarios para realizar todas las operaciones. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Identity and Access Management (IAM) — gestiona identidades y aplica el principio de mínimo privilegio", "Amazon CloudWatch — monitoreo y observabilidad de recursos", "Amazon Macie — detecta datos sensibles en S3", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [0], "multi": false}, {"id": 344, "text": "¿Cuáles de las siguientes son capacidades de la perspectiva de gobernanza (Governance) del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Gestión de identidades y accesos — perspectiva de seguridad", "Gestión financiera de la nube (Cloud financial management) — optimiza y controla el gasto en la nube", "Gestión del portafolio de aplicaciones (Application portfolio management) — prioriza las inversiones en TI", "Gestión de innovación — perspectiva de negocio", "Gestión de productos — perspectiva de negocio"], "correct": [1, 2], "multi": true}, {"id": 345, "text": "¿Qué servicio de AWS proporciona una ubicación única para rastrear el progreso de las migraciones de aplicaciones?", "options": ["AWS Application Discovery Service — descubre y recopila información de la infraestructura local", "AWS Application Migration Service — migra aplicaciones a AWS", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Migration Hub — panel central para rastrear el progreso de todas las migraciones a AWS"], "correct": [3], "multi": false}, {"id": 346, "text": "Una empresa lanzó una instancia de Amazon EC2 con la Amazon Machine Image (AMI) más reciente de Amazon Linux 2. ¿Qué acciones puede tomar un administrador de sistemas para conectarse a la instancia EC2? (Seleccione dos.)", "options": ["Usar Amazon EC2 Instance Connect — conexión SSH directamente desde la consola de AWS sin gestionar claves SSH.", "Usar una conexión de Protocolo de Escritorio Remoto (RDP) — para Windows, no Linux.", "Usar AWS Batch — servicio de procesamiento por lotes, no para conexiones a instancias.", "Usar AWS Systems Manager Session Manager — conexión segura sin abrir puertos SSH ni gestionar claves.", "Usar Amazon Connect — centro de contacto en la nube, no para administración de instancias."], "correct": [0, 3], "multi": true}, {"id": 347, "text": "¿Qué concepto de arquitectura describe la capacidad de desplegar recursos bajo demanda y liberarlos cuando ya no son necesarios?", "options": ["Alta disponibilidad — mantiene el sistema operativo con mínima interrupción", "Arquitectura desacoplada — reduce dependencias entre componentes", "Resiliencia — capacidad de recuperarse de fallos", "Elasticidad — aprovisiona y desaprovisiona recursos dinámicamente según la demanda"], "correct": [3], "multi": false}, {"id": 348, "text": "¿Qué tarea requiere que un usuario inicie sesión como usuario raíz (root) de la cuenta de AWS?", "options": ["La eliminación de usuarios de IAM", "La eliminación de una cuenta de AWS — solo el usuario raíz puede cerrar la cuenta de AWS", "La creación de una organización en AWS Organizations", "La eliminación de instancias de Amazon EC2"], "correct": [1], "multi": false}, {"id": 349, "text": "¿Qué ofrece la clase de almacenamiento S3 Intelligent-Tiering de Amazon S3?", "options": ["Flexibilidad de pago mediante la reserva de capacidad de almacenamiento", "Retención de datos a largo plazo copiándolos en un volumen cifrado de Amazon EBS", "Ahorro automático de costos al mover objetos entre niveles según los cambios en los patrones de acceso", "Almacenamiento más seguro, duradero y de menor costo para el archivado de datos"], "correct": [2], "multi": false}, {"id": 350, "text": "Una empresa necesita instancias de Amazon EC2 para una carga de trabajo que puede tolerar interrupciones. ¿Qué opción de compra de instancias EC2 cumple con este requisito con el MAYOR descuento comparado con los precios Bajo Demanda?", "options": ["Instancias Spot — descuentos de hasta 90% sobre el precio Bajo Demanda, pueden interrumpirse cuando AWS necesita la capacidad", "Instancias Reservadas Convertibles — descuento moderado con flexibilidad para cambiar tipo", "Instancias Reservadas Estándar — mayor descuento con compromiso fijo", "Hosts Dedicados — servidor físico exclusivo con mayor costo"], "correct": [0], "multi": false}, {"id": 351, "text": "Una empresa planea migrar a la nube de AWS. La empresa quiere identificar resultados de negocio medibles que expliquen el valor de la decisión de migrar. ¿Qué fase del recorrido de transformación a la nube incluye estas actividades?", "options": ["Visión (Envision) — identifica y cuantifica los beneficios de negocio medibles para justificar la migración a la nube", "Alinear (Align) — identifica brechas de capacidad y crea planes de acción", "Escalar (Scale) — expande iniciativas exitosas a toda la organización", "Lanzar (Launch) — implementa pilotos en producción"], "correct": [0], "multi": false}, {"id": 352, "text": "¿Qué servicio o componente de AWS permite que el tráfico de internet entrante acceda a una VPC?", "options": ["Internet Gateway — permite la comunicación bidireccional entre la VPC e internet", "NAT Gateway — permite tráfico saliente a internet desde subredes privadas (no tráfico entrante)", "AWS WAF — firewall de aplicaciones web", "VPC Peering — conecta dos VPCs de forma privada"], "correct": [0], "multi": false}, {"id": 353, "text": "¿Qué servicio de AWS permite a las empresas crear infraestructura a partir de código?", "options": ["Amazon EKS — Kubernetes gestionado en AWS", "AWS Outposts — infraestructura AWS en instalaciones propias", "AWS CodePipeline — automatiza pipelines de CI/CD", "AWS CloudFormation — crea y gestiona infraestructura de AWS mediante código (IaC)"], "correct": [3], "multi": false}, {"id": 354, "text": "¿Qué directriz es un principio de diseño bien arquitectado para construir aplicaciones en la nube?", "options": ["Mantener los datos estáticos más cerca de los recursos de cómputo.", "Aprovisionar recursos para la capacidad máxima.", "Diseñar para la recuperación automática de fallos — implementa mecanismos que detecten y recuperen fallos automáticamente.", "Usar componentes fuertemente acoplados."], "correct": [2], "multi": false}, {"id": 355, "text": "Una empresa necesita mover 75 petabytes de datos desde sus centros de datos locales a AWS. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos de la forma MÁS rentable?", "options": ["AWS Snowball Edge Storage Optimized — hasta 80 TB por dispositivo (requeriría miles de dispositivos)", "AWS Snowmobile — camión de datos que puede transferir hasta 100 PB, ideal para 75 PB", "AWS Direct Connect — conexión dedicada por red (muy lento para 75 PB)", "AWS Storage Gateway — conecta almacenamiento local con AWS (no para migraciones masivas)"], "correct": [1], "multi": false}, {"id": 356, "text": "¿Cuáles de los siguientes son pilares del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework)? (Seleccione dos.)", "options": ["Escalabilidad de recursos — característica, no un pilar", "Eficiencia en el rendimiento (Performance Efficiency) — pilar del Well-Architected Framework", "Elasticidad del sistema — ventaja de AWS, no un pilar", "Desarrollo ágil — metodología, no un pilar", "Excelencia operativa (Operational Excellence) — pilar del Well-Architected Framework"], "correct": [1, 4], "multi": true}, {"id": 357, "text": "Una empresa necesita conectar su centro de datos local a la nube de AWS. La empresa necesita una conexión dedicada de baja latencia con rendimiento de red consistente. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Global Accelerator — optimiza el enrutamiento del tráfico por la red global de AWS", "Amazon CloudFront — red de distribución de contenido (CDN)", "AWS Direct Connect — conexión de red dedicada, privada y de baja latencia entre instalaciones propias y AWS", "AWS Managed VPN — VPN gestionada por internet (mayor latencia y variabilidad)"], "correct": [2], "multi": false}, {"id": 358, "text": "¿Qué principios de diseño debe aplicar una empresa a las cargas de trabajo de la nube de AWS para maximizar la sostenibilidad y minimizar el impacto ambiental? (Seleccione dos.)", "options": ["Maximizar la utilización de las instancias de Amazon EC2 — usar los recursos de forma más eficiente reduce el impacto ambiental.", "Minimizar la utilización de las instancias de Amazon EC2.", "Minimizar el uso de servicios gestionados.", "Forzar la reinstalación frecuente de aplicaciones por parte de los usuarios.", "Reducir la necesidad de que los usuarios reinstalen aplicaciones — las aplicaciones eficientes consumen menos recursos."], "correct": [0, 4], "multi": true}, {"id": 359, "text": "¿De qué maneras la nube de AWS ofrece un menor costo total de propiedad (TCO) de los recursos de cómputo que los centros de datos locales? (Seleccione dos.)", "options": ["AWS reemplaza los gastos de capital iniciales con costos de pago por uso — elimina grandes inversiones iniciales en hardware.", "AWS está diseñado para alta disponibilidad, lo que elimina el tiempo de inactividad del usuario.", "AWS elimina la necesidad de personal de TI local.", "AWS usa economías de escala para reducir continuamente los precios — el ahorro de costos de la enorme escala se comparte con los clientes.", "AWS ofrece un único modelo de precios para instancias de Amazon EC2."], "correct": [0, 3], "multi": true}, {"id": 360, "text": "Una empresa quiere desplegar algunos de sus recursos en la nube de AWS. Para cumplir con los requisitos regulatorios, los datos deben permanecer locales y en instalaciones propias. Debe haber baja latencia entre AWS y los recursos de la empresa. ¿Qué servicio o característica de AWS puede usarse para cumplir con estos requisitos?", "options": ["AWS Local Zones — extiende AWS a ciudades metropolitanas (los datos van a AWS)", "Zonas de Disponibilidad — infraestructura de AWS en la nube", "AWS Outposts — rack de infraestructura AWS instalado físicamente en las instalaciones propias de la empresa", "AWS Wavelength Zones — despliegue de apps en redes 5G"], "correct": [2], "multi": false}, {"id": 361, "text": "¿Cuáles de los siguientes servicios de AWS son sin servidor (serverless)? (Seleccione dos.)", "options": ["AWS Outposts — infraestructura física en instalaciones propias", "Amazon EC2 — instancias virtuales que requieren gestión del servidor", "Amazon EKS — Kubernetes gestionado (requiere nodos de cómputo)", "AWS Fargate — ejecuta contenedores sin gestionar servidores subyacentes", "AWS Lambda — funciones sin servidor que se ejecutan sin gestionar infraestructura"], "correct": [3, 4], "multi": true}, {"id": 362, "text": "Cuando un usuario desea usar sus licencias de software existentes por socket, por núcleo o por máquina virtual para un servidor Windows de Microsoft que se ejecuta en AWS, ¿qué tipo de instancia de Amazon EC2 se requiere?", "options": ["Instancias Spot — precio variable, pueden interrumpirse", "Instancias Dedicadas — hardware dedicado, pero no permite traer licencias por socket/núcleo", "Hosts Dedicados (Dedicated Hosts) — servidor físico dedicado que permite usar licencias de software existentes por socket, núcleo o VM", "Instancias Reservadas — descuento por compromiso, no garantiza hardware físico dedicado"], "correct": [2], "multi": false}, {"id": 363, "text": "Un arquitecto de soluciones necesita mantener una flota de instancias de Amazon EC2 para que las instancias deterioradas sean reemplazadas por nuevas. ¿Qué servicio de AWS debe usar el arquitecto de soluciones?", "options": ["Amazon ECS — orquestación de contenedores", "Amazon GuardDuty — detecta amenazas y actividad maliciosa", "AWS Shield — protección contra ataques DDoS", "AWS Auto Scaling — detecta instancias EC2 deterioradas y las reemplaza automáticamente"], "correct": [3], "multi": false}, {"id": 364, "text": "¿Qué servicio de AWS proporciona a las aplicaciones locales acceso de baja latencia a los datos almacenados en la nube de AWS?", "options": ["Amazon CloudFront — red de distribución de contenido (CDN) para usuarios globales", "AWS Storage Gateway — proporciona acceso de baja latencia a datos en la nube desde aplicaciones locales", "AWS Backup — servicio centralizado de respaldo", "AWS DataSync — transfiere datos de forma automatizada y segura"], "correct": [1], "multi": false}, {"id": 365, "text": "¿Qué proporciona Amazon CloudFront?", "options": ["Escalado automático de todos los recursos para alimentar una aplicación desde una única interfaz unificada", "Entrega segura de datos, videos, aplicaciones y APIs a usuarios globalmente con baja latencia", "Capacidad para gestionar el tráfico globalmente a través de varios tipos de enrutamiento, incluyendo basado en latencia, geo DNS, geoproximidad y round robin ponderado", "Distribución automática del tráfico entrante de aplicaciones entre múltiples destinos, como instancias EC2, contenedores, direcciones IP y funciones Lambda"], "correct": [1], "multi": false}, {"id": 366, "text": "¿Qué servicio de AWS respalda el despliegue y la gestión de aplicaciones en la nube de AWS?", "options": ["Amazon CodeGuru — revisa código y detecta problemas de rendimiento", "AWS Fargate — ejecuta contenedores sin gestionar servidores", "AWS CodeCommit — repositorio Git gestionado", "AWS Elastic Beanstalk — despliega y gestiona aplicaciones automáticamente en la nube de AWS"], "correct": [3], "multi": false}, {"id": 367, "text": "Una empresa quiere integrar el procesamiento de lenguaje natural (NLP) en dashboards de inteligencia de negocios (BI). La empresa quiere hacer preguntas y recibir respuestas con visualizaciones relevantes. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["Amazon Macie — detecta datos sensibles en S3", "Amazon Rekognition — analiza imágenes y videos", "Amazon QuickSight Q — permite hacer preguntas en lenguaje natural sobre los datos y recibir visualizaciones automáticas", "Amazon Lex — construye chatbots conversacionales"], "correct": [2], "multi": false}, {"id": 368, "text": "¿Qué característica o clase de almacenamiento de Amazon S3 usa la red troncal de AWS y las ubicaciones de borde para reducir la latencia desde el usuario final hasta Amazon S3?", "options": ["S3 Cross-Region Replication — replica datos entre regiones", "S3 Transfer Acceleration — acelera las transferencias a S3 usando las ubicaciones de borde de CloudFront", "S3 Event Notifications — notifica cuando ocurren eventos en S3", "S3 Standard-IA — clase de almacenamiento para acceso infrecuente"], "correct": [1], "multi": false}, {"id": 369, "text": "¿Qué servicio de AWS proporciona la capacidad de alojar una base de datos NoSQL en la nube de AWS?", "options": ["Amazon Aurora — base de datos relacional compatible con MySQL y PostgreSQL", "Amazon DynamoDB — base de datos NoSQL serverless con escalado automático", "Amazon RDS — base de datos relacional gestionada", "Amazon Redshift — data warehouse para análisis"], "correct": [1], "multi": false}, {"id": 370, "text": "¿Qué servicio de AWS es una base de datos relacional compatible con MySQL y PostgreSQL?", "options": ["Amazon Redshift — data warehouse para análisis (compatible con SQL, no exactamente MySQL/PostgreSQL)", "Amazon DynamoDB — base de datos NoSQL", "Amazon Aurora — base de datos relacional de alto rendimiento compatible con MySQL y PostgreSQL", "Amazon Neptune — base de datos de grafos"], "correct": [2], "multi": false}, {"id": 371, "text": "¿Qué principio de diseño de arquitectura describe la necesidad de aislar los fallos entre componentes dependientes en la nube de AWS?", "options": ["Usar un diseño monolítico.", "Diseñar para la automatización.", "Diseñar para puntos únicos de fallo.", "Componentes débilmente acoplados (Loosely couple components) — aísla los fallos para que no se propaguen entre componentes."], "correct": [3], "multi": false}, {"id": 372, "text": "¿Qué beneficio de la computación en la nube le da a una empresa la capacidad de desplegar aplicaciones para usuarios en todo el mundo a través de una red de regiones de AWS, Zonas de Disponibilidad y ubicaciones de borde?", "options": ["Economías de escala", "Alcance global — infraestructura distribuida mundialmente para llegar a usuarios en cualquier lugar", "Agilidad", "Alta disponibilidad"], "correct": [1], "multi": false}, {"id": 373, "text": "¿Qué servicio de AWS facilita el monitoreo y la resolución de problemas de logs de aplicaciones y recursos en la nube?", "options": ["Amazon EC2 — instancias virtuales", "AWS Identity and Access Management (IAM) — gestión de identidades y accesos", "Amazon CloudWatch — monitoreo, métricas, logs y alarmas para recursos y aplicaciones de AWS", "AWS CloudTrail — registra llamadas a la API de AWS"], "correct": [2], "multi": false}, {"id": 374, "text": "¿Qué servicio de AWS usa AWS Compute Optimizer para proporcionar recomendaciones de dimensionamiento basadas en métricas de carga de trabajo?", "options": ["Amazon EC2 — Compute Optimizer analiza métricas de EC2 y recomienda el tipo e tamaño óptimo", "Amazon RDS — base de datos relacional gestionada", "Amazon Lightsail — plataforma simplificada para apps", "AWS Step Functions — orquesta flujos de trabajo"], "correct": [0], "multi": false}, {"id": 375, "text": "¿Qué servicio de AWS ayudará a una empresa a planificar una migración a AWS recopilando datos de configuración, uso y comportamiento de los centros de datos locales?", "options": ["AWS Resource Groups — organiza recursos de AWS con etiquetas", "AWS Application Discovery Service — recopila datos de configuración y uso de servidores locales para planificar la migración", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Systems Manager — gestiona y opera infraestructura de AWS"], "correct": [1], "multi": false}, {"id": 376, "text": "¿Qué servicio de AWS usa una combinación de publicadores y suscriptores (publishers and subscribers)?", "options": ["AWS Lambda — funciones sin servidor", "Amazon SNS (Simple Notification Service) — mensajería pub/sub donde publicadores envían mensajes a temas y suscriptores los reciben", "Amazon CloudWatch — monitoreo y observabilidad", "AWS CloudFormation — infraestructura como código"], "correct": [1], "multi": false}, {"id": 377, "text": "Una empresa se encuentra en las primeras etapas de planificación de una migración a AWS. La empresa quiere obtener el costo total mensual previsto de AWS para futuras instancias de Amazon EC2 y almacenamiento asociado. ¿Qué servicio o herramienta de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Pricing Calculator — estima el costo mensual de instancias EC2 y almacenamiento antes del despliegue", "AWS Compute Optimizer — recomienda el tamaño óptimo de recursos (no estima costos futuros)", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS Application Migration Service — migra aplicaciones a AWS"], "correct": [0], "multi": false}, {"id": 378, "text": "¿Qué servicio o herramienta de AWS monitoreará recursos y aplicaciones de AWS en tiempo real?", "options": ["AWS Trusted Advisor — recomendaciones de optimización (no monitoreo en tiempo real)", "Amazon CloudWatch — monitoreo en tiempo real de métricas, logs y alarmas para recursos de AWS", "AWS CloudTrail — registra llamadas a la API (no monitoreo de métricas en tiempo real)", "AWS Cost Explorer — analiza costos históricos"], "correct": [1], "multi": false}, {"id": 379, "text": "¿Qué capacidad del Marco de Adopción de la Nube de AWS (AWS CAF) pertenece a la perspectiva de negocio (Business)?", "options": ["Gestión de programas y proyectos — perspectiva de gobernanza", "Ciencia de datos (Data science) — usa datos para generar valor de negocio y apoyar la toma de decisiones", "Observabilidad — perspectiva de operaciones", "Gestión de cambios y releases — perspectiva de operaciones"], "correct": [1], "multi": false}, {"id": 380, "text": "¿Qué recurso de AWS puede ayudar a una empresa a reducir sus costos a cambio de un compromiso de uso al usar instancias de Amazon EC2?", "options": ["Compute Savings Plans — descuentos flexibles a cambio de un compromiso de uso de cómputo por 1 o 3 años", "Grupo de Auto Scaling — ajusta automáticamente la capacidad según la demanda", "Instancia Bajo Demanda — sin descuento por compromiso", "Almacén de instancias de EC2 — almacenamiento temporal efímero"], "correct": [0], "multi": false}, {"id": 381, "text": "¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) incluye una capacidad para arquitectura de datos y análisis bien diseñada?", "options": ["Seguridad (Security)", "Gobernanza (Governance)", "Operaciones (Operations)", "Plataforma (Platform) — incluye capacidades de arquitectura de datos e ingeniería de datos"], "correct": [3], "multi": false}, {"id": 382, "text": "¿Cuáles de las siguientes son capacidades de la perspectiva de personas (People) del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Alineación organizacional (Organizational alignment) — alinea a las personas con los objetivos de la transformación a la nube", "Gestión de portafolio — perspectiva de gobernanza", "Diseño organizacional (Organization design) — define la estructura organizacional para apoyar la adopción de la nube", "Gestión de riesgos — perspectiva de gobernanza", "Desarrollo de aplicaciones modernas — perspectiva de plataforma"], "correct": [0, 2], "multi": true}, {"id": 383, "text": "Una empresa necesita un puente entre la tecnología y el negocio para ayudar a evolucionar hacia una cultura de crecimiento y aprendizaje continuo. ¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) actúa como este puente?", "options": ["Personas (People) — conecta la tecnología con el negocio atrayendo, desarrollando y reteniendo el talento necesario", "Gobernanza (Governance)", "Operaciones (Operations)", "Seguridad (Security)"], "correct": [0], "multi": false}, {"id": 384, "text": "¿Cuál de las siguientes opciones es responsabilidad de AWS bajo el Modelo de Responsabilidad Compartida de AWS?", "options": ["Seguridad de los datos de la aplicación", "Gestión de parches para aplicaciones que se ejecutan en instancias de Amazon EC2", "Gestión de parches de la infraestructura subyacente para servicios gestionados — AWS parchea la infraestructura de RDS, DynamoDB, etc.", "Gestión de identidades y accesos de la aplicación"], "correct": [2], "multi": false}, {"id": 385, "text": "¿Qué servicio o recurso de AWS puede identificar y proporcionar informes sobre los recursos de IAM en una cuenta de AWS que se comparten con otra cuenta de AWS?", "options": ["Informe de credenciales de IAM — lista usuarios y credenciales", "AWS IAM Identity Center — inicio de sesión único para múltiples cuentas", "AWS IAM Access Analyzer — identifica recursos de IAM compartidos con entidades externas o entre cuentas", "Pool de usuarios de Amazon Cognito — gestiona autenticación de usuarios"], "correct": [2], "multi": false}, {"id": 386, "text": "¿En qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) se enfoca la asignación estructurada y optimizada de recursos de cómputo?", "options": ["Fiabilidad (Reliability)", "Excelencia operativa (Operational Excellence)", "Eficiencia en el rendimiento (Performance Efficiency) — usa los recursos de cómputo de manera estructurada y eficiente para satisfacer los requisitos del sistema", "Sostenibilidad (Sustainability)"], "correct": [2], "multi": false}, {"id": 387, "text": "¿Cuáles capacidades del Marco de Adopción de la Nube de AWS (AWS CAF) pertenecen a la perspectiva de gobernanza (Governance)? (Seleccione dos.)", "options": ["Gestión de programas y proyectos (Program and project management) — planifica y ejecuta iniciativas de transformación a la nube", "Gestión de productos — perspectiva de negocio", "Gestión de portafolio — perspectiva de negocio", "Gestión de riesgos (Risk management) — identifica y mitiga riesgos organizacionales y tecnológicos", "Gestión de eventos — perspectiva de operaciones"], "correct": [0, 3], "multi": true}, {"id": 388, "text": "Una empresa quiere usar AWS Managed Services (AMS) para soporte operativo y quiere entender el alcance de AMS. ¿Qué característica de AMS cumplirá con estos requisitos?", "options": ["Gestión de landing zone y red — AMS incluye la configuración y gestión de la infraestructura de red y la zona de aterrizaje", "Desarrollo de aplicaciones del cliente", "Configuración de pipeline DevSecOps", "Monitoreo de logs de aplicaciones"], "correct": [0], "multi": false}, {"id": 389, "text": "Una empresa quiere migrar su carga de trabajo NoSQL local a Amazon DynamoDB. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Migration Hub — rastrea el progreso de migraciones", "AWS Database Migration Service (AWS DMS) — migra bases de datos NoSQL y relacionales a AWS con mínima interrupción", "Migration Evaluator — evalúa el entorno local y estima costos en AWS", "AWS Application Migration Service — migra aplicaciones completas a AWS"], "correct": [1], "multi": false}, {"id": 390, "text": "Una empresa está en proceso de encontrar los tipos y tamaños de instancias de Amazon EC2 correctos para cumplir con sus requisitos de rendimiento y capacidad. La empresa quiere encontrar el menor costo posible. ¿Qué opción caracteriza con precisión las acciones de la empresa?", "options": ["Auto Scaling — ajusta automáticamente la capacidad según la demanda", "Niveles de almacenamiento (Storage tiering) — mueve datos entre clases de almacenamiento según el uso", "Dimensionamiento correcto (Rightsizing) — seleccionar el tipo y tamaño correcto de instancia para optimizar costos y rendimiento", "Programación de instancias (Instance scheduling) — enciende y apaga instancias según un horario"], "correct": [2], "multi": false}], [{"id": 391, "text": "Una empresa quiere gestionar la seguridad de inicio de sesión para los usuarios de su fuerza laboral. La empresa necesita crear usuarios y gestionar centralmente su acceso a todas las cuentas de AWS y aplicaciones de la empresa. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Audit Manager — automatiza la recopilación de evidencias para auditorías", "Amazon Cognito — gestiona autenticación para usuarios de aplicaciones (no fuerza laboral corporativa)", "AWS Security Hub — agrega alertas de seguridad", "AWS IAM Identity Center (Single Sign-On) — gestiona el acceso de la fuerza laboral a múltiples cuentas de AWS y aplicaciones"], "correct": [3], "multi": false}, {"id": 392, "text": "Una empresa quiere un informe que liste el estado de los dispositivos de autenticación multifactor (MFA) que usan todos los usuarios en la cuenta de AWS de la empresa. ¿Qué característica o servicio de AWS cumplirá con este requisito?", "options": ["AWS Cost and Usage Reports — reporte de costos y uso", "Informes de credenciales de IAM (IAM credential reports) — incluye el estado de MFA de todos los usuarios de la cuenta", "Informes de Facturación Detallada", "AWS Cost Explorer — analiza costos históricos"], "correct": [1], "multi": false}, {"id": 393, "text": "Una empresa quiere usar capacidades de Machine Learning para analizar datos de logs de sus instancias de Amazon EC2 y realizar investigaciones de seguridad de manera eficiente. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon Inspector — detecta vulnerabilidades en instancias EC2", "Amazon QuickSight — dashboards de BI", "Amazon Detective — usa ML para analizar y visualizar datos de seguridad, ayuda a investigar incidentes", "Amazon GuardDuty — detecta amenazas con ML (también válido, pero Detective es para investigación)"], "correct": [2], "multi": false}, {"id": 394, "text": "Una empresa está lanzando una aplicación móvil en la nube de AWS. La empresa quiere que los usuarios de la app inicien sesión a través de proveedores de identidad (IdPs) de redes sociales. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Lambda — funciones sin servidor", "Amazon Cognito — gestiona autenticación de usuarios y permite inicio de sesión con redes sociales (Google, Facebook, etc.)", "AWS Secrets Manager — almacena y rota credenciales", "Amazon CloudFront — red de distribución de contenido (CDN)"], "correct": [1], "multi": false}, {"id": 395, "text": "¿Qué servicio o herramienta gratuita de AWS crea casos de negocio basados en datos para la planificación de la migración a la nube?", "options": ["Migration Evaluator — crea casos de negocio con datos reales de uso para justificar la migración a AWS", "AWS Billing Conductor — personaliza la facturación para revendedores", "AWS Billing Console — interfaz para gestionar la facturación", "Amazon Forecast — predicciones con ML"], "correct": [0], "multi": false}, {"id": 396, "text": "¿Qué concepto de la nube se demuestra mediante el uso de AWS Cost Explorer?", "options": ["Dimensionamiento correcto (Rightsizing) — Cost Explorer incluye recomendaciones para ajustar el tamaño de los recursos y reducir costos", "Fiabilidad", "Resiliencia", "Modernización"], "correct": [0], "multi": false}, {"id": 397, "text": "Una empresa quiere desplegar una aplicación web Java (sin contenedores) en AWS. La empresa quiere usar un servicio gestionado para desplegar rápidamente la aplicación. La empresa quiere que el servicio aprovisione capacidad automáticamente, balancee la carga, escale y monitoree el estado de la aplicación. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon ECS — orquestación de contenedores", "AWS Lambda — funciones sin servidor (no es ideal para apps Java completas sin contenedores)", "Amazon EKS — Kubernetes gestionado para contenedores", "AWS Elastic Beanstalk — despliega apps web automáticamente, gestiona el aprovisionamiento, balanceo de carga, escalado y monitoreo"], "correct": [3], "multi": false}, {"id": 398, "text": "¿Qué servicio o herramienta de AWS le da a los usuarios la capacidad de conectarse con AWS y desplegar recursos de forma programática?", "options": ["Amazon QuickSight — dashboards de BI", "AWS PrivateLink — conectividad privada entre servicios de AWS", "AWS Direct Connect — conexión de red dedicada entre instalaciones propias y AWS", "AWS SDKs — bibliotecas para conectarse con AWS y desplegar recursos de forma programática desde el código"], "correct": [3], "multi": false}, {"id": 399, "text": "Una empresa ha desplegado una aplicación web en instancias de Amazon EC2. Las instancias EC2 tienen un uso bajo. ¿Qué servicio o característica de AWS debe usar la empresa para dimensionar correctamente (rightsize) las instancias EC2?", "options": ["AWS Config — registra y evalúa configuraciones de recursos", "AWS Cost Anomaly Detection — detecta anomalías en el gasto", "AWS Budgets — alertas de presupuesto", "AWS Compute Optimizer — analiza métricas de uso y recomienda el tipo e tamaño óptimo de instancias EC2"], "correct": [3], "multi": false}, {"id": 400, "text": "Una empresa quiere definir una política central de protección de datos que funcione en todos los servicios de AWS para recursos de cómputo, almacenamiento y base de datos. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Batch — procesamiento por lotes", "AWS Elastic Disaster Recovery — recuperación ante desastres", "AWS Backup — política centralizada de respaldo para múltiples servicios de AWS", "Amazon FSx — sistemas de archivos gestionados"], "correct": [2], "multi": false}, {"id": 401, "text": "Una empresa necesita categorizar y rastrear el costo de uso de AWS según categorías de negocio. ¿Qué servicio o característica de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Etiquetas de asignación de costos (Cost allocation tags) — categoriza y rastrea costos por etiquetas de negocio (departamento, proyecto, aplicación)", "AWS Organizations — gestiona múltiples cuentas", "AWS Security Hub — agrega alertas de seguridad", "AWS Cost and Usage Report — reporte detallado de costos"], "correct": [0], "multi": false}, {"id": 402, "text": "¿Qué servicio de AWS puede migrar datos entre servicios de almacenamiento de AWS?", "options": ["AWS DataSync — transfiere y sincroniza datos entre servicios de almacenamiento de AWS y almacenamiento local", "AWS Direct Connect — conexión de red dedicada entre instalaciones propias y AWS", "AWS Lake Formation — crea y gestiona data lakes", "Amazon S3 — almacenamiento de objetos"], "correct": [0], "multi": false}, {"id": 403, "text": "¿Cuáles afirmaciones representan la rentabilidad de la nube de AWS? (Seleccione dos.)", "options": ["Los usuarios pueden intercambiar gastos fijos por gastos variables — elimina grandes inversiones de capital iniciales.", "Los usuarios pueden desplegar en todo el mundo en minutos.", "AWS ofrece mayor velocidad y agilidad.", "AWS es responsable de parchear la infraestructura.", "Los usuarios se benefician de las economías de escala — precios más bajos gracias al volumen masivo de AWS."], "correct": [0, 4], "multi": true}, {"id": 404, "text": "Una empresa quiere diseñar su arquitectura de nube para que pueda respaldar innovaciones de desarrollo y mejorar continuamente los procesos y procedimientos. Esto es un ejemplo de ¿qué pilar del Marco de Buena Arquitectura de AWS?", "options": ["Seguridad", "Eficiencia en el rendimiento", "Excelencia operativa (Operational Excellence) — mejora continua de procesos, experimentación y aprendizaje de las operaciones", "Fiabilidad"], "correct": [2], "multi": false}, {"id": 405, "text": "Una empresa necesita consolidar la facturación de múltiples cuentas de AWS. La empresa necesita usar una cuenta para pagar en nombre de todas las demás cuentas. ¿Qué servicio o herramienta de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS Trusted Advisor — recomendaciones de optimización", "AWS Organizations — consolida la facturación de múltiples cuentas en una sola cuenta pagadora", "AWS Budgets — alertas de presupuesto", "AWS Service Catalog — catálogo de servicios de TI aprobados"], "correct": [1], "multi": false}, {"id": 406, "text": "Una empresa está migrando algunos de sus servicios de TI locales a la nube de AWS. El departamento de finanzas quiere ver la factura completa para poder pronosticar los límites de gasto. ¿Qué servicio de AWS puede usar la empresa para establecer límites de gasto y recibir notificaciones si se superan esos límites?", "options": ["AWS Cost and Usage Reports — reporte detallado de costos históricos", "AWS Budgets — establece límites de gasto y envía notificaciones cuando se superan", "AWS Organizations facturación consolidada — combina facturas de múltiples cuentas", "Cost Explorer — analiza costos históricos"], "correct": [1], "multi": false}, {"id": 407, "text": "¿Qué planes de AWS Support proporcionan acceso a un Technical Account Manager (TAM) de AWS? (Seleccione dos.)", "options": ["AWS Basic Support — plan gratuito sin TAM", "AWS Developer Support — soporte para desarrolladores sin TAM", "AWS Business Support — soporte empresarial sin TAM dedicado", "AWS Enterprise On-Ramp Support — incluye acceso a un pool de TAMs", "AWS Enterprise Support — incluye un TAM dedicado"], "correct": [3, 4], "multi": true}, {"id": 408, "text": "¿Dónde pueden encontrar los usuarios ejemplos de diseños de soluciones de la nube de AWS?", "options": ["AWS Marketplace — tienda de software de terceros", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Architecture Center — biblioteca de diseños de referencia, mejores prácticas y soluciones de arquitectura de AWS", "AWS Trusted Advisor — recomendaciones de optimización"], "correct": [2], "multi": false}, {"id": 409, "text": "¿Cuál tarea es responsabilidad de una empresa que usa Amazon RDS?", "options": ["Aprovisionar la infraestructura subyacente.", "Crear políticas de IAM para controlar el acceso administrativo al servicio.", "Instalar los cables para conectar el hardware de cómputo y almacenamiento.", "Instalar y parchear el sistema operativo de RDS."], "correct": [1], "multi": false}, {"id": 410, "text": "¿Cuál de las siguientes es una ventaja que la nube de AWS proporciona a los usuarios?", "options": ["Los usuarios eliminan la necesidad de adivinar los requisitos de capacidad de infraestructura — se aprovisiona exactamente lo necesario según la demanda.", "Los usuarios reducen sus costos variables manteniendo la propiedad exclusiva del hardware de TI.", "Los usuarios mantienen el control de la infraestructura de TI subyacente.", "Los usuarios mantienen el control de los sistemas operativos para los servicios gestionados."], "correct": [0], "multi": false}, {"id": 411, "text": "¿Qué característica de Amazon RDS proporciona la capacidad de crear automáticamente una instancia de base de datos primaria y replicar sincrónicamente los datos a una instancia en otra Zona de Disponibilidad?", "options": ["Réplicas de lectura (Read replicas) — réplicas asíncronas para distribuir cargas de lectura", "Despliegue azul/verde (Blue/green deployment) — actualiza aplicaciones con mínimo tiempo de inactividad", "Despliegue Multi-AZ — crea una instancia primaria y una standby sincrónica en otra AZ para alta disponibilidad", "Instancias Reservadas — descuento por compromiso de uso"], "correct": [2], "multi": false}, {"id": 412, "text": "Una empresa necesita verificar las claves de acceso de IAM que no han sido rotadas recientemente. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["AWS WAF — firewall de aplicaciones web", "AWS Shield — protección contra DDoS", "Amazon Cognito — autenticación de usuarios", "AWS Trusted Advisor — incluye verificaciones de seguridad como claves de acceso IAM no rotadas"], "correct": [3], "multi": false}, {"id": 413, "text": "Una empresa ejecuta muchas instancias de Amazon EC2 en su VPC. La empresa quiere usar un recurso de seguridad nativo de AWS para controlar el tráfico de red entre ciertas instancias EC2. ¿Qué servicio o característica de AWS cumplirá con este requisito?", "options": ["ACLs de red — control a nivel de subred, no de instancia específica", "AWS WAF — firewall de aplicaciones web", "Amazon GuardDuty — detección de amenazas", "Grupos de seguridad (Security groups) — controlan el tráfico entre instancias EC2 específicas a nivel de instancia"], "correct": [3], "multi": false}, {"id": 414, "text": "¿Cuáles de los siguientes pueden ser componentes de una
