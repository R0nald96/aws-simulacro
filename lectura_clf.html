Reserved) — compromiso flexible, sin interrupciones"], "correct": [2], "multi": false}, {"id": 137, "text": "¿Cuáles de las siguientes son capacidades de la perspectiva de seguridad (Security) del Marco de Adopción de la Nube de AWS (AWS CAF)? (Seleccione dos.)", "options": ["Observabilidad — perspectiva de operaciones", "Gestión de incidentes y problemas — perspectiva de operaciones", "Respuesta a incidentes (Incident response) — proceso de respuesta ante incidentes de seguridad", "Protección de infraestructura (Infrastructure protection) — controles de seguridad para proteger la infraestructura", "Disponibilidad y continuidad — perspectiva de operaciones"], "correct": [2, 3], "multi": true}, {"id": 138, "text": "Una empresa desea ejecutar su carga de trabajo en instancias de Amazon EC2 durante más de 1 año. Esta carga de trabajo se ejecutará continuamente. ¿Qué opción ofrece una tarifa por hora con descuento comparada con la tarifa de las instancias Bajo Demanda?", "options": ["Procesador AWS Graviton — procesador ARM de bajo costo para instancias EC2", "Hosts Dedicados (Dedicated Hosts) — servidor físico exclusivo con mayor costo", "Planes de Ahorro de Instancias EC2 (EC2 Instance Savings Plans) — descuento flexible con compromiso de uso por 1 o 3 años", "Instancias de Amazon EC2 Auto Scaling — escala automáticamente según la demanda"], "correct": [2], "multi": false}, {"id": 139, "text": "¿Qué característica de la nube de AWS ayuda a los usuarios a eliminar la capacidad de CPU subutilizada?", "options": ["Agilidad — capacidad de experimentar e innovar rápidamente", "Elasticidad — ajusta automáticamente los recursos según la demanda, evitando capacidad subutilizada", "Fiabilidad — capacidad de recuperarse de fallas", "Durabilidad — capacidad de preservar datos a largo plazo"], "correct": [1], "multi": false}, {"id": 140, "text": "¿Qué servicios de AWS puede usar una empresa para lograr una arquitectura de acoplamiento débil (loosely coupled)? (Seleccione dos.)", "options": ["Amazon WorkSpaces — escritorios virtuales en la nube", "Amazon SQS (Simple Queue Service) — desacopla componentes mediante colas de mensajes", "Amazon Connect — centro de contacto en la nube", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS Step Functions — orquesta flujos de trabajo desacoplados sin servidor"], "correct": [1, 4], "multi": true}, {"id": 141, "text": "¿Qué servicio de la nube de AWS puede enviar alertas a los clientes si se superan los umbrales de gasto personalizados?", "options": ["AWS Budgets — configura alertas cuando los costos o el uso superan umbrales definidos", "AWS Cost Explorer — analiza y visualiza costos históricos de AWS", "Etiquetas de asignación de costos de AWS (Cost Allocation Tags) — organiza costos por etiquetas", "AWS Organizations — gestiona y gobierna múltiples cuentas de AWS"], "correct": [0], "multi": false}, {"id": 142, "text": "Una empresa planea migrar a la nube de AWS. La empresa desea usar el Marco de Adopción de la Nube de AWS (AWS CAF) para definir y hacer seguimiento de los resultados de negocio como parte de su recorrido de transformación a la nube. ¿Qué capacidad de la perspectiva de gobernanza (Governance) del AWS CAF cumplirá con estos requisitos?", "options": ["Gestión de beneficios (Benefits management) — define y hace seguimiento de los resultados de negocio de la transformación a la nube", "Gestión de riesgos (Risk management) — identifica y mitiga riesgos del negocio", "Gestión del portafolio de aplicaciones — prioriza iniciativas según valor e impacto", "Gestión financiera de la nube — optimiza costos y valor de las inversiones en la nube"], "correct": [0], "multi": false}, {"id": 143, "text": "Una empresa necesita mover archivos de forma rápida y segura a través de largas distancias entre su cliente y un bucket de Amazon S3. ¿Qué característica de S3 cumplirá con este requisito?", "options": ["Versionado de S3 (S3 Versioning) — conserva múltiples versiones de cada objeto", "Aceleración de transferencia de S3 (S3 Transfer Acceleration) — usa las ubicaciones de borde de CloudFront para acelerar transferencias globales a S3", "ACLs de S3 — controla el acceso a nivel de objeto o bucket", "S3 Intelligent-Tiering — mueve objetos automáticamente entre clases de almacenamiento según patrones de acceso"], "correct": [1], "multi": false}, {"id": 144, "text": "Una empresa necesita ejecutar continuamente una carga de trabajo experimental en una instancia de Amazon EC2 y detener la instancia después de 12 horas. ¿Qué opción de compra de instancia cumplirá con este requisito de la forma MÁS rentable?", "options": ["Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso, ideal para cargas de trabajo cortas o impredecibles", "Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años (no rentable para uso de solo 12 horas)", "Instancias Spot — precio variable, pueden interrumpirse (no adecuado para carga de trabajo continua)", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado con mayor costo"], "correct": [0], "multi": false}, {"id": 145, "text": "¿En qué fase del recorrido de transformación a la nube del Marco de Adopción de la Nube de AWS (AWS CAF) se enfoca en demostrar cómo la nube ayuda a acelerar los resultados de negocio?", "options": ["Escalar (Scale) — expande iniciativas exitosas a toda la organización", "Visión (Envision) — demuestra cómo la nube puede acelerar los resultados de negocio y crea el caso de transformación", "Alinear (Align) — identifica brechas de capacidad y crea planes de acción", "Lanzar (Launch) — implementa pilotos en producción y demuestra valor del negocio"], "correct": [1], "multi": false}, {"id": 146, "text": "¿Cuál de las siguientes opciones es responsabilidad del cliente bajo el Modelo de Responsabilidad Compartida de AWS?", "options": ["Mantenimiento del hardware subyacente de las instancias de Amazon EC2", "Seguridad de los datos de la aplicación — el cliente siempre es responsable de sus propios datos", "Seguridad física de los centros de datos", "Mantenimiento de los componentes de VPC"], "correct": [1], "multi": false}, {"id": 147, "text": "Una empresa desea que sus instancias de Amazon EC2 operen en un entorno de alta disponibilidad, incluso si ocurre un desastre natural en una zona geográfica particular. ¿Qué enfoque logrará este objetivo?", "options": ["Usar instancias EC2 en múltiples regiones de AWS — distribuye la carga en regiones geográficamente separadas.", "Usar instancias EC2 en múltiples ubicaciones de Amazon CloudFront.", "Usar instancias EC2 en múltiples ubicaciones de borde.", "Usar instancias EC2 en AWS Local Zones."], "correct": [0], "multi": false}, {"id": 148, "text": "Una empresa desea modernizar y convertir una aplicación monolítica en microservicios. La empresa desea mover la aplicación a AWS. ¿Qué estrategia de migración debe usar la empresa?", "options": ["Realojar (Rehost) — migración directa 'lift and shift' sin cambios en la arquitectura", "Replataformar (Replatform) — pequeñas optimizaciones sin cambiar la arquitectura central", "Recomprar (Repurchase) — migrar a un producto diferente, generalmente SaaS", "Refactorizar (Refactor) — rediseñar la arquitectura aprovechando características nativas de la nube, como microservicios"], "correct": [3], "multi": false}, {"id": 149, "text": "Un administrador de sistemas creó un nuevo usuario de IAM para un desarrollador y le asignó una clave de acceso en lugar de un nombre de usuario y contraseña. ¿Para qué se usa la clave de acceso?", "options": ["Para acceder a la cuenta de AWS como usuario raíz (root)", "Para acceder a la cuenta de AWS a través de la Consola de Administración de AWS", "Para acceder a la cuenta de AWS a través de una CLI (interfaz de línea de comandos) o la API de AWS", "Para acceder a todas las cuentas de AWS de una empresa"], "correct": [2], "multi": false}, {"id": 150, "text": "¿Cuál de las siguientes opciones es un entorno que consta de uno o más centros de datos?", "options": ["Amazon CloudFront — red de distribución de contenido (CDN) con ubicaciones de borde globales", "Zona de Disponibilidad (Availability Zone) — uno o más centros de datos con energía, redes y conectividad redundantes", "VPC — red virtual privada aislada en AWS", "AWS Outposts — rack de infraestructura AWS instalado en instalaciones propias"], "correct": [1], "multi": false}, {"id": 151, "text": "Una empresa está trasladando un centro de datos local a la nube de AWS. La empresa debe migrar 50 petabytes de almacenamiento de archivos a AWS con la menor sobrecarga operativa posible. ¿Qué servicio o recurso de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Snowmobile — camión de datos para migrar exabytes de datos a AWS (ideal para 50+ PB)", "AWS Snowball Edge — dispositivo físico para migrar hasta 80 TB por dispositivo", "AWS Data Exchange — servicio para suscribirse y compartir datos de terceros", "AWS Database Migration Service (DMS) — migra bases de datos, no archivos en general"], "correct": [0], "multi": false}, {"id": 152, "text": "Una empresa tiene una aplicación con requisitos de hardware robustos. La aplicación debe ser accesible por estudiantes que usan laptops livianas y de bajo costo. ¿Qué servicio de AWS ayudará a la empresa a desplegar la aplicación sin invertir en infraestructura de backend ni en hardware de cliente de gama alta?", "options": ["Amazon AppStream 2.0 — transmite aplicaciones de escritorio de forma segura a cualquier dispositivo sin necesidad de hardware potente", "AWS AppSync — API GraphQL gestionada para aplicaciones web y móviles", "Amazon WorkLink — acceso seguro desde dispositivos móviles a contenido web interno", "AWS Elastic Beanstalk — despliega y gestiona aplicaciones web sin gestionar infraestructura"], "correct": [0], "multi": false}, {"id": 153, "text": "Una empresa desea consultar sus logs de servidor para obtener información sobre las experiencias de sus clientes. ¿Qué servicio de AWS almacenará estos datos de la forma MÁS rentable?", "options": ["Amazon Aurora — base de datos relacional de alto rendimiento (más costosa para logs)", "Amazon Elastic File System (EFS) — sistema de archivos compartido (más costoso para logs)", "Amazon Elastic Block Store (EBS) — almacenamiento de bloques para instancias EC2 (más costoso para logs)", "Amazon S3 — almacenamiento de objetos de bajo costo, ideal para logs y datos no estructurados"], "correct": [3], "multi": false}, {"id": 154, "text": "¿Cuál de las siguientes es una buena práctica de diseño recomendada para la arquitectura de la nube de AWS?", "options": ["Diseñar componentes fuertemente acoplados.", "Construir un único componente de aplicación que maneje toda la funcionalidad.", "Realizar grandes cambios en pocas iteraciones para reducir las posibilidades de falla.", "Evitar la arquitectura monolítica segmentando las cargas de trabajo en componentes independientes."], "correct": [3], "multi": false}, {"id": 155, "text": "¿Qué servicio de AWS ayuda a los usuarios a auditar la actividad de la API en sus cuentas de AWS?", "options": ["AWS CloudTrail — registra todas las llamadas a la API y la actividad de la cuenta de AWS", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2", "AWS WAF — firewall de aplicaciones web", "AWS Config — registra y evalúa configuraciones de recursos AWS"], "correct": [0], "multi": false}, {"id": 156, "text": "¿Cuál tarea es responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Gestión de los sistemas operativos invitados — el cliente es responsable del SO en sus instancias EC2", "Mantenimiento de la configuración de los dispositivos de infraestructura", "Gestión de los sistemas operativos host y la virtualización", "Mantenimiento del software que impulsa las Zonas de Disponibilidad"], "correct": [0], "multi": false}, {"id": 157, "text": "Una empresa desea agregar y eliminar instancias de Amazon EC2 automáticamente. La empresa desea que las instancias EC2 se ajusten dinámicamente a cargas de trabajo variables. ¿Qué servicio o característica cumplirá con estos requisitos?", "options": ["Amazon DynamoDB — base de datos NoSQL serverless", "Instancias Spot de Amazon EC2 — precio variable, pueden interrumpirse", "AWS Snow Family — dispositivos físicos para migración de datos", "Amazon EC2 Auto Scaling — agrega y elimina instancias EC2 automáticamente según la demanda"], "correct": [3], "multi": false}, {"id": 158, "text": "Un usuario desea automatizar de forma segura la gestión y rotación de credenciales que se comparten entre aplicaciones, con la menor cantidad de tareas de administración. ¿Qué servicio o característica de AWS puede usarse para lograr esto?", "options": ["AWS CloudHSM — módulo de seguridad de hardware dedicado para operaciones criptográficas", "AWS Key Management Service (KMS) — gestión de claves de cifrado", "AWS Secrets Manager — gestiona, rota y recupera credenciales automáticamente", "Cifrado del lado del servidor — cifra datos en reposo"], "correct": [2], "multi": false}, {"id": 159, "text": "¿Qué servicio de seguridad reconoce y clasifica automáticamente datos sensibles o propiedad intelectual en AWS?", "options": ["Amazon GuardDuty — detecta amenazas y actividad maliciosa (no clasifica datos)", "Amazon Macie — usa ML para descubrir y clasificar datos sensibles (PII) en Amazon S3", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2", "AWS Shield — protección contra ataques DDoS"], "correct": [1], "multi": false}, {"id": 160, "text": "¿Cuáles acciones son mejores prácticas para el usuario raíz (root) de una cuenta de AWS? (Seleccione dos.)", "options": ["Compartir las credenciales del usuario raíz con los miembros del equipo.", "Crear múltiples usuarios raíz para la cuenta, separados por entorno.", "Activar la autenticación multifactor (MFA) en el usuario raíz.", "Crear un usuario de IAM con privilegios de administrador para las tareas administrativas diarias, en lugar de usar el usuario raíz.", "Usar acceso programático en lugar del usuario raíz y contraseña."], "correct": [2, 3], "multi": true}, {"id": 161, "text": "Una empresa ejecuta una carga de trabajo crítica en una instancia de base de datos de Amazon RDS. La empresa necesita que la instancia de base de datos sea altamente disponible con un tiempo de recuperación inferior a 5 minutos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Crear una réplica de lectura de la instancia de base de datos.", "Crear una plantilla de la instancia de base de datos usando AWS CloudFormation.", "Tomar snapshots frecuentes de la instancia de base de datos. Almacenar los snapshots en Amazon S3.", "Modificar la instancia de base de datos a un despliegue Multi-AZ — replica sincrónicamente en otra Zona de Disponibilidad para alta disponibilidad."], "correct": [3], "multi": false}, {"id": 162, "text": "Una empresa planea migrar su aplicación a AWS y ejecutar la aplicación en instancias de Amazon EC2. La aplicación tendrá un uso continuo durante 1 año. ¿Qué opción de compra de instancias EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso de 1 año para uso continuo", "Instancias Spot — precio variable, pueden interrumpirse (no adecuado para uso continuo)", "Instancias Bajo Demanda (On-Demand) — sin descuento por compromiso", "Hosts Dedicados (Dedicated Hosts) — hardware dedicado con mayor costo"], "correct": [0], "multi": false}, {"id": 163, "text": "Una empresa necesita transferir datos entre un bucket de Amazon S3 y una aplicación local. ¿Quién es responsable de la seguridad de estos datos, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["La empresa — es responsable de la seguridad de sus propios datos y del cifrado en tránsito", "AWS — solo es responsable de la seguridad de su infraestructura global", "El proveedor del firewall", "El socio de AWS Marketplace"], "correct": [0], "multi": false}, {"id": 164, "text": "¿Qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) hace referencia a la capacidad de un sistema para recuperarse de interrupciones de infraestructura o servicio y adquirir dinámicamente recursos de cómputo para satisfacer la demanda?", "options": ["Seguridad (Security) — protege información y sistemas", "Fiabilidad (Reliability) — se recupera de fallas y cumple demandas dinámicamente", "Eficiencia en el rendimiento (Performance Efficiency) — usa recursos de cómputo eficientemente", "Optimización de costos (Cost Optimization) — entrega valor al menor precio"], "correct": [1], "multi": false}, {"id": 165, "text": "Una empresa desea identificar los buckets de Amazon S3 que se comparten con otra cuenta de AWS. ¿Qué servicio o característica de AWS cumplirá con estos requisitos?", "options": ["AWS Lake Formation — crea y gestiona data lakes", "Informe de credenciales de IAM — lista usuarios y estado de credenciales", "Amazon CloudWatch — monitoreo y observabilidad de recursos", "IAM Access Analyzer — identifica recursos (como buckets S3) compartidos con entidades externas"], "correct": [3], "multi": false}, {"id": 166, "text": "¿Qué servicio de AWS permite a los usuarios crear dashboards interactivos de inteligencia de negocios que incluyen perspectivas de Machine Learning?", "options": ["Amazon Athena — consultas SQL sobre datos en S3", "Amazon Kendra — motor de búsqueda empresarial inteligente", "Amazon QuickSight — dashboards de BI con perspectivas de ML e IA", "Amazon Redshift — data warehouse para análisis a gran escala"], "correct": [2], "multi": false}, {"id": 167, "text": "¿Cuál de las siguientes es una propuesta de valor de AWS que describe la capacidad de un usuario de escalar la infraestructura según la demanda?", "options": ["Velocidad de innovación — capacidad de experimentar e implementar nuevas ideas rápidamente", "Elasticidad de recursos — ajusta automáticamente los recursos hacia arriba o hacia abajo según la demanda", "Arquitectura desacoplada — reduce dependencias entre componentes", "Despliegue global — lanza recursos en múltiples regiones del mundo"], "correct": [1], "multi": false}, {"id": 168, "text": "¿Qué acción es una mejor práctica de seguridad para el acceso a datos sensibles almacenados en un bucket de Amazon S3?", "options": ["Habilitar la Replicación entre Regiones de S3 (CRR) en el bucket de S3.", "Usar roles de IAM para las aplicaciones que requieren acceso al bucket de S3 — evita usar credenciales de largo plazo.", "Configurar AWS WAF para prevenir el acceso no autorizado al bucket de S3.", "Configurar Amazon GuardDuty para prevenir el acceso no autorizado al bucket de S3."], "correct": [1], "multi": false}, {"id": 169, "text": "Una empresa desea conocer más sobre los beneficios que ofrece la computación en la nube. La empresa desea entender la ventaja operativa de la agilidad. ¿Cómo proporciona AWS agilidad a los usuarios?", "options": ["La capacidad de garantizar alta disponibilidad desplegando cargas de trabajo en múltiples regiones", "Un modelo de pago por uso para muchos servicios y recursos", "La capacidad de transferir la gestión de infraestructura a la nube de AWS", "La capacidad de aprovisionar y desaprovisionar recursos rápidamente con mínimo esfuerzo"], "correct": [3], "multi": false}, {"id": 170, "text": "Una empresa necesita un portal de usuario central para que los usuarios puedan iniciar sesión en aplicaciones empresariales de terceros que admiten Security Assertion Markup Language (SAML) 2.0. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS Identity and Access Management (IAM) — gestiona identidades y permisos dentro de AWS", "Amazon Cognito — gestiona autenticación de usuarios y permite inicio de sesión con proveedores externos compatibles con SAML", "AWS IAM Identity Center (Single Sign-On) — inicio de sesión único para múltiples cuentas y aplicaciones de AWS", "AWS CLI — interfaz de línea de comandos para interactuar con AWS"], "correct": [1], "multi": false}, {"id": 171, "text": "¿Qué servicio de AWS deben usar los usuarios para conocer la disponibilidad y las operaciones de los servicios de AWS?", "options": ["Amazon EventBridge — bus de eventos sin servidor para automatizar flujos de trabajo", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Control Tower — configura y gobierna entornos multi-cuenta", "AWS Health Dashboard — muestra el estado actual y el historial de eventos de los servicios de AWS"], "correct": [3], "multi": false}, {"id": 172, "text": "¿Qué servicio o herramienta de AWS puede usarse para capturar información sobre el tráfico entrante y saliente en una Amazon VPC?", "options": ["VPC Flow Logs — captura metadatos del tráfico IP en interfaces de red dentro de una VPC", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2", "Servicios de endpoint de VPC — conectividad privada entre VPC y servicios de AWS", "NAT Gateway — permite a instancias en subredes privadas acceder a internet"], "correct": [0], "multi": false}, {"id": 173, "text": "¿De qué es SIEMPRE responsable el cliente en cuanto a gestión, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Licencias de software", "Redes", "Datos del cliente — el cliente siempre es dueño y responsable de sus propios datos", "Claves de cifrado"], "correct": [2], "multi": false}, {"id": 174, "text": "¿Qué servicio de AWS puede usarse para obtener informes de cumplimiento normativo bajo demanda?", "options": ["AWS Secrets Manager — gestiona y rota credenciales de forma segura", "AWS Artifact — portal para descargar informes de cumplimiento y acuerdos de AWS bajo demanda", "AWS Security Hub — centro de seguridad que agrega alertas en formato estandarizado", "AWS Certificate Manager — gestiona certificados SSL/TLS"], "correct": [1], "multi": false}, {"id": 175, "text": "¿Qué servicio de AWS permite a los usuarios verificar si hay vulnerabilidades en instancias de Amazon EC2 usando plantillas de evaluación predefinidas?", "options": ["AWS WAF — firewall de aplicaciones web", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "Amazon Inspector — escanea instancias EC2 y funciones Lambda en busca de vulnerabilidades usando plantillas predefinidas", "AWS Shield — protección contra ataques DDoS"], "correct": [2], "multi": false}, {"id": 176, "text": "Una empresa planea migrar a la nube de AWS. La empresa está recopilando información sobre su infraestructura local y necesita información como el nombre de host, la dirección IP y la dirección MAC. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS DataSync — transfiere datos entre almacenamiento local y AWS", "AWS Application Migration Service — simplifica la migración de aplicaciones a AWS", "AWS Application Discovery Service — descubre y recopila información sobre la infraestructura local para planificar migraciones", "AWS Database Migration Service (DMS) — migra bases de datos a AWS"], "correct": [2], "multi": false}, {"id": 177, "text": "¿Qué acción ayudará a aumentar la seguridad en la nube de AWS?", "options": ["Habilitar el acceso programático para todos los usuarios de IAM.", "Usar usuarios de IAM en lugar de roles de IAM para delegar permisos.", "Rotar las claves de acceso periódicamente — reduce el riesgo si una clave se ve comprometida.", "Usar políticas en línea (inline) en lugar de políticas administradas por el cliente."], "correct": [2], "multi": false}, {"id": 178, "text": "Una empresa está planificando migrar su aplicación a la nube de AWS. ¿Qué herramienta o conjunto de recursos de AWS debe usar la empresa para analizar y evaluar su preparación para la migración?", "options": ["Marco de Adopción de la Nube de AWS (AWS CAF) — evalúa la preparación organizacional y de capacidades para migrar a la nube", "AWS Pricing Calculator — estima costos de servicios AWS antes del despliegue", "Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) — evalúa arquitecturas contra mejores prácticas", "AWS Budgets — configura alertas de presupuesto y costos"], "correct": [0], "multi": false}, {"id": 179, "text": "¿Cuál de las siguientes describe parte de la funcionalidad principal de Amazon S3?", "options": ["Amazon S3 es un servicio de almacenamiento de bloques de alto rendimiento diseñado para su uso con Amazon EC2.", "Amazon S3 es un servicio de almacenamiento de objetos que proporciona alto rendimiento, seguridad, escalabilidad y disponibilidad de datos.", "Amazon S3 es un sistema de archivos completamente gestionado, altamente confiable y escalable accesible a través del protocolo SMB.", "Amazon S3 es un NFS elástico y completamente gestionado para uso con servicios de la nube de AWS y recursos locales."], "correct": [1], "multi": false}, {"id": 180, "text": "¿Qué beneficio de AWS se demuestra mediante los servicios tecnológicos bajo demanda que permiten a las empresas reemplazar gastos fijos iniciales por gastos variables?", "options": ["Alta disponibilidad — funciona con mínimo tiempo de inactividad ante fallas", "Economías de escala — precios más bajos gracias al volumen de uso de AWS", "Precios de pago por uso (pay-as-you-go) — pagas solo por lo que usas, sin compromisos iniciales", "Alcance global — despliega recursos en múltiples regiones del mundo"], "correct": [2], "multi": false}, {"id": 181, "text": "¿Qué servicios o características de AWS permiten a los usuarios conectar redes locales a una VPC? (Seleccione dos.)", "options": ["AWS VPN — conexión segura encriptada entre la red local y la VPC a través de internet", "Elastic Load Balancing — distribuye el tráfico entre múltiples instancias EC2", "AWS Direct Connect — conexión de red dedicada y privada entre instalaciones propias y AWS", "VPC Peering — conecta dos VPCs de forma privada (no conecta redes locales)", "Amazon CloudFront — red de distribución de contenido (CDN)"], "correct": [0, 2], "multi": true}, {"id": 182, "text": "Un usuario necesita desplegar rápidamente una base de datos no relacional en AWS. El usuario no quiere gestionar el hardware subyacente ni el software de la base de datos. ¿Qué servicio de AWS puede usarse para lograr esto?", "options": ["Amazon RDS — base de datos relacional gestionada (no es NoSQL)", "Amazon DynamoDB — base de datos NoSQL completamente gestionada y sin servidor", "Amazon Aurora — base de datos relacional compatible con MySQL y PostgreSQL", "Amazon Redshift — data warehouse para análisis a gran escala"], "correct": [1], "multi": false}, {"id": 183, "text": "¿Cuáles acciones son ejemplos del esfuerzo de una empresa para dimensionar correctamente (rightsize) sus recursos de AWS y controlar los costos de la nube? (Seleccione dos.)", "options": ["Cambiar de Amazon RDS a Amazon DynamoDB para acomodar conjuntos de datos NoSQL.", "Basar la selección de tipos de instancias de Amazon EC2 en patrones de utilización pasados — ajusta el tamaño según el uso real.", "Usar políticas de ciclo de vida de Amazon S3 para mover objetos de acceso infrecuente a niveles de almacenamiento de menor costo.", "Usar despliegues Multi-AZ para Amazon RDS.", "Reemplazar instancias existentes de Amazon EC2 con AWS Elastic Beanstalk."], "correct": [1, 2], "multi": true}, {"id": 184, "text": "¿Qué servicio o característica de AWS puede usar una empresa para aplicar reglas de seguridad a instancias específicas de Amazon EC2?", "options": ["ACLs de red (Network ACLs) — reglas de seguridad a nivel de subred, no de instancia individual", "Grupos de seguridad (Security groups) — reglas de firewall aplicadas directamente a instancias EC2 específicas", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS WAF — firewall de aplicaciones web"], "correct": [1], "multi": false}, {"id": 185, "text": "¿Cuáles principios de diseño respaldan el pilar de fiabilidad (Reliability) del Marco de Buena Arquitectura de AWS? (Seleccione dos.)", "options": ["Realizar operaciones como código.", "Habilitar la trazabilidad.", "Escalar automáticamente para satisfacer la demanda — ajusta la capacidad según los cambios en la carga.", "Desplegar recursos globalmente para mejorar el tiempo de respuesta.", "Recuperarse automáticamente de las fallas — detecta fallas y activa la recuperación automáticamente."], "correct": [2, 4], "multi": true}, {"id": 186, "text": "Una empresa que usa AWS necesita transferir 2 TB de datos. ¿Qué tipo de transferencia de datos no tendrá ningún costo para la empresa?", "options": ["Transferencia de datos entrante desde internet — AWS no cobra por los datos que entran a la nube de AWS", "Transferencia de datos saliente hacia internet — AWS cobra por los datos que salen a internet", "Transferencia de datos entre regiones de AWS — AWS cobra por las transferencias entre regiones", "Transferencia de datos entre Zonas de Disponibilidad — AWS puede cobrar por estas transferencias"], "correct": [0], "multi": false}, {"id": 187, "text": "Una empresa desea crear plantillas que pueda reutilizar para desplegar múltiples recursos de AWS. ¿Qué servicio o característica de AWS puede usar la empresa para cumplir con este requisito?", "options": ["AWS Marketplace — tienda de software de terceros para AWS", "Amazon Machine Image (AMI) — plantilla del estado de una instancia EC2", "AWS CloudFormation — infraestructura como código (IaC) para crear plantillas reutilizables de recursos AWS", "AWS OpsWorks — gestión de configuración con Chef/Puppet"], "correct": [2], "multi": false}, {"id": 188, "text": "Una empresa está construyendo una aplicación que requiere la capacidad de enviar, almacenar y recibir mensajes entre componentes de la aplicación. La empresa tiene otro requisito de procesar mensajes en orden de entrada y salida (FIFO). ¿Qué servicio de AWS debe usar la empresa?", "options": ["AWS Step Functions — orquesta flujos de trabajo sin servidor", "Amazon SNS (Simple Notification Service) — mensajería pub/sub, no garantiza orden FIFO", "Amazon Kinesis Data Streams — procesamiento de datos en streaming en tiempo real", "Amazon SQS (Simple Queue Service) — cola de mensajes con soporte para colas FIFO que garantizan el orden de procesamiento"], "correct": [3], "multi": false}, {"id": 189, "text": "¿Qué servicio o característica de AWS es un servicio basado en navegador y preauthenticado que puede lanzarse directamente desde la Consola de Administración de AWS?", "options": ["AWS API — interfaz de programación para interactuar con servicios AWS", "Amazon Lightsail — plataforma simplificada para desplegar apps y sitios web", "AWS Cloud9 — entorno de desarrollo integrado (IDE) basado en la nube", "AWS CloudShell — terminal de línea de comandos en el navegador, precargada con AWS CLI y credenciales"], "correct": [3], "multi": false}, {"id": 190, "text": "Una empresa desea migrar su base de datos a un servicio de AWS gestionado que sea compatible con PostgreSQL. ¿Qué servicios de AWS cumplirán con estos requisitos? (Seleccione dos.)", "options": ["Amazon Athena — consultas SQL sobre datos en S3 (no es base de datos PostgreSQL)", "Amazon RDS — base de datos relacional gestionada compatible con PostgreSQL", "Amazon EC2 — instancias virtuales (requiere gestionar el motor de base de datos manualmente)", "Amazon DynamoDB — base de datos NoSQL (no compatible con PostgreSQL)", "Amazon Aurora — base de datos de alto rendimiento compatible con PostgreSQL (hasta 5x más rápida)"], "correct": [1, 4], "multi": true}, {"id": 191, "text": "Una empresa tiene una flota de barcos de carga. Los barcos tienen sensores que recopilan datos en el mar, donde la conectividad a internet es intermitente o nula. La empresa necesita recopilar, formatear y procesar los datos en el mar y mover los datos a AWS más tarde. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS IoT Core — conecta dispositivos IoT a la nube de AWS (requiere conectividad a internet)", "Amazon Lightsail — plataforma simplificada para apps y sitios web", "AWS Storage Gateway — conecta almacenamiento local con la nube de AWS", "AWS Snowball Edge — dispositivo físico con capacidad de cómputo y almacenamiento, funciona sin conectividad a internet"], "correct": [3], "multi": false}, {"id": 192, "text": "Una empresa aloja una aplicación en múltiples instancias de Amazon EC2. La aplicación usa Amazon SNS para enviar mensajes. ¿Qué servicio o característica de AWS dará a la aplicación permiso para acceder a los servicios de AWS necesarios?", "options": ["AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS", "Roles de IAM — otorgan permisos temporales y seguros a instancias EC2 para acceder a otros servicios de AWS", "AWS Security Hub — centro de seguridad unificado", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [1], "multi": false}, {"id": 193, "text": "Un usuario tiene conocimientos limitados de servicios de AWS, pero desea desplegar rápidamente una aplicación Node.js escalable en la nube de AWS. ¿Qué servicio debe usarse para desplegar la aplicación?", "options": ["AWS CloudFormation — infraestructura como código, requiere conocimiento de plantillas", "AWS Elastic Beanstalk — despliega aplicaciones automáticamente sin necesidad de gestionar infraestructura, ideal para desarrolladores", "Amazon EC2 — instancias virtuales que requieren configuración manual", "AWS OpsWorks — gestión de configuración con Chef/Puppet, requiere conocimiento avanzado"], "correct": [1], "multi": false}, {"id": 194, "text": "Una empresa necesita una red de entrega de contenido que proporcione entrega segura de datos, videos, aplicaciones y APIs a usuarios globalmente con baja latencia y altas velocidades de transferencia. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon CloudFront — red de distribución de contenido (CDN) global con baja latencia y alta velocidad de transferencia", "Elastic Load Balancing — distribuye el tráfico entre múltiples instancias EC2", "Amazon S3 — almacenamiento de objetos escalable", "Amazon Elastic Transcoder — convierte archivos de video en la nube"], "correct": [0], "multi": false}, {"id": 195, "text": "Una empresa necesita usar software de terceros para su carga de trabajo en AWS. ¿Qué servicio o característica de AWS puede usar la empresa para adquirir el software?", "options": ["AWS Resource Access Manager — comparte recursos de AWS entre cuentas", "AWS Managed Services — operaciones gestionadas para entornos AWS", "AWS License Manager — gestiona licencias de software", "AWS Marketplace — tienda en línea con miles de soluciones de software de terceros listas para usar en AWS"], "correct": [3], "multi": false}], [{"id": 196, "text": "Una empresa necesita almacenamiento de archivos completamente gestionado, altamente confiable y escalable que sea accesible a través del protocolo Server Message Block (SMB). ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon S3 — almacenamiento de objetos (no compatible con protocolo SMB)", "Amazon EFS — sistema de archivos compatible con NFS (no SMB)", "Amazon FSx for Windows File Server — sistema de archivos Windows gestionado compatible con SMB y NTFS", "Amazon EBS — almacenamiento de bloques para instancias EC2 (no accesible por protocolo SMB)"], "correct": [2], "multi": false}, {"id": 197, "text": "Una empresa necesita configurar y gestionar centralmente los grupos de seguridad de Amazon VPC en múltiples cuentas de AWS dentro de una organización en AWS Organizations. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Firewall Manager — gestión centralizada de reglas de firewall, WAF y grupos de seguridad en múltiples cuentas", "Amazon GuardDuty — detecta amenazas y actividad maliciosa", "Amazon Detective — investiga incidentes de seguridad", "AWS WAF — firewall de aplicaciones web"], "correct": [0], "multi": false}, {"id": 198, "text": "¿Cuál tarea es responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Configurar la gestión de identidades y accesos para las aplicaciones.", "Gestionar las opciones de cifrado para los datos almacenados en AWS.", "Configurar los grupos de seguridad para las instancias de Amazon EC2.", "Mantener el hardware físico de la infraestructura — AWS es responsable de toda la infraestructura física subyacente."], "correct": [3], "multi": false}, {"id": 199, "text": "Una empresa tiene una instancia de Amazon EC2 en una subred privada. La empresa desea iniciar una conexión a internet para descargar actualizaciones del sistema operativo, sin permitir que el tráfico de internet acceda a la instancia EC2. ¿Qué servicio gestionado de AWS lo permite?", "options": ["Endpoint de VPC — conectividad privada entre VPC y servicios de AWS sin pasar por internet", "NAT Gateway — permite que instancias en subredes privadas accedan a internet, sin exposición entrante", "Amazon PrivateLink — conectividad privada entre servicios de AWS y redes locales", "VPC Peering — conecta dos VPCs de forma privada"], "correct": [1], "multi": false}, {"id": 200, "text": "¿Cuáles acciones son responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Asegurar la capa de virtualización — AWS gestiona y protege el hipervisor", "Aplicar parches al sistema operativo en instancias de Amazon EC2", "Aplicar una política de contraseñas estricta para usuarios de IAM", "Aplicar parches al sistema operativo en instancias de Amazon RDS — AWS gestiona el motor de base de datos gestionada", "Configurar grupos de seguridad y ACLs de red"], "correct": [0, 3], "multi": true}, {"id": 201, "text": "Una empresa almacena datos que no se accederán con frecuencia en la nube de AWS. Si la empresa necesita acceder a los datos, deben recuperarse en un plazo de 12 horas. La empresa quiere una solución rentable en cuanto a costos de almacenamiento por gigabyte. ¿Qué clase de almacenamiento de Amazon S3 cumplirá con estos requisitos?", "options": ["S3 Standard — acceso frecuente, mayor costo por almacenamiento", "S3 Glacier Flexible Retrieval — archivado con recuperación entre 1 y 12 horas, bajo costo por almacenamiento", "S3 One Zone-IA — acceso infrecuente en una sola Zona de Disponibilidad, sin redundancia multi-AZ", "S3 Standard-IA — acceso infrecuente con redundancia multi-AZ, mayor costo que Glacier"], "correct": [1], "multi": false}, {"id": 202, "text": "¿Qué servicio o recurso de AWS puede usarse para identificar los servicios que ha utilizado un usuario dentro de un rango de fechas específico?", "options": ["Listas de control de acceso de Amazon S3 (ACLs) — controla el acceso a objetos y buckets", "AWS Certificate Manager (ACM) — gestiona certificados SSL/TLS", "Network Access Analyzer — analiza el acceso a la red", "AWS IAM Access Analyzer — identifica recursos compartidos y accesos de los usuarios a servicios de AWS"], "correct": [3], "multi": false}, {"id": 203, "text": "Una empresa necesita contratar consultores externos para ayudar a mantener y dar soporte a su entorno de AWS y las necesidades de negocio de la empresa. ¿Qué servicio o recurso de AWS cumplirá con estos requisitos?", "options": ["AWS Support — planes de soporte técnico de AWS", "AWS Organizations — gestiona múltiples cuentas de AWS", "AWS Service Catalog — catálogo de servicios de TI aprobados", "AWS Partner Network (APN) — red de socios certificados de AWS que ofrecen servicios de consultoría y soporte"], "correct": [3], "multi": false}, {"id": 204, "text": "Una empresa desea crear dashboards de Amazon QuickSight cada semana usando sus datos de facturación. ¿Qué característica o herramienta de AWS puede usar la empresa para cumplir con estos requisitos?", "options": ["AWS Budgets — alertas de presupuesto y costos", "AWS Cost Explorer — analiza y visualiza costos históricos", "AWS Cost and Usage Report — reporte detallado de costos y uso que puede usarse como fuente de datos para QuickSight", "AWS Cost Anomaly Detection — detecta anomalías en el gasto de AWS"], "correct": [2], "multi": false}, {"id": 205, "text": "Una empresa planea mover sus respaldos de datos a la nube de AWS. La empresa necesita reemplazar el almacenamiento local con almacenamiento basado en la nube pero con caché local. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["AWS Storage Gateway — conecta almacenamiento local con la nube de AWS, con caché local para acceso rápido", "AWS Snowcone — dispositivo compacto para recopilar y transferir datos a AWS", "AWS Backup — servicio centralizado de respaldo para recursos de AWS", "Amazon EFS — sistema de archivos compartido en la nube"], "correct": [0], "multi": false}, {"id": 206, "text": "Una empresa necesita organizar sus recursos y hacer seguimiento de los costos de AWS a un nivel detallado. La empresa necesita categorizar los costos por departamento de negocio, entorno y aplicación. ¿Qué solución cumplirá con estos requisitos?", "options": ["Acceder a la consola de AWS Cost Management para organizar recursos, establecer un presupuesto de AWS y recibir notificaciones de uso no intencional.", "Usar etiquetas (tags) para organizar los recursos. Activar etiquetas de asignación de costos para hacer seguimiento de los costos de AWS a un nivel detallado.", "Crear dashboards de Amazon CloudWatch para organizar y hacer seguimiento de los costos individualmente.", "Acceder al dashboard de AWS Billing and Cost Management para organizar y hacer seguimiento del consumo de recursos a un nivel detallado."], "correct": [1], "multi": false}, {"id": 207, "text": "Una empresa necesita planificar, programar y ejecutar cientos de miles de trabajos de cómputo en AWS. ¿Qué servicio de AWS puede usar la empresa para cumplir con este requisito?", "options": ["AWS Step Functions — orquesta flujos de trabajo sin servidor", "AWS Service Catalog — catálogo de servicios de TI aprobados", "Amazon SQS — cola de mensajes gestionada", "AWS Batch — ejecuta trabajos de procesamiento por lotes a cualquier escala de forma gestionada"], "correct": [3], "multi": false}, {"id": 208, "text": "¿Qué servicios o características de AWS proporcionan alta disponibilidad y baja latencia al habilitar la conmutación por error entre diferentes regiones de AWS? (Seleccione dos.)", "options": ["Amazon Route 53 — enrutamiento de DNS con políticas de conmutación por error entre regiones", "Network Load Balancer — distribuye tráfico dentro de una región (no entre regiones)", "Amazon S3 Transfer Acceleration — acelera transferencias a S3 usando ubicaciones de borde", "AWS Global Accelerator — enruta tráfico por la red global de AWS para menor latencia entre regiones", "Application Load Balancer — distribuye tráfico HTTP/HTTPS dentro de una región"], "correct": [0, 3], "multi": true}, {"id": 209, "text": "¿Cuál de las siguientes es una forma de usar grupos de Auto Scaling de Amazon EC2 para escalar la capacidad en la nube de AWS?", "options": ["Escalar el número de instancias EC2 hacia adentro o hacia afuera automáticamente, según la demanda.", "Usar instancias EC2 sin servidor.", "Escalar el tamaño de las instancias EC2 hacia arriba o hacia abajo automáticamente, según la demanda.", "Transferir recursos de CPU no usados entre instancias EC2."], "correct": [0], "multi": false}, {"id": 210, "text": "¿Cuáles capacidades son beneficios de la nube de AWS? (Seleccione dos.)", "options": ["Intercambiar gastos variables por gastos de capital.", "Despliegue global en minutos — lanzar recursos en cualquier región del mundo rápidamente.", "Planificar la capacidad con anticipación a los despliegues.", "Aprovechar las economías de escala — AWS comparte los ahorros de costos de su enorme escala con los clientes.", "Reducir las dependencias en la conectividad de red."], "correct": [1, 3], "multi": true}, {"id": 211, "text": "¿Qué servicio de seguridad de AWS protege las aplicaciones de ataques de denegación de servicio distribuido (DDoS) con detección permanente y mitigaciones automáticas en línea?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2", "AWS WAF (Web Application Firewall) — filtra tráfico malicioso en aplicaciones web", "Elastic Load Balancing (ELB) — distribuye el tráfico entre múltiples instancias", "AWS Shield — protección administrada contra ataques DDoS con detección automática y mitigación"], "correct": [3], "multi": false}, {"id": 212, "text": "¿Qué servicio de AWS permite a los usuarios modelar y aprovisionar recursos de AWS usando lenguajes de programación comunes?", "options": ["AWS CloudFormation — infraestructura como código usando plantillas YAML/JSON", "AWS CodePipeline — automatiza pipelines de CI/CD", "AWS Cloud Development Kit (AWS CDK) — define infraestructura con lenguajes de programación como Python, TypeScript, Java y .NET", "AWS Systems Manager — gestiona y opera infraestructura de AWS"], "correct": [2], "multi": false}, {"id": 213, "text": "¿Qué modelo de precios de Amazon EC2 puede proporcionar descuentos de hasta el 90%?", "options": ["Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso", "Bajo Demanda (On-Demand) — sin descuento, pago por hora", "Hosts Dedicados (Dedicated Hosts) — servidor físico exclusivo con mayor costo", "Instancias Spot — descuentos de hasta 90% sobre el precio Bajo Demanda, pueden interrumpirse"], "correct": [3], "multi": false}, {"id": 214, "text": "¿Cuál de las siguientes actúa como firewall a nivel de instancia para controlar el acceso entrante y saliente?", "options": ["Lista de control de acceso de red (Network ACL) — firewall a nivel de subred, no de instancia individual", "Grupos de seguridad (Security groups) — firewall a nivel de instancia que controla tráfico entrante y saliente", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "Puertas de enlace privadas virtuales (Virtual private gateways) — conectan VPCs con redes locales"], "correct": [1], "multi": false}, {"id": 215, "text": "Una empresa debe poder desarrollar, probar y lanzar una aplicación en la nube de AWS rápidamente. ¿Qué ventaja de la computación en la nube cumplirá con estos requisitos?", "options": ["Dejar de adivinar la capacidad — aprovisiona exactamente lo que necesitas", "Intercambiar gasto fijo por gasto variable — paga solo por lo que usas", "Lograr economías de escala — beneficiarse de los costos reducidos de AWS", "Aumentar la velocidad y la agilidad — experimenta y lanza más rápido gracias a recursos disponibles al instante"], "correct": [3], "multi": false}, {"id": 216, "text": "Una empresa tiene equipos con diferentes roles y responsabilidades. Los empleados de la empresa frecuentemente cambian de equipo. La empresa necesita gestionar los permisos de los empleados para que sean apropiados para las responsabilidades del trabajo. ¿Qué recurso de IAM debe usar la empresa para cumplir con este requisito con la MENOR sobrecarga operativa?", "options": ["Grupos de usuarios de IAM — agrupa usuarios con permisos comunes (requiere actualizar membresías al cambiar de equipo)", "Roles de IAM — los empleados asumen el rol correspondiente a su equipo actual sin necesidad de actualizar permisos individuales", "Perfiles de instancia de IAM — asigna roles a instancias EC2", "Políticas de IAM para usuarios individuales — mayor sobrecarga de administración"], "correct": [1], "multi": false}, {"id": 217, "text": "¿Qué servicio de AWS puede usar una empresa para almacenar y cifrar contraseñas de forma segura para una base de datos?", "options": ["AWS Shield — protección contra ataques DDoS", "AWS Secrets Manager — almacena, cifra y rota contraseñas y credenciales de bases de datos de forma segura", "AWS Identity and Access Management (IAM) — gestiona identidades y permisos (no almacena contraseñas de bases de datos)", "Amazon Cognito — gestiona autenticación de usuarios para aplicaciones"], "correct": [1], "multi": false}, {"id": 218, "text": "¿Qué puede usar un profesional de la nube para recuperar documentos de seguridad y cumplimiento de AWS y presentarlos como evidencia a un auditor o regulador?", "options": ["AWS Certificate Manager — gestiona certificados SSL/TLS", "AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS Artifact — portal de autoservicio para descargar informes de cumplimiento y acuerdos de AWS", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2"], "correct": [2], "multi": false}, {"id": 219, "text": "¿Qué tipos de cifrado pueden usarse para proteger objetos en reposo en Amazon S3? (Seleccione dos.)", "options": ["Cifrado del lado del servidor con claves administradas por Amazon S3 (SSE-S3) — AWS gestiona las claves de cifrado automáticamente", "Cifrado del lado del servidor con claves administradas por AWS KMS (SSE-KMS) — control adicional sobre las claves de cifrado", "TLS — protocolo de cifrado en tránsito (no en reposo)", "SSL — protocolo de cifrado en tránsito (no en reposo)", "Cifrado de Datos Transparente (TDE) — usado en bases de datos como SQL Server, no en S3"], "correct": [0, 1], "multi": true}, {"id": 220, "text": "Una empresa desea integrar su sitio web de compras en línea con credenciales de inicio de sesión de redes sociales. ¿Qué servicio de AWS puede usar la empresa para realizar esta integración?", "options": ["AWS Directory Service — conecta recursos de AWS con Microsoft Active Directory", "AWS Identity and Access Management (IAM) — gestiona identidades y permisos dentro de AWS", "Amazon Cognito — gestiona autenticación de usuarios y permite inicio de sesión con redes sociales (Google, Facebook, etc.)", "AWS IAM Identity Center — inicio de sesión único para múltiples cuentas y aplicaciones de AWS"], "correct": [2], "multi": false}, {"id": 221, "text": "¿Qué servicio de AWS se usa para rastrear, registrar y auditar los cambios de configuración realizados en los recursos de AWS?", "options": ["AWS Shield — protección contra ataques DDoS", "AWS Config — rastrea, registra y evalúa los cambios de configuración de recursos de AWS", "AWS IAM — gestiona identidades y permisos", "Amazon Inspector — detecta vulnerabilidades en aplicaciones e instancias EC2"], "correct": [1], "multi": false}, {"id": 222, "text": "Un cliente ejecuta una instancia Amazon Linux EC2 Bajo Demanda durante 3 horas, 5 minutos y 6 segundos. ¿Por cuánto tiempo se facturará al cliente?", "options": ["3 horas, 5 minutos", "3 horas, 5 minutos y 6 segundos — Amazon EC2 factura por segundo (mínimo 60 segundos)", "3 horas, 6 minutos", "4 horas"], "correct": [1], "multi": false}, {"id": 223, "text": "El sitio web de una empresa está experimentando ataques DDoS. ¿Qué servicio de AWS puede ayudar a proteger el sitio web de la empresa contra estos ataques?", "options": ["AWS Resource Access Manager — comparte recursos de AWS entre cuentas", "AWS Amplify — plataforma para desarrollar aplicaciones web y móviles", "AWS Shield — protección administrada contra ataques DDoS con detección automática y mitigación", "Amazon GuardDuty — detecta amenazas y actividad maliciosa en cuentas de AWS"], "correct": [2], "multi": false}, {"id": 224, "text": "Una empresa desea una evaluación personalizada de su entorno local actual. La empresa desea comprender sus costos de ejecución proyectados en la nube de AWS. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento para entornos AWS", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS Control Tower — configura y gobierna entornos multi-cuenta", "Migration Evaluator — evalúa el entorno local actual y proyecta los costos de ejecutar esas cargas de trabajo en AWS"], "correct": [3], "multi": false}, {"id": 225, "text": "Una empresa con múltiples unidades de negocio desea gestionar y gobernar centralmente sus entornos de la nube de AWS. La empresa desea automatizar la creación de cuentas de AWS, aplicar políticas de control de servicios (SCPs) y simplificar los procesos de facturación. ¿Qué servicio o herramienta de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["AWS Organizations — gestiona múltiples cuentas, aplica SCPs y consolida la facturación", "Cost Explorer — analiza y visualiza costos de AWS", "AWS Budgets — configura alertas de presupuesto y costos", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento"], "correct": [0], "multi": false}, {"id": 226, "text": "Una empresa aloja una aplicación en la nube de AWS. La empresa desea verificar que los servicios subyacentes de AWS y la infraestructura general de AWS operan con normalidad. ¿Qué combinación de servicios de AWS puede usar la empresa para recopilar la información requerida? (Seleccione dos.)", "options": ["AWS Personal Health Dashboard — muestra eventos de AWS que afectan específicamente a los recursos de la empresa", "AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS Trusted Advisor — recomendaciones de seguridad, costos y rendimiento", "AWS Service Health Dashboard — muestra el estado general y el historial de todos los servicios de AWS por región", "AWS Service Catalog — catálogo de servicios de TI aprobados"], "correct": [0, 3], "multi": true}, {"id": 227, "text": "Una empresa necesita migrar una base de datos PostgreSQL desde instalaciones propias a Amazon RDS. ¿Qué servicio o herramienta de AWS debe usar la empresa para cumplir con este requisito?", "options": ["Cloud Adoption Readiness Tool — evalúa la preparación de la empresa para migrar a la nube", "AWS Migration Hub — rastrea el progreso de migraciones de aplicaciones a AWS", "AWS Database Migration Service (DMS) — migra bases de datos a AWS con mínima interrupción", "AWS Application Migration Service — migra aplicaciones completas a AWS"], "correct": [2], "multi": false}, {"id": 228, "text": "¿Qué concepto de la nube se demuestra mediante el uso de AWS Compute Optimizer?", "options": ["Validación de seguridad — verifica configuraciones de seguridad", "Dimensionamiento correcto (Rightsizing) — recomienda el tamaño óptimo de recursos para reducir costos", "Elasticidad — ajusta recursos automáticamente según la demanda", "Alcance global — despliega recursos en múltiples regiones del mundo"], "correct": [1], "multi": false}, {"id": 229, "text": "Una empresa aloja una gran cantidad de datos en AWS. La empresa desea identificar si alguno de los datos debe considerarse sensible. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones (no clasifica datos sensibles)", "Amazon Macie — usa ML para descubrir y clasificar automáticamente datos sensibles en Amazon S3", "AWS Identity and Access Management (IAM) — gestiona identidades y permisos", "Amazon CloudWatch — monitoreo y observabilidad de recursos AWS"], "correct": [1], "multi": false}, {"id": 230, "text": "Un usuario tiene una carga de trabajo con estado (stateful) que se ejecutará en Amazon EC2 durante los próximos 3 años. ¿Cuál es el modelo de precios MÁS rentable para esta carga de trabajo?", "options": ["Instancias Bajo Demanda (On-Demand) — sin descuento, pago por hora", "Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso de 1 o 3 años para uso continuo", "Instancias Dedicadas (Dedicated Instances) — hardware dedicado con mayor costo", "Instancias Spot — pueden interrumpirse (no adecuado para cargas de trabajo con estado)"], "correct": [1], "multi": false}, {"id": 231, "text": "¿Quién habilita el cifrado de datos en reposo para Amazon Elastic Block Store (Amazon EBS)?", "options": ["AWS Support — soporte técnico de AWS", "Los clientes de AWS — el cliente habilita el cifrado de EBS en la configuración del volumen", "AWS Key Management Service (KMS) — provee las claves de cifrado pero el cliente debe habilitarlo", "AWS Trusted Advisor — recomendaciones de seguridad"], "correct": [1], "multi": false}, {"id": 232, "text": "¿Qué puede lograr un usuario con AWS CloudTrail?", "options": ["Generar un informe de credenciales de usuarios de IAM.", "Registrar las llamadas a la API realizadas a los servicios de AWS — quién hizo qué, cuándo y desde dónde.", "Evaluar el cumplimiento de las configuraciones de recursos de AWS con políticas y directrices.", "Garantizar que las instancias de Amazon EC2 tengan instalados los últimos parches de seguridad."], "correct": [1], "multi": false}, {"id": 233, "text": "Una empresa planea alojar sus cargas de trabajo en AWS. ¿Qué servicio de AWS requiere que la empresa actualice y aplique parches al sistema operativo invitado?", "options": ["Amazon DynamoDB — base de datos NoSQL completamente gestionada (AWS gestiona todo)", "Amazon S3 — almacenamiento de objetos completamente gestionado", "Amazon EC2 — instancias virtuales donde el cliente es responsable del sistema operativo invitado", "Amazon Aurora — base de datos relacional completamente gestionada (AWS gestiona el motor)"], "correct": [2], "multi": false}, {"id": 234, "text": "¿Qué servicio o característica de AWS buscará e identificará recursos de AWS que se comparten externamente?", "options": ["Amazon OpenSearch Service — motor de búsqueda y análisis gestionado", "AWS Control Tower — configura y gobierna entornos multi-cuenta", "AWS IAM Access Analyzer — identifica recursos (buckets S3, roles IAM, etc.) compartidos con entidades externas", "AWS Fargate — ejecuta contenedores sin gestionar servidores"], "correct": [2], "multi": false}, {"id": 235, "text": "Una empresa está migrando sus cargas de trabajo a la nube de AWS. La empresa debe mantener control total de la gestión de parches para los sistemas operativos invitados que alojan sus aplicaciones. ¿Qué servicio de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Amazon DynamoDB — base de datos NoSQL completamente gestionada (AWS gestiona el SO)", "Amazon EC2 — instancias virtuales donde el cliente tiene control total del sistema operativo invitado", "AWS Lambda — funciones sin servidor (AWS gestiona la infraestructura subyacente)", "Amazon RDS — base de datos relacional gestionada (AWS gestiona el sistema operativo)"], "correct": [1], "multi": false}, {"id": 236, "text": "¿En qué nivel de soporte los usuarios reciben acceso a un conserje de soporte (support concierge)?", "options": ["Soporte Básico (Basic Support) — gratuito, sin acceso a ingenieros", "Soporte para Desarrolladores (Developer Support) — acceso por email a ingenieros de soporte", "Soporte Empresarial (Business Support) — acceso 24/7 a ingenieros de soporte", "Soporte Enterprise (Enterprise Support) — incluye conserje de soporte y Technical Account Manager (TAM)"], "correct": [3], "multi": false}, {"id": 237, "text": "¿Qué servicio de AWS puede usar una empresa para diseñar y construir visualmente aplicaciones sin servidor?", "options": ["AWS Lambda — ejecuta funciones sin servidor (no tiene diseñador visual de aplicaciones)", "AWS Batch — procesamiento por lotes a gran escala", "AWS Application Composer — diseña y construye aplicaciones sin servidor visualmente con arrastrar y soltar", "AWS App Runner — despliega aplicaciones web sin gestionar infraestructura"], "correct": [2], "multi": false}, {"id": 238, "text": "Una empresa quiere migrar a AWS y usar el mismo software de seguridad que usa en sus instalaciones propias. El proveedor del software de seguridad ofrece su software como servicio en AWS. ¿Dónde puede comprar la empresa la solución de seguridad?", "options": ["AWS Partner Solutions Finder — directorio de socios de AWS", "AWS Support Center — centro de soporte técnico de AWS", "AWS Management Console — interfaz web para gestionar servicios de AWS", "AWS Marketplace — tienda con miles de soluciones de software de terceros, incluyendo seguridad, disponibles en AWS"], "correct": [3], "multi": false}, {"id": 239, "text": "Una empresa ha desplegado una instancia de Amazon EC2. ¿Cuál de las siguientes opciones es responsabilidad de AWS bajo el Modelo de Responsabilidad Compartida de AWS?", "options": ["Gestionar y cifrar los datos de la aplicación", "Instalar actualizaciones y parches de seguridad del sistema operativo invitado", "Configuración de los dispositivos de infraestructura — AWS es responsable de routers, switches y demás infraestructura física", "Configuración de los grupos de seguridad en cada instancia"], "correct": [2], "multi": false}, {"id": 240, "text": "Una empresa desea migrar su base de datos PostgreSQL a AWS. La empresa no usa la base de datos con frecuencia. ¿Qué servicio o recurso de AWS cumplirá con estos requisitos con la MENOR sobrecarga de administración?", "options": ["PostgreSQL en Amazon EC2 — requiere gestionar el SO, la base de datos y los parches manualmente", "Amazon RDS for PostgreSQL — base de datos gestionada (requiere aprovisionar capacidad)", "Amazon Aurora PostgreSQL — alta disponibilidad y rendimiento (requiere capacidad aprovisionada)", "Amazon Aurora Serverless — escala automáticamente hacia cero cuando no se usa, ideal para bases de datos de uso infrecuente"], "correct": [3], "multi": false}, {"id": 241, "text": "Una empresa usa Amazon DynamoDB para su base de datos de aplicaciones. ¿Cuáles tareas son responsabilidad de AWS, de acuerdo con el Modelo de Responsabilidad Compartida de AWS? (Seleccione dos.)", "options": ["Clasificar los datos.", "Configurar los permisos de acceso.", "Gestionar las opciones de cifrado.", "Proporcionar endpoints públicos para almacenar y recuperar datos — AWS gestiona la infraestructura de endpoints de DynamoDB.", "Gestionar la capa de infraestructura y el sistema operativo — AWS gestiona toda la infraestructura subyacente de DynamoDB."], "correct": [3, 4], "multi": true}, {"id": 242, "text": "Una empresa desea crear una plataforma de comercio electrónico globalmente accesible para sus clientes. La empresa desea usar un servicio web de DNS altamente disponible y escalable para conectar a los usuarios a la plataforma. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["Amazon EC2 — instancias virtuales para alojar aplicaciones", "Amazon VPC — red virtual privada en AWS", "Amazon Route 53 — servicio de DNS escalable y altamente disponible con enrutamiento global", "Amazon RDS — base de datos relacional gestionada"], "correct": [2], "multi": false}, {"id": 243, "text": "¿Cuál tarea de mantenimiento es responsabilidad del cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Conectividad física entre Zonas de Disponibilidad", "Mantenimiento de switches de red", "Actualizaciones de hardware y parches de firmware", "Actualizaciones y parches de seguridad de Amazon EC2 — el cliente es responsable del sistema operativo y las aplicaciones en EC2"], "correct": [3], "multi": false}, {"id": 244, "text": "Una empresa desea mejorar su postura de seguridad revisando la actividad de los usuarios a través de llamadas a la API. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS WAF — firewall de aplicaciones web", "Amazon Detective — investiga y analiza incidentes de seguridad", "Amazon CloudWatch — monitoreo y observabilidad de métricas y logs", "AWS CloudTrail — registra todas las llamadas a la API y la actividad de los usuarios en cuentas de AWS"], "correct": [3], "multi": false}, {"id": 245, "text": "Una empresa está migrando a la nube de AWS y planea ejecutar cargas de trabajo experimentales durante 3 a 6 meses en AWS. ¿Qué modelo de precios cumplirá con estos requisitos?", "options": ["Usar Planes de Ahorro (Savings Plans) por un período de 3 años — compromiso demasiado largo para 3-6 meses.", "Usar Hosts Dedicados (Dedicated Hosts) — hardware dedicado con mayor costo.", "Comprar Instancias Reservadas (Reserved Instances) — compromiso de 1 o 3 años, no rentable para 3-6 meses.", "Usar Instancias Bajo Demanda (On-Demand) — pago por hora sin compromiso, ideal para cargas de trabajo temporales."], "correct": [3], "multi": false}, {"id": 246, "text": "Una empresa con AWS Enterprise Support lanzará una nueva versión de un producto popular en 2 meses. La empresa espera un gran aumento en el tráfico hacia su sitio web alojado en instancias de Amazon EC2. ¿Qué acción debe tomar la empresa para evaluar su preparación para escalar en este lanzamiento?", "options": ["Reemplazar las instancias EC2 con funciones de AWS Lambda.", "Usar el soporte de AWS Infrastructure Event Management (IEM) — disponible para clientes Enterprise, ayuda a planificar y escalar para eventos importantes.", "Enviar una solicitud en AWS Marketplace para monitorear el evento.", "Revisar los informes de cobertura en la consola de AWS Cost Management."], "correct": [1], "multi": false}, {"id": 247, "text": "Una empresa quiere lanzar múltiples cargas de trabajo en AWS. Cada carga de trabajo está relacionada con una unidad de negocio diferente. La empresa quiere separar y hacer seguimiento de los costos de cada unidad de negocio. ¿Qué solución cumplirá con estos requisitos con la MENOR sobrecarga operativa?", "options": ["Usar AWS Organizations y crear una cuenta para cada unidad de negocio — separa completamente los costos y recursos por unidad de negocio.", "Usar una hoja de cálculo para controlar los propietarios y el costo de cada recurso.", "Usar una tabla de Amazon DynamoDB para registrar los costos de cada unidad de negocio.", "Acceder a la consola de AWS Billing para asignar propietarios a los recursos y hacer seguimiento de costos."], "correct": [0], "multi": false}, {"id": 248, "text": "Una empresa quiere un servicio de base de datos de series temporales que facilite el almacenamiento y análisis de billones de eventos por día. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Neptune — base de datos de grafos gestionada", "Amazon Timestream — base de datos de series temporales sin servidor, diseñada para billones de eventos por día", "Amazon Forecast — predicciones de series temporales con ML (no es una base de datos)", "Amazon DocumentDB — base de datos de documentos compatible con MongoDB"], "correct": [1], "multi": false}, {"id": 249, "text": "¿Cuál de las siguientes es una responsabilidad compartida entre AWS y el cliente, de acuerdo con el Modelo de Responsabilidad Compartida de AWS?", "options": ["Gestión de la configuración (Configuration management) — AWS gestiona la infraestructura; el cliente gestiona sus sistemas operativos y aplicaciones", "Controles físicos y ambientales — responsabilidad exclusiva de AWS", "Autenticación de integridad de datos", "Gestión de identidades y accesos"], "correct": [0], "multi": false}, {"id": 250, "text": "Una empresa frecuentemente no usa toda su capacidad actual de Amazon EC2 para ejecutar cargas de trabajo sin estado. La empresa quiere optimizar sus costos de EC2. ¿Qué tipo de instancia EC2 cumplirá con estos requisitos?", "options": ["Instancias Spot — aprovechan la capacidad no utilizada de EC2 con descuentos de hasta 90%, ideales para cargas sin estado tolerantes a interrupciones", "Instancias Dedicadas — hardware dedicado con mayor costo", "Instancias Reservadas — compromiso de 1 o 3 años", "Instancias Bajo Demanda — sin descuento por compromiso"], "correct": [0], "multi": false}, {"id": 251, "text": "Una empresa quiere almacenar datos en Amazon S3. La empresa raramente accede a los datos y los datos pueden regenerarse si es necesario. La empresa quiere almacenar los datos en la clase de almacenamiento más rentable. ¿Qué clase de almacenamiento S3 cumplirá con este requisito?", "options": ["S3 Standard — acceso frecuente, mayor costo", "S3 Intelligent-Tiering — mueve automáticamente objetos según el patrón de acceso", "S3 Standard-IA — acceso infrecuente con redundancia multi-AZ", "S3 One Zone-IA — acceso infrecuente en una sola Zona de Disponibilidad, el costo más bajo cuando no se necesita redundancia multi-AZ"], "correct": [3], "multi": false}, {"id": 252, "text": "Una empresa ha migrado sus cargas de trabajo a AWS. La empresa quiere adoptar AWS a escala y operar de manera más eficiente y segura. ¿Qué servicio o framework de AWS debe usar la empresa para soporte operativo?", "options": ["AWS Support — planes de soporte técnico de AWS", "Marco de Adopción de la Nube de AWS (AWS CAF) — guía para la transformación a la nube", "AWS Managed Services (AMS) — opera el entorno de AWS de la empresa de forma gestionada y eficiente", "Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) — mejores prácticas de arquitectura"], "correct": [2], "multi": false}, {"id": 253, "text": "Una empresa quiere aprovisionar y gestionar su infraestructura de AWS usando los lenguajes de programación comunes TypeScript, Python, Java y .NET. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["AWS CodeBuild — compila y prueba código en la nube", "AWS CloudFormation — infraestructura como código usando plantillas YAML/JSON", "AWS CLI — interfaz de línea de comandos para interactuar con AWS", "AWS Cloud Development Kit (AWS CDK) — define infraestructura con lenguajes de programación como Python, TypeScript, Java y .NET"], "correct": [3], "multi": false}, {"id": 254, "text": "¿Qué modelo de precios de Amazon EC2 proporciona los MAYORES ahorros de costos para un servidor de base de datos siempre activo y con el tamaño correcto que se ejecutará durante 1 año en un proyecto?", "options": ["Instancias Bajo Demanda (On-Demand) — sin descuento por compromiso", "Instancias Reservadas Convertibles — descuento moderado con flexibilidad para cambiar tipo de instancia", "Instancias Spot — pueden interrumpirse (no adecuado para base de datos siempre activa)", "Instancias Reservadas Estándar (Standard Reserved) — mayor descuento (hasta 72%) con compromiso de 1 año para uso continuo"], "correct": [3], "multi": false}, {"id": 255, "text": "Una empresa tiene una biblioteca de cintas físicas para almacenar respaldos de datos. La biblioteca de cintas se está quedando sin espacio. La empresa necesita extender la capacidad de la biblioteca de cintas a la nube de AWS. ¿Qué servicio de AWS debe usar la empresa para cumplir con este requisito?", "options": ["Amazon EFS — sistema de archivos compartido en la nube", "Amazon EBS — almacenamiento de bloques para instancias EC2", "Amazon S3 — almacenamiento de objetos escalable", "AWS Storage Gateway (Tape Gateway) — extiende bibliotecas de cintas físicas hacia la nube, con cintas virtuales en AWS"], "correct": [3], "multi": false}, {"id": 256, "text": "Una empresa usa el nivel gratuito (Free Tier) de AWS para varios servicios de AWS para una aplicación. ¿Qué sucederá si el período de uso del nivel gratuito expira o si el uso de la aplicación supera los límites del nivel gratuito?", "options": ["A la empresa se le cobrarán las tarifas estándar de pago por uso por el uso que supere el nivel gratuito.", "El soporte de AWS contactará a la empresa para establecer cargos de servicio estándar.", "A la empresa se le cobrarán los servicios consumidos durante el período de nivel gratuito, más cargos adicionales por el consumo posterior.", "La cuenta de AWS de la empresa se congelará y puede reiniciarse después de establecer un plan de pago."], "correct": [0], "multi": false}, {"id": 257, "text": "Una empresa desea monitorear el rendimiento de su carga de trabajo. La empresa quiere asegurarse de que los servicios en la nube se entreguen a un nivel que cumpla con sus necesidades de negocio. ¿Qué perspectiva del Marco de Adopción de la Nube de AWS (AWS CAF) cumplirá con estos requisitos?", "options": ["Negocio (Business) — alinea inversiones en la nube con los resultados de negocio", "Gobernanza (Governance) — gestiona riesgos y cumplimiento normativo", "Plataforma (Platform) — arquitectura e ingeniería de la plataforma cloud", "Operaciones (Operations) — monitorea y gestiona el rendimiento de los servicios en la nube"], "correct": [3], "multi": false}, {"id": 258, "text": "Una empresa desea migrar sus aplicaciones a la nube de AWS. La empresa planea identificar y priorizar oportunidades de transformación de negocio y evaluar su preparación para la nube de AWS. ¿Qué servicio o herramienta de AWS debe usar la empresa para cumplir con estos requisitos?", "options": ["Marco de Adopción de la Nube de AWS (AWS CAF) — evalúa la preparación y prioriza oportunidades de transformación", "AWS Managed Services (AMS) — opera el entorno de AWS de forma gestionada", "Marco de Buena Arquitectura de AWS (Well-Architected Framework) — evalúa arquitecturas contra mejores prácticas", "AWS Migration Hub — rastrea el progreso de migraciones de aplicaciones"], "correct": [0], "multi": false}, {"id": 259, "text": "Una empresa necesita un servicio de AWS que proporcione una línea base clara de lo que ejecuta en sus centros de datos locales y el costo proyectado de ejecutar esas cargas de trabajo en la nube de AWS. ¿Qué servicio o herramienta de AWS cumplirá con estos requisitos?", "options": ["AWS Compute Optimizer — recomienda el tamaño óptimo de recursos de cómputo en AWS", "AWS Cost Explorer — analiza y visualiza costos históricos de AWS", "AWS Systems Manager Agent (SSM Agent) — gestiona instancias y recopila inventario", "Migration Evaluator — analiza el entorno local actual y estima los costos proyectados en AWS"], "correct": [3], "multi": false}, {"id": 260, "text": "Una empresa adquirió otra corporación. La empresa ahora tiene dos cuentas de AWS. ¿Qué servicio o herramienta de AWS puede usar la empresa para consolidar la facturación de estas dos cuentas?", "options": ["AWS Systems Manager — gestiona y opera infraestructura de AWS", "AWS Organizations — consolida la facturación de múltiples cuentas de AWS en una sola factura", "AWS License Manager — gestiona licencias de software", "Cost Explorer — analiza y visualiza costos de AWS"], "correct": [1], "multi": false}], [{"id": 261, "text": "Una empresa desea configurar sus cargas de trabajo para que realicen sus funciones previstas y se recuperen rápidamente de los fallos. ¿Qué pilar del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework) se alinea con estos objetivos?", "options": ["Eficiencia en el rendimiento (Performance Efficiency)", "Sostenibilidad (Sustainability)", "Fiabilidad (Reliability) — diseña sistemas para que se recuperen automáticamente de fallos", "Seguridad (Security)"], "correct": [2], "multi": false}, {"id": 262, "text": "¿Cuál de los siguientes es un servicio de AWS gestionado que se usa específicamente para extracción, transformación y carga (ETL) de datos?", "options": ["Amazon Athena — consultas SQL sobre datos en S3 (no ETL gestionado)", "AWS Glue — servicio ETL sin servidor para descubrir, preparar e integrar datos", "Amazon S3 — almacenamiento de objetos escalable", "AWS Snowball Edge — dispositivo físico para migrar datos a AWS"], "correct": [1], "multi": false}, {"id": 263, "text": "Una empresa desea migrar petabytes de datos desde su centro de datos local a AWS. La empresa no quiere usar una conexión a internet para realizar la migración. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS DataSync — transfiere datos por internet de forma automatizada", "Amazon Connect — centro de contacto en la nube", "AWS Snowmobile — camión de datos para migrar decenas de petabytes a AWS sin usar internet", "AWS Direct Connect — conexión de red dedicada (requiere instalación física, no es inmediata)"], "correct": [2], "multi": false}, {"id": 264, "text": "Una empresa desea recibir alertas para monitorear sus costos operativos generales para su infraestructura de nube pública de AWS. ¿Qué oferta de AWS cumplirá con estos requisitos?", "options": ["Amazon EventBridge — bus de eventos sin servidor para automatizar flujos de trabajo", "Compute Savings Plans — descuentos por compromiso de uso de cómputo", "AWS Budgets — configura alertas cuando los costos o el uso superen los umbrales definidos", "Migration Evaluator — evalúa el entorno local y estima costos en AWS"], "correct": [2], "multi": false}, {"id": 265, "text": "¿Cómo ayuda el equipo de Conserje (Concierge) de AWS Enterprise Support a los usuarios?", "options": ["Apoyando el desarrollo de aplicaciones", "Proporcionando orientación de arquitectura", "Respondiendo consultas de facturación y de la cuenta", "Respondiendo preguntas sobre casos de soporte técnico"], "correct": [2], "multi": false}, {"id": 266, "text": "Una empresa desea ejecutar una simulación durante 3 años sin interrupciones. ¿Qué opción de compra de instancias de Amazon EC2 cumplirá con estos requisitos de la forma MÁS rentable?", "options": ["Instancias Spot — pueden interrumpirse (no adecuado para 3 años sin interrupciones)", "Instancias Reservadas (Reserved Instances) — descuento de hasta 72% con compromiso de 1 o 3 años para uso continuo", "Hosts Dedicados (Dedicated Hosts) — hardware dedicado con mayor costo", "Instancias Bajo Demanda (On-Demand) — sin descuento por compromiso"], "correct": [1], "multi": false}, {"id": 267, "text": "¿Qué servicio o recurso de AWS puede proporcionar descuentos en el costo de algunos servicios de AWS a cambio de un compromiso de gasto?", "options": ["Amazon Detective — investiga incidentes de seguridad", "AWS Pricing Calculator — estima costos de AWS antes del despliegue", "Planes de Ahorro (Savings Plans) — descuentos flexibles a cambio de un compromiso de uso", "Soporte Básico (Basic Support) — plan de soporte gratuito"], "correct": [2], "multi": false}, {"id": 268, "text": "¿Cuáles de los siguientes son pilares del Marco de Buena Arquitectura de AWS (AWS Well-Architected Framework)? (Seleccione dos.)", "options": ["Alta disponibilidad — característica, no un pilar del Well-Architected Framework", "Eficiencia en el rendimiento (Performance Efficiency) — pilar del Well-Architected Framework", "Optimización de costos (Cost Optimization) — pilar del Well-Architected Framework", "Despliegue global en minutos — ventaja de AWS, no un pilar", "Desarrollo continuo — práctica de DevOps, no un pilar"], "correct": [1, 2], "multi": true}, {"id": 269, "text": "Una empresa desea usar instancias de Amazon EC2 para proporcionar un sitio web estático a usuarios de todo el mundo. La empresa necesita minimizar la latencia para los usuarios. ¿Qué solución cumple con estos requisitos?", "options": ["Usar instancias EC2 en múltiples ubicaciones de borde.", "Usar instancias EC2 en la misma Zona de Disponibilidad pero en diferentes regiones de AWS.", "Usar Amazon CloudFront con las instancias EC2 configuradas como origen — CloudFront distribuye el contenido desde ubicaciones de borde cercanas a los usuarios.", "Usar instancias EC2 en la misma Zona de Disponibilidad pero en diferentes cuentas de AWS."], "correct": [2], "multi": false}, {"id": 270, "text": "Un equipo de investigadores recopilará datos en ubicaciones remotas de todo el mundo. Muchas ubicaciones no tienen conectividad a internet. El equipo necesita capturar los datos en el campo y transferirlos a la nube de AWS más tarde. ¿Qué servicio de AWS cumplirá con estos requisitos?", "options": ["AWS Outposts — rack de infraestructura AWS en instalaciones propias (requiere conectividad)", "AWS Transfer Family — transfiere archivos con SFTP/FTP (requiere internet)", "AWS Snow Family — dispositivos físicos portátiles para recopilar y transferir datos en campo sin conectividad", "AWS Migration Hub — rastrea migraciones de aplicaciones a AWS"], "correct": [2], "multi": false}, {"id": 271, "text": "¿Cuáles de los siguientes son beneficios que recibe una empresa cuando mueve una carga de trabajo de producción local a AWS? (Seleccione dos.)", "options": ["AWS capacita al personal de la empresa en el uso de todos los servicios de AWS.", "AWS gestiona tod
