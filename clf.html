<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AWS Cloud Practitioner CLF-C02 — Simulacro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0f1923;--navy:#162032;--card:#1c2b3a;--border:#263545;--orange:#FF9900;--green:#22c55e;--red:#ef4444;--text:#e2e8f0;--muted:#7a95b0;--dim:#4a6580;}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.header{background:var(--navy);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.aws-badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1px;flex-shrink:0}
.h-title{font-size:14px;font-weight:700}.h-sub{font-size:11px;color:var(--muted)}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.prog-bar{width:100px;height:5px;background:var(--border);border-radius:3px}
.prog-fill{height:100%;background:var(--orange);border-radius:3px;transition:width .3s}
.score-pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-family:monospace}
.btn-home{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.btn-home:hover{border-color:var(--orange);color:var(--orange)}
.main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.home-hdr{text-align:center;padding:28px 16px 20px}
.home-icon{font-size:48px;margin-bottom:10px}
.home-title{font-size:20px;font-weight:800;margin-bottom:5px}
.home-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.stats-row{display:flex;justify-content:center;gap:18px;margin-bottom:24px}
.stat{text-align:center}
.stat-num{font-size:26px;font-weight:700;color:var(--orange)}
.stat-lbl{font-size:10px;color:var(--muted)}
.modules-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s}
.mod-card:hover{border-color:var(--orange);transform:translateY(-2px)}
.mod-num{font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:4px}
.mod-title{font-size:13px;font-weight:700;margin-bottom:3px}
.mod-count{font-size:11px;color:var(--muted);margin-bottom:7px}
.mod-bar{height:4px;background:var(--border);border-radius:2px}
.mod-fill{height:100%;border-radius:2px;transition:width .3s}
.mod-score{font-size:10px;color:var(--muted);margin-top:4px;font-family:monospace}
.nav-dots{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px}
.dot{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:monospace;transition:all .15s}
.dot.current{border-color:var(--orange);color:var(--orange);background:rgba(255,153,0,0.1)}
.dot.correct{background:rgba(34,197,94,0.15);border-color:var(--green);color:var(--green)}
.dot.wrong{background:rgba(239,68,68,0.15);border-color:var(--red);color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.qhead{background:var(--navy);border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;font-family:monospace}
.multi-hint{background:rgba(255,153,0,0.1);border:1px solid rgba(255,153,0,0.3);color:var(--orange);font-size:10px;padding:2px 7px;border-radius:10px}
.qbody{padding:16px}
.qtext{font-size:13.5px;line-height:1.7;margin-bottom:16px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1.5px solid var(--border);background:var(--navy);font-size:12.5px;line-height:1.5;transition:all .2s}
.opt:hover:not(.disabled){border-color:var(--orange);background:rgba(255,153,0,0.07)}
.opt.selected{border-color:var(--orange);background:rgba(255,153,0,0.1)}
.opt.correct{border-color:var(--green);background:rgba(34,197,94,0.1)}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,0.1)}
.opt.disabled{cursor:default}
.oletter{width:22px;height:22px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:monospace;margin-top:1px}
.opt.correct .oletter{background:var(--green);color:#000}
.opt.wrong .oletter{background:var(--red);color:#fff}
.opt.selected .oletter{background:var(--orange);color:#000}
.feedback{margin-top:10px;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.6;display:none}
.feedback.ok{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:#86efac}
.feedback.bad{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#fca5a5}
.fb-title{font-weight:700;margin-bottom:4px;font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-confirm{background:var(--orange);color:#000}
.btn-next{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-next:hover{border-color:var(--orange);color:var(--orange)}
.results{text-align:center;padding:28px 16px}
.res-pct{font-size:68px;font-weight:800;color:var(--orange)}
.res-lbl{font-size:12px;color:var(--muted);margin-bottom:20px}
.res-title{font-size:20px;font-weight:700;margin-bottom:5px}
.res-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.res-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.res-num{font-size:26px;font-weight:700}
.res-sl{font-size:10px;color:var(--muted);margin-top:2px}
.res-ok .res-num{color:var(--green)}.res-bad .res-num{color:var(--red)}.res-tot .res-num{color:var(--orange)}
.btn-retry{background:var(--orange);color:#000;border:none;padding:11px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:6px}
.btn-back{background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 22px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.stb{position:fixed;bottom:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--orange);color:#000;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,153,0,0.3);z-index:200;opacity:0;transition:all .2s}
.stb.vis{opacity:1}
@media(max-width:600px){.modules-grid{grid-template-columns:1fr 1fr}.prog-bar,.score-pill{display:none}.dot{width:22px;height:22px;font-size:7px}}
</style>
</head>
<body>
<div class="header">
  <div class="aws-badge">CLF-C02</div>
  <div><div class="h-title">AWS Cloud Practitioner — Simulacro</div><div class="h-sub">719 preguntas · 12 módulos de 65</div></div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="score-pill" id="sp">0/0</div>
    <button class="btn-home" onclick="showHome()">⌂ Inicio</button>
  </div>
</div>
<div class="main" id="main"></div>
<button class="stb" id="stb" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const ALL_Q=[{"id": 1, "text": "A company plans to use an Amazon Snowball Edge device to transfer files to the AWS Cloud. Which activities related to a Snowball Edge device are available to the company at no cost?", "options": ["Use of the Snowball Edge appliance for a 10-day period", "The transfer of data out of Amazon S3 and to the Snowball Edge appliance", "The transfer of data from the Snowball Edge appliance into Amazon S3", "Daily use of the Snowball Edge appliance after 10 days"], "correct": [2], "multi": false, "explanation": ""}, {"id": 2, "text": "A company has deployed applications on Amazon EC2 instances. The company needs to assess application vulnerabilities and must identify infrastructure deployments that do not meet best practices. Which AWS service can the company use to meet these requirements?", "options": ["AWS Trusted Advisor — recomendaciones de optimización y seguridad", "Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS Config — registra y evalúa configuraciones de recursos", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [1], "multi": false, "explanation": ""}, {"id": 3, "text": "A company has a centralized group of users with large file storage requirements that have exceeded the space available on premises. The company wants to extend its file storage capabilities for this group while retaining the performance benefit of sharing content locally. What is the MOST operationally efficient AWS solution for this scenario?", "options": ["Create an Amazon S3 bucket for each user. Mount each bucket by using an S3 file system mounting utility.", "Configure and deploy an AWS Storage Gateway file gateway. Connect each user’s workstation to the file gateway.", "Move each user’s working environment to Amazon WorkSpaces. Set up an Amazon WorkDocs account for each user.", "Deploy an Amazon EC2 instance and attach an Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS volume. Share the EBS volume directly with the users."], "correct": [1], "multi": false, "explanation": ""}, {"id": 4, "text": "According to security best practices, how should an Amazon EC2 instance be given access to an Amazon S3 bucket?", "options": ["Hard code an IAM user’s secret key and access key directly in the application, and upload the file.", "Store the IAM user’s secret key and access key in a text file on the EC2 instance, read the keys, then upload the file.", "Have the EC2 instance assume a role to obtain the privileges to upload the file.", "Modify the S3 bucket policy so that any service can upload to it at any time."], "correct": [2], "multi": false, "explanation": ""}, {"id": 5, "text": "Which option is a customer responsibility when using Amazon DynamoDB under the AWS Shared Responsibility Model?", "options": ["Physical security of DynamoDB", "Patching of DynamoDB", "Access to DynamoDB tables", "Encryption of data at rest in DynamoDB"], "correct": [2], "multi": false, "explanation": ""}, {"id": 6, "text": "Which option is a perspective that includes foundational capabilities of the AWS Cloud Adoption Framework (AWS CAF)?", "options": ["Sustainability", "Performance efficiency", "Governance", "Reliability"], "correct": [2], "multi": false, "explanation": ""}, {"id": 7, "text": "A company is running and managing its own Docker environment on Amazon EC2 instances. The company wants an alternative to help manage cluster size, scheduling, and environment maintenance. Which AWS service meets these requirements?", "options": ["AWS Lambda — funciones sin servidor (serverless)", "Amazon RDS — base de datos relacional gestionada", "AWS Fargate — ejecuta contenedores sin gestionar servidores", "Amazon Athena — consultas SQL sobre datos en S3"], "correct": [2], "multi": false, "explanation": ""}, {"id": 8, "text": "A company wants to run a NoSQL database on Amazon EC2 instances. Which task is the responsibility of AWS in this scenario?", "options": ["Update the guest operating system of the EC2 instances.", "Maintain high availability at the database layer.", "Patch the physical infrastructure that hosts the EC2 instances.", "Configure the security group firewall."], "correct": [2], "multi": false, "explanation": ""}, {"id": 9, "text": "Which AWS services or tools can identify rightsizing opportunities for Amazon EC2 instances? (Choose two.)", "options": ["AWS Cost Explorer — analiza y visualiza costos", "AWS Billing Conductor — personaliza facturación", "Amazon CodeGuru — revisa código y detecta problemas", "Amazon SageMaker — plataforma completa de Machine Learning", "AWS Compute Optimizer — recomienda tamaño óptimo de recursos"], "correct": [0, 4], "multi": true, "explanation": ""}, {"id": 10, "text": "Which of the following are benefits of using AWS Trusted Advisor? (Choose two.)", "options": ["Providing high-performance container orchestration", "Creating and rotating encryption keys", "Detecting underutilized resources to save costs", "Improving security by proactively monitoring the AWS environment", "Implementing enforced tagging across AWS resources"], "correct": [2, 3], "multi": true, "explanation": ""}, {"id": 11, "text": "Which of the following is an advantage that users experience when they move on-premises workloads to the AWS Cloud?", "options": ["Elimination of expenses for running and maintaining data centers", "Price discounts that are identical to discounts from hardware providers", "Distribution of all operational controls to AWS", "Elimination of operational expenses"], "correct": [0], "multi": false, "explanation": ""}, {"id": 12, "text": "A company wants to manage deployed IT services and govern its infrastructure as code (IaC) templates. Which AWS service will meet this requirement?", "options": ["AWS Resource Explorer", "AWS Service Catalog — catálogo de servicios IT aprobados", "AWS Organizations — gestiona múltiples cuentas AWS", "AWS Systems Manager — gestiona y opera infraestructura AWS"], "correct": [1], "multi": false, "explanation": ""}, {"id": 13, "text": "Which AWS service or tool helps users visualize, understand, and manage spending and usage over time?", "options": ["AWS Organizations — gestiona múltiples cuentas AWS", "AWS Pricing Calculator — estima costos de servicios AWS", "AWS Cost Explorer — analiza y visualiza costos", "AWS Service Catalog — catálogo de servicios IT aprobados"], "correct": [2], "multi": false, "explanation": ""}, {"id": 14, "text": "A company is using a central data platform to manage multiple types of data for its customers. The company wants to use AWS services to discover, transform, and visualize the data. Which combination of AWS services should the company use to meet these requirements? (Choose two.)", "options": ["AWS Glue — ETL serverless para integración de datos", "Amazon Elastic File System (Amazon EFS)", "Amazon Redshift — data warehouse para análisis a gran escala", "Amazon QuickSight — dashboards y visualización de datos", "Amazon Quantum Ledger Database (Amazon QLDB)"], "correct": [0, 3], "multi": true, "explanation": ""}, {"id": 15, "text": "A global company wants to migrate its third-party applications to the AWS Cloud. The company wants help from a global team of experts to complete the migration faster and more reliably in accordance with AWS internal best practices. Which AWS service or resource will meet these requirements?", "options": ["AWS Support", "AWS Professional Services", "AWS Launch Wizard", "AWS Managed Services (AMS)"], "correct": [1], "multi": false, "explanation": ""}, {"id": 16, "text": "An e-learning platform needs to run an application for 2 months each year. The application will be deployed on Amazon EC2 instances. Any application downtime during those 2 months must be avoided. Which EC2 purchasing option will meet these requirements MOST cost-effectively?", "options": ["Reserved Instances — Instancias Reservadas, descuento por compromiso", "Dedicated Hosts", "Spot Instances — Instancias Spot, precio variable con descuento", "On-Demand Instances"], "correct": [3], "multi": false, "explanation": ""}, {"id": 17, "text": "A developer wants to deploy an application quickly on AWS without manually creating the required resources. Which AWS service will meet these requirements?", "options": ["Amazon EC2 — servidores virtuales en la nube", "AWS Elastic Beanstalk — despliega apps sin gestionar infraestructura", "AWS CodeBuild — compila y prueba código en la nube", "Amazon Personalize — recomendaciones personalizadas con ML"], "correct": [1], "multi": false, "explanation": ""}, {"id": 18, "text": "A company is storing sensitive customer data in an Amazon S3 bucket. The company wants to protect the data from accidental deletion or overwriting. Which S3 feature should the company use to meet these requirements?", "options": ["S3 Lifecycle rules", "S3 Versioning", "S3 bucket policies", "S3 server-side encryption"], "correct": [1], "multi": false, "explanation": ""}, {"id": 19, "text": "Which AWS service provides the ability to manage infrastructure as code?", "options": ["AWS CodePipeline — automatiza pipelines de CI/CD", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "AWS Direct Connect — conexión dedicada entre empresa y AWS", "AWS CloudFormation — infraestructura como código (IaC)"], "correct": [3], "multi": false, "explanation": ""}, {"id": 20, "text": "An online gaming company needs to choose a purchasing option to run its Amazon EC2 instances for 1 year. The web traffic is consistent, and any increases in traffic are predictable. The EC2 instances must be online and available without any disruption. Which EC2 instance purchasing option will meet these requirements MOST cost-effectively?", "options": ["On-Demand Instances", "Reserved Instances — Instancias Reservadas, descuento por compromiso", "Spot Instances — Instancias Spot, precio variable con descuento", "Spot Fleet"], "correct": [1], "multi": false, "explanation": ""}, {"id": 21, "text": "Which AWS service or feature allows a user to establish a dedicated network connection between a company’s on-premises data center and the AWS Cloud?", "options": ["AWS Direct Connect — conexión dedicada entre empresa y AWS", "VPC peering", "AWS VPN", "Amazon Route 53 — servicio de DNS escalable"], "correct": [0], "multi": false, "explanation": ""}, {"id": 22, "text": "Which option is a physical location of the AWS global infrastructure?", "options": ["AWS DataSync — transfiere datos entre almacenamiento local y AWS", "AWS Region", "Amazon Connect — centro de contacto en la nube", "AWS Organizations — gestiona múltiples cuentas AWS"], "correct": [1], "multi": false, "explanation": ""}, {"id": 23, "text": "A company wants to protect its AWS Cloud information, systems, and assets while performing risk assessment and mitigation tasks. Which pillar of the AWS Well-Architected Framework is supported by these goals?", "options": ["Reliability", "Security", "Operational excellence", "Performance efficiency"], "correct": [1], "multi": false, "explanation": ""}, {"id": 24, "text": "What is the purpose of having an internet gateway within a VPC?", "options": ["To create a VPN connection to the VPC", "To allow communication between the VPC and the internet", "To impose bandwidth constraints on internet traffic", "To load balance traffic from the internet across Amazon EC2 instances"], "correct": [1], "multi": false, "explanation": ""}, {"id": 25, "text": "A company is running a monolithic on-premises application that does not scale and is difficult to maintain. The company has a plan to migrate the application to AWS and divide the application into microservices. Which best practice of the AWS Well-Architected Framework is the company following with this plan?", "options": ["Integrate functional testing as part of AWS deployment.", "Use automation to deploy changes.", "Deploy the application to multiple locations.", "Implement loosely coupled dependencies."], "correct": [3], "multi": false, "explanation": ""}, {"id": 26, "text": "A company has an AWS account. The company wants to audit its password and access key rotation details for compliance purposes. Which AWS service or tool will meet this requirement?", "options": ["IAM Access Analyzer", "AWS Artifact — informes de cumplimiento y certificaciones", "IAM credential report", "AWS Audit Manager — automatiza evidencia de auditorías"], "correct": [2], "multi": false, "explanation": ""}, {"id": 27, "text": "A company wants to receive a notification when a specific AWS cost threshold is reached. Which AWS services or tools can the company use to meet this requirement? (Choose two.)", "options": ["Amazon Simple Queue Service (Amazon SQS)", "AWS Budgets — alertas de presupuesto y costos", "Cost Explorer", "Amazon CloudWatch — monitoreo y observabilidad", "AWS Cost and Usage Report — reporte detallado de costos"], "correct": [1, 3], "multi": true, "explanation": ""}, {"id": 28, "text": "Which AWS service or resource provides answers to the most frequently asked security-related questions that AWS receives from its users?", "options": ["AWS Artifact — informes de cumplimiento y certificaciones", "Amazon Connect — centro de contacto en la nube", "AWS Chatbot", "AWS Knowledge Center"], "correct": [3], "multi": false, "explanation": ""}, {"id": 29, "text": "Which tasks are customer responsibilities, according to the AWS shared responsibility model? (Choose two.)", "options": ["Configure the AWS provided security group firewall.", "Classify company assets in the AWS Cloud.", "Determine which Availability Zones to use for Amazon S3 buckets.", "Patch or upgrade Amazon DynamoDB.", "Select Amazon EC2 instances to run AWS Lambda on."], "correct": [0, 1], "multi": true, "explanation": ""}, {"id": 30, "text": "Which of the following are pillars of the AWS Well-Architected Framework? (Choose two.)", "options": ["Availability", "Reliability", "Scalability", "Responsive design", "Operational excellence"], "correct": [1, 4], "multi": true, "explanation": ""}, {"id": 31, "text": "Which AWS service or feature is used to send both text and email messages from distributed applications?", "options": ["Amazon Simple Notification Service (Amazon SNS)", "Amazon Simple Email Service (Amazon SES)", "Amazon CloudWatch alerts", "Amazon Simple Queue Service (Amazon SQS)"], "correct": [0], "multi": false, "explanation": ""}, {"id": 32, "text": "A user needs programmatic access to AWS resources through the AWS CLI or the AWS API. Which option will provide the user with the appropriate access?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones", "Access keys", "SSH public keys", "AWS Key Management Service (AWS KMS) keys"], "correct": [1], "multi": false, "explanation": ""}, {"id": 33, "text": "A company runs thousands of simultaneous simulations using AWS Batch. Each simulation is stateless, is fault tolerant, and runs for up to 3 hours. Which pricing model enables the company to optimize costs and meet these requirements?", "options": ["Reserved Instances — Instancias Reservadas, descuento por compromiso", "Spot Instances — Instancias Spot, precio variable con descuento", "On-Demand Instances", "Dedicated Instances"], "correct": [1], "multi": false, "explanation": ""}, {"id": 34, "text": "What does the concept of agility mean in AWS Cloud computing? (Choose two.)", "options": ["The speed at which AWS resources are implemented", "The speed at which AWS creates new AWS Regions", "The ability to experiment quickly", "The elimination of wasted capacity", "The low cost of entry into cloud computing"], "correct": [0, 2], "multi": true, "explanation": ""}, {"id": 35, "text": "A company needs to block SQL injection attacks. Which AWS service or feature can meet this requirement?", "options": ["AWS WAF — firewall de aplicaciones web", "AWS Shield — protección contra ataques DDoS", "Network ACLs", "Security groups"], "correct": [0], "multi": false, "explanation": ""}, {"id": 36, "text": "Which AW ert the Standard RIs to Savings Plans"], "correct": [1], "multi": false, "explanation": ""}, {"id": 698, "text": "A company is releasing a business-critical application. Before the release, the company needs strategic planning assistance from AWS. During the release, the company needs AWS infrastructure event management and real-time support. What should the company do to meet these requirements?", "options": ["Access AWS Trusted Advisor", "Contact the AWS Partner Network (APN)", "Sign up for AWS Enterprise Support", "Contact AWS Professional Services"], "correct": [2], "multi": false, "explanation": ""}, {"id": 699, "text": "A company wants to improve employee productivity by providing a way for employees to search for questions and retrieve specific answers. The company wants to use a single intelligent search interface. Which AWS service will meet these requirements?", "options": ["Amazon Connect — centro de contacto en la nube", "Amazon Kendra — búsqueda empresarial inteligente", "Amazon Lex — construye chatbots conversacionales", "Amazon Comprehend — análisis de texto con NLP"], "correct": [1], "multi": false, "explanation": ""}, {"id": 700, "text": "A company wants an Amazon S3 solution that provides access to object storage within single-digit milliseconds. Which solution will meet these requirements?", "options": ["S3 Express One Zone", "S3 Standard", "S3 Glacier Flexible Retrieval", "S3 Glacier Instant Retrieval"], "correct": [1], "multi": false, "explanation": ""}, {"id": 701, "text": "A company runs an uninterruptible Amazon EC2 workload on AWS 24 hours a day, 7 days a week. The company will require the same instance family and instance type to run the workload for the next 12 months. Which combination of purchasing options should the company choose to MOST optimize costs? (Choose two.)", "options": ["Standard Reserved Instance", "Convertible Reserved Instance", "Compute Savings Plan", "Spot Instance", "All Upfront payment"], "correct": [0, 4], "multi": true, "explanation": ""}, {"id": 702, "text": "A company wants to run its application's code without having to provision and manage servers. Which AWS service will meet this requirement?", "options": ["AWS Glue — ETL serverless para integración de datos", "AWS Lambda — funciones sin servidor (serverless)", "AWS CodeDeploy — automatiza despliegues de aplicaciones", "Amazon CodeGuru — revisa código y detecta problemas"], "correct": [1], "multi": false, "explanation": ""}, {"id": 703, "text": "A company is planning to migrate to the AWS Cloud. The company needs to understand the existing on-premises usage and configuration. The company does not want to replicate its workloads to AWS, yet. Which AWS service or tool will meet these requirements?", "options": ["AWS Application Discovery Service", "AWS Application Migration Service — migra aplicaciones a AWS", "Cloud Migration Factory", "AWS Transfer Family — transfiere archivos con SFTP/FTP a S3"], "correct": [0], "multi": false, "explanation": ""}, {"id": 704, "text": "A company wants to allow its employees to work remotely from home. The company's employees use Windows or Linux desktops. The company's employees need access from anywhere and at anytime by using any supported devices. Which AWS service will meet these requirements?", "options": ["Amazon Workspaces", "Amazon AppStream 2.0", "Amazon Keyspaces (for Apache Cassandra)", "AWS Cloud9"], "correct": [0], "multi": false, "explanation": ""}, {"id": 705, "text": "A company wants to test a new application. Which AWS principle will help the company test the application?", "options": ["Make long-term commitments in exchange for a cost discount.", "Scale up and down when needed without any long-term commitments.", "Have total control over the application infrastructure.", "Manage all of the maintenance tasks associated with the cloud."], "correct": [1], "multi": false, "explanation": ""}, {"id": 706, "text": "A company plans to launch an ecommerce website that contains many images for a product catalog. The company wants to keep the cost of running the website within a specific budget. Which AWS service or tool should the company use to monitor the ongoing costs of the website?", "options": ["AWS Cost Explorer — analiza y visualiza costos", "AWS SDKs", "EC2 Image Builder", "AWS CloudFormation — infraestructura como código (IaC)"], "correct": [0], "multi": false, "explanation": ""}, {"id": 707, "text": "A company has deployed several public applications behind Application Load Balancers. The company wants to improve the performance of the applications. Which AWS service will meet these requirements?", "options": ["AWS Global Accelerator", "Amazon Connect — centro de contacto en la nube", "Amazon ElastiCache — caché en memoria (Redis/Memcached)", "Amazon CloudWatch — monitoreo y observabilidad"], "correct": [0], "multi": false, "explanation": ""}, {"id": 708, "text": "A company has an on-premises application. The application has processing times of less than 5 minutes and is invoked only a few times each day. The company wants to move the application to the AWS Cloud. Which AWS service will support this application MOST cost-effectively?", "options": ["Amazon Elastic Container Service (Amazon ECS)", "AWS Lambda — funciones sin servidor (serverless)", "Amazon Elastic Kubernetes Service (Amazon EKS)", "Amazon EC2 — servidores virtuales en la nube"], "correct": [1], "multi": false, "explanation": ""}, {"id": 709, "text": "A company is learning about the perspectives of the AWS Cloud Adoption Framework (AWS CAF). Which perspective of the AWS CAF addresses the strategy management capability?", "options": ["Business perspective", "People perspective", "Governance perspective", "Operations perspective"], "correct": [0], "multi": false, "explanation": ""}, {"id": 710, "text": "A company wants to consolidate its call centers to improve the customer voice and chat experience with call center agents. Which AWS service or tool will meet these requirements?", "options": ["Amazon Simple Notification Service (Amazon SNS)", "AWS Support Center", "Amazon Cognito — autenticación de usuarios para apps", "Amazon Connect — centro de contacto en la nube"], "correct": [3], "multi": false, "explanation": ""}, {"id": 711, "text": "A company needs to provision uninterruptible Amazon EC2 instances, when needed, and pay for compute capacity by the second. Which EC2 instance purchasing option will meet these requirements?", "options": ["Reserved Instances — Instancias Reservadas, descuento por compromiso", "Spot Instances — Instancias Spot, precio variable con descuento", "On-Demand Instances", "Dedicated Instances"], "correct": [2], "multi": false, "explanation": ""}, {"id": 712, "text": "Which AWS service can migrate Amazon EC2 instances from one AWS Region to another?", "options": ["AWS Application Migration Service — migra aplicaciones a AWS", "AWS Database Migration Service (AWS DMS)", "AWS DataSync — transfiere datos entre almacenamiento local y AWS", "AWS Migration Hub — rastrea migraciones a AWS"], "correct": [0], "multi": false, "explanation": ""}, {"id": 713, "text": "A company needs to block SQL injection attacks. Which AWS service or feature provides this functionality?", "options": ["AWS WAF — firewall de aplicaciones web", "Network ACLs", "Security groups", "AWS Trusted Advisor — recomendaciones de optimización y seguridad"], "correct": [0], "multi": false, "explanation": ""}, {"id": 714, "text": "A company wants to run its application on Amazon EC2 instances. The company needs to keep the application on-premises to meet a compliance requirement. Which AWS offering will meet these requirements?", "options": ["Dedicated Instances", "Amazon CloudFront — red de distribución de contenido (CDN)", "AWS Fargate — ejecuta contenedores sin gestionar servidores", "AWS Outposts — infraestructura AWS en instalaciones propias"], "correct": [3], "multi": false, "explanation": ""}, {"id": 715, "text": "A company wants to connect its supported AWS services and VPCs. The company does not want to expose its internal traffic to the public internet. Which AWS service will meet these requirements?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones", "AWS PrivateLink", "Amazon Connect — centro de contacto en la nube", "AWS Internet Gateway"], "correct": [1], "multi": false, "explanation": ""}, {"id": 716, "text": "Which AWS service can manage permissions for AWS resources by using policies?", "options": ["Amazon Inspector — detecta vulnerabilidades en aplicaciones", "Amazon Detective — investiga incidentes de seguridad", "AWS Identity and Access Management (IAM)", "Amazon GuardDuty — detecta amenazas y actividad maliciosa"], "correct": [2], "multi": false, "explanation": ""}, {"id": 717, "text": "A company needs to run some of its workload in the AWS Cloud. The company needs to keep some of the workload in its own on-site data center due to compliance reasons. Which AWS service will meet these requirements?", "options": ["AWSConfig", "AWS Outposts — infraestructura AWS en instalaciones propias", "Amazon Lightsail — servidores virtuales simples y económicos", "Amazon Connect — centro de contacto en la nube"], "correct": [1], "multi": false, "explanation": ""}, {"id": 718, "text": "A company wants to deploy an application that stores data in a relational database. The company wants database tasks, such as automated backups and database snapshots, to be managed by AWS. Which AWS service will meet these requirements?", "options": ["Amazon DocumentDB", "Amazon RDS — base de datos relacional gestionada", "Amazon Elastic Block Store (Amazon EBS)", "Amazon S3 — almacenamiento de objetos escalable"], "correct": [1], "multi": false, "explanation": ""}, {"id": 719, "text": "A company that operates on-premises servers decides to start a new line of business. The company determines that additional servers are required for the new workloads. Which advantage of cloud computing can help the company to provision additional infrastructure as quickly as possible?", "options": ["Benefit from massive economies of scale", "Increase speed and agility", "Trade fixed expense for variable expense", "Go global in minutes"], "correct": [1], "multi": false, "explanation": ""}];
const MODS=[
  {id:1,title:"Módulo 1",range:"P1–P65",s:0,e:65},
  {id:2,title:"Módulo 2",range:"P66–P130",s:65,e:130},
  {id:3,title:"Módulo 3",range:"P131–P195",s:130,e:195},
  {id:4,title:"Módulo 4",range:"P196–P260",s:195,e:260},
  {id:5,title:"Módulo 5",range:"P261–P325",s:260,e:325},
  {id:6,title:"Módulo 6",range:"P326–P390",s:325,e:390},
  {id:7,title:"Módulo 7",range:"P391–P455",s:390,e:455},
  {id:8,title:"Módulo 8",range:"P456–P520",s:455,e:520},
  {id:9,title:"Módulo 9",range:"P521–P585",s:520,e:585},
  {id:10,title:"Módulo 10",range:"P586–P650",s:585,e:650},
  {id:11,title:"Módulo 11",range:"P651–P715",s:650,e:715},
  {id:12,title:"Módulo 12",range:"P716–P719",s:715,e:719},
];
var S={mod:null,qs:[],cur:0,ans:{},sel:[],done:false,scores:{}};
try{S.scores=JSON.parse(localStorage.getItem('clf_scores')||'{}');}catch(e){}
function save(){try{localStorage.setItem('clf_scores',JSON.stringify(S.scores));}catch(e){}}
function showHome(){S.mod=null;document.getElementById('pf').style.width='0%';document.getElementById('sp').textContent='0/0';renderHome();}
function renderHome(){
  var h='<div class="home-hdr"><div class="home-icon">☁️</div><div class="home-title">AWS Cloud Practitioner CLF-C02</div>';
  h+='<div class="home-sub">719 preguntas reales · Opciones de AWS con descripción en español · 12 módulos de 65 preguntas</div>';
  h+='<div class="stats-row"><div class="stat"><div class="stat-num">719</div><div class="stat-lbl">Preguntas</div></div>';
  h+='<div class="stat"><div class="stat-num">12</div><div class="stat-lbl">Módulos</div></div>';
  h+='<div class="stat"><div class="stat-num">65</div><div class="stat-lbl">Por módulo</div></div></div></div>';
  h+='<div class="modules-grid">';
  MODS.forEach(function(m){
    var sc=S.scores[m.id],pct=sc?Math.round(sc.c/sc.t*100):0;
    var fc=pct>=80?'var(--green)':pct>=60?'var(--orange)':'var(--red)';
    h+='<div class="mod-card" onclick="startMod('+m.id+')">';
    h+='<div class="mod-num">'+m.range+'</div><div class="mod-title">'+m.title+'</div>';
    h+='<div class="mod-count">'+(m.e-m.s)+' preguntas</div>';
    h+='<div class="mod-bar"><div class="mod-fill" style="width:'+(sc?pct:0)+'%;background:'+fc+'"></div></div>';
    h+='<div class="mod-score">'+(sc?sc.c+'/'+sc.t+' ('+pct+'%)':'Sin intentar')+'</div></div>';
  });
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}
function startMod(id){
  var m=MODS.find(function(x){return x.id===id;});
  S.mod=m;S.qs=ALL_Q.slice(m.s,m.e);S.cur=0;S.ans={};S.sel=[];S.done=false;
  renderQ();
}
function renderQ(){
  var q=S.qs[S.cur],tot=S.qs.length;
  document.getElementById('pf').style.width=((S.cur)/tot*100)+'%';
  var ok=Object.values(S.ans).filter(function(a){return a.ok;}).length;
  document.getElementById('sp').textContent=ok+'/'+S.cur;
  S.sel=[];S.done=false;
  var dots='<div class="nav-dots">';
  S.qs.forEach(function(qq,i){
    var c='dot'+(i===S.cur?' current':S.ans[i]?S.ans[i].ok?' correct':' wrong':'');
    dots+='<div class="'+c+'" onclick="goQ('+i+')">'+(i+1)+'</div>';
  });
  dots+='</div>';
  var mi=q.multi?'<span class="multi-hint">Selección múltiple</span>':'';
  var opts='';
  q.options.forEach(function(o,i){
    opts+='<div class="opt" id="o'+i+'" onclick="selOpt('+i+')"><span class="oletter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></div>';
  });
  var h=dots+'<div class="qcard"><div class="qhead"><span class="qnum">P'+q.id+'</span>'+mi+'</div>';
  h+='<div class="qbody"><div class="qtext">'+q.text+'</div><div id="opts">'+opts+'</div>';
  h+='<div class="feedback" id="fb"><div class="fb-title" id="fbt"></div><div id="fbe"></div></div></div></div>';
  h+='<div class="actions"><button class="btn btn-confirm" id="bc" onclick="confirmQ()">Confirmar respuesta</button>';
  h+='<button class="btn btn-next" id="bn" onclick="nextQ()" style="display:none">'+(S.cur<tot-1?'Siguiente →':'Ver resultado')+'</button></div>';
  document.getElementById('main').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}
function selOpt(i){
  if(S.done)return;
  var q=S.qs[S.cur];
  if(q.multi){
    var p=S.sel.indexOf(i);
    if(p>-1){S.sel.splice(p,1);document.getElementById('o'+i).classList.remove('selected');}
    else{S.sel.push(i);document.getElementById('o'+i).classList.add('selected');}
  }else{
    S.sel=[i];
    document.querySelectorAll('.opt').forEach(function(o){o.classList.remove('selected');});
    document.getElementById('o'+i).classList.add('selected');
  }
}
function confirmQ(){
  if(!S.sel.length)return;
  var q=S.qs[S.cur];S.done=true;
  document.querySelectorAll('.opt').forEach(function(o){o.classList.add('disabled');});
  document.getElementById('bc').style.display='none';
  document.getElementById('bn').style.display='block';
  var ok=JSON.stringify(S.sel.slice().sort()===JSON.stringify?S.sel.slice().sort():false);
  var isOk=JSON.stringify(S.sel.slice().sort())==JSON.stringify(q.correct.slice().sort());
  q.correct.forEach(function(i){var e=document.getElementById('o'+i);if(e)e.classList.add('correct');});
  S.sel.forEach(function(i){if(!q.correct.includes(i)){var e=document.getElementById('o'+i);if(e)e.classList.add('wrong');}});
  var fb=document.getElementById('fb');
  fb.className='feedback '+(isOk?'ok':'bad');fb.style.display='block';
  document.getElementById('fbt').textContent=isOk?'✅ ¡Correcto!':'❌ Incorrecto';
  var cl=q.correct.map(function(i){return String.fromCharCode(65+i);}).join(', ');
  var ct=q.correct.map(function(i){return q.options[i];}).join(' / ');
  document.getElementById('fbe').textContent='Respuesta correcta: '+cl+'. '+ct.substring(0,120);
  S.ans[S.cur]={ok:isOk,sel:S.sel.slice()};
  var dot=document.querySelectorAll('.dot')[S.cur];
  if(dot){dot.classList.remove('current');dot.classList.add(isOk?'correct':'wrong');}
}
function nextQ(){
  if(S.cur<S.qs.length-1){S.cur++;renderQ();}else{showResults();}
}
function goQ(i){
  if(i<=S.cur||S.ans[i]!==undefined){S.cur=i;renderQ();}
}
function showResults(){
  var ok=Object.values(S.ans).filter(function(a){return a.ok;}).length;
  var tot=S.qs.length,pct=Math.round(ok/tot*100);
  S.scores[S.mod.id]={c:ok,t:tot};save();
  document.getElementById('pf').style.width='100%';
  document.getElementById('sp').textContent=ok+'/'+tot;
  var title=pct>=80?'¡Excelente! 🏆':pct>=70?'¡Muy bien! 💪':'Sigue practicando 📚';
  var sub=pct>=80?'Superaste el 80%. ¡Listo para el examen!':pct>=70?'Estás cerca. Repasa los errores y vuelve.':'Revisa el módulo e inténtalo de nuevo.';
  var h='<div class="results"><div class="res-pct">'+pct+'%</div>';
  h+='<div class="res-lbl">'+S.mod.title+' — '+S.mod.range+'</div>';
  h+='<div class="res-title">'+title+'</div><div class="res-sub">'+sub+'</div>';
  h+='<div class="res-grid"><div class="res-stat res-ok"><div class="res-num">'+ok+'</div><div class="res-sl">Correctas</div></div>';
  h+='<div class="res-stat res-bad"><div class="res-num">'+(tot-ok)+'</div><div class="res-sl">Incorrectas</div></div>';
  h+='<div class="res-stat res-tot"><div class="res-num">'+tot+'</div><div class="res-sl">Total</div></div></div>';
  h+='<button class="btn-retry" onclick="startMod('+S.mod.id+')">🔄 Reintentar</button>';
  h+='<button class="btn-back" onclick="showHome()">⌂ Inicio</button></div>';
  document.getElementById('main').innerHTML=h;
}
window.addEventListener('scroll',function(){document.getElementById('stb').classList.toggle('vis',window.scrollY>300);});
showHome();
</script>
