ión con las indicaciones. Quiere modificar técnicas para reducir imágenes irrelevantes. ¿Qué solución cumple estos requisitos?", "options": ["Utilice indicaciones de disparo cero", "Utilice indicaciones negativas", "Utilice indicaciones positivas", "Utilice indicaciones ambiguas"], "correct": [1], "multi": false, "explanation": "Las indicaciones negativas especifican explícitamente qué NO debe aparecer en la imagen generada, ayudando al modelo a evitar elementos irrelevantes o no deseados."}, {"id": 108, "text": "Una empresa quiere usar un LLM para generar descripciones concisas y específicas de características de productos. ¿Qué técnica de ingeniería de indicaciones cumple estos requisitos?", "options": ["Crea una pregunta general y edita las respuestas para que sean específicas", "Cree indicaciones por categoría que resalten características clave e incluyan formato y longitud deseados", "Incluya una amplia gama de características en cada indicación para generar descripciones creativas", "Proporcione indicaciones detalladas y específicas del producto"], "correct": [1], "multi": false, "explanation": "Crear indicaciones estructuradas por categoría con formato definido y características clave produce descripciones consistentes, concisas y específicas para cada tipo de producto."}, {"id": 109, "text": "Un modelo de predicción de deserción de clientes funciona bien con datos de entrenamiento pero no con datos nuevos. ¿Qué solución resolverá este problema?", "options": ["Disminuya el parámetro de regularización para aumentar la complejidad", "Aumentar el parámetro de regularización para disminuir la complejidad del modelo", "Agregar más características a los datos de entrada", "Entrenar el modelo durante más épocas"], "correct": [1], "multi": false, "explanation": "El problema es sobreajuste (overfitting). Aumentar la regularización penaliza la complejidad del modelo, forzándolo a generalizar mejor con datos nuevos."}, {"id": 110, "text": "Una empresa implementa agentes inteligentes para búsqueda conversacional y necesita una base de datos que almacene y consulte vectores de IA generativa. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon Athena", "Amazon Aurora PostgreSQL", "Amazon Redshift", "Amazon EMR"], "correct": [1], "multi": false, "explanation": "Amazon Aurora PostgreSQL soporta la extensión pgvector que permite almacenar y consultar embeddings vectoriales, siendo una solución robusta para bases de datos vectoriales."}, {"id": 111, "text": "Una institución financiera necesita que las decisiones de IA sean explicables para auditoría. ¿Qué factor influye en la explicabilidad de dichas decisiones?", "options": ["Complejidad del modelo", "Tiempo de entrenamiento", "Número de hiperparámetros", "Tiempo de despliegue"], "correct": [0], "multi": false, "explanation": "La complejidad del modelo afecta directamente su explicabilidad — los modelos simples (regresión logística, árboles de decisión) son más interpretables que los modelos complejos (redes neuronales profundas)."}, {"id": 112, "text": "Una empresa farmacéutica quiere analizar opiniones de usuarios sobre medicamentos y crear descripciones concisas. ¿Qué solución cumple estos requisitos?", "options": ["Cree un modelo de pronóstico usando Amazon Personalize", "Cree resúmenes usando LLMs de Amazon Bedrock", "Cree un modelo de clasificación usando Amazon SageMaker", "Cree resúmenes usando Amazon Rekognition"], "correct": [1], "multi": false, "explanation": "Los LLMs de Amazon Bedrock pueden analizar texto y generar resúmenes concisos de las reseñas de medicamentos, siendo la solución más directa para este caso de uso."}, {"id": 113, "text": "Una empresa quiere una app de priorización de leads donde empleados puedan visualizar y ajustar ponderaciones del modelo según su experiencia. ¿Qué modelo cumple estos requisitos?", "options": ["Modelo de regresión logística", "Modelo de aprendizaje profundo sobre componentes principales", "Modelo k-NN", "Red neuronal"], "correct": [0], "multi": false, "explanation": "La regresión logística es un modelo interpretable donde los coeficientes representan el peso de cada variable, permitiendo a los usuarios entender y ajustar la influencia de cada factor."}, {"id": 114, "text": "¿Cuál es el orden correcto de los pasos para crear una carga de trabajo de ML bien estructurada?", "options": ["Definir objetivo de negocio → Desarrollar modelo → Desplegar modelo → Monitorear modelo", "Desarrollar modelo → Definir objetivo → Desplegar modelo → Monitorear modelo", "Monitorear modelo → Definir objetivo → Desarrollar modelo → Desplegar modelo", "Desplegar modelo → Monitorear modelo → Definir objetivo → Desarrollar modelo"], "correct": [0], "multi": false, "explanation": "El ciclo de vida del ML siempre comienza definiendo el objetivo de negocio, luego desarrollando el modelo, desplegándolo en producción, y finalmente monitoreando su rendimiento."}, {"id": 115, "text": "¿Qué estrategia determinará si un FM cumple eficazmente con los objetivos empresariales?", "options": ["Evaluar el rendimiento en conjuntos de datos de referencia", "Analizar la arquitectura y los hiperparámetros del modelo", "Evaluar la adecuación del modelo a casos de uso específicos", "Medir los recursos computacionales necesarios"], "correct": [2], "multi": false, "explanation": "La adecuación a casos de uso específicos (task-specific evaluation) mide si el modelo realmente cumple los objetivos empresariales reales, no solo métricas genéricas de benchmark."}, {"id": 116, "text": "Una empresa necesita entrenar un modelo para clasificar imágenes de diferentes tipos de animales con un gran conjunto de imágenes etiquetadas. ¿Qué tipo de aprendizaje debe usar?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "Aprendizaje activo"], "correct": [0], "multi": false, "explanation": "El aprendizaje supervisado requiere datos etiquetados — exactamente lo que la empresa tiene. Es el enfoque estándar para clasificación de imágenes con categorías definidas."}, {"id": 117, "text": "¿Qué fase del ciclo de vida del ML determina el cumplimiento de los requisitos normativos?", "options": ["Ingeniería de características", "Entrenamiento del modelo", "Recopilación de datos", "Identificación de objetivos empresariales"], "correct": [3], "multi": false, "explanation": "Durante la identificación de objetivos empresariales se deben considerar los requisitos normativos desde el inicio, ya que afectan el diseño completo de la solución de ML."}, {"id": 118, "text": "Una empresa de servicios de alimentación quiere mejorar continuamente la precisión de su modelo de ML. ¿Qué solución cumple estos requisitos?", "options": ["Utilice Amazon SageMaker y realice iteraciones con datos más recientes", "Utilice Amazon Personalize y realice iteraciones con datos históricos", "Utilice Amazon CloudWatch para analizar los pedidos", "Utilice Amazon Rekognition para optimizar el modelo"], "correct": [0], "multi": false, "explanation": "SageMaker permite reentrenar modelos con datos nuevos de forma iterativa, mejorando continuamente la precisión a medida que se acumulan más datos recientes."}, {"id": 119, "text": "Una empresa quiere implementar un modelo de predicción de precios de bienes raíces sin gestionar servidores. ¿Qué solución cumple estos requisitos?", "options": ["Implemente en una instancia de Amazon EC2", "Implemente en un clúster de Amazon EKS", "Implemente usando Amazon CloudFront con integración de S3", "Implemente usando un endpoint de Amazon SageMaker"], "correct": [3], "multi": false, "explanation": "Los endpoints de Amazon SageMaker son la forma estándar de desplegar modelos en producción, gestionando automáticamente la infraestructura subyacente."}, {"id": 120, "text": "Una empresa quiere una app de IA para revisar reclamaciones, identificar detalles específicos y acceder a documentación relacionada. ¿Qué solución cumple estos requisitos?", "options": ["Use Agentes para Bedrock con Amazon Fraud Detector", "Use Agentes para Bedrock con Bases de Conocimiento de Bedrock", "Use Amazon Personalize con Bases de Conocimiento de Bedrock", "Use Amazon SageMaker para entrenar un nuevo modelo"], "correct": [1], "multi": false, "explanation": "Los Agentes de Bedrock con Bases de Conocimiento permiten a la IA buscar en documentación específica y tomar acciones complejas de múltiples pasos para revisar reclamaciones."}, {"id": 121, "text": "Una empresa manufacturera usa IA para inspeccionar productos y detectar daños o defectos. ¿Qué tipo de aplicación de IA usa la empresa?", "options": ["Sistema de recomendación", "Procesamiento del lenguaje natural", "Visión por computadora", "Procesamiento de imágenes"], "correct": [2], "multi": false, "explanation": "La visión por computadora es la rama de IA que permite a las máquinas interpretar y analizar imágenes y video — perfecta para inspección visual de defectos en manufactura."}, {"id": 122, "text": "Una empresa quiere crear un modelo de ML para predecir satisfacción del cliente con optimización totalmente automatizada. ¿Qué servicio de AWS cumple estos requisitos?", "options": ["Amazon Personalize", "Amazon SageMaker", "Amazon Athena", "Amazon Comprehend"], "correct": [1], "multi": false, "explanation": "Amazon SageMaker Autopilot automatiza el proceso completo de ML — desde preprocesamiento hasta selección de modelo y ajuste de hiperparámetros — sin intervención manual."}, {"id": 123, "text": "¿Qué técnica puede usar una empresa para reducir el sesgo y la toxicidad en aplicaciones de IA generativa durante el ciclo de vida del ML post-procesamiento?", "options": ["Intervención humana", "Aumento de datos", "Ingeniería de características", "Entrenamiento adversario"], "correct": [0], "multi": false, "explanation": "La intervención humana post-procesamiento (revisión humana de outputs) es la forma más efectiva de filtrar sesgo y toxicidad que el modelo pueda generar en producción."}, {"id": 124, "text": "Un banco optimizó un LLM para aprobación de préstamos pero descubrió que aprueba más rápido para un grupo demográfico. ¿Cuál es la solución más rentable?", "options": ["Incluya datos de entrenamiento más diversos. Ajuste nuevamente el modelo", "Use RAG con el modelo ajustado", "Use AWS Trusted Advisor para eliminar sesgos", "Preentrenar un nuevo LLM con datos más diversos"], "correct": [0], "multi": false, "explanation": "Reentrenar el modelo existente con datos más diversos y representativos es más rentable que crear uno nuevo desde cero, ya que aprovecha el conocimiento ya adquirido."}, {"id": 125, "text": "Una empresa necesita seleccionar el modo de inferencia para un chatbot con latencia mínima, procesamiento por lotes de datos grandes, y API para texto de baja latencia. ¿Cuál es la combinación correcta?", "options": ["Tiempo real → Lotes → Tiempo real", "Asíncrona → Tiempo real → Lotes", "Tiempo real → Lotes → Asíncrona", "Lotes → Tiempo real → Asíncrona"], "correct": [0], "multi": false, "explanation": "Chatbot con latencia mínima = inferencia en tiempo real. Procesar gigabytes en fines de semana = transformación por lotes. API para texto pequeño con baja latencia = inferencia en tiempo real."}, {"id": 126, "text": "Una empresa necesita registrar solicitudes a su API de Bedrock y conservarlas 5 años al menor costo. ¿Qué combinación cumple estos requisitos? (Seleccione dos)", "options": ["AWS CloudTrail", "Amazon CloudWatch", "AWS Audit Manager", "Amazon S3 Intelligent-Tiering", "Amazon S3 Standard"], "correct": [0, 3], "multi": true, "explanation": "CloudTrail registra todas las llamadas a la API de Bedrock. S3 Intelligent-Tiering mueve automáticamente los datos a clases de menor costo según el patrón de acceso, siendo la opción más rentable para retención a largo plazo."}, {"id": 127, "text": "Una empresa de comercio electrónico quiere mejorar recomendaciones de motores de búsqueda personalizando resultados para cada usuario. ¿Qué servicio de AWS cumple estos requisitos?", "options": ["Amazon Personalize", "Amazon Kendra", "Amazon Rekognition", "Amazon Transcribe"], "correct": [0], "multi": false, "explanation": "Amazon Personalize está diseñado específicamente para crear sistemas de recomendación personalizados en tiempo real basados en el comportamiento individual de cada usuario."}, {"id": 128, "text": "Un hospital desarrolla IA para diagnosticar enfermedades y los datos confidenciales de pacientes no pueden salir del país. ¿Qué estrategia garantizará el cumplimiento?", "options": ["Residencia de datos", "Calidad de los datos", "Descubrimiento de datos", "Enriquecimiento de datos"], "correct": [0], "multi": false, "explanation": "La residencia de datos garantiza que los datos se almacenen y procesen únicamente en la región o país especificado, cumpliendo con regulaciones de privacidad de datos de salud."}, {"id": 129, "text": "Una empresa necesita supervisar el rendimiento de sus sistemas ML mediante un servicio de AWS altamente escalable. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon CloudWatch", "AWS CloudTrail", "AWS Trusted Advisor", "AWS Config"], "correct": [0], "multi": false, "explanation": "Amazon CloudWatch es el servicio de monitoreo y observabilidad de AWS, altamente escalable, que permite supervisar métricas de rendimiento de sistemas ML en tiempo real."}, {"id": 130, "text": "Un profesional de IA añade al final de una instrucción: 'Pídele al modelo que muestre su trabajo explicando su razonamiento paso a paso'. ¿Qué técnica está usando?", "options": ["Incitación a la cadena de pensamiento", "Inyección inmediata", "Indicaciones con pocos disparos", "Plantillas de indicaciones"], "correct": [0], "multi": false, "explanation": "Chain-of-thought prompting pide al modelo que explique su razonamiento paso a paso, mejorando la precisión en problemas complejos y haciendo el proceso más transparente."}, {"id": 131, "text": "¿Qué servicio de AWS pone a disposición FMs para ayudar a los usuarios a crear y escalar aplicaciones de IA generativa?", "options": ["Amazon Q Developer", "Amazon Bedrock", "Amazon Kendra", "Amazon Comprehend"], "correct": [1], "multi": false, "explanation": "Amazon Bedrock es el servicio de AWS que proporciona acceso a una amplia variedad de modelos base (FMs) de IA generativa de alto rendimiento para crear aplicaciones."}, {"id": 132, "text": "Una empresa quiere crear una app móvil para usuarios con discapacidad visual que escuche y proporcione respuestas de voz. ¿Qué solución cumplirá estos requisitos?", "options": ["Usar una red neuronal de aprendizaje profundo para reconocimiento de voz", "Crear modelos ML para buscar patrones en datos numéricos", "Usar resumen mediante IA para generar texto", "Crear modelos para clasificación de imágenes"], "correct": [0], "multi": false, "explanation": "El reconocimiento de voz mediante redes neuronales profundas (como las usadas en Amazon Transcribe) es la tecnología necesaria para convertir habla en texto y luego generar respuestas de voz."}, {"id": 133, "text": "Una empresa quiere mejorar la calidad de respuesta de un LLM para tareas complejas que requieren razonamiento detallado paso a paso. ¿Qué técnica cumple estos requisitos?", "options": ["Indicación con pocas tomas", "Indicaciones de disparo cero", "Inducción de estímulos direccionales", "Inducción a la cadena de pensamiento"], "correct": [3], "multi": false, "explanation": "Chain-of-thought prompting guía al modelo para desarrollar un razonamiento explícito y detallado paso a paso, mejorando la calidad en tareas complejas de resolución de problemas."}, {"id": 134, "text": "Una empresa quiere mantener actualizado su FM usando datos más recientes con actualizaciones periódicas. ¿Qué solución cumple estos requisitos?", "options": ["Aprendizaje por lotes", "Entrenamiento previo continuo", "Entrenamiento estático", "Entrenamiento latente"], "correct": [1], "multi": false, "explanation": "El preentrenamiento continuo (continued pre-training) actualiza el modelo con nuevos datos de forma periódica, manteniendo su conocimiento actualizado sin reentrenamiento completo."}, {"id": 135, "text": "¿Cuál es la asociación correcta entre paradigmas de ML y casos de uso?", "options": ["Clasificación binaria = Supervisado, Clasificación multiclase = Supervisado, K-means = No supervisado, Reducción de dimensionalidad = No supervisado", "Clasificación binaria = No supervisado, K-means = Supervisado, Reducción = Supervisado", "Clasificación binaria = Refuerzo, K-means = Supervisado, Reducción = No supervisado", "Todos = Supervisado"], "correct": [0], "multi": false, "explanation": "Clasificación (binaria y multiclase) requiere datos etiquetados = supervisado. K-means agrupa datos sin etiquetas = no supervisado. La reducción de dimensionalidad transforma datos sin necesitar etiquetas = no supervisado."}, {"id": 136, "text": "¿Cuál es una característica de los marcos de gobernanza de IA para generar confianza e implementar tecnologías de IA centradas en el ser humano?", "options": ["Ampliar las iniciativas en todas las unidades de negocio", "Garantizar la alineación con estándares comerciales y objetivos de ingresos", "Superar los desafíos para impulsar la transformación", "Desarrollar políticas y directrices para datos, transparencia, IA responsable y cumplimiento"], "correct": [3], "multi": false, "explanation": "Los marcos de gobernanza de IA se basan en políticas claras para el manejo de datos, transparencia en las decisiones, IA responsable y cumplimiento normativo — los pilares para generar confianza."}, {"id": 137, "text": "Una empresa de comercio electrónico usa un chatbot de IA generativa para consultas de clientes. Quiere medir el impacto financiero. ¿Qué métrica debe usar?", "options": ["Número de consultas atendidas", "Costo del entrenamiento de modelos", "Costo por cada conversación con el cliente", "Tiempo medio de atención"], "correct": [2], "multi": false, "explanation": "El costo por conversación es la métrica que directamente mide el impacto financiero operativo del chatbot, comparándolo con el costo de atención humana tradicional."}, {"id": 138, "text": "Una empresa quiere segmentar a sus clientes según datos demográficos y patrones de compra. ¿Qué algoritmo debe usar?", "options": ["K vecinos más cercanos (k-NN)", "K-medias", "Árbol de decisión", "Máquina de vectores de soporte"], "correct": [1], "multi": false, "explanation": "K-medias es el algoritmo de clustering más usado para segmentación de clientes — agrupa automáticamente a los clientes en segmentos basándose en similitudes en sus características."}, {"id": 139, "text": "El LLM de una empresa está experimentando alucinaciones. ¿Cómo puede la empresa reducirlas?", "options": ["Configurar agentes de Bedrock para supervisar el entrenamiento", "Use preprocesamiento de datos y elimine datos que provoquen alucinaciones", "Disminuir el parámetro de temperatura para el modelo", "Use un FM entrenado para no tener alucinaciones"], "correct": [2], "multi": false, "explanation": "Disminuir la temperatura hace que el modelo sea más determinista y conservador, reduciendo las alucinaciones al elegir tokens más probables y evitar generaciones creativas pero incorrectas."}, {"id": 140, "text": "Una empresa usa un LLM en Bedrock para un chatbot de atención. El cliente y el chatbot deben interactuar varias veces. ¿Qué solución permite usar el contenido de mensajes anteriores?", "options": ["Active el registro de invocación del modelo", "Agregue mensajes anteriores al mensaje del modelo", "Utilice Amazon Personalize para guardar el historial", "Utilice el rendimiento aprovisionado"], "correct": [1], "multi": false, "explanation": "Incluir el historial de mensajes anteriores en el contexto del prompt permite al LLM mantener el contexto de la conversación multi-turno sin necesidad de servicios adicionales."}, {"id": 141, "text": "Empleados de una empresa ofrecen descripciones y recomendaciones de productos a clientes según su ubicación. La empresa quiere automatizar con FMs. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon Macie", "Amazon Transcribe", "Amazon Bedrock", "Amazon Textract"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock proporciona acceso a FMs que pueden generar descripciones y recomendaciones de productos contextualizadas, automatizando el proceso de atención al cliente."}, {"id": 142, "text": "Una empresa quiere detectar datos confidenciales en correos de clientes subidos a S3 y recibir alertas, con mínimo esfuerzo de desarrollo. ¿Qué solución cumple estos requisitos?", "options": ["Configure Amazon Macie para detectar información confidencial en S3", "Use endpoints de SageMaker con un LLM para censurar datos", "Desarrolle múltiples patrones de expresiones regulares", "Pida a los clientes evitar compartir información confidencial"], "correct": [0], "multi": false, "explanation": "Amazon Macie usa ML para detectar automáticamente datos confidenciales (PII, financieros, etc.) en S3 y genera alertas, requiriendo mínima configuración y sin desarrollo personalizado."}, {"id": 143, "text": "¿Cuál es la asociación correcta de técnicas de ingeniería de indicaciones?", "options": ["'Clasifica el texto como deportes/política/entretenimiento' = Zero-shot; '[imagen 1, 2, 3] son ejemplos, clasifica esta imagen' = Few-shot; 'Piensa paso a paso' = Chain-of-thought", "'Clasifica el texto' = Few-shot; '[imágenes ejemplos]' = Zero-shot; 'Paso a paso' = Chain-of-thought", "Todos son Zero-shot", "Todos son Chain-of-thought"], "correct": [0], "multi": false, "explanation": "Zero-shot = sin ejemplos, solo instrucción. Few-shot = con ejemplos de la tarea. Chain-of-thought = pide razonamiento paso a paso. Cada técnica tiene un propósito diferente."}, {"id": 144, "text": "¿Cuál es la asociación correcta de políticas de filtrado de Amazon Bedrock Guardrails?", "options": ["Bloquear contenido dañino = Filtros de contenido; Evitar temas ilegales = Temas denegados; Términos ofensivos = Filtros de palabras; Info no fundamentada = Verificación contextual", "Bloquear contenido = Temas denegados; Temas ilegales = Filtros de contenido; Términos = Verificación contextual", "Todos son Filtros de contenido", "Bloquear = Verificación contextual; Temas = Filtros de palabras"], "correct": [0], "multi": false, "explanation": "Filtros de contenido = odio/violencia. Temas denegados = áreas específicas como asesoría legal. Filtros de palabras = términos específicos. Verificación contextual = información no fundamentada en la fuente."}, {"id": 145, "text": "¿Qué ventaja ofrece usar las Model Cards de Amazon SageMaker para documentar modelos de IA?", "options": ["Proporciona un resumen visualmente atractivo", "Estandarizar la información sobre propósito, rendimiento y limitaciones de un modelo", "Reducir los requisitos computacionales del modelo", "Almacenamiento físico de modelos para archivo"], "correct": [1], "multi": false, "explanation": "Las Model Cards estandarizan la documentación de modelos de ML, proporcionando un formato consistente para describir propósito, rendimiento, limitaciones y consideraciones éticas."}, {"id": 146, "text": "¿Qué mide una puntuación F1 en el contexto del rendimiento de un FM?", "options": ["Precisión y exhaustividad del modelo", "Velocidad del modelo en la generación de respuestas", "Costo financiero de operar el modelo", "Eficiencia energética de los cálculos del modelo"], "correct": [0], "multi": false, "explanation": "La puntuación F1 es la media armónica de precisión (precision) y exhaustividad (recall), proporcionando un balance entre ambas métricas para evaluar el rendimiento del modelo."}, {"id": 147, "text": "Una empresa quiere que agentes de atención respondan preguntas frecuentes que cambian con el tiempo, de forma rentable. ¿Qué estrategia cumple estos requisitos?", "options": ["Ajustar el modelo periódicamente", "Entrene el modelo usando datos de contexto", "Preentrenar y evaluar el modelo usando datos de contexto", "Utilice RAG con técnicas de ingeniería rápida"], "correct": [3], "multi": false, "explanation": "RAG con ingeniería de prompts es la opción más rentable para FAQs que cambian frecuentemente — solo se actualiza la base de conocimiento sin necesidad de reentrenar el modelo."}, {"id": 148, "text": "Una empresa desarrolló un sistema de selección de currículos con IA entrenado con datos que no representaban a todos los grupos demográficos. ¿Qué dimensión de IA responsable se observa?", "options": ["Equidad", "Explicabilidad", "Privacidad y seguridad", "Transparencia"], "correct": [0], "multi": false, "explanation": "La equidad (fairness) en IA requiere que los sistemas funcionen bien para todos los grupos. Datos no representativos generan modelos sesgados que discriminan injustamente."}, {"id": 149, "text": "Una empresa financiera global quiere monitorear fases de desarrollo de una app ML y garantizar cumplimiento normativo. ¿Qué servicios ayudarán a evaluar requisitos de cumplimiento? (Seleccione dos)", "options": ["AWS Audit Manager", "AWS Config", "Amazon Inspector", "Amazon CloudWatch", "AWS CloudTrail"], "correct": [0, 1], "multi": true, "explanation": "AWS Audit Manager automatiza la recopilación de evidencia para auditorías de cumplimiento. AWS Config registra y evalúa las configuraciones de recursos contra reglas de cumplimiento definidas."}, {"id": 150, "text": "Una empresa quiere mejorar la precisión de una app de IA generativa con Bedrock de la forma más rentable. ¿Qué solución cumple estos requisitos?", "options": ["Ajustar la FM", "Recapacitar al FM", "Capacitar a un nuevo FM", "Utilice ingeniería rápida"], "correct": [3], "multi": false, "explanation": "La ingeniería de prompts es la forma más económica de mejorar la precisión — no requiere reentrenamiento ni infraestructura adicional, solo refinamiento de las instrucciones al modelo."}, {"id": 151, "text": "Una empresa quiere identificar lenguaje ofensivo en comentarios de redes sociales sin usar datos etiquetados. ¿Qué estrategia debe usar?", "options": ["Use la moderación de Amazon Rekognition", "Use la herramienta de detección de toxicidad Amazon Comprehend", "Use los algoritmos integrados de SageMaker para entrenar el modelo", "Use Amazon Polly para supervisar los comentarios"], "correct": [1], "multi": false, "explanation": "Amazon Comprehend tiene capacidades preentrenadas de detección de toxicidad que funcionan sin datos etiquetados propios, siendo la solución más directa para este caso."}, {"id": 152, "text": "Una empresa de medios quiere observar si la calidad de su modelo ML varía con el tiempo. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon Rekognition", "Amazon SageMaker Clarify", "Amazon Comprehend", "Amazon SageMaker Model Monitor"], "correct": [3], "multi": false, "explanation": "SageMaker Model Monitor detecta automáticamente la degradación del rendimiento del modelo y el data drift en producción, alertando cuando la calidad varía con el tiempo."}, {"id": 153, "text": "Una empresa implementa modelos de IA/ML y quiere ofrecer transparencia en los procesos de toma de decisiones. ¿Qué servicio cumple estos requisitos?", "options": ["Tarjetas modelo de Amazon SageMaker", "Amazon Rekognition", "Amazon Comprehend", "Amazon Lex"], "correct": [0], "multi": false, "explanation": "Las Model Cards de SageMaker documentan el propósito, rendimiento y limitaciones del modelo, proporcionando transparencia sobre cómo toma decisiones para usuarios y partes interesadas."}, {"id": 154, "text": "Una empresa manufacturera quiere crear descripciones de productos en varios idiomas. ¿Qué servicio de AWS automatizará esta tarea?", "options": ["Amazon Translate", "Amazon Transcribe", "Amazon Kendra", "Amazon Polly"], "correct": [0], "multi": false, "explanation": "Amazon Translate es el servicio de traducción automática de AWS que convierte texto entre idiomas de forma automática, ideal para crear descripciones multilingüe de productos."}, {"id": 155, "text": "¿Cuál es la asociación correcta de metodologías de personalización de modelos?", "options": ["Enseñar nueva tarea específica = Fine-tuning; Pocos datos etiquetados, necesita más = Data augmentation; Solo datos sin etiquetar = Continued pre-training", "Fine-tuning para todo tipo de datos", "Continued pre-training para datos etiquetados", "RAG para todos los casos"], "correct": [0], "multi": false, "explanation": "Fine-tuning = datos etiquetados para tarea específica. Data augmentation = cuando hay pocos datos, se generan más. Continued pre-training = datos sin etiquetar para conocimiento de dominio general."}, {"id": 156, "text": "¿Qué función de AWS registra detalles sobre los datos de instancias de ML para gobernanza e informes?", "options": ["Tarjetas modelo de Amazon SageMaker", "Depurador de Amazon SageMaker", "Monitor modelo Amazon SageMaker", "Amazon SageMaker JumpStart"], "correct": [0], "multi": false, "explanation": "Las Model Cards de SageMaker registran información detallada sobre el modelo (datos usados, métricas, limitaciones) para propósitos de gobernanza, auditoría e informes."}, {"id": 157, "text": "¿Cuál de las siguientes opciones representa un uso de modelos de IA generativa en una empresa financiera?", "options": ["Resumen de las quejas de los clientes", "Clasificación de clientes según uso del producto", "Segmentación de clientes por tipo de inversión", "Previsión de ingresos para determinados productos"], "correct": [0], "multi": false, "explanation": "El resumen de texto es una capacidad fundamental de la IA generativa (LLMs). Las otras opciones son casos de uso de ML tradicional (clasificación, segmentación, forecasting)."}, {"id": 158, "text": "Una empresa médica quiere extraer información de historiales clínicos y generar resúmenes concisos. ¿Qué solución cumple estos requisitos?", "options": ["Use Amazon Comprehend Medical para extraer entidades y relaciones médicas. Aplique lógica para estructurar resúmenes", "Use Amazon Personalize para analizar patrones de pacientes", "Use Amazon Textract para convertir documentos a texto digital y extraer palabras clave", "Implemente Amazon Kendra para búsqueda en registros médicos"], "correct": [0], "multi": false, "explanation": "Amazon Comprehend Medical extrae entidades médicas específicas (diagnósticos, medicamentos, síntomas) de historiales clínicos, siendo la herramienta más adecuada para este dominio."}, {"id": 159, "text": "¿Qué opción describe las incrustaciones en el contexto de la IA?", "options": ["Un método para comprimir grandes conjuntos de datos", "Un método de cifrado para proteger datos confidenciales", "Un método para visualizar datos de alta dimensión", "Un método numérico para la representación de datos en un espacio de dimensionalidad reducida"], "correct": [3], "multi": false, "explanation": "Las incrustaciones convierten datos de alta dimensionalidad (como palabras) en vectores numéricos de dimensionalidad reducida que capturan relaciones semánticas y son procesables por modelos de IA."}, {"id": 160, "text": "Una app de IA para resumir libros falla con algunos libros. ¿Por qué falla la aplicación en esos casos?", "options": ["La temperatura está configurada demasiado alta", "El modelo seleccionado no admite ajustes finos", "El valor P superior es demasiado alto", "Los tokens de entrada exceden el tamaño del contexto del modelo"], "correct": [3], "multi": false, "explanation": "Cada modelo tiene un límite de ventana de contexto (número máximo de tokens). Los libros más largos superan ese límite, causando que el modelo no pueda procesar toda la información."}, {"id": 161, "text": "Una aerolínea quiere un asistente de IA conversacional para responder preguntas sobre horarios, reservas y pagos usando LLMs y una base de conocimiento, con el MENOR esfuerzo de desarrollo. ¿Qué solución cumple estos requisitos?", "options": ["Modelos de entrenamiento en SageMaker Autopilot", "Desarrollar un agente RAG usando Amazon Bedrock", "Crea una aplicación Python usando Amazon Q Developer", "Ajuste los modelos en Amazon SageMaker JumpStart"], "correct": [1], "multi": false, "explanation": "Bedrock Agents con bases de conocimiento implementa RAG de forma integrada, permitiendo crear chatbots conversacionales con mínimo esfuerzo de desarrollo sin gestionar infraestructura."}, {"id": 162, "text": "¿Para qué se utiliza la tokenización en el procesamiento del lenguaje natural?", "options": ["Para cifrar datos de texto", "Para comprimir archivos de texto", "Dividir el texto en unidades más pequeñas para su procesamiento", "Traducir texto entre idiomas"], "correct": [2], "multi": false, "explanation": "La tokenización divide el texto en unidades procesables (tokens) que pueden ser palabras, subpalabras o caracteres. Es el primer paso del procesamiento de texto en NLP."}, {"id": 163, "text": "¿Cuál es una característica de los modelos de lenguaje basados en transformadores?", "options": ["Utilizan capas convolucionales para aplicar filtros", "Solo pueden procesar datos de texto", "Utilizan mecanismos de autoatención para capturar relaciones contextuales", "Procesan secuencias elemento por elemento en iteraciones cíclicas"], "correct": [2], "multi": false, "explanation": "El mecanismo de autoatención (self-attention) es la característica definitoria de los transformadores — permite al modelo entender las relaciones contextuales entre todas las palabras de una secuencia simultáneamente."}, {"id": 164, "text": "Una empresa financiera quiere expandirse a una nueva zona geográfica con sistemas de IA para calificación crediticia. ¿Qué leyes de cumplimiento debe revisar?", "options": ["Leyes locales de protección de datos sanitarios", "Leyes locales de protección de datos de tarjetas de pago", "Leyes locales de privacidad en materia de educación", "Leyes locales de responsabilidad sobre algoritmos"], "correct": [3], "multi": false, "explanation": "Las leyes de responsabilidad sobre algoritmos regulan el uso de IA en decisiones automatizadas que afectan a personas (como crédito). Son las más relevantes para sistemas de calificación crediticia."}, {"id": 165, "text": "Una empresa quiere usar Amazon Bedrock Guardrails para detectar y filtrar entradas y salidas dañinas. ¿Qué categorías puede filtrar Guardrails? (Seleccione dos)", "options": ["Odio", "Política", "Violencia", "Juegos de azar", "Religión"], "correct": [0, 2], "multi": true, "explanation": "Amazon Bedrock Guardrails filtra categorías de contenido dañino incluyendo odio (hate speech) y violencia. La política, los juegos de azar y la religión no son categorías predefinidas de filtrado de Guardrails."}, {"id": 166, "text": "¿Qué escenario describe un riesgo potencial de la ingeniería rápida en el contexto de un modelo de IA generativa?", "options": ["La ingeniería rápida no garantiza que el modelo produzca resultados consistentes", "La ingeniería rápida podría exponer el modelo a vulnerabilidades como ataques de inyección rápida", "Las indicaciones diseñadas correctamente reducen pero no eliminan el riesgo de contaminación", "La ingeniería rápida no garantiza resultados altamente confiables con datos del mundo real"], "correct": [1], "multi": false, "explanation": "Los ataques de inyección de prompts pueden explotar el sistema de ingeniería rápida para manipular el comportamiento del modelo, siendo el principal riesgo de seguridad de esta técnica."}, {"id": 167, "text": "Una editorial con solución RAG publica contenido nuevo diariamente y quiere experiencia casi en tiempo real. ¿Qué pasos del proceso RAG debe implementar mediante procesamiento por lotes sin conexión? (Seleccione dos)", "options": ["Generación de incrustaciones de contenido", "Generación de incrustaciones para consultas de usuario", "Creación del índice de búsqueda", "Recuperación de contenido relevante", "Generación de respuesta para el usuario"], "correct": [0, 2], "multi": true, "explanation": "Las incrustaciones del contenido y el índice de búsqueda se pueden pre-calcular en batch cuando se publica nuevo contenido. Las incrustaciones de consultas y la recuperación/generación ocurren en tiempo real."}, {"id": 168, "text": "¿Qué técnica divide una tarea compleja en subtareas más pequeñas que se envían secuencialmente a un LLM?", "options": ["Indicación de una sola vez", "Encadenamiento de indicaciones", "Árbol de los pensamientos", "RAG"], "correct": [1], "multi": false, "explanation": "El encadenamiento de indicaciones (prompt chaining) divide tareas complejas en pasos secuenciales, donde el output de cada paso se convierte en input del siguiente, manejando problemas complejos."}, {"id": 169, "text": "Un profesional de IA necesita mejorar la precisión de un modelo de generación de lenguaje natural que usa datos de inventario que cambian rápidamente. ¿Qué técnica mejorará la precisión?", "options": ["Aprendizaje por transferencia", "Aprendizaje federado", "RAG", "Indicaciones de una sola vez"], "correct": [2], "multi": false, "explanation": "RAG conecta el modelo a datos externos actualizados en tiempo real (como inventario), asegurando que las respuestas siempre reflejen la información más reciente sin necesitar reentrenamiento."}, {"id": 170, "text": "Una empresa quiere colaborar con institutos de investigación y necesita documentación estandarizada para seguimiento de versiones del modelo. ¿Qué solución cumple estos requisitos?", "options": ["Realice seguimiento de cambios usando Git", "Use Amazon Fraud Detector", "Use las Model Cards de Amazon SageMaker", "Use Amazon Comprehend"], "correct": [2], "multi": false, "explanation": "Las Model Cards de SageMaker proporcionan un formato estandarizado para documentar y versionar modelos, incluyendo información sobre entrenamiento, rendimiento y limitaciones para colaboración."}, {"id": 171, "text": "Una empresa quiere identificar cambios en la calidad del modelo original para resolver problemas. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon SageMaker JumpStart", "Amazon SageMaker HyperPod", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Model Monitor"], "correct": [3], "multi": false, "explanation": "SageMaker Model Monitor supervisa continuamente los modelos en producción, detectando cambios en la calidad (data drift, degradación del rendimiento) y generando alertas automáticas."}, {"id": 172, "text": "¿Cuál es el propósito de la segmentación (chunking) en la Generación Aumentada de Recuperación?", "options": ["Para evitar las limitaciones de almacenamiento de la base de datos", "Para evitar la necesidad de convertir textos extensos en embeddings vectoriales", "Mejorar la relevancia contextual de los resultados obtenidos del índice vectorial", "Disminuir el costo de almacenamiento"], "correct": [2], "multi": false, "explanation": "Dividir documentos en chunks más pequeños permite recuperar solo las secciones más relevantes para cada consulta, mejorando la precisión y relevancia contextual de las respuestas RAG."}, {"id": 173, "text": "Una empresa con bajo uso inicial quiere minimizar costos en su app de asistente editorial con IA generativa. ¿Qué solución cumplirá estos requisitos?", "options": ["Utilice instancias de Amazon EC2 con GPU", "Utilice Amazon Bedrock con rendimiento aprovisionado", "Utilice Amazon Bedrock con rendimiento bajo demanda", "Utilice Amazon SageMaker JumpStart"], "correct": [2], "multi": false, "explanation": "El rendimiento bajo demanda (on-demand) en Bedrock cobra solo por uso real, sin compromisos. Ideal para uso impredecible o bajo — el rendimiento aprovisionado requiere pago mínimo garantizado."}, {"id": 174, "text": "Una app RAG en Bedrock para boletines financieros tiene sesgo político en el contenido. ¿Qué medida de seguridad de Bedrock puede identificar y filtrar este contenido?", "options": ["Filtros de palabras", "Temas rechazados", "Filtros de información sensible", "Filtros de contenido"], "correct": [1], "multi": false, "explanation": "Los temas rechazados (denied topics) en Bedrock Guardrails permiten configurar áreas temáticas específicas (como política) que el modelo debe evitar, bloqueando respuestas sobre esos temas."}, {"id": 175, "text": "Una empresa de detección de fraude quiere minimizar el tiempo que los empleados dedican a revisar casos que en realidad no son fraudulentos. ¿Qué métrica de evaluación cumple estos requisitos?", "options": ["Recall (Exhaustividad)", "Precisión (Precision)", "Accuracy (Exactitud)", "Tabla de elevación"], "correct": [1], "multi": false, "explanation": "La precisión (precision) mide qué porcentaje de los casos marcados como fraude son realmente fraudes. Alta precisión = menos falsos positivos = menos tiempo revisando casos que no son fraude."}, {"id": 176, "text": "Una empresa diseñó un agente de IA para responder consultas sobre manuales de producto. ¿Qué estrategia puede mejorar la confianza en las respuestas?", "options": ["Escribir el nivel de confianza en la respuesta", "Incluir enlaces a los manuales de productos mencionados en la respuesta", "Diseñar un avatar de agente que parezca una computadora", "Capacitar al agente para responder en el estilo de lenguaje de la empresa"], "correct": [1], "multi": false, "explanation": "Incluir referencias y enlaces a las fuentes (manuales) permite a los usuarios verificar la información, aumentando la confianza y la transparencia de las respuestas del agente."}, {"id": 177, "text": "Un hospital desarrolló un sistema de IA para recomendaciones de tratamiento que explica el fundamento y hace la información accesible. ¿Qué principio de diseño centrado en el humano se observa?", "options": ["Explicabilidad", "Privacidad y seguridad", "Equidad", "Gobernanza de datos"], "correct": [0], "multi": false, "explanation": "La explicabilidad (explainability) es el principio de IA responsable que requiere que los sistemas puedan explicar sus decisiones de forma comprensible tanto para médicos como para pacientes."}, {"id": 178, "text": "¿Qué afirmación presenta una ventaja del uso de RAG para tareas de PLN?", "options": ["RAG puede usar fuentes de conocimiento externas para generar respuestas más precisas e informativas", "RAG mejora la velocidad de entrenamiento de los modelos de lenguaje", "RAG se usa principalmente para reconocimiento de voz", "RAG es una técnica para el aumento de datos en visión por computadora"], "correct": [0], "multi": false, "explanation": "La principal ventaja de RAG es que permite al modelo acceder a conocimiento externo actualizado en tiempo real, generando respuestas más precisas sin necesitar reentrenamiento."}, {"id": 179, "text": "Una empresa creó un modelo personalizado mediante fine-tuning de un LLM de Bedrock y quiere desplegarlo para gestionar un flujo constante de solicitudes. ¿Qué solución cumple estos requisitos de forma rentable?", "options": ["Implemente usando una instancia de EC2 optimizada", "Use el modelo con rendimiento bajo demanda en Bedrock", "Almacene el modelo en S3 y alójelo usando Lambda", "Adquiera el rendimiento aprovisionado para el modelo en Amazon Bedrock"], "correct": [3], "multi": false, "explanation": "Para flujos constantes y predecibles de solicitudes, el rendimiento aprovisionado en Bedrock es más rentable que on-demand — ofrece capacidad garantizada y menor costo por solicitud a alto volumen."}, {"id": 180, "text": "¿Qué técnica consiste en entrenar modelos de IA con datasets etiquetados para adaptarlos a terminología específica de la industria?", "options": ["Aumento de datos", "Ajuste fino (Fine-tuning)", "Cuantización del modelo", "Preentrenamiento continuo"], "correct": [1], "multi": false, "explanation": "El fine-tuning adapta un modelo preentrenado a un dominio específico usando datos etiquetados del sector, mejorando su rendimiento en la terminología y casos de uso particulares de esa industria."}, {"id": 181, "text": "Una empresa quiere mejorar la precisión de su agente en Bedrock Agents proporcionándole ejemplos específicos. ¿Qué solución cumple estos requisitos?", "options": ["Modifique las indicaciones avanzadas para incluir los ejemplos", "Cree una barrera de seguridad para el agente con los ejemplos", "Utilice SageMaker Ground Truth para etiquetar los ejemplos", "Ejecuta un script en Lambda que agregue los ejemplos al dataset"], "correct": [0], "multi": false, "explanation": "Las indicaciones avanzadas (advanced prompts) en Bedrock Agents permiten personalizar el comportamiento del agente incluyendo ejemplos específicos y contexto adicional."}, {"id": 182, "text": "¿Qué ventaja ofrece usar infraestructura como código (IaC) en las MLOps?", "options": ["IaC elimina la necesidad de ajustar hiperparámetros", "IaC siempre proporciona instancias potentes para entrenamiento más preciso", "IaC simplifica la implementación de cargas de trabajo ML escalables y consistentes en entornos de nube", "IaC minimiza los gastos al desplegar únicamente instancias de bajo costo"], "correct": [2], "multi": false, "explanation": "IaC (como CloudFormation o Terraform) permite definir y versionar la infraestructura ML de forma reproducible, facilitando despliegues consistentes en múltiples entornos con mínimo esfuerzo."}, {"id": 183, "text": "Una empresa quiere hacer fine-tuning basado en instrucciones a un FM. ¿Cómo debe preparar los datos de entrenamiento?", "options": ["Reúna documentos internos y materiales del sector en un único archivo", "Recopile reseñas externas y etiquételas como positivas o negativas", "Cree pares de preguntas y respuestas sobre temas relacionados con el sector", "Cree indicaciones con pocos ejemplos para instruir al modelo"], "correct": [2], "multi": false, "explanation": "El fine-tuning basado en instrucciones requiere pares de instrucción-respuesta (prompt-completion) específicos del dominio. Los pares de preguntas y respuestas del sector son exactamente este formato."}, {"id": 184, "text": "¿Qué técnica de ML garantiza el cumplimiento y la privacidad de los datos al entrenar modelos de IA en AWS?", "options": ["Aprendizaje por refuerzo", "Aprendizaje por transferencia", "Aprendizaje federado", "Aprendizaje no supervisado"], "correct": [2], "multi": false, "explanation": "El aprendizaje federado entrena modelos en los datos localmente sin mover los datos a un servidor central, garantizando la privacidad y cumplimiento al mantener los datos en su origen."}, {"id": 185, "text": "¿Cuál es la asociación correcta de métodos de personalización de modelos base en Bedrock?", "options": ["Mejorar rendimiento en tareas específicas con datos etiquetados = Fine-tuning; Conocimiento de dominio con documentos sin etiquetar = Continued pre-training; Reentrenar con datos sin etiquetar = Continued pre-training", "Fine-tuning para todo; RAG para conocimiento de dominio", "Continued pre-training para todo", "Destilación para datos etiquetados"], "correct": [0], "multi": false, "explanation": "Fine-tuning = datos etiquetados para tarea específica. Continued pre-training = datos sin etiquetar para conocimiento de dominio general. Ambos son métodos de personalización según el tipo de datos disponibles."}, {"id": 186, "text": "Una empresa manufacturera quiere escalar lógica compleja de procesamiento de quejas a diferentes mercados. ¿Qué ventaja ofrece la IA generativa?", "options": ["Previsibilidad de los resultados", "Adaptabilidad", "Menor sensibilidad a los cambios en las entradas", "Explicabilidad"], "correct": [1], "multi": false, "explanation": "La adaptabilidad es la ventaja clave de la IA generativa — puede manejar variaciones en el lenguaje, mercados y tipos de quejas sin necesitar reglas específicas para cada caso."}, {"id": 187, "text": "Una empresa financiera quiere clasificar toda la actividad con tarjetas de crédito como fraudulenta o no fraudulenta. ¿Qué tipo de modelo cumple estos requisitos?", "options": ["Regresión", "Difusión", "Clasificación binaria", "Clasificación multiclase"], "correct": [2], "multi": false, "explanation": "La clasificación binaria tiene exactamente dos clases de salida: fraude / no fraude. Es el modelo estándar para detección de fraude en transacciones."}, {"id": 188, "text": "¿Cuál es la asociación correcta de características de IA responsable en el diseño de un chatbot?", "options": ["Anonimizar PII en preparación de datos = Privacidad y seguridad; Proporcionar decisiones explicables = Transparencia; Usar Guardrails para prevenir outputs dañinos = Seguridad", "Anonimizar PII = Transparencia; Decisiones explicables = Privacidad; Guardrails = Equidad", "Todos son Privacidad y seguridad", "Anonimizar = Equidad; Explicables = Seguridad; Guardrails = Transparencia"], "correct": [0], "multi": false, "explanation": "Anonimizar PII protege la privacidad y seguridad de datos. Las decisiones explicables garantizan transparencia. Los Guardrails implementan medidas de seguridad contra outputs dañinos."}, {"id": 189, "text": "Un hospital quiere usar IA generativa con función de conversión de voz a texto para mejorar el dictado de notas clínicas. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon Q Developer", "Amazon Polly", "Amazon Rekognition", "AWS HealthScribe"], "correct": [3], "multi": false, "explanation": "AWS HealthScribe es un servicio especializado que usa IA generativa para transcribir conversaciones médicas y generar notas clínicas estructuradas, diseñado específicamente para el sector salud."}, {"id": 190, "text": "¿Qué tipo de modelo de IA realiza predicciones numéricas?", "options": ["Difusión", "Regresión", "Transformador", "Multimodal"], "correct": [1], "multi": false, "explanation": "Los modelos de regresión predicen valores numéricos continuos (precio de una casa, temperatura, ventas). Son diferentes de los modelos de clasificación que predicen categorías."}, {"id": 191, "text": "¿Cuál es la asociación correcta de funciones de SageMaker para casos de uso específicos?", "options": ["Interfaz visual no-code = SageMaker Canvas; Solución preconfigurada para fraude = SageMaker JumpStart; Datasets etiquetados con humanos = SageMaker Ground Truth", "Canvas para todo; JumpStart para entrenamiento; Ground Truth para despliegue", "JumpStart para todo; Clarify para etiquetado", "Todos son SageMaker Autopilot"], "correct": [0], "multi": false, "explanation": "Canvas = interfaz no-code para usuarios sin ML. JumpStart = modelos y soluciones preconfiguradas. Ground Truth = etiquetado de datos con trabajadores humanos o ML asistido."}, {"id": 192, "text": "¿Cuál es el propósito de las incrustaciones vectoriales en un LLM?", "options": ["Dividir el texto en fragmentos de datos manejables", "Agrupar un conjunto de caracteres para tratarlos como una sola unidad", "Proporcionar la capacidad de comparar textos matemáticamente", "Proporcionar el recuento de cada palabra en la entrada"], "correct": [2], "multi": false, "explanation": "Las incrustaciones vectoriales representan palabras y textos como vectores numéricos, permitiendo operaciones matemáticas como similitud coseno para comparar semánticamente diferentes textos."}, {"id": 193, "text": "Una empresa quiere optimizar un FM con AWS garantizando que sus datos permanezcan privados en la región de AWS donde se almacenan, de forma rentable. ¿Qué combinación cumple estos requisitos? (Seleccione dos)", "options": ["Aloje el modelo en sus propias instalaciones usando AWS Outposts", "Utilice la API de Amazon Bedrock", "Utilice AWS PrivateLink y una VPC", "Alojar la API de Amazon Bedrock en las instalaciones", "Utilice los registros y métricas de Amazon CloudWatch"], "correct": [1, 2], "multi": true, "explanation": "La API de Bedrock procesa datos dentro de la región AWS sin moverlos. AWS PrivateLink asegura que las conexiones permanezcan dentro de la red de AWS sin pasar por internet público."}, {"id": 194, "text": "Una empresa financiera debe generar informes que demuestren cumplimiento de normativas internacionales sobre datos confidenciales. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon Macie", "AWS Artifact", "AWS Secrets Manager", "AWS Config"], "correct": [1], "multi": false, "explanation": "AWS Artifact proporciona acceso bajo demanda a informes de seguridad y cumplimiento de AWS y certificaciones de terceros (SOC, ISO, PCI) necesarios para demostrar cumplimiento normativo."}, {"id": 195, "text": "Una empresa médica quiere usar IA generativa para responder preguntas médicas de forma responsable. ¿Qué servicio debe usar para garantizar IA responsable?", "options": ["Amazon Bedrock Guardrails", "Amazon Inspector", "Amazon Rekognition", "AWS Trusted Advisor"], "correct": [0], "multi": false, "explanation": "Amazon Bedrock Guardrails permite implementar salvaguardas como filtros de contenido, temas denegados y verificación de base contextual para asegurar que la IA médica sea responsable y precisa."}, {"id": 196, "text": "¿Qué métrica se usa para evaluar el rendimiento de FMs en tareas de resumen de texto?", "options": ["Puntuación F1", "BLEU", "Precisión", "Error cuadrático medio"], "correct": [1], "multi": false, "explanation": "BLEU (Bilingual Evaluation Understudy) evalúa la calidad de texto generado comparando n-gramas con referencias humanas. Es la métrica estándar para evaluar resumen y traducción automática."}, {"id": 197, "text": "¿Cuál es el beneficio de hacer fine-tuning a un FM?", "options": ["El fine-tuning reduce el tamaño del FM y permite inferencia más lenta", "El fine-tuning usa datos específicos para reentrenar el FM desde cero", "El fine-tuning mantiene actualizado el conocimiento del FM mediante preentrenamiento", "El fine-tuning mejora el rendimiento del FM en una tarea específica mediante entrenamiento adicional con nuevos datos etiquetados"], "correct": [3], "multi": false, "explanation": "El fine-tuning añade una capa de entrenamiento adicional sobre el modelo preentrenado usando datos específicos del dominio, mejorando su rendimiento en esa tarea sin reentrenar desde cero."}, {"id": 198, "text": "Una empresa quiere mejorar las respuestas de su chatbot usando 100 ejemplos de conversaciones de alta calidad para incorporar el tono de la empresa. ¿Qué solución cumple estos requisitos?", "options": ["Utilice Amazon Personalize para generar respuestas", "Cree un trabajo de preentrenamiento de SageMaker HyperPod", "Aloje el modelo usando SageMaker y use TensorRT para despliegue de LLMs", "Crear un trabajo de fine-tuning de Amazon Bedrock"], "correct": [3], "multi": false, "explanation": "El fine-tuning en Amazon Bedrock con ejemplos de conversaciones de alta calidad es la forma de incorporar el tono y estilo específico de la empresa al modelo sin infraestructura compleja."}, {"id": 199, "text": "Un chatbot impulsado por IA que automatiza envíos de pedidos tiene una vulnerabilidad. ¿Cuál debe resolver antes de lanzarlo?", "options": ["Fuga de datos", "Inyección inmediata (Prompt injection)", "Alucinaciones del LLM", "Desviación conceptual"], "correct": [1], "multi": false, "explanation": "La inyección de prompts permite a usuarios maliciosos manipular el chatbot para realizar acciones no autorizadas (como modificar pedidos, cambiar datos). Es la vulnerabilidad más crítica para chatbots transaccionales."}, {"id": 200, "text": "Una empresa de redes sociales quiere impedir que usuarios publiquen contenido discriminatorio usando Amazon Bedrock. ¿Cómo puede usar Bedrock para esto?", "options": ["Brindar a los usuarios la posibilidad de interactuar según sus preferencias", "Bloquear las interacciones relacionadas con temas predefinidos", "Restringir las conversaciones a temas predefinidos", "Ofrecer una variedad de respuestas para que el usuario elija"], "correct": [1], "multi": false, "explanation": "Los Temas Denegados de Bedrock Guardrails permiten bloquear específicamente interacciones relacionadas con contenido discriminatorio u otros temas predefinidos que la empresa quiere prohibir."}, {"id": 201, "text": "Waftion ofrece una app donde usuarios introducen texto o adjuntan imagen para hacer una pregunta y reciben una respuesta escrita con explicación. ¿Qué tipo de modelo cumple estos requisitos?", "options": ["Modelo de visión por computadora", "Modelo de lenguaje multimodal de gran tamaño", "Modelo de difusión", "Modelo de conversión de texto a voz"], "correct": [1], "multi": false, "explanation": "Un LLM multimodal puede procesar múltiples tipos de entrada (texto e imágenes) y generar respuestas textuales, siendo exactamente lo que necesita la aplicación educativa."}, {"id": 202, "text": "¿En qué etapa del ciclo de vida del modelo de IA generativa se realizan las pruebas para examinar la precisión del modelo?", "options": ["Despliegue", "Selección de datos", "Ajuste fino", "Evaluación"], "correct": [3], "multi": false, "explanation": "La evaluación es la etapa donde se prueban y miden las capacidades del modelo usando métricas específicas antes de desplegarlo en producción."}, {"id": 203, "text": "¿Qué afirmación describe correctamente las incrustaciones en la IA generativa?", "options": ["Las incrustaciones representan los datos como vectores de alta dimensión que capturan relaciones semánticas", "La técnica de embeddings busca en los datos la información más útil para responder preguntas", "Las incrustaciones reducen los requisitos de hardware usando un tipo de datos menos preciso", "Las incrustaciones proporcionan la capacidad de almacenar y recuperar datos para IA generativa"], "correct": [0], "multi": false, "explanation": "Las incrustaciones son representaciones vectoriales que capturan relaciones semánticas — palabras similares tienen vectores similares, permitiendo al modelo entender el significado del lenguaje."}, {"id": 204, "text": "Una empresa quiere que las respuestas del LLM sean lo más deterministas y estables posible. ¿Qué solución cumple estos requisitos?", "options": ["Configure la temperatura en 0 al enviar la solicitud al LLM", "Agregar 'haga que su respuesta sea determinista' al final de la solicitud", "Agregar 'haga que su respuesta sea determinista' al principio del mensaje", "Configure la temperatura en 1 al enviar la solicitud al LLM"], "correct": [0], "multi": false, "explanation": "Temperatura = 0 hace que el modelo siempre elija el token más probable, produciendo respuestas deterministas y consistentes. Temperatura = 1 introduce máxima aleatoriedad."}, {"id": 205, "text": "Una empresa selecciona un modelo de IA generativa para una app que debe proporcionar respuestas en tiempo real. ¿Qué característica debe considerar?", "options": ["Complejidad del modelo", "Velocidad de innovación", "Velocidad de inferencia", "Tiempo de entrenamiento"], "correct": [2], "multi": false, "explanation": "La velocidad de inferencia determina qué tan rápido el modelo genera respuestas. Para aplicaciones en tiempo real, es la característica más crítica a considerar al seleccionar un modelo."}, {"id": 206, "text": "¿Qué término se refiere a las instrucciones que se dan a los FMs para que proporcionen una respuesta más precisa?", "options": ["Indicación (Prompt)", "Dirección", "Diálogo", "Traducción"], "correct": [0], "multi": false, "explanation": "Un prompt (indicación) es la entrada de texto que le damos al modelo con instrucciones, contexto y preguntas para guiar su respuesta hacia el resultado deseado."}, {"id": 207, "text": "Una empresa minorista quiere crear un modelo de recomendación de productos basado en prácticas responsables. ¿Qué práctica debe aplicar al recopilar datos para reducir el sesgo?", "options": ["Use únicamente datos de clientes que coincidan con las características demográficas generales", "Recopilar datos de clientes con historial de compras previo", "Asegúrese de que los datos sean equilibrados y se recopilen de un grupo diverso", "Asegúrese de que los datos provengan de un dataset disponible públicamente"], "correct": [2], "multi": false, "explanation": "Datos equilibrados y diversos representan adecuadamente a todos los grupos de clientes, reduciendo el riesgo de que el modelo favorezca o discrimine a ciertos segmentos."}, {"id": 208, "text": "Una empresa desarrolla un modelo de predicción de deserción de clientes. ¿Qué métrica de evaluación valorará el rendimiento en clasificación binaria?", "options": ["Puntuación F1", "Error cuadrático medio", "R cuadrado", "Tiempo empleado para entrenar el modelo"], "correct": [0], "multi": false, "explanation": "La puntuación F1 es la métrica estándar para clasificación binaria — combina precisión y recall para dar una visión balanceada del rendimiento, especialmente con clases desbalanceadas."}, {"id": 209, "text": "Un profesional de IA debe elegir una métrica que muestre la proporción de elementos clasificados correctamente sobre el total de clasificados. ¿Qué métrica cumple estos requisitos?", "options": ["Precisión (Accuracy)", "Precisión (Precision)", "Puntuación F1", "Recall (Exhaustividad)"], "correct": [0], "multi": false, "explanation": "La exactitud (accuracy) es la proporción de predicciones correctas sobre el total de predicciones — exactamente la métrica que describe la pregunta."}, {"id": 210, "text": "Una empresa de comercio electrónico recibe varios gigabytes de datos diarios y necesita inferencia una vez al día. ¿Qué tipo de inferencia cumple estos requisitos?", "options": ["Inferencia por lotes", "Inferencia asíncrona", "Inferencia en tiempo real", "Inferencia sin servidor"], "correct": [0], "multi": false, "explanation": "La inferencia por lotes procesa grandes volúmenes de datos de forma eficiente en un solo trabajo programado. Es ideal cuando no se necesitan resultados inmediatos y se procesan grandes cantidades periódicamente."}, {"id": 211, "text": "Una empresa detectó inconsistencias en las respuestas de su modelo de segmentación de clientes y quiere evaluar sesgo y desviación. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "Amazon SageMaker Model Cards", "Amazon SageMaker Feature Store"], "correct": [0], "multi": false, "explanation": "SageMaker Model Monitor detecta data drift y degradación del rendimiento en modelos de producción, siendo la herramienta correcta para identificar inconsistencias y desviaciones del modelo."}, {"id": 212, "text": "Una empresa quiere restringir el acceso de sus empleados a modelos específicos en Amazon Bedrock. ¿Qué solución cumple estos requisitos?", "options": ["Utilice políticas de AWS IAM para restringir el acceso a los modelos", "Utilice AWS STS para generar credenciales temporales para el uso del modelo", "Utilice roles de servicio IAM para restringir la suscripción al modelo", "Utilice Amazon Inspector para supervisar el acceso a los modelos"], "correct": [0], "multi": false, "explanation": "Las políticas de IAM permiten controlar granularmente qué usuarios o roles pueden acceder a qué modelos específicos en Amazon Bedrock mediante permisos de acción específicos."}, {"id": 213, "text": "¿Qué técnica de ML usa datos de entrenamiento etiquetados con los valores de salida correctos?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "Aprendizaje por transferencia"], "correct": [0], "multi": false, "explanation": "El aprendizaje supervisado requiere datasets con etiquetas (respuestas correctas) para cada ejemplo de entrenamiento, permitiendo al modelo aprender la relación entre entrada y salida."}, {"id": 214, "text": "¿Qué parámetro del LLM controla la cantidad de posibles tokens siguientes considerados en cada paso de generación?", "options": ["Número máximo de tokens", "Top K", "Temperatura", "Tamaño del lote"], "correct": [1], "multi": false, "explanation": "Top K limita la selección a los K tokens más probables en cada paso. Por ejemplo, Top K=50 significa que solo se consideran los 50 tokens más probables, controlando la diversidad del output."}, {"id": 215, "text": "Un chatbot con Amazon Lex y OpenSearch necesita convertir datos privados de la empresa a representación vectorial antes de almacenarlos. ¿Qué tipo de FM cumple estos requisitos?", "options": ["Modelo de autocompletado de texto", "Modelo de seguimiento de instrucciones", "Modelo de incrustaciones de texto", "Modelo de generación de imágenes"], "correct": [2], "multi": false, "explanation": "Los modelos de incrustaciones de texto convierten texto en vectores numéricos que capturan el significado semántico, permitiendo búsquedas de similitud en bases de datos vectoriales."}, {"id": 216, "text": "Una empresa quiere usar un LLM para generar descripciones de productos proporcionando ejemplos de descripciones con un formato determinado. ¿Qué técnica cumple estos requisitos?", "options": ["Indicaciones de disparo cero", "Inducción a la cadena de pensamiento", "Indicaciones de una sola vez", "Indicaciones con pocos disparos (Few-shot)"], "correct": [3], "multi": false, "explanation": "Few-shot prompting proporciona múltiples ejemplos del formato deseado antes de la nueva tarea, guiando al modelo para que siga el mismo patrón en las nuevas descripciones."}, {"id": 217, "text": "Un banco hace fine-tuning de un LLM en Bedrock y quiere asegurar que el modelo no revele datos privados de clientes. ¿Qué solución cumple estos requisitos?", "options": ["Utilice Amazon Bedrock Guardrails", "Elimine la información personal (PII) de los datos del cliente antes de hacer fine-tuning al LLM", "Aumentar el parámetro Top-K del LLM", "Almacene los datos en S3 y cifre antes de hacer fine-tuning"], "correct": [1], "multi": false, "explanation": "Eliminar PII de los datos de entrenamiento antes del fine-tuning asegura que el modelo nunca aprenda esa información privada, siendo la solución más efectiva en la fuente."}, {"id": 218, "text": "Un supermercado quiere un chatbot para ayudar a clientes a encontrar productos, que consulte inventario en tiempo real e indique la ubicación. ¿Qué técnica de ingeniería de mensajes debe usar?", "options": ["Indicaciones de disparo cero", "Indicaciones con pocos disparos", "De menor a mayor indicación", "Incitación al razonamiento y la acción (ReAct)"], "correct": [3], "multi": false, "explanation": "ReAct combina razonamiento y acción — permite al modelo razonar sobre qué hacer y luego actuar (consultar APIs de inventario en tiempo real) para proporcionar respuestas precisas y actualizadas."}, {"id": 219, "text": "Un supermercado quiere un chatbot que consulte inventario en tiempo real. ¿Qué técnica de mensajes debe usar? (variante)", "options": ["Indicaciones de disparo cero", "Indicaciones con pocos disparos", "De menor a mayor indicación", "Incitación al razonamiento y la acción (ReAct)"], "correct": [3], "multi": false, "explanation": "ReAct (Reasoning and Acting) es la técnica que permite al modelo razonar sobre qué pasos seguir y ejecutar acciones externas como consultar APIs, ideal para chatbots que necesitan datos en tiempo real."}, {"id": 220, "text": "Una empresa de animación quiere ofrecer subtítulos para su contenido. ¿Qué servicio de AWS cumple este requisito?", "options": ["Amazon Comprehend", "Amazon Polly", "Amazon Transcribe", "Amazon Translate"], "correct": [2], "multi": false, "explanation": "Amazon Transcribe convierte audio y video a texto, generando automáticamente transcripciones que pueden usarse como subtítulos. Polly hace lo contrario (texto a voz)."}, {"id": 221, "text": "Una empresa de comercio electrónico quiere agrupar a sus clientes según historial de compras y preferencias para personalizar la experiencia. ¿Qué técnica de ML debe usar?", "options": ["Clasificación", "Agrupación (Clustering)", "Regresión", "Generación de contenido"], "correct": [1], "multi": false, "explanation": "El clustering (agrupación) agrupa automáticamente clientes con comportamientos similares sin necesitar etiquetas previas — ideal para segmentación de clientes para personalización."}, {"id": 222, "text": "Una empresa quiere controlar el acceso de sus empleados a FMs disponibles públicamente. ¿Qué solución cumple estos requisitos?", "options": ["Analice los informes de costos en AWS Cost Explorer", "Descargue documentos de seguridad desde AWS Artifact", "Configure Amazon SageMaker JumpStart para restringir los FMs detectables", "Cree una solución de búsqueda híbrida usando Amazon OpenSearch Service"], "correct": [2], "multi": false, "explanation": "SageMaker JumpStart permite configurar qué modelos base son accesibles para los usuarios, controlando el acceso a FMs disponibles públicamente dentro de la organización."}, {"id": 223, "text": "Una empresa quiere evaluar su herramienta de traducción comparando sus respuestas con las de personas reales. ¿Qué estrategia debe usar?", "options": ["Use BLEU para estimar la calidad absoluta de traducción de los dos métodos", "Use BLEU para estimar la calidad relativa de traducción de los dos métodos", "Use BERTScore para estimar la calidad absoluta de traducción de los dos métodos", "Use BERTScore para estimar la calidad relativa de traducción de los dos métodos"], "correct": [1], "multi": false, "explanation": "BLEU mide la calidad relativa al comparar una traducción con referencias humanas. Al usarlo con dos métodos del mismo dataset, permite comparar cuál es mejor de forma relativa."}, {"id": 224, "text": "Un profesional de IA desea generar resultados más diversos y creativos a partir de un LLM. ¿Cómo debe ajustar el parámetro de inferencia?", "options": ["Aumentar el valor de la temperatura", "Disminuir el valor de Top K", "Aumentar la duración de la respuesta", "Disminuir la longitud de la indicación"], "correct": [0], "multi": false, "explanation": "Aumentar la temperatura incrementa la aleatoriedad del modelo, generando respuestas más diversas y creativas. A mayor temperatura, mayor variabilidad en los outputs generados."}, {"id": 225, "text": "Una empresa tiene modelos de visión artificial personalizados y necesita una interfaz fácil de usar para etiquetado de datos minimizando errores del modelo. ¿Qué servicio cumple estos requisitos?", "options": ["Amazon SageMaker Ground Truth", "Amazon SageMaker Canvas", "Amazon Bedrock Playground", "Amazon Bedrock Agents"], "correct": [0], "multi": false, "explanation": "SageMaker Ground Truth proporciona flujos de trabajo de etiquetado asistido por ML con revisión humana, ofreciendo una interfaz fácil de usar que minimiza errores en el etiquetado."}, {"id": 226, "text": "Una empresa de reclutamiento quiere mitigar riesgos de sesgo y garantizar IA responsable en decisiones de contratación. ¿Qué dimensiones de IA responsable debe considerar? (Elija dos)", "options": ["Equidad", "Tolerancia", "Flexibilidad", "Código abierto", "Transparencia"], "correct": [0, 4], "multi": true, "explanation": "La equidad asegura que el sistema no discrimine por género, raza u otros atributos protegidos. La transparencia permite entender y auditar las decisiones del sistema — ambas críticas en contratación."}, {"id": 227, "text": "Una empresa quiere evaluar la precisión con que su modelo de predicción de deserción predice el comportamiento real. ¿Qué métrica cumple estos requisitos?", "options": ["RMSE", "ROI", "Puntuación F1", "BLEU"], "correct": [2], "multi": false, "explanation": "La puntuación F1 es la métrica estándar para evaluar modelos de clasificación binaria como predicción de deserción, balanceando precisión y recall para dar una evaluación completa."}, {"id": 228, "text": "Una empresa quiere que su FM incluya más contexto usando información corporativa de forma rentable. ¿Qué solución cumple estos requisitos?", "options": ["Utilice las bases de conocimiento de Amazon Bedrock", "Elija un FM diferente en Amazon Bedrock", "Utilice agentes de Amazon Bedrock", "Implementar un modelo personalizado en Amazon Bedrock"], "correct": [0], "multi": false, "explanation": "Las Bases de Conocimiento de Bedrock indexan información corporativa y la recuperan en tiempo real (RAG), siendo la forma más rentable de agregar contexto sin reentrenar el modelo."}, {"id": 229, "text": "¿Cuál es la asociación correcta de funciones de SageMaker para el ciclo de vida del modelo de IA?", "options": ["Gestionar versiones del modelo = SageMaker Model Registry; Usar modelo para predicciones = SageMaker Serverless Inference", "Model Registry para todo; Canvas para inferencia", "JumpStart para versiones; Autopilot para inferencia", "Clarify para versiones; Model Monitor para despliegue"], "correct": [0], "multi": false, "explanation": "Model Registry gestiona versiones, aprobaciones y metadatos de modelos. Serverless Inference despliega modelos para hacer predicciones sin gestionar servidores."}, {"id": 230, "text": "Una empresa de servicios de alimentación quiere recopilar datos que incluyan preferencias de todos los grupos demográficos. ¿Qué característica del dataset representa este escenario?", "options": ["Precisión", "Diversidad", "Sesgo de actualidad", "Fiabilidad"], "correct": [1], "multi": false, "explanation": "La diversidad en los datos asegura que el dataset represente adecuadamente a todos los grupos demográficos, siendo fundamental para crear modelos justos y equitativos."}, {"id": 231, "text": "Una empresa quiere crear un chatbot de RR.HH. que responda preguntas sobre políticas usando un LLM y amplia documentación digital. ¿Qué técnica debe usar para optimizar las respuestas?", "options": ["Utilice RAG", "Utilice indicaciones con pocos ejemplos", "Ajuste la temperatura a 1", "Disminuir el tamaño del token"], "correct": [0], "multi": false, "explanation": "RAG conecta el LLM a la base de documentación de RR.HH., permitiendo respuestas precisas y actualizadas basadas en las políticas reales sin necesitar reentrenar el modelo."}, {"id": 232, "text": "Una empresa educativa quiere un chatbot para adolescentes con lenguaje creativo y palabras abreviadas. ¿Qué métrica evaluará el rendimiento?", "options": ["Puntuación F1", "Puntuación BERTScore", "ROUGE", "BLEU"], "correct": [1], "multi": false, "explanation": "BERTScore evalúa la similitud semántica usando representaciones contextuales de BERT, pudiendo capturar similitudes semánticas incluso con ortografía creativa o palabras abreviadas."}, {"id": 233, "text": "Un equipo quiere una app que analice opiniones de clientes y las clasifique en categorías como calidad del producto, atención y experiencia de entrega. ¿Qué concepto de IA representa?", "options": ["Visión por computadora", "Procesamiento del lenguaje natural (PLN)", "Sistemas de recomendación", "Detección de fraude"], "correct": [1], "multi": false, "explanation": "El PLN (NLP) es el campo de IA que analiza y comprende texto en lenguaje humano. La clasificación de opiniones de clientes en categorías es una tarea clásica de NLP."}, {"id": 234, "text": "Una empresa de servicios financieros quiere que su chatbot generativo proporcione respuestas veraces para cumplimiento normativo. ¿Qué solución evita que el FM genere alucinaciones?", "options": ["Use AWS Config para consultar metadatos de cumplimiento", "Configure Amazon Bedrock Guardrails para evaluar entradas y respuestas", "Utilice Amazon Fraud Detector para detectar actividades fraudulentas", "Use AWS Audit Manager para preparar informes de auditoría"], "correct": [1], "multi": false, "explanation": "Bedrock Guardrails incluye verificación de base contextual que evalúa si las respuestas están fundamentadas en las fuentes de datos autorizadas, reduciendo las alucinaciones."}, {"id": 235, "text": "¿Cuál es la asociación correcta de tipos de modelos para crear contenido publicitario?", "options": ["Imágenes desde eslóganes = Modelo de difusión; Eslóganes contextuales = Modelo basado en Transformer; Colocación de elementos de marca = Detección de objetos", "Todo con modelos de difusión", "Transformer para imágenes; Difusión para texto; GAN para detección", "Todos con modelos de generación de imágenes"], "correct": [0], "multi": false, "explanation": "Modelos de difusión generan imágenes de alta calidad desde texto. Transformers generan texto contextual (eslóganes). Detección de objetos localiza y posiciona elementos específicos en imágenes."}, {"id": 236, "text": "Una empresa necesita almacenar, gestionar y versionar sus modelos de ML. ¿Qué servicio o función de AWS cumple estos requisitos?", "options": ["AWS Audit Manager", "Amazon SageMaker Model Monitor", "Amazon SageMaker Model Registry", "Amazon SageMaker Canvas"], "correct": [2], "multi": false, "explanation": "SageMaker Model Registry es el repositorio centralizado para almacenar, versionar, aprobar y gestionar el ciclo de vida de los modelos ML en Amazon SageMaker."}, {"id": 237, "text": "Un profesional de IA quiere brindar transparencia y explicabilidad al modelo para las partes interesadas. ¿Qué solución cumplirá estos requisitos?", "options": ["Presente los valores de Shapley del modelo", "Proporcione la medida de precisión del modelo", "Proporcione la matriz de confusión del modelo", "Proporcione un endpoint seguro para la inferencia"], "correct": [0], "multi": false, "explanation": "Los valores SHAP (SHapley Additive exPlanations) explican la contribución de cada característica a la predicción del modelo, siendo la herramienta estándar de XAI (IA explicable) para partes interesadas."}, {"id": 238, "text": "Una app de ML debe agrupar automáticamente clientes y productos similares según sus características. ¿Qué estrategia de ML debe usar?", "options": ["Aprendizaje no supervisado", "Aprendizaje supervisado", "Aprendizaje por refuerzo", "Aprendizaje semisupervisado"], "correct": [0], "multi": false, "explanation": "El aprendizaje no supervisado (clustering) descubre automáticamente grupos y patrones en los datos sin necesitar etiquetas predefinidas — ideal para agrupar clientes y productos."}, {"id": 239, "text": "Una agencia de noticias publica artículos en inglés y quiere que estén disponibles en otros idiomas. ¿Qué solución cumple estos requisitos?", "options": ["Añadir Amazon Transcribe al sitio web", "Utilice la función de traducción en tiempo real de Amazon Translate", "Añadir Amazon Personalize al sitio web", "Utilice Amazon Textract para procesamiento de documentos"], "correct": [1], "multi": false, "explanation": "Amazon Translate ofrece traducción en tiempo real de texto entre idiomas, siendo el servicio ideal para hacer artículos accesibles en múltiples idiomas automáticamente."}, {"id": 240, "text": "Un banco quiere usar un LLM en Bedrock para responder preguntas sobre apertura de cuentas usando documentos públicos del banco. ¿Qué técnica de ingeniería de indicaciones cumple estos requisitos?", "options": ["Indicaciones basadas en la complejidad", "Indicaciones de disparo cero", "Indicaciones con pocos disparos", "Inducción de estímulos direccionales"], "correct": [3], "multi": false, "explanation": "Las indicaciones direccionales guían al modelo hacia un dominio específico (documentos bancarios) proporcionando contexto y dirección sobre qué información usar y cómo responder."}, {"id": 241, "text": "Una empresa quiere optimizar un modelo en Bedrock usando datos confidenciales de bases de datos privadas en una VPC, manteniendo los datos en la red privada. ¿Qué solución cumple estos requisitos?", "options": ["Restrinja el acceso a Bedrock mediante una función de servicio IAM", "Restrinja el acceso mediante una política de recursos IAM", "Utilice AWS PrivateLink para conectar la VPC y Amazon Bedrock", "Utilice claves de AWS KMS para cifrar los datos"], "correct": [2], "multi": false, "explanation": "AWS PrivateLink crea una conexión privada entre la VPC y Amazon Bedrock sin exponer los datos a internet, manteniendo todo el tráfico dentro de la red privada de AWS."}, {"id": 242, "text": "Un documentalista quiere añadir automáticamente subtítulos y narraciones en varios idiomas. ¿Qué combinación cumple estos requisitos? (Elija dos)", "options": ["Utilice Amazon Transcribe y Amazon Translate para generar subtítulos en otros idiomas", "Utilice Amazon Textract y Amazon Translate para generar subtítulos", "Utilice Amazon Polly para generar locuc
