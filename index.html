<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AWS AI Practitioner — Simulacro Completo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#0f1923;--navy:#162032;--card:#1c2b3a;--border:#263545;
  --orange:#FF9900;--orange-dim:rgba(255,153,0,0.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
  --text:#e2e8f0;--muted:#7a95b0;--dim:#4a6580;
}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
/* SCREENS */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
/* MODULE SELECT */
#moduleSelect{padding:32px 20px;max-width:900px;margin:0 auto}
.logo{text-align:center;padding:40px 0 32px}
.logo h1{font-size:28px;font-weight:700;color:var(--text)}
.logo p{color:var(--muted);margin-top:8px;font-size:14px}
.aws-tag{display:inline-block;background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:1px;margin-bottom:12px}
.progress-overview{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:28px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.prog-stat{text-align:center;flex:1;min-width:80px}
.prog-stat-num{font-size:24px;font-weight:700;font-family:monospace;color:var(--orange)}
.prog-stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.module-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.module-card:hover{border-color:var(--orange);transform:translateY(-2px)}
.module-card.completed{border-color:var(--green)}
.module-badge{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.module-card.completed .module-badge{background:var(--green)}
.module-title{font-size:16px;font-weight:600;margin-bottom:4px}
.module-range{font-size:12px;color:var(--muted);margin-bottom:12px;font-family:monospace}
.module-progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:8px}
.module-progress-fill{height:100%;border-radius:2px;background:var(--orange);transition:width .4s}
.module-card.completed .module-progress-fill{background:var(--green)}
.module-stats{display:flex;gap:10px;font-size:12px}
.module-stat{color:var(--muted)}
.module-stat span{font-weight:600}
.module-stat span.c{color:var(--green)}
.module-stat span.w{color:var(--red)}
/* HEADER */
.header{background:var(--navy);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.h-badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:1px}
.h-title{font-size:14px;font-weight:600}
.h-sub{font-size:11px;color:var(--muted)}
.prog-wrap{flex:1;max-width:280px;margin:0 16px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:monospace}
.prog-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s}
.score-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-family:monospace}
.sc{color:var(--green)}.sw{color:var(--red)}.ss{color:var(--dim)}
.btn-home{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
.btn-home:hover{border-color:var(--orange);color:var(--orange)}
/* QUIZ */
.main{max-width:800px;margin:0 auto;padding:24px 16px 80px}
.nav-dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.dot{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;font-family:monospace}
.dot.cur{border-color:var(--orange);color:var(--orange)}
.dot.ok{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.dot.err{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.dot.skip{border-color:var(--dim);color:var(--dim)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qhead{background:var(--navy);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.qnum{background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:monospace;white-space:nowrap}
.qmulti{background:rgba(255,153,0,0.2);color:var(--orange);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid rgba(255,153,0,0.3)}
.qbody{padding:20px}
.qtext{font-size:15px;line-height:1.65;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;background:transparent;text-align:left;width:100%;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--orange);background:var(--orange-dim)}
.opt.sel{border-color:var(--orange);background:var(--orange-dim)}
.opt.ok{border-color:var(--green);background:var(--green-dim)}
.opt.err{border-color:var(--red);background:var(--red-dim)}
.opt.show-ok{border-color:var(--green);background:var(--green-dim)}
.opt:disabled{cursor:default}
.oletter{width:24px;height:24px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted);transition:all .2s;font-family:monospace}
.opt.sel .oletter{background:var(--orange);color:#000}
.opt.ok .oletter{background:var(--green);color:#000}
.opt.err .oletter{background:var(--red);color:#fff}
.opt.show-ok .oletter{background:var(--green);color:#000}
.otext{flex:1}
.multi-hint{font-size:12px;color:var(--orange);margin-bottom:12px;padding:8px 12px;background:var(--orange-dim);border-radius:6px;border:1px solid rgba(255,153,0,0.2)}
.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.feedback.ok{background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);color:#86efac;display:block}
.feedback.err{background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;display:block}
.feedback-title{font-weight:700;margin-bottom:5px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--orange);color:#000;flex:1}
.btn-primary:hover{background:#ffad33;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
.btn-skip{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn-skip:hover{border-color:var(--orange);color:var(--orange)}
.btn-confirm{background:var(--orange);color:#000;flex:1}
.btn-confirm:disabled{opacity:.4;cursor:default}
/* RESULTS */
.results{display:none;text-align:center;padding:40px 16px}
.res-pct{font-size:72px;font-weight:700;font-family:monospace;color:var(--orange);line-height:1;margin-bottom:6px}
.res-label{font-size:14px;color:var(--muted);margin-bottom:28px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.res-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.res-num{font-size:30px;font-weight:700;font-family:monospace;margin-bottom:3px}
.res-sl{font-size:11px;color:var(--muted)}
.btn-retry{background:var(--orange);color:#000;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;margin-right:10px}
.btn-retry:hover{background:#ffad33;transform:translateY(-2px)}
.btn-back{background:var(--card);color:var(--text);padding:13px 28px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .2s}
.btn-back:hover{border-color:var(--orange);color:var(--orange)}
@media(max-width:768px){
  /* HOME */
  .progress-overview{gap:10px;padding:14px}
  .prog-stat-num{font-size:20px}
  .modules-grid{grid-template-columns:1fr}
  .module-card{padding:16px}

  /* HEADER */
  .header{padding:10px 12px;flex-wrap:wrap;gap:8px}
  .h-title{font-size:13px}
  .h-sub{font-size:10px}
  .prog-wrap{display:none}
  .score-pill{font-size:11px;padding:4px 10px}
  .btn-home{font-size:11px;padding:5px 10px}

  /* MAIN QUIZ */
  .main{padding:12px 10px 80px}
  .nav-dots{gap:4px;margin-bottom:14px}
  .dot{width:26px;height:26px;font-size:9px}

  /* QUESTION CARD */
  .qhead{padding:12px 14px}
  .qnum{font-size:10px}
  .qbody{padding:14px}
  .qtext{font-size:14px;line-height:1.6;margin-bottom:16px}
  .multi-hint{font-size:11px;padding:7px 10px}

  /* OPTIONS */
  .opt{padding:11px 12px;gap:10px;font-size:13px}
  .oletter{width:22px;height:22px;font-size:10px}

  /* FEEDBACK */
  .feedback{font-size:12px;padding:12px}
  .feedback-title{font-size:12px}

  /* ACTIONS */
  .actions{gap:6px;margin-top:12px}
  .btn{padding:13px 16px;font-size:13px}

  /* RESULTS */
  .results{padding:28px 12px}
  .res-pct{font-size:56px}
  .res-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .res-stat{padding:14px 8px}
  .res-num{font-size:24px}
  .res-sl{font-size:10px}
  .btn-retry{padding:12px 20px;font-size:14px;margin-right:6px}
  .btn-back{padding:12px 20px;font-size:14px}

  /* GLOSSARY PANEL */
  .gloss-panel{width:100vw;right:-100vw}
  .gloss-btn{bottom:16px;right:16px;width:48px;height:48px;font-size:20px}
  .gterm-name{font-size:12px}
  .gterm-def{font-size:11px}
  .gterm-analogy{font-size:11px}
  .gterm-ex{font-size:10px}
}

@media(max-width:400px){
  .dot{width:22px;height:22px;font-size:8px}
  .qtext{font-size:13px}
  .opt{font-size:12px;padding:10px 10px}
  .res-grid{gap:6px}
  .res-stat{padding:10px 6px}
  .res-num{font-size:20px}
}

/* GLOSSARY PANEL */
.gloss-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--orange);color:#000;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,153,0,0.4);z-index:200;transition:all .2s}
.gloss-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(255,153,0,0.5)}
.gloss-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;opacity:0;transition:opacity .3s}
.gloss-overlay.open{display:block;opacity:1}
.gloss-panel{position:fixed;top:0;right:-420px;width:420px;max-width:95vw;height:100vh;background:var(--navy);border-left:1px solid var(--border);z-index:400;display:flex;flex-direction:column;transition:right .3s ease;box-shadow:-8px 0 32px rgba(0,0,0,0.4)}
.gloss-panel.open{right:0}
.gloss-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gloss-head-left{display:flex;align-items:center;gap:10px}
.gloss-head-badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.gloss-head-title{font-size:15px;font-weight:700}
.gloss-close{background:var(--card);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.gloss-close:hover{border-color:var(--orange);color:var(--orange)}
.gloss-search{padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.gloss-search input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.gloss-search input:focus{border-color:var(--orange)}
.gloss-search input::placeholder{color:var(--dim)}
.gloss-cats{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.gcbtn{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s}
.gcbtn.active,.gcbtn:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,153,0,0.1)}
.gloss-count{padding:6px 16px;font-size:11px;color:var(--dim);font-family:monospace;flex-shrink:0}
.gloss-list{flex:1;overflow-y:auto;padding:8px 12px 24px}
.gloss-list::-webkit-scrollbar{width:4px}
.gloss-list::-webkit-scrollbar-track{background:transparent}
.gloss-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.gterm{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.gterm-hd{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.gterm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gterm-name{font-size:13px;font-weight:600;flex:1;line-height:1.3}
.gterm-abbr{font-size:10px;color:var(--muted);font-family:monospace;margin-left:4px}
.gterm-arrow{color:var(--dim);font-size:10px;transition:transform .2s;flex-shrink:0}
.gterm.open .gterm-arrow{transform:rotate(90deg)}
.gterm-body{display:none;padding:0 14px 12px 30px;border-top:1px solid var(--border)}
.gterm.open .gterm-body{display:block}
.gterm-def{font-size:12px;line-height:1.65;color:var(--text);margin-top:10px}
.gterm-analogy{margin-top:8px;padding:8px 12px;background:var(--navy);border-radius:6px;border-left:2px solid var(--orange);font-size:11px;color:var(--muted);line-height:1.6}
.gterm-analogy strong{color:var(--orange);font-size:10px;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.gterm-ex{margin-top:6px;font-size:11px;color:var(--dim);font-style:italic;line-height:1.5}
.gsvc-wrap{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.gsvc{background:rgba(255,153,0,0.1);border:1px solid rgba(255,153,0,0.25);color:var(--orange);font-size:10px;padding:1px 7px;border-radius:4px;font-family:monospace}
.gno-results{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- MODULE SELECT -->
<div id="moduleSelect" class="screen active">
  <div class="logo">
    <div class="aws-badge">AIF-C01</div>
    <h1>AWS Certified AI Practitioner</h1>
    <p>Simulacro Completo — 452 preguntas en 9 módulos</p>
  </div>
  <div class="progress-overview">
    <div class="prog-stat"><div class="prog-stat-num" id="ov-total">0</div><div class="prog-stat-label">Respondidas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-correct" style="color:var(--green)">0</div><div class="prog-stat-label">Correctas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-wrong" style="color:var(--red)">0</div><div class="prog-stat-label">Incorrectas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-pct">0%</div><div class="prog-stat-label">Puntaje global</div></div>
  </div>
  <div class="modules-grid" id="modulesGrid"></div>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
  <div class="header">
    <div class="header-left">
      <div class="h-badge">AIF-C01</div>
      <div>
        <div class="h-title" id="h-modtitle">Módulo 1</div>
        <div class="h-sub" id="h-modsub">P1–P50</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span id="prog-text">Pregunta 1 de 50</span><span id="prog-pct">0%</span></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="score-pill"><span class="sc">✓ <span id="sc-c">0</span></span><span class="ss">/</span><span class="sw">✗ <span id="sc-w">0</span></span></div>
      <button class="btn-home" onclick="goHome()">← Módulos</button>
    </div>
  </div>
  <div class="main">
    <div class="nav-dots" id="navDots"></div>
    <div id="quizArea"></div>
    <div class="results" id="resultsScreen">
      <div class="res-pct" id="res-pct">0%</div>
      <div class="res-label" id="res-label">Puntaje del módulo</div>
      <div class="res-grid">
        <div class="res-stat"><div class="res-num" id="res-c" style="color:var(--green)">0</div><div class="res-sl">Correctas</div></div>
        <div class="res-stat"><div class="res-num" id="res-w" style="color:var(--red)">0</div><div class="res-sl">Incorrectas</div></div>
        <div class="res-stat"><div class="res-num" id="res-s" style="color:var(--muted)">0</div><div class="res-sl">Omitidas</div></div>
      </div>
      <button class="btn-retry" onclick="retryModule()">🔄 Reintentar módulo</button>
      <button class="btn-back" onclick="goHome()">← Volver a módulos</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"id": 1, "text": "Una empresa realiza pronósticos trimestrales usando modelos de ML. Un profesional de IA escribe un informe para brindar transparencia y explicabilidad a las partes interesadas. ¿Qué debe incluir el informe?", "options": ["Código para entrenamiento de modelos", "Gráficos de dependencia parcial (PDP)", "Datos de muestra para formación", "Tablas de convergencia de modelos"], "correct": [1], "multi": false, "explanation": "Los gráficos de dependencia parcial (PDP) muestran visualmente cómo cada variable influye en la predicción del modelo, haciéndolo explicable para partes interesadas no técnicas."}, {"id": 2, "text": "Un bufete de abogados quiere una app de IA con LLM que lea documentos legales y extraiga puntos clave. ¿Qué solución cumple estos requisitos?", "options": ["Sistema de reconocimiento de entidades nombradas", "Motor de recomendaciones", "Chatbot de resumen", "Sistema de traducción multilingüe"], "correct": [2], "multi": false, "explanation": "Un chatbot de resumen usa LLMs para leer documentos y extraer los puntos más importantes. El reconocimiento de entidades solo extrae nombres/lugares, no resume contenido."}, {"id": 3, "text": "Una empresa quiere clasificar genes humanos en 20 categorías y necesita un algoritmo ML que documente cómo el mecanismo interno del modelo afecta el resultado. ¿Qué algoritmo cumple esto?", "options": ["Árboles de decisión", "Regresión lineal", "Regresión logística", "Redes neuronales"], "correct": [0], "multi": false, "explanation": "Los árboles de decisión son modelos 'white box' — puedes ver exactamente qué características llevan a cada decisión. Las redes neuronales son 'black box' y difíciles de explicar internamente."}, {"id": 4, "text": "Una empresa creó un modelo de clasificación de imágenes para predecir enfermedades de plantas. Quiere evaluar cuántas imágenes clasificó correctamente. ¿Qué métrica debe usar?", "options": ["Puntuación R-cuadrado", "Precisión (Accuracy)", "Error cuadrático medio (RMSE)", "Tasa de aprendizaje"], "correct": [1], "multi": false, "explanation": "La precisión (accuracy) mide el porcentaje de clasificaciones correctas sobre el total. R-cuadrado y RMSE son métricas de regresión. La tasa de aprendizaje es un hiperparámetro, no una métrica."}, {"id": 5, "text": "Una empresa usa un LLM para un chatbot de recomendaciones. Necesita que los resultados sean breves y en un lenguaje específico. ¿Qué solución alinea la calidad de respuesta?", "options": ["Ajustar el mensaje (prompt)", "Elegir un LLM de tamaño diferente", "Aumentar la temperatura", "Aumentar el valor K superior"], "correct": [0], "multi": false, "explanation": "La ingeniería de prompts es la forma más directa de controlar formato, longitud e idioma. Aumentar la temperatura genera más aleatoriedad — lo opuesto a lo que se necesita."}, {"id": 6, "text": "Una empresa usa Amazon SageMaker con datos de hasta 1 GB y tiempos de procesamiento de hasta 1 hora, necesitando latencia casi en tiempo real. ¿Qué opción de inferencia cumple estos requisitos?", "options": ["Inferencia en tiempo real", "Inferencia sin servidor", "Inferencia asíncrona", "Transformación por lotes"], "correct": [2], "multi": false, "explanation": "La inferencia asíncrona está diseñada para payloads grandes (hasta 1 GB) y tiempos largos (hasta 1 hora). La inferencia en tiempo real tiene límites de tamaño menores."}, {"id": 7, "text": "Una empresa quiere adaptar modelos preentrenados para tareas nuevas y relacionadas, sin crear modelos desde cero. ¿Qué estrategia ML cumple estos requisitos?", "options": ["Aumentar el número de épocas", "Aprendizaje por transferencia", "Disminuir el número de épocas", "Aprendizaje no supervisado"], "correct": [1], "multi": false, "explanation": "El aprendizaje por transferencia permite tomar un modelo preentrenado y adaptarlo a una nueva tarea relacionada, aprovechando el conocimiento ya adquirido."}, {"id": 8, "text": "Una empresa genera imágenes para gafas de protección y necesita alta precisión minimizando anotaciones incorrectas. ¿Qué solución cumple estos requisitos?", "options": ["Validación con intervención humana mediante Amazon SageMaker Ground Truth Plus", "Aumento de datos mediante Amazon Bedrock", "Reconocimiento de imágenes mediante Amazon Rekognition", "Resumen de datos mediante Amazon QuickSight Q"], "correct": [0], "multi": false, "explanation": "SageMaker Ground Truth Plus combina IA con revisión humana, garantizando alta precisión en las anotaciones. Ideal cuando la precisión es crítica."}, {"id": 9, "text": "Un FM en Amazon Bedrock necesita acceder a datos cifrados en S3 con SSE-S3 pero experimenta un error. ¿Qué solución cumple estos requisitos?", "options": ["Asegurarse de que el rol de Amazon Bedrock tenga permiso para descifrar con la clave correcta", "Configurar permisos de S3 para permitir acceso público", "Usar ingeniería de prompts para indicarle al modelo que busque en S3", "Asegurarse de que los datos no contengan información confidencial"], "correct": [0], "multi": false, "explanation": "El error ocurre porque el rol IAM de Bedrock no tiene permisos para descifrar los datos. La solución es otorgar permisos de descifrado al rol. Nunca hacer los datos públicos."}, {"id": 10, "text": "Una empresa quiere inferencia en dispositivos periféricos (edge) con la menor latencia posible. ¿Qué solución cumple estos requisitos?", "options": ["Implementar modelos de lenguaje pequeños optimizados (SLM) en dispositivos periféricos", "Implementar LLMs optimizados en dispositivos periféricos", "API centralizada de SLM para comunicación asíncrona", "API centralizada de LLM para comunicación asíncrona"], "correct": [0], "multi": false, "explanation": "Los SLMs son ligeros y pueden ejecutarse directamente en dispositivos edge sin conectarse a la nube, minimizando la latencia. Los LLMs son demasiado grandes para dispositivos periféricos."}, {"id": 11, "text": "Una empresa quiere compartir y gestionar variables para desarrollo de modelos ML entre varios equipos en SageMaker. ¿Qué función cumple estos requisitos?", "options": ["Amazon SageMaker Feature Store", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Clarify", "Amazon SageMaker Model Cards"], "correct": [0], "multi": false, "explanation": "SageMaker Feature Store es el repositorio centralizado para almacenar, compartir y gestionar características (features) entre equipos de ML."}, {"id": 12, "text": "Una empresa quiere usar Amazon Q Developer para aumentar la productividad de sus desarrolladores. ¿Cómo puede ayudar?", "options": ["Crear fragmentos de software, seguimiento de referencias y licencias de código abierto", "Ejecutar aplicaciones sin aprovisionar servidores", "Habilitar comandos de voz para codificación", "Convertir archivos de audio a texto"], "correct": [0], "multi": false, "explanation": "Amazon Q Developer es un asistente de IA para desarrolladores que genera código, hace seguimiento de referencias de código abierto y gestiona licencias."}, {"id": 13, "text": "Una institución financiera usa Amazon Bedrock en una VPC sin acceso a internet por cumplimiento normativo. ¿Qué servicio permite que Bedrock acceda a recursos sin salir a internet?", "options": ["AWS PrivateLink", "Amazon Macie", "Amazon CloudFront", "Internet Gateway"], "correct": [0], "multi": false, "explanation": "AWS PrivateLink permite conectar servicios de AWS como Bedrock a recursos dentro de una VPC sin que el tráfico salga a internet, cumpliendo con requisitos estrictos de seguridad."}, {"id": 14, "text": "Una empresa quiere un juego educativo de probabilidades con el MENOR costo operativo. ¿Qué solución cumple estos requisitos?", "options": ["Aprendizaje supervisado con modelo de regresión", "Aprendizaje por refuerzo", "Código que calcule probabilidad mediante reglas y cálculos sencillos", "Aprendizaje no supervisado"], "correct": [2], "multi": false, "explanation": "Para cálculos de probabilidad simples, una función matemática sencilla es más eficiente, más precisa y tiene costo operativo mínimo. El ML agrega complejidad innecesaria."}, {"id": 15, "text": "¿Qué métrica mide la eficiencia en tiempo de ejecución de los modelos de IA en funcionamiento (en producción)?", "options": ["Puntuación de satisfacción del cliente (CSAT)", "Tiempo de entrenamiento por época", "Tiempo de respuesta promedio", "Número de instancias de entrenamiento"], "correct": [2], "multi": false, "explanation": "El tiempo de respuesta promedio mide qué tan rápido responde el modelo en producción. CSAT mide satisfacción del cliente, y las otras son métricas de entrenamiento."}, {"id": 16, "text": "Una empresa de centros de contacto quiere analizar y extraer información clave del audio de llamadas. ¿Qué solución cumple estos requisitos?", "options": ["Chatbot conversacional con Amazon Lex", "Transcribir grabaciones con Amazon Transcribe", "Extraer información con SageMaker Model Monitor", "Crear etiquetas de clasificación con Amazon Comprehend"], "correct": [1], "multi": false, "explanation": "Amazon Transcribe convierte audio a texto, permitiendo luego analizar el contenido. Lex es para crear chatbots interactivos, no para analizar grabaciones."}, {"id": 17, "text": "Una empresa tiene petabytes de datos de clientes sin etiquetar y quiere clasificarlos en diferentes niveles para publicidad. ¿Qué metodología debe usar?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "RLHF"], "correct": [1], "multi": false, "explanation": "El aprendizaje no supervisado (clustering) agrupa automáticamente clientes en segmentos según sus características. El supervisado requiere datos etiquetados que aquí no existen."}, {"id": 18, "text": "Un profesional de IA quiere diseñar una app de búsqueda que procese consultas con texto e imágenes. ¿Qué tipo de modelo debe usar?", "options": ["Modelo de incrustación multimodal", "Modelo de incrustación de texto", "Modelo de generación multimodal", "Modelo de generación de imágenes"], "correct": [0], "multi": false, "explanation": "Un modelo de incrustación multimodal puede procesar y representar tanto texto como imágenes en el mismo espacio vectorial, ideal para búsquedas que combinen ambos tipos."}, {"id": 19, "text": "Una empresa quiere optimizar un FM de Amazon Bedrock para búsqueda con IA usando sus propios datos. ¿Qué estrategia permite optimizar el modelo?", "options": ["Proporcionar datos etiquetados con campo de solicitud y campo de finalización", "Preparar el dataset en archivo .txt en formato .csv", "Adquirir rendimiento aprovisionado para Amazon Bedrock", "Entrenar el modelo con revistas y libros de texto"], "correct": [0], "multi": false, "explanation": "Para fine-tuning en Amazon Bedrock se necesitan pares de prompt/completion etiquetados. El rendimiento aprovisionado mejora disponibilidad pero no personaliza el modelo."}, {"id": 20, "text": "Una empresa quiere usar IA para verificar si una dirección IP proviene de una fuente sospechosa. ¿Qué solución cumple estos requisitos?", "options": ["Sistema de reconocimiento de voz", "Sistema de reconocimiento de entidades nombradas con PLN", "Sistema de detección de anomalías", "Sistema de predicción de fraudes"], "correct": [2], "multi": false, "explanation": "Un sistema de detección de anomalías identifica patrones inusuales comparándolos contra el comportamiento normal. Es la solución más directa para detectar fuentes sospechosas."}, {"id": 21, "text": "¿Qué característica de Amazon OpenSearch Service permite a las empresas crear aplicaciones de bases de datos vectoriales?", "options": ["Integración con Amazon S3 para almacenamiento de objetos", "Soporte para indexación y consultas geoespaciales", "Gestión de índices escalable y capacidad de búsqueda del vecino más cercano", "Capacidad para realizar análisis en tiempo real de datos en streaming"], "correct": [2], "multi": false, "explanation": "OpenSearch Service soporta búsqueda de vecino más cercano (k-NN) e indexación vectorial, lo que permite construir bases de datos vectoriales para aplicaciones de IA."}, {"id": 22, "text": "¿Qué opción constituye un caso de uso para los modelos de IA generativa?", "options": ["Mejorar la seguridad de la red mediante sistemas de detección de intrusiones", "Creación de imágenes fotorrealistas a partir de descripciones de texto para marketing digital", "Mejora del rendimiento de la base de datos mediante índices optimizados", "Analizar datos financieros para pronosticar tendencias del mercado de valores"], "correct": [1], "multi": false, "explanation": "La generación de imágenes a partir de texto es un caso de uso clásico de IA generativa. Los otros casos corresponden a IA/ML tradicional, no generativa."}, {"id": 23, "text": "Una empresa desea desarrollar una aplicación de IA generativa usando Amazon Bedrock y necesita saber cuánta información puede incluirse en una sola solicitud al FM. ¿Qué consideración influirá en su decisión?", "options": ["Temperatura", "Ventana de contexto", "Tamaño del lote", "Tamaño del modelo"], "correct": [1], "multi": false, "explanation": "La ventana de contexto define cuántos tokens (palabras/fragmentos) puede procesar el modelo en una sola solicitud. Determina cuánta información cabe en un prompt."}, {"id": 24, "text": "Una empresa eligió un FM para un chatbot que debe generar respuestas que se ajusten al tono de la empresa. ¿Qué solución cumple estos requisitos?", "options": ["Establezca un límite bajo en la cantidad de tokens que el FM puede producir", "Utilice la inferencia por lotes para procesar respuestas detalladas", "Experimente y refine la consigna hasta que el FM produzca las respuestas deseadas", "Defina un número mayor para el parámetro de temperatura"], "correct": [2], "multi": false, "explanation": "Refinar el prompt (ingeniería de prompts) es el método más efectivo para ajustar el tono y estilo de las respuestas sin necesidad de reentrenar el modelo."}, {"id": 25, "text": "Una empresa quiere usar un LLM para análisis de sentimientos clasificando texto como positivo o negativo. ¿Qué estrategia de ingeniería de indicaciones cumple estos requisitos?", "options": ["Proporcione ejemplos de pasajes con etiquetas positivas o negativas en la consigna, seguidos del nuevo pasaje a clasificar", "Proporcione una explicación detallada del análisis de sentimientos y cómo funcionan los LLM", "Proporcione el nuevo fragmento a clasificar sin contexto adicional", "Proporcione ejemplos de tareas no relacionadas como resumir texto"], "correct": [0], "multi": false, "explanation": "Esto es few-shot learning — proporcionar ejemplos etiquetados antes de la nueva entrada ayuda al modelo a entender el patrón de clasificación deseado."}, {"id": 26, "text": "Una empresa de seguridad usa Amazon Bedrock y necesita identificar intentos de acceso no autorizado. ¿Qué servicio de AWS debe usar?", "options": ["AWS Audit Manager", "AWS CloudTrail", "Amazon Fraud Detector", "AWS Trusted Advisor"], "correct": [1], "multi": false, "explanation": "AWS CloudTrail registra todas las llamadas a la API de AWS, incluyendo quién accedió a qué y cuándo. Es el servicio estándar para auditoría de acceso."}, {"id": 27, "text": "Una empresa quiere implementar un modelo de clasificación de imágenes en producción sin gestionar infraestructura subyacente. ¿Qué solución cumple estos requisitos?", "options": ["Amazon SageMaker Serverless Inference", "Amazon CloudFront", "Amazon API Gateway para alojar el modelo", "AWS Batch para alojar el modelo"], "correct": [0], "multi": false, "explanation": "SageMaker Serverless Inference permite desplegar modelos sin gestionar servidores — AWS maneja automáticamente el aprovisionamiento y escalado."}, {"id": 28, "text": "Una empresa de IA necesita recibir notificaciones por correo cuando informes de cumplimiento de ISV estén disponibles. ¿Qué servicio de AWS cumple este requisito?", "options": ["AWS Audit Manager", "AWS Artifact", "AWS Trusted Advisor", "AWS Data Exchange"], "correct": [1], "multi": false, "explanation": "AWS Artifact proporciona acceso a informes de cumplimiento y acuerdos de AWS, incluyendo notificaciones cuando nuevos informes de terceros están disponibles."}, {"id": 29, "text": "Una empresa quiere evitar que el LLM sea manipulado mediante técnicas de ingeniería de mensajes para realizar acciones no deseadas. ¿Qué acción reducirá estos riesgos?", "options": ["Cree una plantilla de indicaciones que enseñe al LLM a detectar patrones de ataque", "Aumentar el parámetro de temperatura", "Evite usar LLM que no estén listados en Amazon SageMaker", "Disminuir el número de tokens de entrada"], "correct": [0], "multi": false, "explanation": "Una plantilla de prompt bien diseñada que incluya instrucciones de seguridad ayuda al modelo a reconocer y rechazar intentos de manipulación o inyección de prompts."}, {"id": 30, "text": "¿Qué alcance de solución le otorga a la empresa la MAYOR responsabilidad en materia de seguridad según la Matriz de Alcance de Seguridad de IA Generativa?", "options": ["Usar una aplicación empresarial de terceros con funciones de IA generativa integradas", "Crear una aplicación usando un FM de terceros existente", "Refinar un FM de terceros mediante ajuste fino con datos del negocio", "Crear y entrenar un modelo de IA generativa desde cero con datos propios"], "correct": [3], "multi": false, "explanation": "Crear un modelo desde cero implica responsabilidad total: datos, infraestructura, entrenamiento, seguridad y despliegue. En modelos de terceros, parte de la responsabilidad es del proveedor."}, {"id": 31, "text": "Un profesional de IA tiene fotos de animales y quiere identificar y categorizar automáticamente los animales sin intervención humana. ¿Qué estrategia cumple estos requisitos?", "options": ["Detección de objetos", "Detección de anomalías", "Reconocimiento de entidades nombradas", "Repintado"], "correct": [0], "multi": false, "explanation": "La detección de objetos identifica y localiza objetos específicos en imágenes — en este caso animales — y los clasifica automáticamente."}, {"id": 32, "text": "Una empresa quiere usar Amazon Bedrock con presupuesto limitado y prefiere flexibilidad sin compromisos a largo plazo. ¿Qué modelo de precios cumple estos requisitos?", "options": ["Bajo demanda", "Personalización del modelo", "Rendimiento aprovisionado", "Instancia de punto"], "correct": [0], "multi": false, "explanation": "El modelo bajo demanda (on-demand) cobra solo por lo que se usa, sin compromisos mínimos. El rendimiento aprovisionado requiere compromisos de tiempo y mayor costo base."}, {"id": 33, "text": "¿Qué servicio de AWS puede ayudar a un equipo de IA a implementar y consumir rápidamente un FM dentro de la VPC del equipo?", "options": ["Amazon Customize", "Amazon SageMaker JumpStart", "PartyRock", "Amazon SageMaker Endpoints"], "correct": [1], "multi": false, "explanation": "SageMaker JumpStart proporciona modelos base preentrenados, notebooks de ejemplo y plantillas de soluciones que permiten desplegar modelos rápidamente dentro de una VPC."}, {"id": 34, "text": "¿Cómo pueden las empresas utilizar LLMs de forma segura en Amazon Bedrock?", "options": ["Diseñe indicaciones claras y específicas. Configure roles y políticas IAM usando acceso con privilegios mínimos", "Habilitar AWS Audit Manager para evaluación automática de modelos", "Habilitar las tareas de evaluación automática de modelos de Amazon Bedrock", "Utilice los registros de CloudWatch para hacer los modelos explicables"], "correct": [0], "multi": false, "explanation": "La combinación de prompts bien diseñados con políticas IAM de privilegios mínimos es la práctica de seguridad fundamental para usar LLMs de forma segura."}, {"id": 35, "text": "Una empresa quiere desarrollar una aplicación que genere consultas SQL a partir del texto introducido por empleados con poca experiencia técnica. ¿Qué solución cumple estos requisitos?", "options": ["Transformadores generativos preentrenados (GPT)", "Red neuronal residual", "Máquina de vectores de soporte", "WaveNet"], "correct": [0], "multi": false, "explanation": "Los GPT (modelos de lenguaje basados en transformadores) pueden convertir lenguaje natural a SQL — exactamente lo que se necesita para usuarios sin conocimiento técnico."}, {"id": 36, "text": "Una empresa implementó un modelo de aprendizaje profundo para detección de objetos. ¿Qué proceso de IA se produce cuando el modelo analiza una nueva imagen?", "options": ["Formación", "Inferencia", "Despliegue del modelo", "Corrección de sesgo"], "correct": [1], "multi": false, "explanation": "La inferencia es el proceso de usar un modelo ya entrenado para hacer predicciones sobre datos nuevos. El entrenamiento ocurre antes del despliegue."}, {"id": 37, "text": "Un experto en IA descubrió que los datos de entrada están sesgados y ciertos atributos afectan la generación de imágenes. ¿Qué técnica resolverá el problema?", "options": ["Aumento de datos para clases desequilibradas", "Monitoreo del modelo para la distribución de clases", "Generación aumentada de recuperación (RAG)", "Detección de marcas de agua para imágenes"], "correct": [0], "multi": false, "explanation": "El aumento de datos genera ejemplos sintéticos para las clases subrepresentadas, equilibrando el dataset y reduciendo el sesgo en el modelo."}, {"id": 38, "text": "Una empresa implementa el modelo Amazon Titan en Bedrock y necesita complementarlo con datos de fuentes de datos privadas. ¿Qué solución cumple este requisito?", "options": ["Utilice un FM diferente", "Elija un valor de temperatura más bajo", "Crear una base de conocimientos de Amazon Bedrock", "Aumentar el número de épocas"], "correct": [2], "multi": false, "explanation": "Las bases de conocimiento de Amazon Bedrock permiten conectar fuentes de datos privadas al FM usando RAG, sin necesidad de reentrenar el modelo."}, {"id": 39, "text": "Una empresa médica personaliza un FM para diagnósticos y necesita que sea transparente y explicable. ¿Qué solución cumplirá estos requisitos?", "options": ["Configure la seguridad mediante Amazon Inspector", "Genere métricas, informes y ejemplos usando Amazon SageMaker Clarify", "Cifre los datos de entrenamiento usando Amazon Macie", "Recopile más datos y use Amazon Rekognition para etiquetas personalizadas"], "correct": [1], "multi": false, "explanation": "SageMaker Clarify detecta sesgos y explica las predicciones del modelo, generando métricas e informes que satisfacen requisitos normativos de transparencia."}, {"id": 40, "text": "Una empresa implementó un chatbot basado en FM de Amazon SageMaker JumpStart. ¿Qué capacidades puede demostrar que cumplen con marcos regulatorios? (Seleccione dos)", "options": ["Puntos finales de inferencia de escalado automático", "Detección de amenazas", "Protección de datos", "Optimización de costos", "Microservicios débilmente acoplados"], "correct": [1, 2], "multi": true, "explanation": "La detección de amenazas y la protección de datos son capacidades directamente relacionadas con marcos regulatorios de seguridad. Las otras opciones son características operativas pero no de cumplimiento normativo."}, {"id": 41, "text": "Una empresa está entrenando un FM y quiere aumentar la precisión hasta un nivel de aceptación específico. ¿Qué solución cumplirá estos requisitos?", "options": ["Disminuir el tamaño del lote", "Aumentar las épocas", "Disminuir las épocas", "Aumentar el parámetro de temperatura"], "correct": [1], "multi": false, "explanation": "Aumentar las épocas permite al modelo ver los datos de entrenamiento más veces, mejorando su capacidad de aprender patrones y aumentando la precisión hasta el nivel deseado."}, {"id": 42, "text": "Una empresa desarrolla un chatbot LLM para reducir acciones de empleados en atención al cliente. ¿Qué objetivo empresarial debe usar para evaluar el impacto?", "options": ["Tasa de interacción con el sitio web", "Duración media de la llamada", "Responsabilidad social corporativa", "Cumplimiento normativo"], "correct": [1], "multi": false, "explanation": "La duración media de llamada mide directamente si el chatbot reduce el tiempo que los empleados dedican a cada interacción — el objetivo principal del caso de uso."}, {"id": 43, "text": "¿Qué funcionalidades ofrece Amazon SageMaker Clarify?", "options": ["Integra un flujo de trabajo RAG", "Supervisa la calidad de modelos ML en producción", "Documenta detalles críticos sobre modelos ML", "Identifica posibles sesgos durante la preparación de los datos"], "correct": [3], "multi": false, "explanation": "SageMaker Clarify está diseñado para detectar sesgos en datos y modelos, y para explicar predicciones. Model Monitor supervisa calidad, Model Cards documenta modelos."}, {"id": 44, "text": "Un modelo de predicción tuvo buen desempeño en entrenamiento pero mal rendimiento en producción. ¿Qué debe hacer la empresa?", "options": ["Reducir el volumen de datos de entrenamiento", "Añadir hiperparámetros al modelo", "Aumentar el volumen de datos de entrenamiento", "Aumentar el tiempo de entrenamiento"], "correct": [2], "multi": false, "explanation": "Cuando un modelo funciona bien en entrenamiento pero mal en producción, generalmente hay sobreajuste (overfitting). Más datos de entrenamiento diversos ayuda al modelo a generalizar mejor."}, {"id": 45, "text": "Una empresa de comercio electrónico quiere determinar la opinión de clientes a partir de reseñas escritas. ¿Qué servicios de AWS cumplen estos requisitos? (Seleccione dos)", "options": ["Amazon Lex", "Amazon Comprehend", "Amazon Polly", "Amazon Bedrock", "Amazon Rekognition"], "correct": [1, 3], "multi": true, "explanation": "Amazon Comprehend es el servicio nativo de AWS para análisis de sentimientos en texto. Amazon Bedrock con LLMs también puede realizar análisis de sentimientos con mayor flexibilidad."}, {"id": 46, "text": "Una empresa quiere usar LLMs con Bedrock para crear una interfaz de chat para manuales PDF de forma rentable. ¿Qué solución cumple estos requisitos?", "options": ["Agregar un PDF como contexto a la indicación cuando se envíe", "Agregar todos los PDFs como contexto a la indicación", "Usar todos los PDFs para ajustar un modelo con Amazon Bedrock", "Cargar documentos PDF a una base de conocimientos de Amazon Bedrock y usarla para proporcionar contexto"], "correct": [3], "multi": false, "explanation": "Las bases de conocimiento de Bedrock indexan los PDFs y recuperan solo el contexto relevante para cada pregunta (RAG), siendo más eficiente y rentable que incluir todos los documentos en cada prompt."}, {"id": 47, "text": "Una empresa de redes sociales quiere evaluar resultados de LLM para detectar sesgos con mínimo esfuerzo administrativo. ¿Qué fuente de datos debe usar?", "options": ["Contenido generado por el usuario", "Registros de moderación", "Directrices para la moderación de contenido", "Conjuntos de datos de referencia"], "correct": [3], "multi": false, "explanation": "Los conjuntos de datos de referencia son datasets estándar y pre-validados que permiten evaluar sesgos de forma sistemática y reproducible con mínimo esfuerzo."}, {"id": 48, "text": "Una empresa quiere usar IA generativa preentrenada para crear contenido de marketing alineado con su identidad de marca. ¿Qué solución cumple estos requisitos?", "options": ["Optimizar arquitectura e hiperparámetros del modelo", "Aumentar la complejidad del modelo añadiendo más capas", "Crear indicaciones eficaces con instrucciones claras y contexto para guiar la generación", "Seleccionar un dataset amplio para preentrenar un nuevo modelo generativo"], "correct": [2], "multi": false, "explanation": "La ingeniería de prompts (indicaciones) es la forma más directa de guiar el estilo, tono e identidad de marca en el contenido generado sin necesidad de reentrenar el modelo."}, {"id": 49, "text": "Una empresa de préstamos desarrolla una solución de IA responsable para minimizar sesgos en descuentos a clientes. ¿Qué medidas debe tomar? (Seleccione dos)", "options": ["Detectar desequilibrios o disparidades en los datos", "Asegúrese de que el modelo se ejecute con frecuencia", "Evaluar el comportamiento del modelo para brindar transparencia", "Usar ROUGE para garantizar que el modelo sea 100% preciso", "Asegurar que el tiempo de inferencia esté dentro de límites aceptados"], "correct": [0, 2], "multi": true, "explanation": "Detectar desequilibrios en datos previene sesgos desde el origen. Evaluar y comunicar el comportamiento del modelo asegura transparencia y rendición de cuentas — pilares de IA responsable."}, {"id": 50, "text": "Una empresa entrenó un modelo personalizado en Bedrock para mejorar resúmenes. ¿Qué acción debe realizar para usar el modelo personalizado?", "options": ["Adquirir el rendimiento aprovisionado para el modelo personalizado", "Implementar el modelo en un endpoint de SageMaker", "Registrar el modelo en el Registro de modelos de SageMaker", "Otorgar acceso al modelo personalizado en Amazon Bedrock"], "correct": [0], "multi": false, "explanation": "Los modelos personalizados en Amazon Bedrock requieren rendimiento aprovisionado para poder ser invocados. Sin este paso, el modelo personalizado no está disponible para inferencia."}, {"id": 51, "text": "Una empresa necesita elegir un modelo de Amazon Bedrock. Debe identificar un modelo que genere respuestas con el estilo que prefieren sus empleados. ¿Qué debe hacer?", "options": ["Evalúe los modelos usando conjuntos de datos de ejemplo integrados", "Evaluar los modelos usando personal humano y conjuntos de datos personalizados", "Utilice las clasificaciones públicas de modelos para identificar el modelo", "Utilice métricas de tiempo de ejecución InvocationLatency en CloudWatch"], "correct": [1], "multi": false, "explanation": "Para determinar qué modelo produce el estilo preferido, se necesita evaluación humana con datos representativos de los casos de uso reales de la empresa."}, {"id": 52, "text": "Un estudiante universitario copia contenido de una IA generativa para escribir ensayos. ¿Qué desafío para la IA generativa responsable representa este escenario?", "options": ["Toxicidad", "Alucinaciones", "Plagio", "Privacidad"], "correct": [2], "multi": false, "explanation": "El plagio ocurre cuando se usa contenido generado por IA como propio sin atribución. Es un desafío de IA responsable relacionado con la integridad académica y propiedad intelectual."}, {"id": 53, "text": "Una empresa quiere crear un LLM propio con datos privados y le preocupa el impacto ambiental. ¿Qué tipo de instancia EC2 tiene el MENOR impacto ambiental?", "options": ["Serie C de Amazon EC2", "Serie G de Amazon EC2", "Serie P de Amazon EC2", "Serie de transacciones de Amazon EC2"], "correct": [3], "multi": false, "explanation": "Las instancias de la serie T (transacciones) son las más eficientes energéticamente para cargas variables. Para entrenamiento de LLMs con menor impacto, se prefieren instancias más eficientes en energía."}, {"id": 54, "text": "Una empresa quiere crear una aplicación para niños que genere historias apropiadas usando Amazon Bedrock. ¿Qué servicio cumplirá estos requisitos?", "options": ["Amazon Rekognition", "Amazon Bedrock Playgrounds", "Amazon Bedrock Guardrails", "Agentes para Amazon Bedrock"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock Guardrails permite configurar filtros de contenido para asegurar que las respuestas sean apropiadas — en este caso, adecuadas para niños."}, {"id": 55, "text": "Una empresa necesita generar datos sintéticos a partir de datos existentes. ¿Qué tipo de modelo puede usar?", "options": ["Red generativa antagónica (GAN)", "XGBoost", "Red neuronal residual", "WaveNet"], "correct": [0], "multi": false, "explanation": "Las GANs están diseñadas específicamente para generar datos sintéticos realistas aprendiendo la distribución de los datos originales. Son el estándar para generación de datos sintéticos."}, {"id": 56, "text": "Una empresa de dispositivos digitales sin experiencia en ML quiere predecir demanda de hardware analizando datos internos y externos. ¿Qué solución cumple estos requisitos?", "options": ["Almacene datos en S3. Cree modelos con algoritmos integrados de SageMaker", "Importe datos a SageMaker Data Wrangler y cree modelos con algoritmos integrados", "Importe datos a SageMaker Data Wrangler y use Amazon Personalize", "Importe datos a Amazon SageMaker Canvas y cree predicciones seleccionando valores"], "correct": [3], "multi": false, "explanation": "SageMaker Canvas ofrece una interfaz visual sin código (no-code) para crear modelos de ML, ideal para equipos sin experiencia en programación o algoritmos de ML."}, {"id": 57, "text": "Una empresa de cámaras de seguridad descubrió que el modelo identifica desproporcionadamente a personas de un grupo étnico. ¿Qué tipo de sesgo afecta el modelo?", "options": ["Sesgo de medición", "Sesgo de muestreo", "Sesgo del observador", "Sesgo de confirmación"], "correct": [1], "multi": false, "explanation": "El sesgo de muestreo ocurre cuando los datos de entrenamiento no representan equitativamente todos los grupos. Si el dataset tenía más imágenes de ciertos grupos étnicos, el modelo aprenderá ese sesgo."}, {"id": 58, "text": "Una empresa desarrolla un chatbot que mejora aprendiendo de interacciones anteriores. ¿Qué estrategia de aprendizaje proporciona esta capacidad?", "options": ["Aprendizaje supervisado con dataset seleccionado manualmente", "Aprendizaje por refuerzo con recompensas por comentarios positivos", "Aprendizaje no supervisado para encontrar grupos de consultas similares", "Aprendizaje supervisado con base de datos de FAQs actualizada continuamente"], "correct": [1], "multi": false, "explanation": "El aprendizaje por refuerzo con retroalimentación (RLHF) permite al modelo mejorar continuamente basándose en recompensas positivas de las interacciones — ideal para chatbots que aprenden de usuarios."}, {"id": 59, "text": "Un experto en IA quiere medir el rendimiento de un modelo de clasificación de materiales en imágenes. ¿Qué métrica le ayudará?", "options": ["Matriz de confusión", "Matriz de correlación", "Puntuación R2", "Error cuadrático medio (ECM)"], "correct": [0], "multi": false, "explanation": "La matriz de confusión muestra los verdaderos positivos, falsos positivos, verdaderos negativos y falsos negativos para cada clase — la herramienta estándar para evaluar clasificadores."}, {"id": 60, "text": "Un chatbot basado en FM genera imágenes. La empresa quiere asegurar que no muestre imágenes inapropiadas. ¿Qué solución cumple estos requisitos?", "options": ["Implementar API de moderación", "Reentrenar el modelo con un dataset público general", "Realizar la validación del modelo", "Automatizar la integración de comentarios de usuarios"], "correct": [0], "multi": false, "explanation": "Las APIs de moderación filtran contenido inapropiado en tiempo real antes de mostrar las imágenes a los usuarios, siendo la solución más directa para este caso."}, {"id": 61, "text": "Un profesional de IA usa Bedrock para resumir conversaciones y quiere almacenar registros de invocación para monitorizar datos de entrada y salida. ¿Qué estrategia debe usar?", "options": ["Configure AWS CloudTrail como destino de registros", "Habilitar el registro de invocaciones en Amazon Bedrock", "Configure AWS Audit Manager como destino de registros", "Configure el registro en Amazon EventBridge"], "correct": [1], "multi": false, "explanation": "El registro de invocaciones de Amazon Bedrock captura específicamente los datos de entrada y salida de los modelos, siendo la herramienta correcta para monitorizar el uso del modelo."}, {"id": 62, "text": "Una empresa analiza datos archivados de varios gigabytes y no necesita predicciones inmediatas. ¿Qué opción de inferencia de SageMaker cumple estos requisitos?", "options": ["Transformación por lotes", "Inferencia en tiempo real", "Inferencia sin servidor", "Inferencia asíncrona"], "correct": [0], "multi": false, "explanation": "La transformación por lotes procesa grandes conjuntos de datos de forma eficiente sin necesidad de un endpoint activo, ideal cuando no se necesitan predicciones en tiempo real."}, {"id": 63, "text": "¿Qué término describe las representaciones numéricas que usan los modelos de IA para mejorar la comprensión de información textual?", "options": ["Incrustaciones (Embeddings)", "Tokens", "Modelos", "Binarios"], "correct": [0], "multi": false, "explanation": "Las incrustaciones (embeddings) son representaciones numéricas vectoriales de palabras o conceptos que capturan relaciones semánticas, permitiendo a los modelos entender el significado del texto."}, {"id": 64, "text": "Un FM en Bedrock tiene rendimiento deficiente debido a terminología científica compleja. ¿Cómo puede la empresa mejorar el rendimiento?", "options": ["Utilice indicaciones con pocas opciones para definir cómo el FM responde", "Utilice ajuste fino de adaptación de dominio para adaptar el FM a términos científicos", "Modifique los parámetros de inferencia del FM", "Limpie los datos eliminando los términos científicos complejos"], "correct": [1], "multi": false, "explanation": "El ajuste fino de adaptación de dominio (domain adaptation fine-tuning) entrena el modelo con texto especializado del dominio, haciéndolo experto en esa terminología específica."}, {"id": 65, "text": "Una empresa usa un LLM en Bedrock para análisis de sentimientos y necesita respuestas más consistentes ante la misma entrada. ¿Qué ajuste debe realizar?", "options": ["Disminuir el valor de la temperatura", "Aumentar el valor de la temperatura", "Disminuir la longitud de los tokens de salida", "Aumentar la duración máxima de la generación"], "correct": [0], "multi": false, "explanation": "La temperatura controla la aleatoriedad. Con temperatura baja (cercana a 0), el modelo es más determinista y consistente. Con temperatura alta, las respuestas son más variadas y creativas."}, {"id": 66, "text": "Una empresa con política de seguridad donde cada equipo solo puede acceder a sus propios datos de clientes usa Bedrock. ¿Qué solución cumple estos requisitos?", "options": ["Cree un rol de servicio personalizado de Bedrock para cada equipo con acceso solo a sus datos", "Cree un rol de servicio con acceso a S3 y pida a los equipos especificar el cliente en cada solicitud", "Oculte datos personales en S3 y actualice la política del bucket", "Cree un rol con acceso completo a S3 y roles IAM por equipo con acceso a sus carpetas"], "correct": [0], "multi": false, "explanation": "Crear roles de servicio específicos por equipo con acceso solo a sus datos es el principio de privilegios mínimos — cada equipo solo puede acceder a lo que necesita."}, {"id": 67, "text": "Una empresa médica quiere evitar que el modelo incluya información personal de pacientes en sus respuestas y recibir notificaciones de infracciones. ¿Qué solución cumple estos requisitos?", "options": ["Use Amazon Macie para analizar la salida del modelo", "Configure CloudTrail para supervisar las respuestas", "Use las medidas de seguridad de Amazon Bedrock y configure alarmas de CloudWatch", "Implemente SageMaker Model Monitor para detectar desviaciones"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock Guardrails filtra PII en tiempo real, y las alarmas de CloudWatch notifican cuando se detectan infracciones — combinación perfecta para este requisito."}, {"id": 68, "text": "Una empresa que crece necesita automatizar la conversión de currículos PDF a texto plano. ¿Qué servicio de AWS cumple este requisito?", "options": ["Amazon Textract", "Amazon Personalize", "Amazon Lex", "Amazon Transcribe"], "correct": [0], "multi": false, "explanation": "Amazon Textract extrae texto y datos de documentos escaneados y PDFs de forma automática, siendo el servicio ideal para procesar currículos en PDF."}, {"id": 69, "text": "Un proveedor educativo quiere que el estilo de respuesta del modelo cambie según el rango de edad del usuario, con el MENOR esfuerzo de implementación. ¿Qué solución cumple estos requisitos?", "options": ["Perfeccionar el modelo con datos de entrenamiento por rango de edad", "Agregar una descripción del rol al contexto indicando el rango de edad", "Usar razonamiento de cadena de pensamiento para deducir el estilo", "Resumir el texto según la edad del usuario"], "correct": [1], "multi": false, "explanation": "Incluir el rango de edad en el contexto del prompt (role prompting) es la forma más simple y eficiente de adaptar el estilo sin reentrenar el modelo."}, {"id": 70, "text": "¿Qué estrategia evalúa la precisión de un FM usado en clasificación de imágenes?", "options": ["Calcula el costo total de los recursos utilizados", "Medir la precisión comparándola con un conjunto de datos de referencia predefinido", "Cuenta el número de capas en la red neuronal", "Evaluar la precisión del color de las imágenes procesadas"], "correct": [1], "multi": false, "explanation": "Comparar las predicciones del modelo con un dataset de referencia (benchmark) con respuestas conocidas es el método estándar para evaluar precisión en clasificación."}, {"id": 71, "text": "Una firma de contabilidad quiere implementar un LLM de forma responsable para procesamiento de documentos. ¿Qué debe hacer? (Elija dos)", "options": ["Incluir métricas de equidad para la evaluación del modelo", "Ajustar el parámetro de temperatura del modelo", "Modificar los datos de entrenamiento para mitigar el sesgo", "Evite el sobreajuste a los datos de entrenamiento", "Aplicar técnicas de ingeniería rápidas"], "correct": [0, 2], "multi": true, "explanation": "Las métricas de equidad aseguran que el modelo trate a todos los grupos de forma justa. Modificar datos de entrenamiento para eliminar sesgos es fundamental para IA responsable en contextos legales."}, {"id": 72, "text": "Una empresa recopiló nuevos datos y los analizó creando una matriz de correlación, estadísticas y visualizaciones. ¿En qué etapa del proceso ML está?", "options": ["Preprocesamiento de datos", "Ingeniería de características", "Análisis exploratorio de datos", "Ajuste de hiperparámetros"], "correct": [2], "multi": false, "explanation": "El análisis exploratorio de datos (EDA) es la fase donde se investigan los datos usando estadísticas, correlaciones y visualizaciones para entender su estructura antes de modelar."}, {"id": 73, "text": "Una empresa tiene documentos con palabras faltantes por error en la base de datos y quiere un modelo que sugiera palabras para completar el texto. ¿Qué tipo de modelo cumple este requisito?", "options": ["Modelado de temas", "Modelos de agrupamiento", "Modelos de aprendizaje automático prescriptivos", "Modelos basados en BERT"], "correct": [3], "multi": false, "explanation": "BERT (Bidirectional Encoder Representations from Transformers) fue diseñado específicamente para la tarea de predicción de palabras enmascaradas (masked language modeling), perfecta para este caso."}, {"id": 74, "text": "Una empresa quiere mostrar ventas totales de productos más vendidos en diferentes puntos de venta durante 12 meses. ¿Qué solución de AWS debe usar para automatizar la generación de gráficos?", "options": ["Amazon Q en Amazon EC2", "Amazon Q Developer", "Amazon Q en Amazon QuickSight", "Amazon Q en el chatbot de AWS"], "correct": [2], "multi": false, "explanation": "Amazon Q en QuickSight permite generar visualizaciones y análisis de datos de ventas usando lenguaje natural, automatizando la creación de gráficos directamente en la herramienta de BI."}, {"id": 75, "text": "Una empresa usa un LLM de Bedrock para detección de intenciones y quiere usar few-shot learning. ¿Qué datos adicionales necesita?", "options": ["Pares de respuestas del chatbot e intenciones correctas", "Pares de mensajes de usuario y respuestas correctas del chatbot", "Pares de mensajes de usuario e intenciones correctas del usuario", "Pares de intenciones del usuario y respuestas correctas del chatbot"], "correct": [2], "multi": false, "explanation": "Para few-shot learning en detección de intenciones, se necesitan ejemplos de mensajes de usuario emparejados con sus intenciones correctas — esto es lo que el modelo aprende a clasificar."}, {"id": 76, "text": "Una empresa usa few-shot prompting con 10 ejemplos en Bedrock, ejecutado una vez al día con buen rendimiento. Quiere reducir el costo mensual. ¿Qué solución cumple estos requisitos?", "options": ["Personalice el modelo mediante ajuste fino", "Disminuya el número de tokens en la consigna", "Aumentar el número de tokens en la solicitud", "Utilice el rendimiento aprovisionado"], "correct": [1], "multi": false, "explanation": "En Bedrock se cobra por tokens. Reducir el número de tokens en el prompt (por ejemplo, usando menos ejemplos o prompts más concisos) disminuye directamente el costo por inferencia."}, {"id": 77, "text": "Un profesional de IA usa un LLM para crear contenido de marketing. El contenido suena plausible pero es incorrecto. ¿Qué problema presenta el LLM?", "options": ["Fuga de datos", "Alucinación", "Sobreajuste", "Ajuste insuficiente"], "correct": [1], "multi": false, "explanation": "Las alucinaciones en LLMs son respuestas que suenan convincentes y plausibles pero contienen información incorrecta o inventada. Es uno de los principales desafíos de los modelos generativos."}, {"id": 78, "text": "Un profesional de IA entrenó un modelo personalizado en Bedrock con datos confidenciales y quiere evitar que genere respuestas basadas en esos datos. ¿Cómo puede lograrlo?", "options": ["Elimine el modelo. Elimine los datos confidenciales del dataset. Vuelva a entrenar el modelo", "Oculte los datos confidenciales en las respuestas usando enmascaramiento dinámico", "Encripte los datos en las respuestas mediante Amazon SageMaker", "Encripte los datos confidenciales en el modelo usando AWS KMS"], "correct": [0], "multi": false, "explanation": "La única forma de eliminar información que el modelo aprendió durante el entrenamiento es eliminar esos datos del dataset y reentrenar el modelo desde cero."}, {"id": 79, "text": "Una empresa usa IA generativa para traducir manuales del inglés a otros idiomas y quiere evaluar la precisión. ¿Qué estrategia de evaluación cumple estos requisitos?", "options": ["BLEU (Bilingual Evaluation Understudy)", "RMSE (Error cuadrático medio)", "ROUGE (Recall-Oriented Understudy for Gisting Evaluation)", "Precisión"], "correct": [0], "multi": false, "explanation": "BLEU es la métrica estándar para evaluar calidad de traducciones automáticas, comparando la salida del modelo con traducciones de referencia humanas."}, {"id": 80, "text": "Una gran cadena minorista recibe miles de consultas diarias. ¿Cuáles son los principales beneficios de usar Agentes de Amazon Bedrock?", "options": ["Generación de FMs personalizados para predecir necesidades del cliente", "Automatización de tareas repetitivas y orquestación de flujos de trabajo complejos", "Llamada automática a múltiples FMs y consolidación de resultados", "Selección del FM en función de criterios y métricas predefinidos"], "correct": [1], "multi": false, "explanation": "Los Agentes de Amazon Bedrock automatizan tareas repetitivas y orquestan flujos de trabajo complejos de múltiples pasos, reduciendo el esfuerzo manual en atención al cliente."}, {"id": 81, "text": "¿Qué opción representa una ventaja del preentrenamiento continuo al ajustar un FM?", "options": ["Ayuda a disminuir la complejidad del modelo", "Mejora el rendimiento del modelo con el tiempo", "Disminuye el tiempo de capacitación requerido", "Optimiza el tiempo de inferencia del modelo"], "correct": [1], "multi": false, "explanation": "El preentrenamiento continuo actualiza el conocimiento del modelo con datos nuevos de forma gradual, mejorando su rendimiento a lo largo del tiempo sin necesidad de reentrenamiento completo."}, {"id": 82, "text": "¿Qué son los tokens en el contexto de los modelos de IA generativa?", "options": ["Las unidades básicas de entrada y salida con las que opera un modelo de IA generativa, representando palabras, subpalabras u otras unidades lingüísticas", "Las representaciones matemáticas de palabras o conceptos usadas en modelos de IA generativa", "Los pesos preentrenados de un modelo de IA generativa que se ajustan para tareas específicas", "Las indicaciones o instrucciones específicas que se le dan a un modelo para generar un resultado"], "correct": [0], "multi": false, "explanation": "Los tokens son las unidades básicas de procesamiento — pueden ser palabras completas, partes de palabras o caracteres. Los LLMs leen y generan texto token por token."}, {"id": 83, "text": "Una empresa quiere evaluar los costos de usar un LLM en Bedrock para inferencias. ¿Qué factor determinará los costos de inferencia?", "options": ["Número de tokens consumidos", "Valor de temperatura", "Cantidad de datos usados para entrenar el LLM", "Tiempo total de entrenamiento"], "correct": [0], "multi": false, "explanation": "Amazon Bedrock cobra por token procesado (tanto entrada como salida). La temperatura y otros parámetros de inferencia no afectan el costo directamente."}, {"id": 84, "text": "Una empresa usa notebooks de SageMaker Studio y almacena datos en S3, necesitando gestionar el flujo de datos. ¿Qué solución cumple este requisito?", "options": ["Use Amazon Inspector para supervisar SageMaker Studio", "Use Amazon Macie para monitorear SageMaker Studio", "Configure SageMaker para que use una VPC con un endpoint S3", "Configure SageMaker para usar S3 Glacier Deep Archive"], "correct": [2], "multi": false, "explanation": "Configurar un endpoint de S3 dentro de la VPC permite que SageMaker Studio acceda a los datos de S3 de forma privada y segura sin pasar por internet."}, {"id": 85, "text": "Una empresa tiene un FM personalizado en Bedrock y quiere cargar un nuevo dataset para validación. ¿Qué servicio de AWS cumple estos requisitos?", "options": ["Amazon S3", "Amazon EBS", "Amazon EFS", "AWS Snowcone"], "correct": [0], "multi": false, "explanation": "Amazon S3 es el servicio de almacenamiento estándar para cargar y gestionar datasets en AWS, compatible con Amazon Bedrock para validación de modelos."}, {"id": 86, "text": "¿Qué ataque de inducción expone directamente el comportamiento configurado de un LLM?", "options": ["Cambios de personalidad inducidos", "Explotar la amabilidad y la confianza", "Ignorar la plantilla de solicitud", "Extracción de la plantilla de solicitud"], "correct": [3], "multi": false, "explanation": "La extracción de plantilla de solicitud (prompt extraction) intenta que el modelo revele sus instrucciones del sistema o configuración interna, exponiendo el comportamiento configurado."}, {"id": 87, "text": "Una empresa quiere usar Amazon Bedrock. ¿De qué aspecto de seguridad será responsable la empresa?", "options": ["Parcheo y actualización de las versiones de Amazon Bedrock", "Protección de la infraestructura que aloja Amazon Bedrock", "Garantizar la seguridad de los datos de la empresa tanto en tránsito como en reposo", "Aprovisionamiento de Amazon Bedrock dentro de la red de la empresa"], "correct": [2], "multi": false, "explanation": "Bajo el modelo de responsabilidad compartida de AWS, la empresa es responsable de la seguridad de sus propios datos (cifrado, acceso), mientras AWS es responsable de la infraestructura."}, {"id": 88, "text": "Una empresa quiere comparar la toxicidad de resultados de varios LLMs en SageMaker JumpStart con el menor costo operativo. ¿Qué estrategia debe usar?", "options": ["Evaluación colaborativa", "Evaluación automática del modelo", "Evaluación del modelo con trabajadores humanos", "RLHF"], "correct": [1], "multi": false, "explanation": "La evaluación automática usa métricas computacionales para medir toxicidad de forma escalable y económica, sin necesitar revisores humanos para cada muestra."}, {"id": 89, "text": "Una empresa prueba la seguridad de un FM intentando eludir medidas de seguridad y generar contenido dañino. ¿De qué técnica de seguridad es un ejemplo?", "options": ["Pruebas de fuzzing en datos de entrenamiento", "Denegación de servicio (DoS)", "Pruebas de penetración con autorización", "Jailbreak (Fuga de la cárcel)"], "correct": [3], "multi": false, "explanation": "El jailbreak es la técnica de intentar eludir las medidas de seguridad de un modelo de IA para que genere contenido que normalmente rechazaría."}, {"id": 90, "text": "Una empresa debe cumplir con requisitos normativos ejecutando trabajos de SageMaker en un entorno aislado sin acceso a internet. ¿Qué solución cumple estos requisitos?", "options": ["Ejecute entrenamiento e inferencia usando los experimentos de SageMaker", "Ejecutar entrenamiento e inferencia de SageMaker usando el aislamiento de red", "Encripte los datos en reposo usando cifrado para capacidades geoespaciales", "Asocie roles IAM apropiados con los puestos de trabajo de SageMaker"], "correct": [1], "multi": false, "explanation": "El aislamiento de red en SageMaker configura los trabajos para ejecutarse dentro de una VPC sin acceso a internet, cumpliendo con requisitos de seguridad y cumplimiento estrictos."}, {"id": 91, "text": "Un equipo de ML quiere crear un mecanismo para auditar los modelos ML personalizados que publica. ¿Qué solución debe usar?", "options": ["Cree documentos con información pertinente y almacénelos en S3", "Utilice las tarjetas de servicio de IA de AWS para transparencia", "Cree tarjetas de modelo de Amazon SageMaker con usos previstos y detalles de entrenamiento", "Crear scripts de entrenamiento y confirmarlos en un repositorio Git"], "correct": [2], "multi": false, "explanation": "Las Model Cards de SageMaker son documentos estructurados que capturan información esencial del modelo (propósito, rendimiento, limitaciones) de forma estándar para auditoría."}, {"id": 92, "text": "Una empresa de software quiere usar IA para aumentar la productividad en desarrollo de software. ¿Qué solución cumplirá estos requisitos?", "options": ["Use un modelo de clasificación binaria para generar revisiones de código", "Instalar software de recomendación de código en las herramientas para desarrolladores", "Instale una herramienta de predicción de código para anticipar posibles problemas", "Use PLN para generar código"], "correct": [1], "multi": false, "explanation": "Un software de recomendación de código (como Amazon CodeWhisperer/Q Developer) integrado en las herramientas del desarrollador aumenta la productividad directamente en el flujo de trabajo."}, {"id": 93, "text": "Una tienda minorista quiere predecir la demanda de un producto para las próximas semanas usando el algoritmo DeepAR de SageMaker. ¿Qué tipo de datos cumplirá este requisito?", "options": ["Datos de texto", "Datos de imagen", "Datos de series temporales", "Datos binarios"], "correct": [2], "multi": false, "explanation": "DeepAR es un algoritmo de pronóstico de series temporales — requiere datos históricos con marca de tiempo (como ventas diarias) para predecir valores futuros."}, {"id": 94, "text": "Un banco quiere desarrollar un sistema ML para decidir asignación de préstamos a diferentes grupos demográficos. ¿Qué debe hacer para desarrollar un modelo imparcial?", "options": ["Reduzca el tamaño del conjunto de datos de entrenamiento", "Asegúrese de que las predicciones sean coherentes con los resultados históricos", "Cree un modelo de ML diferente para cada grupo demográfico", "Medir el desequilibrio de clases en el dataset de entrenamiento y adaptar el proceso en consecuencia"], "correct": [3], "multi": false, "explanation": "Medir el desequilibrio de clases e identificar sesgos en los datos es el primer paso para desarrollar modelos de ML justos en decisiones de alto impacto como préstamos."}, {"id": 95, "text": "¿Qué técnica de aviso puede proteger contra los ataques de inyección de avisos?", "options": ["Incitación adversarial", "Indicaciones de disparo cero", "De menor a mayor indicación", "Inducción a la cadena de pensamiento"], "correct": [0], "multi": false, "explanation": "La incitación adversarial (adversarial prompting) prueba el sistema con inputs diseñados para explotar vulnerabilidades, ayudando a identificar y mitigar ataques de inyección antes de producción."}, {"id": 96, "text": "Una empresa optimizó un LLM para responder preguntas de soporte técnico y quiere evaluar si mejoró la precisión. ¿Qué métrica debe usar?", "options": ["Precisión", "Tiempo hasta el primer token", "Puntuación F1", "Tasa de error de palabras"], "correct": [2], "multi": false, "explanation": "La puntuación F1 combina precisión y recall, siendo ideal para evaluar modelos de QA donde tanto los falsos positivos como los falsos negativos son importantes."}, {"id": 97, "text": "Una empresa usa RAG con Bedrock y Stable Diffusion para generar imágenes de productos pero los resultados son aleatorios. Quiere más especificidad. ¿Qué solución cumple estos requisitos?", "options": ["Aumentar el número de pasos de generación", "Utilice la opción de origen de máscara MASK_IMAGE_BLACK", "Aumentar la escala de guía sin clasificador (CFG)", "Aumentar la fuerza del aviso"], "correct": [2], "multi": false, "explanation": "La escala CFG (Classifier-Free Guidance) controla qué tan fielmente el modelo sigue el prompt. Aumentarla produce imágenes más específicas y fieles a la descripción."}, {"id": 98, "text": "Una empresa quiere implementar un chatbot LLM con base de conocimiento de políticas propias de forma rentable. ¿Qué solución cumple estos requisitos?", "options": ["Reentrenar el LLM con datos de política de la empresa", "Ajustar el LLM con datos de política", "Implementar RAG para respuestas en contexto", "Usar preentrenamiento y aumento de datos en datos de política"], "correct": [2], "multi": false, "explanation": "RAG es la forma más rentable de incorporar conocimiento específico — recupera el contexto relevante de las políticas en tiempo real sin necesidad de reentrenar el modelo."}, {"id": 99, "text": "Una empresa quiere crear una nueva solución usando AWS Glue pero tiene poca experiencia. ¿Qué servicio de AWS puede ayudar?", "options": ["Amazon Q Developer", "AWS Config", "Amazon Personalize", "Amazon Comprehend"], "correct": [0], "multi": false, "explanation": "Amazon Q Developer es el asistente de IA para desarrolladores que puede ayudar a escribir código, entender servicios y resolver problemas con AWS Glue y otros servicios."}, {"id": 100, "text": "Una empresa entrena un modelo de clasificación de imágenes con un dataset diverso de picaduras de insectos de diferentes géneros, etnias y ubicaciones geográficas. ¿Qué principio de IA responsable demuestra?", "options": ["Equidad", "Explicabilidad", "Gobernanza", "Transparencia"], "correct": [0], "multi": false, "explanation": "La equidad (fairness) en IA requiere que los modelos funcionen bien para todos los grupos demográficos. Usar datos diversos asegura que el modelo sea equitativo para todos los usuarios."}, {"id": 101, "text": "Una empresa implementa un modelo para detectar sesgos y explicar predicciones. ¿Qué solución cumple estos requisitos?", "options": ["Amazon SageMaker Clarify", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Model Cards", "AWS AI Service Cards"], "correct": [0], "multi": false, "explanation": "SageMaker Clarify está diseñado específicamente para detectar sesgos en datos y modelos, y para generar explicaciones de las predicciones del modelo."}, {"id": 102, "text": "Una empresa usa Bedrock para resumir documentos y quiere evaluar la precisión del modelo usando evaluación automática. ¿Qué métrica debe usar?", "options": ["AUC ROC", "Puntuación F1", "Puntuación BERTScore", "Puntuación de conocimientos del mundo real"], "correct": [2], "multi": false, "explanation": "BERTScore evalúa la similitud semántica entre el texto generado y la referencia usando representaciones contextuales de BERT, ideal para tareas de resumen."}, {"id": 103, "text": "Un profesional de IA quiere predecir la clasificación de flores basándose en longitud y ancho de pétalos y sépalos. ¿Qué algoritmo cumple estos requisitos?", "options": ["K vecinos más cercanos (k-NN)", "K-medias", "ARIMA", "Regresión lineal"], "correct": [0], "multi": false, "explanation": "K-NN clasifica nuevas muestras basándose en la similitud con los ejemplos de entrenamiento más cercanos, siendo ideal para clasificación multiclase como tipos de flores."}, {"id": 104, "text": "Una empresa usa modelos personalizados en Bedrock y quiere cifrar los artefactos con una clave gestionada por la empresa. ¿Qué servicio cumple estos requisitos?", "options": ["AWS Key Management Service (AWS KMS)", "Amazon Inspector", "Amazon Macie", "AWS Secrets Manager"], "correct": [0], "multi": false, "explanation": "AWS KMS permite crear y gestionar claves de cifrado propias para proteger datos en servicios de AWS, incluyendo los artefactos de modelos en Amazon Bedrock."}, {"id": 105, "text": "Una empresa quiere usar LLMs para generar código a partir de comentarios en lenguaje natural. ¿Qué característica de los LLMs cumple estos requisitos?", "options": ["Resumen de texto", "Generación de texto", "Completar el texto", "Clasificación de texto"], "correct": [1], "multi": false, "explanation": "La generación de texto es la capacidad fundamental de los LLMs para crear nuevo contenido — incluyendo código — a partir de instrucciones en lenguaje natural."}, {"id": 106, "text": "Una empresa quiere que el LLM de su app de aprendizaje de idiomas se asemeje a ejemplos de texto más legibles. ¿Qué métrica debe usar para evaluar?", "options": ["Valor de la función de pérdida", "Robustez semántica", "Puntuación ROUGE", "Latencia de la generación de texto"], "correct": [2], "multi": false, "explanation": "ROUGE mide la superposición entre el texto generado y textos de referencia, evaluando qué tan similar es el output del modelo a los ejemplos deseados."}, {"id": 107, "text": "Una empresa observa que su FM genera imágenes que no guardan relac
