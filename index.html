t": "Una empresa está diseñando un chatbot de atención al cliente utilizando un modelo de lenguaje grande (LLM) optimizado. La empresa desea garantizar que el chatbot utilice características de IA responsable. Seleccione la característica de IA responsable correcta de la siguiente lista para cada acción de diseño de la aplicación. Cada característica de IA responsable debe seleccionarse una sola vez o ninguna [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Anonimizar PII en preparación de datos = Privacidad y seguridad; Proporcionar decisiones explicables = Transparencia; Usar Guardrails para prevenir outputs dañinos = Seguridad", "Anonimizar PII = Transparencia; Decisiones explicables = Privacidad; Guardrails = Equidad", "Todos son Privacidad y seguridad", "Anonimizar = Equidad; Explicables = Seguridad; Guardrails = Transparencia"], "correct": [0], "multi": false, "explanation": "Anonimizar PII protege la privacidad y seguridad de datos. Las decisiones explicables garantizan transparencia. Los Guardrails implementan medidas de seguridad contra outputs dañinos."}, {"id": 189, "text": "Un hospital desea utilizar una solución de IA generativa con función de conversión de voz a texto para mejorar las habilidades de sus empleados al dictar notas clínicas. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Q Developer", "Amazon Polly", "Amazon Rekognition", "AWS HealthScribe"], "correct": [3], "multi": false, "explanation": "AWS HealthScribe es un servicio especializado que usa IA generativa para transcribir conversaciones médicas y generar notas clínicas estructuradas, diseñado específicamente para el sector salud."}, {"id": 190, "text": "¿Qué tipo de modelo de IA realiza predicciones numéricas?", "options": ["Difusión", "Regresión", "Transformador", "Multimodal"], "correct": [1], "multi": false, "explanation": "Los modelos de regresión predicen valores numéricos continuos (precio de una casa, temperatura, ventas). Son diferentes de los modelos de clasificación que predicen categorías."}, {"id": 191, "text": "Una empresa desea utilizar las funciones de Amazon SageMaker para diversos casos de uso. Seleccione la función de SageMaker adecuada de la siguiente lista para cada caso de uso. Cada función de SageMaker debe seleccionarse una sola vez o ninguna. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Interfaz visual no-code = SageMaker Canvas; Solución preconfigurada para fraude = SageMaker JumpStart; Datasets etiquetados con humanos = SageMaker Ground Truth", "Canvas para todo; JumpStart para entrenamiento; Ground Truth para despliegue", "JumpStart para todo; Clarify para etiquetado", "Todos son SageMaker Autopilot"], "correct": [0], "multi": false, "explanation": "Canvas = interfaz no-code para usuarios sin ML. JumpStart = modelos y soluciones preconfiguradas. Ground Truth = etiquetado de datos con trabajadores humanos o ML asistido."}, {"id": 192, "text": "¿Cuál es el propósito de las incrustaciones vectoriales en un modelo de lenguaje grande (LLM)?", "options": ["Dividir el texto en fragmentos de datos manejables.", "Agrupar un conjunto de caracteres para tratarlos como una sola unidad.", "Proporcionar la capacidad de comparar textos matemáticamente.", "Proporcionar el recuento de cada palabra en la entrada."], "correct": [2], "multi": false, "explanation": "Las incrustaciones vectoriales representan palabras y textos como vectores numéricos, permitiendo operaciones matemáticas como similitud coseno para comparar semánticamente diferentes textos."}, {"id": 193, "text": "Una empresa desea optimizar un modelo de base (FM) mediante los servicios de AWS. La empresa necesita garantizar que sus datos permanezcan privados, seguros y protegidos en la región de AWS donde se almacenan. ¿Qué combinación de pasos cumplirá con estos requisitos de la manera más rentable? (Seleccione dos).", "options": ["Aloje el modelo en sus propias instalaciones utilizando AWS Outposts.", "Utilice la API de Amazon Bedrock.", "Utilice AWS PrivateLink y una VPC.", "Alojar la API de Amazon Bedrock en las instalaciones de la empresa.", "Utilice los registros y métricas de Amazon CloudWatch."], "correct": [1, 2], "multi": true, "explanation": "La API de Bedrock procesa datos dentro de la región AWS sin moverlos. AWS PrivateLink asegura que las conexiones permanezcan dentro de la red de AWS sin pasar por internet público."}, {"id": 194, "text": "Una empresa financiera utiliza AWS para alojar sus modelos de IA generativa. La empresa debe generar informes que demuestren el cumplimiento de las normativas internacionales sobre el manejo de datos confidenciales de clientes. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Macie", "AWS Artifact", "AWS Secrets Manager", "AWS Config"], "correct": [1], "multi": false, "explanation": "AWS Artifact proporciona acceso bajo demanda a informes de seguridad y cumplimiento de AWS y certificaciones de terceros (SOC, ISO, PCI) necesarios para demostrar cumplimiento normativo."}, {"id": 195, "text": "Una empresa médica desea modernizar su aplicación de procesamiento de información local. La empresa quiere utilizar IA generativa para responder a las preguntas médicas de los pacientes. ¿Qué servicio de AWS debería usar la empresa para garantizar una IA responsable en la aplicación?", "options": ["Barreras de protección para la Amazon Bedrock", "Amazon Inspector", "Amazon Rekognition", "AWS Trusted Advisor"], "correct": [0], "multi": false, "explanation": "Amazon Bedrock Guardrails permite implementar salvaguardas como filtros de contenido, temas denegados y verificación de base contextual para asegurar que la IA médica sea responsable y precisa."}, {"id": 196, "text": "¿Qué métrica se utiliza para evaluar el rendimiento de los modelos base (FM) en tareas de resumen de texto?", "options": ["F1", "BLEU Score (BLEU)", "Precisión", "Root Mean Square Error (RMSE) (ECM)"], "correct": [1], "multi": false, "explanation": "BLEU (Bilingual Evaluation Understudy) evalúa la calidad de texto generado comparando n-gramas con referencias humanas. Es la métrica estándar para evaluar resumen y traducción automática."}, {"id": 197, "text": "¿Cuál es el beneficio de perfeccionar un modelo base (FM)?", "options": ["El ajuste fino reduce el tamaño y la complejidad del FM y permite una inferencia más lenta.", "El ajuste fino utiliza datos de entrenamiento específicos para reentrenar el FM desde cero y adaptarlo a un caso de uso específico.", "El ajuste fino mantiene actualizado el conocimiento del FM mediante el preentrenamiento del FM con datos más recientes.", "El ajuste fino mejora el rendimiento del FM en una tarea específica mediante un entrenamiento adicional del FM con nuevos datos etiquetados."], "correct": [3], "multi": false, "explanation": "El fine-tuning añade una capa de entrenamiento adicional sobre el modelo preentrenado usando datos específicos del dominio, mejorando su rendimiento en esa tarea sin reentrenar desde cero."}, {"id": 198, "text": "Una empresa desea mejorar las respuestas de su chatbot para que se ajusten al tono deseado. La empresa cuenta con 100 ejemplos de conversaciones de alta calidad entre agentes de atención al cliente y clientes. Quiere utilizar estos datos para incorporar el tono de la empresa en las respuestas del chatbot. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon Personalize para generar respuestas.", "Cree un trabajo de preentrenamiento de Amazon SageMaker HyperPod.", "Aloje el modelo utilizando Amazon SageMaker. Utilice TensorRT para la implementación de modelos de lenguaje grandes (LLM).", "Crear un trabajo de ajuste fino de Amazon Bedrock."], "correct": [3], "multi": false, "explanation": "El fine-tuning en Amazon Bedrock con ejemplos de conversaciones de alta calidad es la forma de incorporar el tono y estilo específico de la empresa al modelo sin infraestructura compleja."}, {"id": 199, "text": "Una empresa de comercio electrónico utiliza un chatbot para automatizar el proceso de envío de pedidos de los clientes. El chatbot, impulsado por IA, está disponible para los clientes directamente desde el sitio web de la empresa las 24 horas del día, los 7 días de la semana. ¿Cuál de las siguientes opciones representa una vulnerabilidad de entrada del sistema de IA que la empresa debe resolver antes de que el chatbot esté disponible?", "options": ["Fuga de datos", "Prompt injection", "Alucinaciones del modelo de lenguaje extenso (LLM)", "Desviación conceptual"], "correct": [1], "multi": false, "explanation": "La inyección de prompts permite a usuarios maliciosos manipular el chatbot para realizar acciones no autorizadas (como modificar pedidos, cambiar datos). Es la vulnerabilidad más crítica para chatbots transaccionales."}, {"id": 200, "text": "Una empresa de redes sociales quiere impedir que los usuarios publiquen contenido discriminatorio en su aplicación. La empresa desea utilizar Amazon Bedrock como parte de la solución. ¿Cómo puede la empresa utilizar Amazon Bedrock para cumplir con estos requisitos?", "options": ["Brindar a los usuarios la posibilidad de interactuar en función de sus preferencias.", "Bloquear las interacciones relacionadas con temas predefinidos.", "Restringir las conversaciones de los usuarios a temas predefinidos.", "Ofrecer una variedad de respuestas para que el usuario pueda elegir y así fomentar su participación."], "correct": [1], "multi": false, "explanation": "Los Temas Denegados de Bedrock Guardrails permiten bloquear específicamente interacciones relacionadas con contenido discriminatorio u otros temas predefinidos que la empresa quiere prohibir."}, {"id": 201, "text": "Waftion, una empresa educativa, ofrece una aplicación que permite a los usuarios introducir texto o adjuntar una imagen para formular una pregunta. La aplicación proporciona una respuesta escrita y una explicación de la misma. ¿Qué tipo de modelo cumple con estos requisitos?", "options": ["Modelo de visión por computadora", "Modelo de lenguaje multimodal de gran tamaño", "Modelo de difusión", "Modelo de conversión de texto a voz"], "correct": [1], "multi": false, "explanation": "Un LLM multimodal puede procesar múltiples tipos de entrada (texto e imágenes) y generar respuestas textuales, siendo exactamente lo que necesita la aplicación educativa."}, {"id": 202, "text": "¿En qué etapa del ciclo de vida del modelo de IA generativa se realizan las pruebas para examinar la precisión del modelo?", "options": ["Despliegue", "Selección de datos", "Ajuste fino", "Evaluación"], "correct": [3], "multi": false, "explanation": "La evaluación es la etapa donde se prueban y miden las capacidades del modelo usando métricas específicas antes de desplegarlo en producción."}, {"id": 203, "text": "¿Qué afirmación describe correctamente las incrustaciones en la IA generativa?", "options": ["Las incrustaciones representan los datos como vectores de alta dimensión que capturan relaciones semánticas.", "La técnica de incrustación (embeddings) busca en los datos la información más útil para responder preguntas en lenguaje natural.", "Las incrustaciones reducen los requisitos de hardware de un modelo al utilizar un tipo de datos menos preciso para los pesos y las activaciones.", "Las incrustaciones proporcionan la capacidad de almacenar y recuperar datos para aplicaciones de IA generativa."], "correct": [0], "multi": false, "explanation": "Las incrustaciones son representaciones vectoriales que capturan relaciones semánticas — palabras similares tienen vectores similares, permitiendo al modelo entender el significado del lenguaje."}, {"id": 204, "text": "Una empresa desea incorporar funcionalidades de IA generativa a su aplicación mediante la integración de un modelo de lenguaje extenso (LLM). Las respuestas del LLM deben ser lo más deterministas y estables posible. ¿Qué solución cumple con estos requisitos?", "options": ["Configure la aplicación para que establezca automáticamente el parámetro de temperatura en 0 al enviar la solicitud al LLM.", "Configure la aplicación para que agregue automáticamente \"haga que su respuesta sea determinista\" al final de la solicitud antes de enviarla al LLM.", "Configure la aplicación para que agregue automáticamente \"haga que su respuesta sea determinista\" al principio del mensaje antes de enviarlo al LLM.", "Configure la aplicación para que establezca automáticamente el parámetro de temperatura en 1 al enviar la solicitud al LLM."], "correct": [0], "multi": false, "explanation": "Temperatura = 0 hace que el modelo siempre elija el token más probable, produciendo respuestas deterministas y consistentes. Temperatura = 1 introduce máxima aleatoriedad."}, {"id": 205, "text": "Una empresa necesita seleccionar un modelo de IA generativa para desarrollar una aplicación. Esta aplicación debe proporcionar respuestas a los usuarios en tiempo real. ¿Qué características del modelo debería considerar la empresa para cumplir con estos requisitos?", "options": ["Complejidad del modelo", "Velocidad de innovación", "Velocidad de inferencia", "Tiempo de entrenamiento"], "correct": [2], "multi": false, "explanation": "La velocidad de inferencia determina qué tan rápido el modelo genera respuestas. Para aplicaciones en tiempo real, es la característica más crítica a considerar al seleccionar un modelo."}, {"id": 206, "text": "¿Qué término se refiere a las instrucciones que se dan a los modelos de base (MF) para que estos proporcionen una respuesta más precisa a una pregunta?", "options": ["Indicación", "Dirección", "Diálogo", "Traducción"], "correct": [0], "multi": false, "explanation": "Un prompt (indicación) es la entrada de texto que le damos al modelo con instrucciones, contexto y preguntas para guiar su respuesta hacia el resultado deseado."}, {"id": 207, "text": "Una empresa minorista desea crear un modelo de aprendizaje automático para recomendar productos a sus clientes. La empresa quiere desarrollar el modelo basándose en prácticas responsables. ¿Qué práctica debería aplicar la empresa al recopilar datos para reducir el sesgo del modelo?", "options": ["Utilice únicamente datos de clientes que coincidan con las características demográficas de la base de clientes general de la empresa.", "Recopilar datos de clientes que tengan un historial de compras anterior.", "Asegúrese de que los datos sean equilibrados y se recopilen de un grupo diverso.", "Asegúrese de que los datos provengan de un conjunto de datos disponible públicamente."], "correct": [2], "multi": false, "explanation": "Datos equilibrados y diversos representan adecuadamente a todos los grupos de clientes, reduciendo el riesgo de que el modelo favorezca o discrimine a ciertos segmentos."}, {"id": 208, "text": "Una empresa está desarrollando un modelo de aprendizaje automático para predecir la deserción de clientes. ¿Qué métrica de evaluación permitirá valorar el rendimiento del modelo en una tarea de clasificación binaria, como la predicción de la deserción?", "options": ["F1", "Root Mean Square Error (RMSE) (ECM)", "R cuadrado", "Tiempo empleado para entrenar el modelo"], "correct": [0], "multi": false, "explanation": "La puntuación F1 es la métrica estándar para clasificación binaria — combina precisión y recall para dar una visión balanceada del rendimiento, especialmente con clases desbalanceadas."}, {"id": 209, "text": "Un profesional de IA está evaluando el rendimiento de un modelo de Amazon SageMaker. Debe elegir una métrica de rendimiento que muestre la proporción entre el número de elementos clasificados correctamente y el número total de elementos clasificados correctamente e incorrectamente. ¿Qué métrica cumple con estos requisitos?", "options": ["Precisión", "Precisión", "F1", "Recordatorio"], "correct": [0], "multi": false, "explanation": "La exactitud (accuracy) es la proporción de predicciones correctas sobre el total de predicciones — exactamente la métrica que describe la pregunta."}, {"id": 210, "text": "Una empresa de comercio electrónico recibe diariamente varios gigabytes de datos de clientes. La empresa utiliza estos datos para entrenar un modelo de aprendizaje automático (ML) que pronostica la demanda futura de productos. Necesita una solución para realizar inferencias una vez al día. ¿Qué tipo de inferencia cumple con estos requisitos?", "options": ["Inferencia por lotes", "Inferencia asíncrona", "Inferencia en tiempo real", "Inferencia sin servidor"], "correct": [0], "multi": false, "explanation": "La inferencia por lotes procesa grandes volúmenes de datos de forma eficiente en un solo trabajo programado. Es ideal cuando no se necesitan resultados inmediatos y se procesan grandes cantidades periódicamente."}, {"id": 211, "text": "Una empresa ha desarrollado un modelo de IA generativa para la segmentación de clientes. El modelo lleva tiempo implementado en el entorno de producción de la empresa. Recientemente, la empresa ha detectado inconsistencias en sus respuestas y desea evaluar el sesgo y la desviación del modelo. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker Model Monitor", "Amazon SageMaker Clarify", "Amazon SageMaker Feature Store"], "correct": [0], "multi": false, "explanation": "SageMaker Model Monitor detecta data drift y degradación del rendimiento en modelos de producción, siendo la herramienta correcta para identificar inconsistencias y desviaciones del modelo."}, {"id": 212, "text": "Una empresa se ha suscrito a Amazon Bedrock para desarrollar aplicaciones. La empresa desea restringir el acceso de sus empleados a modelos específicos disponibles en Amazon Bedrock. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice las políticas de AWS Identity and Access Management (IAM) para restringir el acceso a los modelos.", "Utilice el AWS Security Token Service (STS) (AWS STS) para generar credenciales temporales para el uso del modelo.", "Utilice los roles de servicio de AWS Identity and Access Management (IAM) para restringir la suscripción al modelo.", "Utilice Amazon Inspector para supervisar el acceso a los modelos."], "correct": [0], "multi": false, "explanation": "Las políticas de IAM permiten controlar granularmente qué usuarios o roles pueden acceder a qué modelos específicos en Amazon Bedrock mediante permisos de acción específicos."}, {"id": 213, "text": "¿Qué técnica de aprendizaje automático utiliza datos de entrenamiento etiquetados con los valores de salida correctos?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "Transfer learning"], "correct": [0], "multi": false, "explanation": "El aprendizaje supervisado requiere datasets con etiquetas (respuestas correctas) para cada ejemplo de entrenamiento, permitiendo al modelo aprender la relación entre entrada y salida."}, {"id": 214, "text": "¿Qué parámetro del modelo de lenguaje a gran escala (LLM, por sus siglas en inglés) controla la cantidad de posibles palabras o tokens siguientes que se consideran en cada paso del proceso de generación de texto?", "options": ["Número máximo de fichas", "Top K", "Tamaño del lote"], "correct": [1], "multi": false, "explanation": "Top K limita la selección a los K tokens más probables en cada paso. Por ejemplo, Top K=50 significa que solo se consideran los 50 tokens más probables, controlando la diversidad del output."}, {"id": 215, "text": "Una empresa está desarrollando un chatbot. El chatbot utiliza Amazon Lex y Amazon OpenSearch Service. Para responder preguntas, el chatbot utiliza datos privados de la empresa. La empresa necesita convertir estos datos a una representación vectorial antes de almacenarlos en una base de datos. ¿Qué tipo de modelo de base (FM) cumple con estos requisitos?", "options": ["Modelo de autocompletado de texto", "Modelo de seguimiento de instrucciones", "Modelo de incrustaciones de texto", "Modelo de generación de imágenes"], "correct": [2], "multi": false, "explanation": "Los modelos de incrustaciones de texto convierten texto en vectores numéricos que capturan el significado semántico, permitiendo búsquedas de similitud en bases de datos vectoriales."}, {"id": 216, "text": "Una empresa desea utilizar un modelo de lenguaje extenso (LLM) para generar descripciones de productos. La empresa quiere proporcionarle al modelo ejemplos de descripciones que sigan un formato determinado. ¿Qué técnica de ingeniería de indicaciones generará descripciones que se ajusten a dicho formato?", "options": ["Zero-shot prompting", "Chain-of-thought prompting", "One-shot prompting", "Few-shot prompting"], "correct": [3], "multi": false, "explanation": "Few-shot prompting proporciona múltiples ejemplos del formato deseado antes de la nueva tarea, guiando al modelo para que siga el mismo patrón en las nuevas descripciones."}, {"id": 217, "text": "Un banco está perfeccionando un modelo de lenguaje natural (LLM) en Amazon Bedrock para ayudar a sus clientes con preguntas sobre sus préstamos. El banco quiere asegurarse de que el modelo no revele ningún dato privado de los clientes. ¿Qué solución cumple con estos requisitos?", "options": ["Use Amazon Bedrock Guardrails.", "Elimine la información de identificación personal (PII) de los datos del cliente antes de ajustar el LLM.", "Aumentar el parámetro Top-K del LLM.", "Almacene los datos de los clientes en Amazon S3. Cifre los datos antes de ajustar el LLM."], "correct": [1], "multi": false, "explanation": "Eliminar PII de los datos de entrenamiento antes del fine-tuning asegura que el modelo nunca aprenda esa información privada, siendo la solución más efectiva en la fuente."}, {"id": 218, "text": "Un supermercado quiere crear un chatbot para ayudar a los clientes a encontrar productos. El chatbot debe consultar el inventario en tiempo real e indicar la ubicación del producto. ¿Qué técnica de ingeniería de mensajes debería usar el supermercado para crear el chatbot?", "options": ["Zero-shot prompting", "Few-shot prompting", "Least-to-most prompting", "ReAct prompting (ReAct)"], "correct": [3], "multi": false, "explanation": "ReAct combina razonamiento y acción — permite al modelo razonar sobre qué hacer y luego actuar (consultar APIs de inventario en tiempo real) para proporcionar respuestas precisas y actualizadas."}, {"id": 219, "text": "Un supermercado quiere crear un chatbot para ayudar a los clientes a encontrar productos. El chatbot debe consultar el inventario en tiempo real e indicar la ubicación del producto. ¿Qué técnica de ingeniería de mensajes debería usar el supermercado para crear el chatbot?", "options": ["Zero-shot prompting", "Few-shot prompting", "Least-to-most prompting", "ReAct prompting (ReAct)"], "correct": [3], "multi": false, "explanation": "ReAct (Reasoning and Acting) es la técnica que permite al modelo razonar sobre qué pasos seguir y ejecutar acciones externas como consultar APIs, ideal para chatbots que necesitan datos en tiempo real."}, {"id": 220, "text": "Una empresa de animación quiere ofrecer subtítulos para su contenido. ¿Qué servicio de AWS cumple con este requisito?", "options": ["Amazon Comprehend", "Amazon Polly", "Amazon Transcribe", "Amazon Translate"], "correct": [2], "multi": false, "explanation": "Amazon Transcribe convierte audio y video a texto, generando automáticamente transcripciones que pueden usarse como subtítulos. Polly hace lo contrario (texto a voz)."}, {"id": 221, "text": "Una empresa de comercio electrónico quiere agrupar a sus clientes según su historial de compras y preferencias para personalizar la experiencia de usuario de su aplicación. ¿Qué técnica de aprendizaje automático debería utilizar?", "options": ["Clasificación", "Agrupación", "Regresión", "Generación de contenido"], "correct": [1], "multi": false, "explanation": "El clustering (agrupación) agrupa automáticamente clientes con comportamientos similares sin necesitar etiquetas previas — ideal para segmentación de clientes para personalización."}, {"id": 222, "text": "Una empresa desea controlar el acceso de sus empleados a los modelos de base (FM) disponibles públicamente. ¿Qué solución cumple con estos requisitos?", "options": ["Analice los informes de costos y uso en AWS Cost Explorer.", "Descargue los documentos de seguridad y cumplimiento de AWS desde AWS Artifact.", "Configure Amazon SageMaker JumpStart para restringir los FM detectables.", "Cree una solución de búsqueda híbrida utilizando Amazon OpenSearch Service."], "correct": [2], "multi": false, "explanation": "SageMaker JumpStart permite configurar qué modelos base son accesibles para los usuarios, controlando el acceso a FMs disponibles públicamente dentro de la organización."}, {"id": 223, "text": "Una empresa ha implementado una herramienta de traducción para ayudar a su equipo de atención al cliente a gestionar las consultas de clientes de todo el mundo. La empresa desea evaluar el rendimiento de la herramienta. Para ello, establece un proceso de datos paralelo que compara las respuestas de la herramienta con las de personas reales. Ambos conjuntos de respuestas se generan a partir del mismo conjunto de documentos. ¿Qué estrategia debería utilizar la empresa para evaluar la herramienta de traducción?", "options": ["Utilice la puntuación del Estudio de Evaluación Bilingüe (BLEU) para estimar la calidad absoluta de la traducción de los dos métodos.", "Utilice la puntuación del Estudio de Evaluación Bilingüe (BLEU) para estimar la calidad relativa de la traducción de los dos métodos.", "Utilice el BERTScore para estimar la calidad de traducción absoluta de los dos métodos.", "Utilice el BERTScore para estimar la calidad de traducción relativa de los dos métodos."], "correct": [1], "multi": false, "explanation": "BLEU mide la calidad relativa al comparar una traducción con referencias humanas. Al usarlo con dos métodos del mismo dataset, permite comparar cuál es mejor de forma relativa."}, {"id": 224, "text": "Un profesional de la IA desea generar resultados más diversos y creativos a partir de un modelo de lenguaje extenso (LLM). ¿Cómo debería ajustar el parámetro de inferencia?", "options": ["Aumentar el valor de la temperatura.", "Disminuir el valor de Top K.", "Aumentar la duración de la respuesta.", "Disminuir la longitud de la indicación."], "correct": [0], "multi": false, "explanation": "Aumentar la temperatura incrementa la aleatoriedad del modelo, generando respuestas más diversas y creativas. A mayor temperatura, mayor variabilidad en los outputs generados."}, {"id": 225, "text": "Una empresa ha desarrollado modelos de visión artificial personalizados. Necesita una interfaz fácil de usar para el etiquetado de datos con el fin de minimizar los errores del modelo en nuevos datos reales. ¿Qué servicio, función o herramienta de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker Ground Truth", "Amazon SageMaker Canvas", "Amazon Bedrock PartyRock", "Amazon Bedrock Agents"], "correct": [0], "multi": false, "explanation": "SageMaker Ground Truth proporciona flujos de trabajo de etiquetado asistido por ML con revisión humana, ofreciendo una interfaz fácil de usar que minimiza errores en el etiquetado."}, {"id": 226, "text": "Una empresa está integrando la IA en su solución de reclutamiento y contratación de personal. La empresa busca mitigar los riesgos de sesgo y garantizar prácticas de IA responsables, priorizando la equidad en las decisiones de contratación. ¿Qué dimensiones clave de la IA responsable debería considerar la empresa? (Elija dos).", "options": ["Equidad", "Tolerancia", "Flexibilidad", "Código abierto", "Transparencia"], "correct": [0, 4], "multi": true, "explanation": "La equidad asegura que el sistema no discrimine por género, raza u otros atributos protegidos. La transparencia permite entender y auditar las decisiones del sistema — ambas críticas en contratación."}, {"id": 227, "text": "Una empresa financiera ha implementado un modelo de aprendizaje automático para predecir la deserción de clientes. El modelo lleva una semana en producción y desea evaluar la precisión con la que el modelo predice la deserción en comparación con el comportamiento real de los clientes. ¿Qué métrica cumple con estos requisitos?", "options": ["Root Mean Square Error (RMSE) (RMSE)", "Retorno de la inversión (ROI)", "F1", "BLEU Score (BLEU)"], "correct": [2], "multi": false, "explanation": "La puntuación F1 es la métrica estándar para evaluar modelos de clasificación binaria como predicción de deserción, balanceando precisión y recall para dar una evaluación completa."}, {"id": 228, "text": "Una empresa cuenta con una aplicación de IA generativa que utiliza un modelo base preentrenado (FM) en Amazon Bedrock. La empresa desea que el FM incluya más contexto mediante el uso de información corporativa. ¿Qué solución cumple estos requisitos de la manera más rentable?", "options": ["Utilice las bases de conocimiento de Amazon Bedrock.", "Elija un FM diferente en Amazon Bedrock.", "Utilice agentes de Amazon Bedrock.", "Implementar un modelo personalizado en Amazon Bedrock."], "correct": [0], "multi": false, "explanation": "Las Bases de Conocimiento de Bedrock indexan información corporativa y la recuperan en tiempo real (RAG), siendo la forma más rentable de agregar contexto sin reentrenar el modelo."}, {"id": 229, "text": "Una empresa utiliza Amazon SageMaker para desarrollar modelos de IA. Seleccione la función o el recurso de SageMaker adecuado de la siguiente lista para cada paso del flujo de trabajo del ciclo de vida del modelo de IA. Cada función o recurso de SageMaker debe seleccionarse una sola vez o no seleccionarse en absoluto. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Gestionar versiones del modelo = SageMaker Model Registry; Usar modelo para predicciones = SageMaker Serverless Inference", "Model Registry para todo; Canvas para inferencia", "JumpStart para versiones; Autopilot para inferencia", "Clarify para versiones; Model Monitor para despliegue"], "correct": [0], "multi": false, "explanation": "Model Registry gestiona versiones, aprobaciones y metadatos de modelos. Serverless Inference despliega modelos para hacer predicciones sin gestionar servidores."}, {"id": 230, "text": "Una empresa de servicios de alimentación desea recopilar un conjunto de datos para predecir las preferencias alimentarias de sus clientes. La empresa quiere asegurarse de que los datos incluyan las preferencias alimentarias de todos los grupos demográficos. ¿Qué característica del conjunto de datos presenta este escenario?", "options": ["Precisión", "Diversidad", "Sesgo de actualidad", "Fiabilidad"], "correct": [1], "multi": false, "explanation": "La diversidad en los datos asegura que el dataset represente adecuadamente a todos los grupos demográficos, siendo fundamental para crear modelos justos y equitativos."}, {"id": 231, "text": "Una empresa desea crear un chatbot que responda preguntas sobre políticas de recursos humanos. La empresa utiliza un modelo de lenguaje extenso (LLM) y cuenta con una amplia base de documentación digital. ¿Qué técnica debería emplear para optimizar las respuestas generadas?", "options": ["Utilice la Retrieval Augmented Generation (RAG) (RAG).", "Utilice indicaciones con pocos ejemplos.", "Ajuste la temperatura a 1.", "Disminuir el tamaño del token."], "correct": [0], "multi": false, "explanation": "RAG conecta el LLM a la base de documentación de RR.HH., permitiendo respuestas precisas y actualizadas basadas en las políticas reales sin necesitar reentrenar el modelo."}, {"id": 232, "text": "Una empresa educativa está desarrollando un chatbot dirigido a adolescentes. Para ello, está entrenando un modelo de lenguaje a gran escala (LLM) personalizado. La empresa busca que el chatbot hable con el estilo lingüístico de su público objetivo, utilizando ortografía creativa y palabras abreviadas. ¿Qué métrica permitirá evaluar el rendimiento del LLM?", "options": ["F1", "Puntuación BERTScore", "ROUGE Score (ROUGE)", "BLEU Score (BLEU)"], "correct": [1], "multi": false, "explanation": "BERTScore evalúa la similitud semántica usando representaciones contextuales de BERT, pudiendo capturar similitudes semánticas incluso con ortografía creativa o palabras abreviadas."}, {"id": 233, "text": "Un equipo de atención al cliente está desarrollando una aplicación para analizar las opiniones de los clientes y clasificarlas automáticamente en diferentes categorías. Estas categorías incluyen calidad del producto, atención al cliente y experiencia de entrega. ¿Qué concepto A1 presenta este escenario?", "options": ["Visión por computadora", "Procesamiento del lenguaje natural (PLN)", "Sistemas de recomendación", "Detección de fraude"], "correct": [1], "multi": false, "explanation": "El PLN (NLP) es el campo de IA que analiza y comprende texto en lenguaje humano. La clasificación de opiniones de clientes en categorías es una tarea clásica de NLP."}, {"id": 234, "text": "Una empresa de servicios financieros debe garantizar que su chatbot generativo con IA proporcione respuestas veraces para el cumplimiento normativo. ¿Qué solución evita que el modelo base subyacente (FM) genere ilusiones?", "options": ["Utilice AWS Config para consultar los metadatos de cumplimiento mediante lenguaje natural.", "Configure Amazon Bedrock Guardrails para evaluar las entradas del usuario y las respuestas del modelo.", "Utilice Amazon Fraud Detector para detectar actividades en línea potencialmente fraudulentas.", "Utilice AWS Audit Manager para preparar informes de auditoría y cumplimiento de TI."], "correct": [1], "multi": false, "explanation": "Bedrock Guardrails incluye verificación de base contextual que evalúa si las respuestas están fundamentadas en las fuentes de datos autorizadas, reduciendo las alucinaciones."}, {"id": 235, "text": "Una empresa desea desarrollar una solución que utilice IA generativa para crear contenido publicitario para sus productos, incluyendo imágenes de muestra y eslóganes. Seleccione el tipo de modelo correcto de la siguiente lista para cada acción. Cada tipo de modelo debe seleccionarse una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Imágenes desde eslóganes = Modelo de difusión; Eslóganes contextuales = Modelo basado en Transformer; Colocación de elementos de marca = Detección de objetos", "Todo con modelos de difusión", "Transformer para imágenes; Difusión para texto; GAN para detección", "Todos con modelos de generación de imágenes"], "correct": [0], "multi": false, "explanation": "Modelos de difusión generan imágenes de alta calidad desde texto. Transformers generan texto contextual (eslóganes). Detección de objetos localiza y posiciona elementos específicos en imágenes."}, {"id": 236, "text": "Una empresa ha creado varios modelos de aprendizaje automático. Necesita una solución para almacenar, gestionar y versionar estos modelos. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["AWS Audit Manager", "Amazon SageMaker Model Monitor", "Amazon SageMaker Model Registry - mas votado", "Amazon SageMaker Canvas"], "correct": [0], "multi": false, "explanation": "SageMaker Model Registry es el repositorio centralizado para almacenar, versionar, aprobar y gestionar el ciclo de vida de los modelos ML en Amazon SageMaker."}, {"id": 237, "text": "Un profesional de la IA está creando un modelo de aprendizaje automático. Su objetivo es brindar transparencia y explicabilidad al modelo para las partes interesadas. ¿Qué solución cumplirá con estos requisitos?", "options": ["Presente los valores de Shapley del modelo.", "Proporcione la medida de precisión del modelo.", "Proporcione la matriz de confusión del modelo.", "Proporcionar un punto final seguro para la inferencia del modelo."], "correct": [0], "multi": false, "explanation": "Los valores SHAP (SHapley Additive exPlanations) explican la contribución de cada característica a la predicción del modelo, siendo la herramienta estándar de XAI (IA explicable) para partes interesadas."}, {"id": 238, "text": "Una empresa está desarrollando una aplicación de aprendizaje automático (ML). La aplicación debe agrupar automáticamente a clientes y productos similares según sus características. ¿Qué estrategia de ML debería utilizar la empresa para cumplir con estos requisitos?", "options": ["Aprendizaje no supervisado", "Aprendizaje supervisado", "Aprendizaje por refuerzo", "Semi-supervised learning"], "correct": [0], "multi": false, "explanation": "El aprendizaje no supervisado (clustering) descubre automáticamente grupos y patrones en los datos sin necesitar etiquetas predefinidas — ideal para agrupar clientes y productos."}, {"id": 239, "text": "Una agencia de noticias publica artículos en inglés. La agencia desea que estos artículos estén disponibles en otros idiomas. ¿Qué solución cumple con estos requisitos?", "options": ["Añadir Amazon Transcribe al sitio web de la empresa.", "Utilice la función de traducción en tiempo real de Amazon Translate.", "Añadir Amazon Personalize al sitio web de la empresa.", "Utilice la función de procesamiento de documentos en tiempo real de Amazon Textract."], "correct": [1], "multi": false, "explanation": "Amazon Translate ofrece traducción en tiempo real de texto entre idiomas, siendo el servicio ideal para hacer artículos accesibles en múltiples idiomas automáticamente."}, {"id": 240, "text": "Un banco está desarrollando un chatbot para responder las preguntas de los clientes sobre la apertura de una cuenta bancaria. El chatbot utilizará documentos públicos del banco para generar las respuestas. La empresa utilizará Amazon Bedrock y la técnica de ingeniería de indicaciones para mejorar las respuestas del chatbot. ¿Qué técnica de ingeniería de indicaciones cumple con estos requisitos?", "options": ["Indicaciones basadas en la complejidad", "Zero-shot prompting", "Few-shot prompting", "Directional stimulus prompting"], "correct": [3], "multi": false, "explanation": "Las indicaciones direccionales guían al modelo hacia un dominio específico (documentos bancarios) proporcionando contexto y dirección sobre qué información usar y cómo responder."}, {"id": 241, "text": "Una empresa desea optimizar un modelo de aprendizaje automático alojado en Amazon Bedrock. La empresa quiere utilizar sus propios datos confidenciales, almacenados en bases de datos privadas dentro de una VPC. Los datos deben permanecer dentro de la red privada de la empresa. ¿Qué solución cumple con estos requisitos?", "options": ["Restrinja el acceso a Amazon Bedrock mediante el uso de una función de servicio de AWS Identity and Access Management (IAM).", "Restrinja el acceso a Amazon Bedrock mediante una política de recursos de AWS Identity and Access Management (IAM).", "Utilice AWS PrivateLink para conectar la VPC y Amazon Bedrock.", "Utilice claves del AWS Key Management Service (KMS) (AWS KMS) para cifrar los datos."], "correct": [2], "multi": false, "explanation": "AWS PrivateLink crea una conexión privada entre la VPC y Amazon Bedrock sin exponer los datos a internet, manteniendo todo el tráfico dentro de la red privada de AWS."}, {"id": 242, "text": "Un documentalista quiere llegar a más espectadores. Desea añadir automáticamente subtítulos y narraciones en varios idiomas a sus películas. ¿Qué combinación de pasos cumple con estos requisitos? (Elija dos).", "options": ["Utilice Amazon Transcribe y Amazon Translate para generar subtítulos en otros idiomas.", "Utilice Amazon Textract y Amazon Translate para generar subtítulos en otros idiomas.", "Utilice Amazon Polly para generar locuciones en otros idiomas.", "Utilice Amazon Translate para generar locuciones en otros idiomas.", "Utilice Amazon Textract para generar locuciones en otros idiomas."], "correct": [0, 2], "multi": true, "explanation": "Transcribe + Translate = subtítulos (transcribir audio a texto, luego traducir). Polly convierte texto traducido en audio/narración. Juntos cubren subtítulos y narraciones en otros idiomas."}, {"id": 243, "text": "Una empresa desea crear un chatbot para responder las preguntas de los empleados sobre las políticas de la empresa. Estas políticas se actualizan con frecuencia, por lo que el chatbot debe reflejar los cambios prácticamente en tiempo real. La empresa quiere elegir un modelo de lenguaje grande (LLM). ¿Qué solución cumple con estos requisitos?", "options": ["Perfeccionar un LLM sobre el texto de la política de la empresa utilizando Amazon SageMaker.", "Seleccione un modelo base (FM) de Amazon Bedrock para crear una aplicación.", "Cree un flujo de trabajo de Retrieval Augmented Generation (RAG) (RAG) utilizando las bases de conocimiento de Amazon Bedrock.", "Utilice Amazon Q Business para crear una aplicación Q personalizada."], "correct": [2], "multi": false, "explanation": "RAG con Bases de Conocimiento permite actualizar la información disponible para el modelo actualizando solo la base de conocimiento, reflejando cambios casi en tiempo real sin reentrenar el modelo."}, {"id": 244, "text": "Una empresa utiliza el aprendizaje supervisado para entrenar un modelo de IA con un pequeño conjunto de datos etiquetados específico para una tarea determinada. ¿Qué paso del ciclo de vida del modelo base (FM) describe esta situación?", "options": ["Ajuste fino", "Selección de datos", "Entrenamiento previo", "Evaluación"], "correct": [0], "multi": false, "explanation": "El fine-tuning es el proceso de entrenar adicionalmente un modelo preentrenado con datos etiquetados específicos de la tarea, usando aprendizaje supervisado para adaptar el modelo."}, {"id": 245, "text": "Una empresa está desarrollando una aplicación de IA para ayudarla a aprobar o denegar préstamos personales. La aplicación debe seguir los principios de la IA responsable. Seleccione el principio de IA responsable correcto de la siguiente lista para cada acción. Seleccione cada principio de IA responsable una sola vez o ninguna. la imagen pertenece a la pregunta 245. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Cifrar+aislar datos = Privacidad y seguridad; Evaluar grupos demográficos = Equidad; Probar con datos inesperados = Robustez", "Cifrar = Equidad; Evaluar grupos = Privacidad; Probar = Transparencia", "Todos son Equidad", "Cifrar = Robustez; Evaluar = Transparencia; Probar = Equidad"], "correct": [0], "multi": false, "explanation": "Privacidad y seguridad = cifrado y aislamiento de datos. Equidad = evaluación justa para todos los grupos. Robustez = capacidad de manejar datos inesperados sin fallas."}, {"id": 246, "text": "Una empresa está implementando una nueva función en su aplicación. Esta función refinará el estilo de los mensajes de salida. Para ello, la empresa optimizará un modelo de lenguaje de gran tamaño (LLM, por sus siglas en inglés) en Amazon Bedrock. ¿Qué tipo de datos necesita la empresa para cumplir con estos requisitos?", "options": ["Muestras de solo mensajes de entrada", "Muestras solo de mensajes de salida", "Ejemplos de pares de mensajes de entrada y salida", "Muestras separadas de mensajes de entrada y salida."], "correct": [2], "multi": false, "explanation": "El fine-tuning para adaptar el estilo de salida requiere pares de entrada-salida — el modelo aprende a transformar un estilo de input en el estilo de output deseado mediante estos ejemplos."}, {"id": 247, "text": "Una empresa del sector sanitario está desarrollando una solución de IA para predecir la readmisión de pacientes en los 30 días posteriores al alta. La empresa ha entrenado un modelo con datos históricos de pacientes, incluyendo historial médico, datos demográficos y especificaciones de tratamiento, para proporcionar predicciones de readmisión en tiempo real. ¿Qué tarea describe la inferencia del modelo de IA en este escenario?", "options": ["Recopilar datos históricos de reingreso de pacientes.", "Utilice métricas apropiadas y evalúe el rendimiento del modelo.", "Utilizar los datos para identificar patrones y correlaciones entre los pacientes.", "Utilizar un modelo entrenado para predecir el reingreso del paciente."], "correct": [3], "multi": false, "explanation": "La inferencia es el proceso de usar un modelo ya entrenado para hacer predicciones sobre nuevos datos (pacientes actuales). El entrenamiento es cuando el modelo aprende los patrones."}, {"id": 248, "text": "Una empresa financiera desea crear flujos de trabajo para la revisión humana de predicciones de aprendizaje automático. La empresa quiere definir umbrales de confianza para su caso de uso y ajustarlos con el tiempo. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Personalize", "Amazon Augmented AI (A2I) (Amazon A2I) - mas votado", "Amazon Inspector", "AWS Audit Manager"], "correct": [0], "multi": false, "explanation": "Amazon A2I (Augmented AI) permite incorporar revisión humana en los workflows de ML cuando el modelo tiene baja confianza, con umbrales configurables para determinar cuándo escalar a humanos."}, {"id": 249, "text": "Una empresa desea desarrollar un asistente de IA para que sus empleados consulten datos internos. ¿Qué servicio de AWS cumplirá con este requisito?", "options": ["Amazon Rekognition", "Amazon Textract", "Amazon Lex", "Amazon Q Business"], "correct": [3], "multi": false, "explanation": "Amazon Q Business es el asistente de IA empresarial de AWS que permite a los empleados hacer preguntas sobre datos internos de la empresa de forma segura y contextualizada."}, {"id": 250, "text": "Una empresa quiere crear e implementar modelos de aprendizaje automático en AWS sin escribir código. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker Canvas", "Amazon Rekognition", "AWS DeepRacer", "Amazon Comprehend"], "correct": [0], "multi": false, "explanation": "SageMaker Canvas ofrece una interfaz visual no-code (sin código) para crear, entrenar y desplegar modelos de ML, accesible para usuarios sin experiencia en programación."}, {"id": 251, "text": "Una empresa de diseño utiliza un modelo base (FM) en Amazon Bedrock para generar imágenes para diversos proyectos. La empresa desea controlar el nivel de detalle o abstracción de cada imagen generada. ¿Qué parámetro del modelo debería modificar?", "options": ["Model checkpoint", "Tamaño del lote", "Generation step", "Longitud del token"], "correct": [2], "multi": false, "explanation": "El paso de generación (generation step) controla cuántas iteraciones de refinamiento aplica el modelo difusor — más pasos = más detalle y calidad, menos pasos = mayor abstracción y velocidad."}, {"id": 252, "text": "Una empresa financiera tiene oficinas en distintos países del mundo. La empresa exige que todas las llamadas a la API entre las aplicaciones de IA generativa y los modelos base (FM) no se realicen a través de internet. ¿Qué servicio de AWS debería utilizar la empresa?", "options": ["AWS PrivateLink", "Amazon Q", "Amazon CloudFront", "AWS CloudTrail"], "correct": [0], "multi": false, "explanation": "AWS PrivateLink crea conexiones privadas entre servicios de AWS sin exponer el tráfico a internet público, cumpliendo con el requisito de comunicación completamente privada."}, {"id": 253, "text": "Una empresa de comercio electrónico está implementando un chatbot. Este permitirá a los usuarios hacer preguntas sobre los productos de la empresa y recibir información sobre sus pedidos. La empresa debe implementar medidas de seguridad para que el chatbot filtre el contenido dañino tanto en las preguntas como en las respuestas. ¿Qué función o recurso de AWS cumple con estos requisitos?", "options": ["Amazon Bedrock Guardrails", "Amazon Bedrock Agents", "API de inferencia de Amazon Bedrock", "Modelos personalizados de Amazon Bedrock"], "correct": [0], "multi": false, "explanation": "Amazon Bedrock Guardrails aplica filtros de contenido en tiempo real tanto a las entradas del usuario como a las respuestas del modelo, siendo la solución correcta para este caso."}, {"id": 254, "text": "Una empresa desea conocer las aplicaciones de la IA generativa en un entorno experimental. ¿Qué solución cumplirá con este requisito de la manera más rentable?", "options": ["Amazon Q Developer", "Amazon SageMaker JumpStart", "Amazon Bedrock PartyRock", "Amazon Q Business"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock PartyRock es un playground gratuito para explorar y experimentar con modelos de IA generativa sin necesidad de configurar infraestructura o manejar APIs."}, {"id": 255, "text": "Una empresa necesita recopilar un gran conjunto de datos para entrenar a un asistente de IA en un área temática específica. ¿Qué conjunto de datos cumplirá con este requisito?", "options": ["Conversaciones diversas que utilizan terminología pertinente.", "Datos de series temporales de ventas históricas de propósito general", "Análisis de sentimiento de artículos periodísticos", "Identificadores únicos de producto e identificadores de usuario correspondientes."], "correct": [0], "multi": false, "explanation": "Para entrenar un asistente de IA en un área específica, se necesitan conversaciones diversas que usen la terminología relevante del dominio — esto enseña al modelo el lenguaje y contexto correcto."}, {"id": 256, "text": "Una empresa financiera está desarrollando una aplicación de IA generativa para la toma de decisiones sobre la aprobación de préstamos. La empresa necesita que el resultado de la aplicación sea responsable y justo. ¿Qué solución cumple con estos requisitos?", "options": ["Revise los datos de entrenamiento para comprobar si hay sesgos. Incluya datos de todos los grupos demográficos en los datos de entrenamiento.", "Utilice un modelo de aprendizaje profundo con muchas capas ocultas.", "Mantener en secreto el proceso de toma de decisiones del modelo para proteger los algoritmos patentados.", "Monitorear continuamente el rendimiento del modelo en un conjunto de datos de prueba estático."], "correct": [0], "multi": false, "explanation": "Revisar sesgos en los datos e incluir datos de todos los grupos demográficos asegura que el modelo trate a todos los solicitantes de forma justa, siendo el primer paso para IA responsable."}, {"id": 257, "text": "Seleccione el servicio o la herramienta de AWS correctos de la siguiente lista para cada caso de uso. Seleccione cada servicio o herramienta de AWS una sola vez o no seleccione ninguno. te una imagen que pertenece a la pregunta 257. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Aplicar retroalimentación humana en ciclo de vida ML = SageMaker Ground Truth; Salvaguardas de IA responsable = Bedrock Guardrails; Detectar sesgo en preparación de datos = SageMaker Clarify", "Ground Truth para todo; Clarify para despliegue", "Bedrock Guardrails para etiquetado; Clarify para monitoreo", "Todos con SageMaker Model Monitor"], "correct": [0], "multi": false, "explanation": "Ground Truth = etiquetado de datos con retroalimentación humana. Bedrock Guardrails = salvaguardas en tiempo de inferencia. SageMaker Clarify = detección de sesgo en datos y modelo."}, {"id": 258, "text": "Un profesional de la IA con conocimientos mínimos de aprendizaje automático quiere predecir la rotación de personal sin escribir código. ¿Qué función de Amazon SageMaker cumple con este requisito? • SageMaker Canvas A. Más votado", "options": ["SageMaker Clarify", "SageMaker Data Wrangler"], "correct": [0], "multi": false, "explanation": "SageMaker Canvas es la herramienta no-code de SageMaker que permite crear modelos de ML mediante una interfaz visual sin necesidad de escribir código ni conocer algoritmos."}, {"id": 259, "text": "Una empresa utiliza inteligencia artificial (IA) para mejorar sus servicios. La empresa necesita garantizar que el sistema de IA sea justo y transparente. Además, desea impartir formación a los miembros del equipo de desarrollo del sistema de IA. ¿Qué tipo de formación cumplirá con estos requisitos?", "options": ["Formación en habilidades de programación avanzadas", "Capacitación en privacidad de datos y protocolos de cifrado", "Formación sobre sesgo e IA responsable", "Formación en algoritmos avanzados de aprendizaje automático"], "correct": [2], "multi": false, "explanation": "La formación específica sobre sesgo e IA responsable enseña al equipo a identificar y mitigar sesgos, aplicar principios éticos y garantizar fairness y transparencia en sus sistemas."}, {"id": 260, "text": "Una empresa tiene un modelo de aprendizaje automático. La empresa quiere saber cómo el modelo realiza predicciones. ¿Qué término se refiere a la comprensión de las predicciones del modelo?", "options": ["Interpretabilidad del modelo", "Entrenamiento del modelo", "Interoperabilidad de modelos", "Rendimiento del modelo"], "correct": [0], "multi": false, "explanation": "La interpretabilidad es la capacidad de entender cómo y por qué un modelo hace sus predicciones — es fundamental para confianza, auditoría y cumplimiento normativo."}, {"id": 261, "text": "Una empresa quiere identificar grupos de clientes basándose en sus datos demográficos y patrones de compra. ¿Qué algoritmo debería utilizar para cumplir con este requisito?", "options": ["K vecinos más cercanos (k-NN)", "K-medias", "Árbol de decisión", "Support Vector Machine (SVM)"], "correct": [1], "multi": false, "explanation": "K-medias es el algoritmo de clustering más utilizado para segmentación de clientes — agrupa automáticamente en K grupos según similitudes en las características demográficas y de comportamiento."}, {"id": 262, "text": "Una empresa está trabajando en un modelo de lenguaje complejo (LLM) y ha observado que sus resultados no son tan diversos como esperaba. ¿Qué parámetro debería ajustar la empresa?", "options": ["Temperatura", "Tamaño del lote", "Tasa de aprendizaje", "Tipo de optimizador"], "correct": [0], "multi": false, "explanation": "La temperatura controla la diversidad de los outputs. Aumentar la temperatura hace que el modelo explore más opciones y genere respuestas más variadas y creativas."}, {"id": 263, "text": "Una empresa utiliza un modelo de Amazon Nova Canvas para generar imágenes. El modelo genera las imágenes correctamente. La empresa necesita evitar que el modelo incluya elementos específicos en las imágenes generadas. ¿Qué solución cumple con este requisito?", "options": ["Utilice un valor de temperatura más alto.", "Utilice una instrucción más detallada.", "Utilice una pregunta negativa. - mas votado", "Utilice otro modelo de base (FM)."], "correct": [0], "multi": false, "explanation": "Las indicaciones negativas especifican explícitamente qué elementos NO deben aparecer en la imagen generada, siendo la forma directa de excluir contenido específico del resultado."}, {"id": 264, "text": "Una empresa utiliza técnicas de aprendizaje automático para desarrollar aplicaciones. Seleccione la técnica de aprendizaje automático correcta de la siguiente lista para cada tarea. Seleccione cada técnica una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Analizar texto correcto/incorrecto = Clasificación binaria; Factores ecológicos → número de especies = Regresión; Atributos de auto → modelo de auto = Clasificación multiclase", "Todos son regresión", "Todos son clasificación binaria", "Texto = Regresión; Ecología = Clasificación; Auto = Clustering"], "correct": [0], "multi": false, "explanation": "Correcto/incorrecto = 2 clases = clasificación binaria. Número de especies = valor continuo = regresión. Modelo de auto entre muchas opciones = múltiples clases = clasificación multiclase."}, {"id": 265, "text": "Una empresa desea etiquetar conjuntos de datos de entrenamiento utilizando la retroalimentación humana para ajustar un modelo base (FM). La empresa no desea desarrollar aplicaciones de etiquetado ni gestionar un equipo de etiquetado. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker Data Wrangler", "Amazon SageMaker Ground Truth Plus", "Amazon Transcribe", "Amazon Macie"], "correct": [1], "multi": false, "explanation": "SageMaker Ground Truth Plus gestiona todo el proceso de etiquetado — recluta trabajadores, coordina el trabajo y entrega datos etiquetados sin que la empresa necesite gestionar nada."}, {"id": 266, "text": "Una empresa de transmisión de contenido multimedia en línea desea brindar a sus clientes la capacidad de realizar búsquedas y filtrado de imágenes mediante lenguaje natural. La empresa necesita una base de datos vectorial que facilite las búsquedas de similitud y las consultas de vecinos más cercanos. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Comprehend", "Amazon Personalize", "Amazon Polly", "Amazon OpenSearch Service"], "correct": [3], "multi": false, "explanation": "Amazon OpenSearch Service soporta búsqueda vectorial k-NN que permite almacenar embeddings de imágenes y realizar búsquedas de similitud usando lenguaje natural como consulta."}, {"id": 267, "text": "Una empresa está desarrollando una solución de IA utilizando Amazon SageMaker AI. La empresa desea usar las funciones de SageMaker AI para facilitar el desarrollo de aplicaciones. Seleccione la función de SageMaker AI correcta de la siguiente lista para cada caso de uso. Seleccione cada función una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Determinar modelo adecuado para negocio = Model Cards; Preparar datos low-code = Data Wrangler; Identificar sesgos = Clarify", "Canvas para todo; JumpStart para datos; Clarify para despliegue", "Model Monitor para selección; Data Wrangler para sesgo; JumpStart para datos", "Todos con SageMaker Autopilot"], "correct": [0], "multi": false, "explanation": "Model Cards documenta información del modelo para comparar opciones. Data Wrangler prepara y transforma datos con interfaz low-code. Clarify identifica sesgos e imbalances en datos y modelos."}, {"id": 268, "text": "Una empresa está desarrollando una herramienta de IA generativa. Para personalizar un modelo base (FM), utilizará documentos internos. ¿Qué enfoque cumplirá con este requisito?", "options": ["Clasificación", "Entrenamiento previo continuo", "Destilación", "Regresión"], "correct": [1], "multi": false, "explanation": "El preentrenamiento continuo (continued pre-training) usa documentos sin etiquetar para mejorar el conocimiento de dominio del modelo — ideal para incorporar información corporativa interna."}, {"id": 269, "text": "Una empresa monitoriza un modelo predictivo mediante Amazon SageMaker Model Monitor. La empresa detecta una desviación de datos que supera un umbral definido y desea mitigar el impacto potencialmente negativo en el modelo predictivo. ¿Qué solución cumple con estos requisitos?", "options": ["Reinicie el punto final de SageMaker AI.", "Ajuste la sensibilidad de la monitorización.", "Reentrenar el modelo con datos nuevos.", "Configurar experimentos de seguimiento."], "correct": [2], "multi": false, "explanation": "Cuando hay data drift significativo, la solución correcta es reentrenar el modelo con datos nuevos que reflejen la distribución actual, restaurando su precisión y rendimiento."}, {"id": 270, "text": "Una empresa financiera utiliza un modelo de IA generativa para asignar límites de crédito a nuevos clientes. La empresa desea que el proceso de toma de decisiones del modelo sea más transparente para sus clientes. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice un sistema basado en reglas en lugar de un modelo de aprendizaje automático.", "Aplicar técnicas de IA explicables para mostrar a los clientes qué factores influyeron en la decisión del modelo.", "Desarrollar una interfaz de usuario interactiva para los clientes y proporcionar explicaciones técnicas claras sobre el sistema.", "Aumentar la precisión del modelo para reducir la necesidad de transparencia."], "correct": [1], "multi": false, "explanation": "Las técnicas de IA explicable (XAI) como SHAP o LIME identifican qué factores influyeron en cada decisión del modelo, haciéndola comprensible para los clientes de forma no técnica."}, {"id": 271, "text": "Una empresa implementó un modelo en producción. Tras cuatro meses, la calidad de la inferencia del modelo se degradó. La empresa desea recibir una notificación si la calidad de la inferencia del modelo se degrada y, además, quiere asegurarse de que el problema no vuelva a ocurrir. ¿Qué solución cumple con estos requisitos?", "options": ["Reentrenar el modelo. Monitorear la desviación del modelo usando Amazon SageMaker Clarify.", "Reentrenar el modelo. Monitorear la desviación del modelo usando Amazon SageMaker Model Monitor.", "Cree un nuevo modelo. Supervise la desviación del modelo utilizando Amazon SageMaker Feature Store.", "Cree un nuevo modelo. Supervise la desviación del modelo utilizando Amazon SageMaker JumpStart."], "correct": [1], "multi": false, "explanation": "Model Monitor detecta degradación del rendimiento y envía alertas. Reentrenar con datos nuevos resuelve el problema. La combinación previene que vuelva a ocurrir mediante monitoreo continuo."}, {"id": 272, "text": "¿Cuál de las siguientes opciones es un ejemplo de aprendizaje no supervisado?", "options": ["Un modelo que agrupa a los clientes en función de su historial de compras.", "Un modelo que clasifica las imágenes como perros o gatos.", "Un modelo que predice el precio de una casa basándose en varias características.", "Un modelo que aprende a jugar al ajedrez mediante ensayo y error."], "correct": [0], "multi": false, "explanation": "Agrupar clientes sin etiquetas predefinidas es clustering — aprendizaje no supervisado. Clasificar perros/gatos requiere etiquetas (supervisado). Jugar ajedrez mediante ensayo es aprendizaje por refuerzo."}, {"id": 273, "text": "Una empresa está evaluando varios modelos de lenguaje grandes (LLM, por sus siglas en inglés) para una tarea de resumen de texto. La empresa necesita seleccionar una métrica para evaluar la calidad de los resúmenes que generan los LLM. ¿Qué métrica cumplirá con este requisito?", "options": ["Recordatorio", "AUC-ROC (AUC)", "ROUGE Score (ROUGE)", "Root Mean Square Error (RMSE) (ECM)"], "correct": [2], "multi": false, "explanation": "ROUGE (Recall-Oriented Understudy for Gisting Evaluation) mide la superposición de n-gramas entre el resumen generado y resúmenes de referencia, siendo la métrica estándar para evaluación de resúmenes."}, {"id": 274, "text": "Un grupo de investigación desea probar diferentes modelos de IA generativa para crear artículos científicos. El grupo ha definido una consigna y necesita un método para evaluar los resultados de los modelos. Para ello, planea utilizar un equipo de científicos. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice la evaluación automática en Amazon Personalize.", "Utilice la moderación de contenido en Amazon Rekognition.", "Utilice la evaluación del modelo en Amazon Bedrock.", "Utilizar el análisis de sentimientos en Amazon Comprehend."], "correct": [2], "multi": false, "explanation": "La evaluación de modelos en Amazon Bedrock permite configurar evaluaciones con trabajadores humanos, siendo la herramienta correcta para comparar modelos con evaluadores expertos."}, {"id": 275, "text": "Una empresa de comercio electrónico está desarrollando una solución de IA generativa para crear recomendaciones de productos personalizadas para los usuarios de su aplicación. La empresa desea evaluar la eficacia con la que la solución de IA aumenta las ventas de productos y la interacción de los usuarios con la aplicación. Seleccione la métrica de negocio correcta de la siguiente lista para cada objetivo de negocio. Cada métrica de negocio debe seleccionarse una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Medir engagement con recomendaciones = CTR; Efecto en valor total de compras = AOV; Animar a usuarios a regresar = Retention rate", "CTR para todo; AOV para engagement; Retention para ventas", "Todos son CTR", "AOV para engagement; CTR para ventas; Retention para valor"], "correct": [0], "multi": false, "explanation": "CTR (Click-Through Rate) mide si los usuarios hacen clic en las recomendaciones. AOV (Average Order Value) mide el valor promedio de compra. Retention rate mide si los usuarios regresan a la plataforma."}, {"id": 276, "text": "Un profesional de la IA desea evaluar modelos de aprendizaje automático y explicar las predicciones de estos modelos a clientes y partes interesadas. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon QuickSight", "Amazon Comprehend", "AWS Trusted Advisor", "Amazon SageMaker Clarify"], "correct": [3], "multi": false, "explanation": "SageMaker Clarify genera explicaciones de las predicciones del modelo e informes de sesgos, siendo la herramienta correcta para explicar el comportamiento del modelo a stakeholders."}, {"id": 277, "text": "El análisis de sentimientos es un subconjunto de qué campo más amplio de la IA?", "options": ["Visión por computadora", "Robótica", "Procesamiento del lenguaje natural (PLN) - mas votado", "Pronóstico de series temporales"], "correct": [0], "multi": false, "explanation": "El análisis de sentimientos analiza texto para determinar la opinión (positiva/negativa/neutral), siendo una de las muchas aplicaciones del procesamiento del lenguaje natural (NLP)."}, {"id": 278, "text": "Una empresa desea configurar el acceso privado a las API de Amazon Bedrock desde su cuenta de AWS. Además, quiere proteger sus datos de la exposición en internet. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon CloudFront para restringir el acceso al contenido privado de la empresa.", "Utilice AWS Glue para configurar el cifrado de datos en todo el catálogo de datos de la empresa.", "Utilice AWS Lake Formation para gestionar la gobernanza de datos centralizada y el intercambio de datos entre cuentas.", "Utilice AWS PrivateLink para configurar una conexión privada entre la VPC de la empresa y Amazon Bedrock. - mas votado"], "correct": [0], "multi": false, "explanation": "AWS PrivateLink crea endpoints VPC que permiten acceder a las APIs de Bedrock de forma completamente privada, sin que el tráfico salga a internet público."}, {"id": 279, "text": "Una empresa recibe una gran cantidad de comentarios de usuarios no estructurados en formato de texto. La empresa desea analizar el sentimiento que transmiten estos comentarios. ¿Qué solución cumplirá con estos requisitos?", "options": ["Utilice un modelo de lenguaje grande (LLM) para realizar el procesamiento del lenguaje natural (NLP) para el análisis de sentimientos. - mas votado", "Utilice un algoritmo de regresión para clasificar los comentarios según categorías predefinidas. A continuación, analice el sentimiento de los usuarios.", "Utilice un algoritmo de motor de recomendaciones para detectar el sentimiento del usuario.", "Utilice un algoritmo de series temporales para predecir el sentimiento del usuario basándose en comentarios anteriores."], "correct": [0], "multi": false, "explanation": "Los LLMs con capacidades de NLP pueden analizar texto no estructurado y determinar el sentimiento con alta precisión, siendo la solución más flexible para texto variado de usuarios."}, {"id": 280, "text": "Una empresa desea mejorar varios modelos de aprendizaje automático. Seleccione la técnica correcta de la siguiente lista de casos de uso. Cada técnica debe seleccionarse una sola vez o ninguna. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Mejorar LLM con fuentes externas = RAG; Generalizar en tareas no vistas = Zero-shot; Datos limitados para nuevas tareas = Few-shot", "RAG para todo; Zero-shot para fine-tuning; Few-shot para RAG", "Todos son Fine-tuning", "Zero-shot para todo; RAG para datos limitados"], "correct": [0], "multi": false, "explanation": "RAG = aumenta LLMs con bases de conocimiento externas. Zero-shot = el modelo generaliza sin ejemplos. Few-shot = el modelo aprende de pocos ejemplos para nuevas tareas."}, {"id": 281, "text": "Una empresa desea crear una solución de IA para generar imágenes y descripciones para un catálogo de productos. Para ello, necesita seleccionar un modelo base (MF). Debe considerar los tipos de salida de cada MF. ¿Qué característica del MF está evaluando la empresa?", "options": ["Latencia", "Tamaño del modelo", "Personalización del modelo", "Modalidad"], "correct": [3], "multi": false, "explanation": "La modalidad define qué tipos de entrada y salida soporta un modelo (texto, imagen, audio, video). Evaluar la modalidad determina si el FM puede generar imágenes Y descripciones de texto."}, {"id": 282, "text": "Una empresa desea utilizar un modelo de aprendizaje automático para analizar las reseñas de clientes en redes sociales. El modelo debe determinar si cada reseña tiene un sentimiento neutral, positivo o negativo. ¿Qué estrategia de evaluación del modelo cumplirá con estos requisitos?", "options": ["Open-ended generation", "Resumen de texto", "Traducción automática", "Clasificación - mas votado"], "correct": [0], "multi": false, "explanation": "Determinar si una reseña es positiva, negativa o neutral es una tarea de clasificación multiclase — el modelo asigna cada reseña a una de las tres categorías predefinidas."}, {"id": 283, "text": "Seleccione el término de IA correcto de la siguiente lista para cada enunciado. Cada término de IA debe seleccionarse una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Simula capacidades humanas de resolución de problemas = IA; Técnicas basadas en datos para predicciones = ML; Procesa datos a través de redes neuronales complejas = Deep learning", "IA = ML = Deep learning son lo mismo", "ML para todo; IA para imágenes; Deep learning para texto", "Deep learning = IA; ML = Deep learning; IA = ML"], "correct": [0], "multi": false, "explanation": "IA es el campo general que simula inteligencia humana. ML es el subconjunto que aprende de datos. Deep learning es un subconjunto de ML que usa redes neuronales profundas."}, {"id": 284, "text": "¿Cuál de las siguientes opciones es un ejemplo de aprendizaje no supervisado?", "options": ["Agrupar los puntos de datos en grupos según su similitud.", "Entrenamiento de un modelo para reconocer imágenes de animales", "Predecir el precio de una casa en función de sus características.", "Generar texto similar al humano a partir de una consigna dada."], "correct": [0], "multi": false, "explanation": "Clustering o agrupamiento de datos sin etiquetas predefinidas es el ejemplo clásico de aprendizaje no supervisado — el modelo descubre la estructura inherente de los datos."}, {"id": 285, "text": "Una empresa de formación online con un gran volumen de materiales educativos desea utilizar la búsqueda empresarial. ¿Qué servicio de AWS cumple estos requisitos?", "options": ["Amazon Comprehend", "Amazon Textract", "Amazon Kendra - mas votado", "Amazon Personalize"], "correct": [0], "multi": false, "explanation": "Amazon Kendra es el servicio de búsqueda empresarial inteligente de AWS que usa ML para encontrar respuestas precisas en grandes colecciones de documentos educativos o corporativos."}, {"id": 286, "text": "Una empresa crea contenido de vídeo. La empresa quiere utilizar IA generativa para crear contenido nuevo y reducir el tiempo de creación de vídeos. ¿Qué solución cumplirá estos requisitos de la forma más eficiente desde el punto de vista operativo?", "options": ["Utilice el modelo Amazon Titan Image Generator en Amazon Bedrock para generar imágenes intermedias. Utilice un software de edición de vídeo para crear vídeos.", "Utilice el modelo Amazon Nova Canvas en Amazon Bedrock para generar imágenes intermedias. Utilice un software de edición de vídeo para crear vídeos.", "Utilice el modelo Amazon Nova Reel en Amazon Bedrock para generar vídeos.", "Utilice el modelo Amazon Nova Pro en Amazon Bedrock para generar vídeos."], "correct": [2], "multi": false, "explanation": "Amazon Nova Reel es el modelo especializado en generación de video de Amazon Bedrock, permitiendo crear videos directamente sin necesidad de herramientas adicionales de edición."}, {"id": 287, "text": "Una empresa está entrenando modelos de aprendizaje automático con conjuntos de datos. Estos conjuntos contienen algunas clases con más ejemplos que otras. La empresa quiere medir la eficacia del modelo para detectar y etiquetar las clases. ¿Qué métrica debería utilizar?", "options": ["Precisión", "Recordatorio", "Precisión", "F1"], "correct": [3], "multi": false, "explanation": "La puntuación F1 es la métrica ideal para datasets desbalanceados — combina precisión y recall para dar una evaluación equilibrada que no se ve afectada por el desequilibrio de clases."}, {"id": 288, "text": "Una empresa analiza los registros de transacciones financieras. La empresa clasifica los registros como personales o comerciales. Luego, inserta estas categorías en los registros de transacciones. ¿Qué paso de preparación de datos describe esto?", "options": ["Codificación de datos", "Etiquetado de datos - mas votado", "Normalización de datos", "Balanceo de datos"], "correct": [0], "multi": false, "explanation": "El etiquetado de datos consiste en asignar categorías o anotaciones a los datos — en este caso, clasificar transacciones como personales o comerciales para su uso posterior en ML."}, {"id": 289, "text": "Una empresa desea extraer información clave de documentos normativos extensos para aumentar la eficiencia de sus empleados. ¿Qué estrategia de IA generativa cumple con este requisito?", "options": ["Regresión", "Agrupación", "Resumen - mas votado", "Clasificación"], "correct": [0], "multi": false, "explanation": "El resumen automático de documentos extensos es una capacidad fundamental de los LLMs, permitiendo extraer la información clave de documentos normativos largos de forma eficiente."}, {"id": 290, "text": "Una empresa utiliza Amazon SageMaker para implementar un modelo que identifica si las publicaciones en redes sociales contienen ciertos temas. La empresa necesita demostrar cómo las diferentes características de entrada influyen en el comportamiento del modelo. ¿Qué característica de SageMaker cumple con estos requisitos? * SageMaker Canvas A.", "options": ["SageMaker Clarify - mas votado", "SageMaker Ground Truth"], "correct": [0], "multi": false, "explanation": "SageMaker Clarify usa técnicas como SHAP para explicar cómo cada característica de entrada influye en las predicciones del modelo, siendo la herramienta de explicabilidad de SageMaker."}, {"id": 291, "text": "Un profesional de IA está determinando el tipo de datos apropiado para diversos casos de uso. Seleccione el tipo de datos correcto de la siguiente lista para cada caso de uso. Seleccione cada tipo de datos una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Reseñas de clientes en texto = Datos de texto; Imágenes de animales etiquetadas = Datos de imagen; Volúmenes de ventas diarios = Datos de series temporales", "Todos son datos tabulares", "Texto para todo; Imagen para series; Series para texto", "Datos de audio para reseñas; Tabulares para imágenes"], "correct": [0], "multi": false, "explanation": "Reseñas = texto (NLP). Imágenes de animales = datos de imagen (visión por computadora). Ventas diarias = valores que cambian en el tiempo = series temporales."}, {"id": 292, "text": "Una empresa quiere evaluar la calidad de internet en zonas remotas del mundo. Para ello, necesita recopilar datos de velocidad de internet y almacenarlos en Amazon RDS. Analizará la variación de la velocidad de internet a lo largo del día. La empresa quiere crear un modelo de IA para predecir posibles interrupciones de internet. ¿Qué tipo de datos debería recopilar para esta tarea?", "options": ["Datos tabulares", "Datos de texto", "Datos de series temporales", "Datos de audio"], "correct": [2], "multi": false, "explanation": "Los datos de velocidad de internet medidos a lo largo del tiempo son series temporales — valores que cambian con el tiempo y cuyo patrón histórico permite predecir comportamientos futuros."}, {"id": 293, "text": "Una empresa desea crear un modelo de aprendizaje automático para detectar patrones anómalos en datos de sensores. La empresa no dispone de datos etiquetados para el entrenamiento. ¿Qué método de aprendizaje automático cumplirá con estos requisitos?", "options": ["Regresión lineal", "Clasificación", "Árbol de decisión", "Autoencoders"], "correct": [3], "multi": false, "explanation": "Los autoencoders son redes neuronales no supervisadas que aprenden la distribución normal de los datos y detectan anomalías cuando el error de reconstrucción es alto — sin necesitar datos etiquetados."}, {"id": 294, "text": "Una empresa utiliza Amazon Bedrock para implementar un asistente de IA generativa en su sitio web. Este asistente ayuda a los clientes con recomendaciones de productos y decisiones de compra. La empresa desea medir el impacto directo del asistente de IA en el rendimiento de las ventas. ¿Qué métrica cumple con estos requisitos?", "options": ["La tasa de conversión de clientes que compran productos después de interactuar con asistentes de IA.", "El número de interacciones del cliente con el asistente de IA", "Puntuaciones de análisis de sentimiento a partir de los comentarios de los clientes tras las interacciones con el asistente de IA.", "Tasas de precisión en la comprensión del lenguaje natural"], "correct": [0], "multi": false, "explanation": "La tasa de conversión mide directamente si las interacciones con el asistente resultan en ventas reales, siendo la métrica más directa para el impacto en el rendimiento de ventas."}, {"id": 295, "text": "¿Qué servicio o función de AWS almacena incrustaciones en una base de datos vectorial para su uso con modelos base (FM) y Retrieval Augmented Generation (RAG) (RAG)?", "options": ["Amazon SageMaker Ground Truth", "Amazon OpenSearch Service", "Amazon Transcribe", "Amazon Textract"], "correct": [1], "multi": false, "explanation": "Amazon OpenSearch Service soporta almacenamiento y búsqueda de vectores (embeddings) con su función k-NN, siendo el servicio estándar de AWS para bases de datos vectoriales en pipelines RAG."}, {"id": 296, "text": "¿Qué escenario representa un caso de uso práctico para la IA generativa?", "options": ["Utilizar un modelo de aprendizaje automático para pronosticar la demanda de productos.", "Emplear un chatbot para proporcionar respuestas similares a las humanas a las consultas de los clientes en tiempo real. - mas votado", "Utilizar un panel de análisis para realizar un seguimiento del tráfico del sitio web y del comportamiento del usuario.", "Implementar un motor de recomendaciones basado en reglas para sugerir productos a los clientes."], "correct": [0], "multi": false, "explanation": "Un chatbot que genera respuestas similares a las humanas es el ejemplo más directo de IA generativa en acción. Los otros casos son ML predictivo o analytics tradicional."}, {"id": 297, "text": "Una empresa utiliza Amazon Bedrock para una solución de IA generativa. Esta solución debe integrar un servicio con almacenamiento de bases de datos vectoriales y capacidades de búsqueda vectorial. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon DynamoDB", "Amazon OpenSearch Service", "Amazon ElastiCache", "Amazon Redshift"], "correct": [1], "multi": false, "explanation": "Amazon OpenSearch Service tiene soporte nativo para búsqueda vectorial y almacenamiento de embeddings, siendo el servicio preferido de AWS para bases de datos vectoriales en aplicaciones de IA."}, {"id": 298, "text": "Una plataforma de transmisión de contenido multimedia quiere ofrecer recomendaciones de películas a los usuarios basándose en su historial de cuenta. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Polly", "Amazon Comprehend", "Amazon Tr
