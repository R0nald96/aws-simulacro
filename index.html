<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AWS AI Practitioner — Simulacro Completo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#0f1923;--navy:#162032;--card:#1c2b3a;--border:#263545;
  --orange:#FF9900;--orange-dim:rgba(255,153,0,0.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
  --text:#e2e8f0;--muted:#7a95b0;--dim:#4a6580;
}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
/* SCREENS */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
/* MODULE SELECT */
#moduleSelect{padding:32px 20px;max-width:900px;margin:0 auto}
.logo{text-align:center;padding:40px 0 32px}
.logo h1{font-size:28px;font-weight:700;color:var(--text)}
.logo p{color:var(--muted);margin-top:8px;font-size:14px}
.aws-tag{display:inline-block;background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:1px;margin-bottom:12px}
.progress-overview{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:28px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.prog-stat{text-align:center;flex:1;min-width:80px}
.prog-stat-num{font-size:24px;font-weight:700;font-family:monospace;color:var(--orange)}
.prog-stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.module-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.module-card:hover{border-color:var(--orange);transform:translateY(-2px)}
.module-card.completed{border-color:var(--green)}
.module-badge{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.module-card.completed .module-badge{background:var(--green)}
.module-title{font-size:16px;font-weight:600;margin-bottom:4px}
.module-range{font-size:12px;color:var(--muted);margin-bottom:12px;font-family:monospace}
.module-progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:8px}
.module-progress-fill{height:100%;border-radius:2px;background:var(--orange);transition:width .4s}
.module-card.completed .module-progress-fill{background:var(--green)}
.module-stats{display:flex;gap:10px;font-size:12px}
.module-stat{color:var(--muted)}
.module-stat span{font-weight:600}
.module-stat span.c{color:var(--green)}
.module-stat span.w{color:var(--red)}
/* HEADER */
.header{background:var(--navy);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.h-badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:1px}
.h-title{font-size:14px;font-weight:600}
.h-sub{font-size:11px;color:var(--muted)}
.prog-wrap{flex:1;max-width:280px;margin:0 16px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:monospace}
.prog-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--orange);border-radius:2px;transition:width .4s}
.score-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-family:monospace}
.sc{color:var(--green)}.sw{color:var(--red)}.ss{color:var(--dim)}
.btn-home{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
.btn-home:hover{border-color:var(--orange);color:var(--orange)}
/* QUIZ */
.main{max-width:800px;margin:0 auto;padding:24px 16px 80px}
.nav-dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.dot{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;font-family:monospace}
.dot.cur{border-color:var(--orange);color:var(--orange)}
.dot.ok{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.dot.err{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.dot.skip{border-color:var(--dim);color:var(--dim)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qhead{background:var(--navy);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.qnum{background:var(--orange);color:#000;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:monospace;white-space:nowrap}
.qmulti{background:rgba(255,153,0,0.2);color:var(--orange);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid rgba(255,153,0,0.3)}
.qbody{padding:20px}
.qtext{font-size:15px;line-height:1.65;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;background:transparent;text-align:left;width:100%;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--orange);background:var(--orange-dim)}
.opt.sel{border-color:var(--orange);background:var(--orange-dim)}
.opt.ok{border-color:var(--green);background:var(--green-dim)}
.opt.err{border-color:var(--red);background:var(--red-dim)}
.opt.show-ok{border-color:var(--green);background:var(--green-dim)}
.opt:disabled{cursor:default}
.oletter{width:24px;height:24px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted);transition:all .2s;font-family:monospace}
.opt.sel .oletter{background:var(--orange);color:#000}
.opt.ok .oletter{background:var(--green);color:#000}
.opt.err .oletter{background:var(--red);color:#fff}
.opt.show-ok .oletter{background:var(--green);color:#000}
.otext{flex:1}
.multi-hint{font-size:12px;color:var(--orange);margin-bottom:12px;padding:8px 12px;background:var(--orange-dim);border-radius:6px;border:1px solid rgba(255,153,0,0.2)}
.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.feedback.ok{background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);color:#86efac;display:block}
.feedback.err{background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;display:block}
.feedback-title{font-weight:700;margin-bottom:5px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--orange);color:#000;flex:1}
.btn-primary:hover{background:#ffad33;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
.btn-skip{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn-skip:hover{border-color:var(--orange);color:var(--orange)}
.btn-confirm{background:var(--orange);color:#000;flex:1}
.btn-confirm:disabled{opacity:.4;cursor:default}
/* RESULTS */
.results{display:none;text-align:center;padding:40px 16px}
.res-pct{font-size:72px;font-weight:700;font-family:monospace;color:var(--orange);line-height:1;margin-bottom:6px}
.res-label{font-size:14px;color:var(--muted);margin-bottom:28px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.res-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.res-num{font-size:30px;font-weight:700;font-family:monospace;margin-bottom:3px}
.res-sl{font-size:11px;color:var(--muted)}
.btn-retry{background:var(--orange);color:#000;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;margin-right:10px}
.btn-retry:hover{background:#ffad33;transform:translateY(-2px)}
.btn-back{background:var(--card);color:var(--text);padding:13px 28px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .2s}
.btn-back:hover{border-color:var(--orange);color:var(--orange)}
@media(max-width:768px){
  /* HOME */
  .progress-overview{gap:10px;padding:14px}
  .prog-stat-num{font-size:20px}
  .modules-grid{grid-template-columns:1fr}
  .module-card{padding:16px}

  /* HEADER */
  .header{padding:10px 12px;flex-wrap:wrap;gap:8px}
  .h-title{font-size:13px}
  .h-sub{font-size:10px}
  .prog-wrap{display:none}
  .score-pill{font-size:11px;padding:4px 10px}
  .btn-home{font-size:11px;padding:5px 10px}

  /* MAIN QUIZ */
  .main{padding:12px 10px 80px}
  .nav-dots{gap:4px;margin-bottom:14px}
  .dot{width:26px;height:26px;font-size:9px}

  /* QUESTION CARD */
  .qhead{padding:12px 14px}
  .qnum{font-size:10px}
  .qbody{padding:14px}
  .qtext{font-size:14px;line-height:1.6;margin-bottom:16px}
  .multi-hint{font-size:11px;padding:7px 10px}

  /* OPTIONS */
  .opt{padding:11px 12px;gap:10px;font-size:13px}
  .oletter{width:22px;height:22px;font-size:10px}

  /* FEEDBACK */
  .feedback{font-size:12px;padding:12px}
  .feedback-title{font-size:12px}

  /* ACTIONS */
  .actions{gap:6px;margin-top:12px}
  .btn{padding:13px 16px;font-size:13px}

  /* RESULTS */
  .results{padding:28px 12px}
  .res-pct{font-size:56px}
  .res-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .res-stat{padding:14px 8px}
  .res-num{font-size:24px}
  .res-sl{font-size:10px}
  .btn-retry{padding:12px 20px;font-size:14px;margin-right:6px}
  .btn-back{padding:12px 20px;font-size:14px}

  /* GLOSSARY PANEL */
  .gloss-panel{width:100vw;right:-100vw}
  .gloss-btn{bottom:16px;right:16px;width:48px;height:48px;font-size:20px}
  .gterm-name{font-size:12px}
  .gterm-def{font-size:11px}
  .gterm-analogy{font-size:11px}
  .gterm-ex{font-size:10px}
}

@media(max-width:400px){
  .dot{width:22px;height:22px;font-size:8px}
  .qtext{font-size:13px}
  .opt{font-size:12px;padding:10px 10px}
  .res-grid{gap:6px}
  .res-stat{padding:10px 6px}
  .res-num{font-size:20px}
}

/* GLOSSARY PANEL */
.gloss-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--orange);color:#000;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,153,0,0.4);z-index:200;transition:all .2s}
.gloss-btn:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(255,153,0,0.5)}
.gloss-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;opacity:0;transition:opacity .3s}
.gloss-overlay.open{display:block;opacity:1}
.gloss-panel{position:fixed;top:0;right:-420px;width:420px;max-width:95vw;height:100vh;background:var(--navy);border-left:1px solid var(--border);z-index:400;display:flex;flex-direction:column;transition:right .3s ease;box-shadow:-8px 0 32px rgba(0,0,0,0.4)}
.gloss-panel.open{right:0}
.gloss-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gloss-head-left{display:flex;align-items:center;gap:10px}
.gloss-head-badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.gloss-head-title{font-size:15px;font-weight:700}
.gloss-close{background:var(--card);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.gloss-close:hover{border-color:var(--orange);color:var(--orange)}
.gloss-search{padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.gloss-search input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.gloss-search input:focus{border-color:var(--orange)}
.gloss-search input::placeholder{color:var(--dim)}
.gloss-cats{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.gcbtn{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s}
.gcbtn.active,.gcbtn:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,153,0,0.1)}
.gloss-count{padding:6px 16px;font-size:11px;color:var(--dim);font-family:monospace;flex-shrink:0}
.gloss-list{flex:1;overflow-y:auto;padding:8px 12px 24px}
.gloss-list::-webkit-scrollbar{width:4px}
.gloss-list::-webkit-scrollbar-track{background:transparent}
.gloss-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.gterm{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden;transition:border-color .2s}
.gterm-hd{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.gterm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gterm-name{font-size:13px;font-weight:600;flex:1;line-height:1.3}
.gterm-abbr{font-size:10px;color:var(--muted);font-family:monospace;margin-left:4px}
.gterm-arrow{color:var(--dim);font-size:10px;transition:transform .2s;flex-shrink:0}
.gterm.open .gterm-arrow{transform:rotate(90deg)}
.gterm-body{display:none;padding:0 14px 12px 30px;border-top:1px solid var(--border)}
.gterm.open .gterm-body{display:block}
.gterm-def{font-size:12px;line-height:1.65;color:var(--text);margin-top:10px}
.gterm-analogy{margin-top:8px;padding:8px 12px;background:var(--navy);border-radius:6px;border-left:2px solid var(--orange);font-size:11px;color:var(--muted);line-height:1.6}
.gterm-analogy strong{color:var(--orange);font-size:10px;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.gterm-ex{margin-top:6px;font-size:11px;color:var(--dim);font-style:italic;line-height:1.5}
.gsvc-wrap{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.gsvc{background:rgba(255,153,0,0.1);border:1px solid rgba(255,153,0,0.25);color:var(--orange);font-size:10px;padding:1px 7px;border-radius:4px;font-family:monospace}
.gno-results{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- MODULE SELECT -->
<div id="moduleSelect" class="screen active">
  <div class="logo">
    <div class="aws-badge">AIF-C01</div>
    <h1>AWS Certified AI Practitioner</h1>
    <p>Simulacro Completo — 452 preguntas en 9 módulos</p>
  </div>
  <div class="progress-overview">
    <div class="prog-stat"><div class="prog-stat-num" id="ov-total">0</div><div class="prog-stat-label">Respondidas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-correct" style="color:var(--green)">0</div><div class="prog-stat-label">Correctas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-wrong" style="color:var(--red)">0</div><div class="prog-stat-label">Incorrectas</div></div>
    <div class="prog-stat"><div class="prog-stat-num" id="ov-pct">0%</div><div class="prog-stat-label">Puntaje global</div></div>
  </div>
  <div class="modules-grid" id="modulesGrid"></div>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
  <div class="header">
    <div class="header-left">
      <div class="h-badge">AIF-C01</div>
      <div>
        <div class="h-title" id="h-modtitle">Módulo 1</div>
        <div class="h-sub" id="h-modsub">P1–P50</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span id="prog-text">Pregunta 1 de 50</span><span id="prog-pct">0%</span></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="score-pill"><span class="sc">✓ <span id="sc-c">0</span></span><span class="ss">/</span><span class="sw">✗ <span id="sc-w">0</span></span></div>
      <button class="btn-home" onclick="goHome()">← Módulos</button>
    </div>
  </div>
  <div class="main">
    <div class="nav-dots" id="navDots"></div>
    <div id="quizArea"></div>
    <div class="results" id="resultsScreen">
      <div class="res-pct" id="res-pct">0%</div>
      <div class="res-label" id="res-label">Puntaje del módulo</div>
      <div class="res-grid">
        <div class="res-stat"><div class="res-num" id="res-c" style="color:var(--green)">0</div><div class="res-sl">Correctas</div></div>
        <div class="res-stat"><div class="res-num" id="res-w" style="color:var(--red)">0</div><div class="res-sl">Incorrectas</div></div>
        <div class="res-stat"><div class="res-num" id="res-s" style="color:var(--muted)">0</div><div class="res-sl">Omitidas</div></div>
      </div>
      <button class="btn-retry" onclick="retryModule()">🔄 Reintentar módulo</button>
      <button class="btn-back" onclick="goHome()">← Volver a módulos</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"id": 1, "text": "Una empresa realiza pronósticos cada trimestre para decidir cómo optimizar las operaciones para satisfacer la demanda esperada. La empresa utiliza modelos de ML para realizar estos pronósticos. Un profesional de IA está escribiendo un informe sobre los modelos de ML entrenados para brindar transparencia y explicabilidad a las partes interesadas de la empresa. ¿Qué debe incluir el profesional de IA en el informe para cumplir con los requisitos de transparencia y explicabilidad?", "options": ["Código para entrenamiento de modelos", "Gráficos de dependencia parcial (PDP)", "Datos de muestra para formación", "Tablas de convergencia de modelos"], "correct": [1], "multi": false, "explanation": "Los gráficos de dependencia parcial (PDP) muestran visualmente cómo cada variable influye en la predicción del modelo, haciéndolo explicable para partes interesadas no técnicas."}, {"id": 2, "text": "Un bufete de abogados quiere crear una aplicación de inteligencia artificial utilizando grandes modelos de lenguaje (LLM). La aplicación leerá documentos legales y extraerá puntos clave de los documentos. ¿Qué solución cumple con estos requisitos?", "options": ["Construya un sistema automático de reconocimiento de entidades nombradas.", "Crea un motor de recomendaciones.", "Desarrollar un chatbot de resumen.", "Desarrollar un sistema de traducción multilingüe."], "correct": [2], "multi": false, "explanation": "Un chatbot de resumen usa LLMs para leer documentos y extraer los puntos más importantes. El reconocimiento de entidades solo extrae nombres/lugares, no resume contenido."}, {"id": 3, "text": "Una empresa quiere clasificar los genes humanos en 20 categorías según las características de los genes. La empresa necesita un algoritmo ML para documentar cómo el mecanismo interno del modelo afecta el resultado. ¿Qué algoritmo ML cumple con estos requisitos?", "options": ["Árboles de decisión", "Regresión lineal", "Regresión logística", "Redes neuronales"], "correct": [0], "multi": false, "explanation": "Los árboles de decisión son modelos 'white box' — puedes ver exactamente qué características llevan a cada decisión. Las redes neuronales son 'black box' y difíciles de explicar internamente."}, {"id": 4, "text": "Una empresa ha creado un modelo de clasificación de imágenes para predecir enfermedades de las plantas a partir de fotografías de hojas de plantas. La empresa quiere evaluar cuántas imágenes clasificó correctamente el modelo. ¿Qué métrica de evaluación debe utilizar la empresa para medir el rendimiento del modelo?", "options": ["Puntuación R-cuadrado", "Precisión.", "Root Mean Square Error (RMSE) (RMSE)", "Tasa de aprendizaje"], "correct": [1], "multi": false, "explanation": "La precisión (accuracy) mide el porcentaje de clasificaciones correctas sobre el total. R-cuadrado y RMSE son métricas de regresión. La tasa de aprendizaje es un hiperparámetro, no una métrica."}, {"id": 5, "text": "Una empresa está utilizando un modelo de lenguaje grande (LLM) previamente entrenado para crear un chatbot para recomendaciones de productos. La empresa necesita que los resultados del LLM sean breves y estén escritos en un lenguaje específico. ¿Qué solución alineará la calidad de la respuesta del LLM con las expectativas de la empresa?", "options": ["Ingeniería de prompts (Prompt Engineering).", "Elija un LLM de un tamaño diferente.", "Aumentar la temperatura.", "Aumente el valor K superior."], "correct": [0], "multi": false, "explanation": "La ingeniería de prompts es la forma más directa de controlar formato, longitud e idioma. Aumentar la temperatura genera más aleatoriedad — lo opuesto a lo que se necesita."}, {"id": 6, "text": "Una empresa utiliza Amazon SageMaker para su canalización de aprendizaje automático en un entorno de producción. La empresa maneja grandes volúmenes de datos de entrada, de hasta 1 GB, y tiempos de procesamiento de hasta 1 hora. Necesita una latencia casi en tiempo real. ¿Qué opción de inferencia de SageMaker cumple con estos requisitos?", "options": ["Inferencia en tiempo real", "Inferencia sin servidor", "Inferencia asíncrona", "Transformación por lotes"], "correct": [2], "multi": false, "explanation": "La inferencia asíncrona está diseñada para payloads grandes (hasta 1 GB) y tiempos largos (hasta 1 hora). La inferencia en tiempo real tiene límites de tamaño menores."}, {"id": 7, "text": "Una empresa utiliza modelos específicos para un dominio concreto. La empresa quiere evitar crear modelos nuevos desde cero. En su lugar, prefiere adaptar modelos preentrenados para crear modelos para tareas nuevas y relacionadas. ¿Qué estrategia de aprendizaje automático cumple estos requisitos?", "options": ["Aumentar el número de épocas.", "Utilizar el Transfer learning.", "Disminuir el número de épocas.", "Utilizar aprendizaje no supervisado."], "correct": [1], "multi": false, "explanation": "El Transfer learning permite tomar un modelo preentrenado y adaptarlo a una nueva tarea relacionada, aprovechando el conocimiento ya adquirido."}, {"id": 8, "text": "Una empresa está desarrollando una solución para generar imágenes para gafas de protección. Esta solución debe tener una alta precisión y minimizar el riesgo de anotaciones incorrectas. ¿Qué solución cumplirá con estos requisitos?", "options": ["Validación con intervención humana mediante Amazon SageMaker Ground Truth Plus", "Data augmentation mediante el uso de una base de conocimiento de Amazon Bedrock.", "Reconocimiento de imágenes mediante Amazon Rekognition", "Resumen de datos mediante Amazon QuickSight Q"], "correct": [0], "multi": false, "explanation": "SageMaker Ground Truth Plus combina IA con revisión humana, garantizando alta precisión en las anotaciones. Ideal cuando la precisión es crítica."}, {"id": 9, "text": "Una empresa desea crear un chatbot utilizando un modelo base (FM) en Amazon Bedrock. El FM necesita acceder a datos cifrados almacenados en un bucket de Amazon S3. Los datos están cifrados con claves administradas de Amazon S3 (SSE-S3). El FM experimenta un error al intentar acceder a los datos del bucket de S3. ¿Qué solución cumplirá con estos requisitos?", "options": ["Asegúrese de que el rol que asume Amazon Bedrock tenga permiso para descifrar datos con la clave de cifrado correcta.", "Configure los permisos de acceso para los buckets de S3 para permitir el acceso público y así habilitar el acceso a través de Internet.", "Utilice técnicas de ingeniería rápida para indicarle al modelo que busque información en Amazon S3.", "Asegúrese de que los datos de S3 no contengan información confidencial."], "correct": [0], "multi": false, "explanation": "El error ocurre porque el rol IAM de Bedrock no tiene permisos para descifrar los datos. La solución es otorgar permisos de descifrado al rol. Nunca hacer los datos públicos."}, {"id": 10, "text": "Una empresa desea utilizar modelos de lenguaje para crear una aplicación de inferencia en dispositivos periféricos. La inferencia debe tener la menor latencia posible. ¿Qué solución cumplirá con estos requisitos?", "options": ["Implementar modelos de lenguaje pequeños optimizados (SLM) en dispositivos periféricos.", "Implementar modelos de lenguaje grandes y optimizados (LLM) en dispositivos periféricos.", "Incorporar una API centralizada de modelo de lenguaje pequeño (SLM) para la comunicación asíncrona con dispositivos periféricos.", "Incorporar una API centralizada de modelo de lenguaje grande (LLM) para la comunicación asíncrona con dispositivos periféricos."], "correct": [0], "multi": false, "explanation": "Los SLMs son ligeros y pueden ejecutarse directamente en dispositivos edge sin conectarse a la nube, minimizando la latencia. Los LLMs son demasiado grandes para dispositivos periféricos."}, {"id": 11, "text": "Una empresa desea crear un modelo de aprendizaje automático (ML) utilizando Amazon SageMaker. La empresa necesita compartir y gestionar variables para el desarrollo del modelo entre varios equipos. ¿Qué función de SageMaker cumple con estos requisitos?", "options": ["Amazon SageMaker Feature Store", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Clarify", "Amazon SageMaker Model Cards"], "correct": [0], "multi": false, "explanation": "SageMaker Feature Store es el repositorio centralizado para almacenar, compartir y gestionar características (features) entre equipos de ML."}, {"id": 12, "text": "Una empresa desea utilizar IA generativa para aumentar la productividad de sus desarrolladores y optimizar el desarrollo de software. La empresa quiere usar Amazon Q Developer. ¿Cómo puede Amazon Q Developer ayudar a la empresa a cumplir con estos requisitos?", "options": ["Crear fragmentos de software, seguimiento de referencias y seguimiento de licencias de código abierto.", "Ejecutar una aplicación sin aprovisionar ni administrar servidores.", "Habilitar comandos de voz para la codificación y la búsqueda en lenguaje natural.", "Convertir archivos de audio a documentos de texto utilizando modelos de aprendizaje automático."], "correct": [0], "multi": false, "explanation": "Amazon Q Developer es un asistente de IA para desarrolladores que genera código, hace seguimiento de referencias de código abierto y gestiona licencias."}, {"id": 13, "text": "Una institución financiera utiliza Amazon Bedrock para desarrollar una aplicación de IA. La aplicación está alojada en una VPC. Para cumplir con las normas de cumplimiento normativo, la VPC no tiene acceso a ningún tráfico de internet. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["AWS PrivateLink", "Amazon Macie", "Amazon CloudFront", "Puerta de enlace a Internet"], "correct": [0], "multi": false, "explanation": "AWS PrivateLink permite conectar servicios de AWS como Bedrock a recursos dentro de una VPC sin que el tráfico salga a internet, cumpliendo con requisitos estrictos de seguridad."}, {"id": 14, "text": "Una empresa quiere desarrollar un juego educativo donde los usuarios respondan preguntas como la siguiente: \"Un frasco contiene seis canicas rojas, cuatro verdes y tres amarillas. ¿Cuál es la probabilidad de sacar una canica verde del frasco?\". ¿Qué solución cumple con estos requisitos con el MENOR costo operativo?", "options": ["Utilice el aprendizaje supervisado para crear un modelo de regresión que prediga la probabilidad.", "Utilice el aprendizaje por refuerzo para entrenar un modelo que devuelva la probabilidad.", "Utilice un código que calcule la probabilidad mediante reglas y cálculos sencillos.", "Utilice el aprendizaje no supervisado para crear un modelo que estime la densidad de probabilidad."], "correct": [2], "multi": false, "explanation": "Para cálculos de probabilidad simples, una función matemática sencilla es más eficiente, más precisa y tiene costo operativo mínimo. El ML agrega complejidad innecesaria."}, {"id": 15, "text": "¿Qué métrica mide la eficiencia en tiempo de ejecución de los modelos de IA en funcionamiento?", "options": ["Puntuación de satisfacción del cliente (CSAT)", "Tiempo de entrenamiento para cada época", "Tiempo de respuesta promedio", "Número de instancias de entrenamiento"], "correct": [2], "multi": false, "explanation": "El tiempo de respuesta promedio mide qué tan rápido responde el modelo en producción. CSAT mide satisfacción del cliente, y las otras son métricas de entrenamiento."}, {"id": 16, "text": "Una empresa está desarrollando una aplicación para centros de contacto y desea obtener información valiosa de las conversaciones con sus clientes. La empresa quiere analizar y extraer información clave del audio de las llamadas. ¿Qué solución cumple con estos requisitos?", "options": ["Crea un chatbot conversacional utilizando Amazon Lex.", "Transcribir las grabaciones de llamadas utilizando Amazon Transcribe.", "Extraiga información de las grabaciones de llamadas utilizando Amazon SageMaker Model Monitor.", "Cree etiquetas de clasificación utilizando Amazon Comprehend."], "correct": [1], "multi": false, "explanation": "Amazon Transcribe convierte audio a texto, permitiendo luego analizar el contenido. Lex es para crear chatbots interactivos, no para analizar grabaciones."}, {"id": 17, "text": "Una empresa dispone de petabytes de datos de clientes sin etiquetar para una campaña publicitaria. La empresa desea clasificar a sus clientes en diferentes niveles para publicitar y promocionar sus productos. ¿Qué metodología debería utilizar para cumplir con estos requisitos?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "Reinforcement Learning from Human Feedback (RLHF) (RLHF)"], "correct": [1], "multi": false, "explanation": "El aprendizaje no supervisado (clustering) agrupa automáticamente clientes en segmentos según sus características. El supervisado requiere datos etiquetados que aquí no existen."}, {"id": 18, "text": "Un profesional de la IA desea utilizar un modelo base (FM) para diseñar una aplicación de búsqueda. Esta aplicación debe procesar consultas que incluyan texto e imágenes. ¿Qué tipo de FM debería utilizar para potenciar la aplicación de búsqueda?", "options": ["Modelo de incrustación multimodal", "Modelo de incrustación de texto", "Modelo de generación multimodal", "Modelo de generación de imágenes"], "correct": [0], "multi": false, "explanation": "Un modelo de incrustación multimodal puede procesar y representar tanto texto como imágenes en el mismo espacio vectorial, ideal para búsquedas que combinen ambos tipos."}, {"id": 19, "text": "Una empresa utiliza un modelo base (FM) de Amazon Bedrock para una herramienta de búsqueda con IA. La empresa desea optimizar el modelo para que sea más preciso utilizando sus propios datos. ¿Qué estrategia permitirá optimizar el modelo con éxito?", "options": ["Proporcione datos etiquetados con el campo de solicitud y el campo de finalización.", "Prepare el conjunto de datos de entrenamiento creando un archivo .txt que contenga varias líneas en formato .csv.", "Adquiera rendimiento aprovisionado para Amazon Bedrock.", "Entrenar el modelo con revistas y libros de texto."], "correct": [0], "multi": false, "explanation": "Para fine-tuning en Amazon Bedrock se necesitan pares de prompt/completion etiquetados. El rendimiento aprovisionado mejora disponibilidad pero no personaliza el modelo."}, {"id": 20, "text": "Una empresa desea utilizar inteligencia artificial para proteger su aplicación de amenazas. La solución de IA debe verificar si una dirección IP proviene de una fuente sospechosa. ¿Qué solución cumple con estos requisitos?", "options": ["Construir un sistema de reconocimiento de voz.", "Crear un sistema de reconocimiento de entidades nombradas mediante procesamiento del lenguaje natural (PLN).", "Desarrollar un sistema de detección de anomalías.", "Crear un sistema de predicción de fraudes."], "correct": [2], "multi": false, "explanation": "Un sistema de detección de anomalías identifica patrones inusuales comparándolos contra el comportamiento normal. Es la solución más directa para detectar fuentes sospechosas."}, {"id": 21, "text": "¿Qué característica de Amazon OpenSearch Service permite a las empresas crear aplicaciones de bases de datos vectoriales?", "options": ["Integración con Amazon S3 para almacenamiento de objetos", "Soporte para indexación y consultas geoespaciales", "Gestión de índices escalable y capacidad de búsqueda del vecino más cercano.", "Capacidad para realizar análisis en tiempo real de datos en streaming."], "correct": [2], "multi": false, "explanation": "OpenSearch Service soporta búsqueda de vecino más cercano (k-NN) e indexación vectorial, lo que permite construir bases de datos vectoriales para aplicaciones de IA."}, {"id": 22, "text": "¿Qué opción constituye un caso de uso para los modelos de IA generativa?", "options": ["Mejorar la seguridad de la red mediante el uso de sistemas de detección de intrusiones.", "Creación de imágenes fotorrealistas a partir de descripciones de texto para marketing digital.", "Mejora del rendimiento de la base de datos mediante el uso de índices optimizados.", "Analizar datos financieros para pronosticar las tendencias del mercado de valores."], "correct": [1], "multi": false, "explanation": "La generación de imágenes a partir de texto es un caso de uso clásico de IA generativa. Los otros casos corresponden a IA/ML tradicional, no generativa."}, {"id": 23, "text": "Una empresa desea desarrollar una aplicación de IA generativa utilizando Amazon Bedrock y necesita elegir un modelo base (FM). La empresa quiere saber cuánta información puede incluirse en una sola solicitud. ¿Qué consideración influirá en la decisión de la empresa?", "options": ["Temperatura", "Ventana de contexto", "Tamaño del lote", "Tamaño del modelo"], "correct": [1], "multi": false, "explanation": "La ventana de contexto define cuántos tokens (palabras/fragmentos) puede procesar el modelo en una sola solicitud. Determina cuánta información cabe en un prompt."}, {"id": 24, "text": "Una empresa desea crear un chatbot para ayudar a sus clientes. El chatbot resolverá problemas técnicos sin intervención humana. La empresa eligió un modelo base (FM) para el chatbot. Este debe generar respuestas que se ajusten al tono de la empresa. ¿Qué solución cumple con estos requisitos?", "options": ["Establezca un límite bajo en la cantidad de tokens que el FM puede producir.", "Utilice la inferencia por lotes para procesar respuestas detalladas.", "Experimente y refine la consigna hasta que el FM produzca las respuestas deseadas.", "Defina un número mayor para el parámetro de temperatura."], "correct": [2], "multi": false, "explanation": "Refinar el prompt (ingeniería de prompts) es el método más efectivo para ajustar el tono y estilo de las respuestas sin necesidad de reentrenar el modelo."}, {"id": 25, "text": "Una empresa desea utilizar un modelo de lenguaje grande (LLM) en Amazon Bedrock para el análisis de sentimientos. La empresa quiere clasificar el sentimiento de los fragmentos de texto como positivo o negativo. ¿Qué estrategia de ingeniería de indicaciones cumple con estos requisitos?", "options": ["Proporcione ejemplos de pasajes de texto con etiquetas positivas o negativas correspondientes en la consigna, seguidos del nuevo pasaje de texto que se va a clasificar.", "Proporcione una explicación detallada del análisis de sentimientos y cómo funcionan los LLM en el enunciado.", "Proporcione el nuevo fragmento de texto que se va a clasificar sin ningún contexto ni ejemplos adicionales.", "Proporcione al nuevo fragmento de texto algunos ejemplos de tareas no relacionadas, como resumir el texto o responder preguntas."], "correct": [0], "multi": false, "explanation": "Esto es few-shot learning — proporcionar ejemplos etiquetados antes de la nueva entrada ayuda al modelo a entender el patrón de clasificación deseado."}, {"id": 26, "text": "Una empresa de seguridad utiliza Amazon Bedrock para ejecutar modelos de base (FM). La empresa desea garantizar que solo los usuarios autorizados accedan a estos modelos. Necesita identificar cualquier intento de acceso no autorizado para configurar las políticas y los roles de AWS Identity and Access Management (IAM) adecuados para futuras iteraciones de los FM. ¿Qué servicio de AWS debería utilizar la empresa para identificar a los usuarios no autorizados que intentan acceder a Amazon Bedrock?", "options": ["AWS Audit Manager", "AWS CloudTrail", "Amazon Fraud Detector", "AWS Trusted Advisor"], "correct": [1], "multi": false, "explanation": "AWS CloudTrail registra todas las llamadas a la API de AWS, incluyendo quién accedió a qué y cuándo. Es el servicio estándar para auditoría de acceso."}, {"id": 27, "text": "Una empresa ha desarrollado un modelo de aprendizaje automático para la clasificación de imágenes. La empresa desea implementar el modelo en producción para que una aplicación web pueda utilizarlo. Necesita implementar una solución que aloje el modelo y genere predicciones sin gestionar la infraestructura subyacente. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon SageMaker Serverless Inference para implementar el modelo.", "Utilice Amazon CloudFront para implementar el modelo.", "Utilice Amazon API Gateway para alojar el modelo y generar predicciones.", "Utilice AWS Batch para alojar el modelo y generar predicciones."], "correct": [0], "multi": false, "explanation": "SageMaker Serverless Inference permite desplegar modelos sin gestionar servidores — AWS maneja automáticamente el aprovisionamiento y escalado."}, {"id": 28, "text": "Una empresa de IA evalúa periódicamente sus sistemas y procesos con la ayuda de proveedores de software independientes (ISV). La empresa necesita recibir notificaciones por correo electrónico cuando los informes de cumplimiento de un ISV estén disponibles. ¿Qué servicio de AWS puede utilizar la empresa para cumplir con este requisito?", "options": ["AWS Audit Manager", "AWS Artifact", "AWS Trusted Advisor", "AWS Data Exchange"], "correct": [1], "multi": false, "explanation": "AWS Artifact proporciona acceso a informes de cumplimiento y acuerdos de AWS, incluyendo notificaciones cuando nuevos informes de terceros están disponibles."}, {"id": 29, "text": "Una empresa desea utilizar un modelo de lenguaje extenso (LLM) para desarrollar un agente conversacional. La empresa necesita evitar que el LLM sea manipulado mediante técnicas comunes de ingeniería de mensajes para realizar acciones no deseadas o exponer información confidencial. ¿Qué acción reducirá estos riesgos?", "options": ["Cree una plantilla de prompts que enseñe al LLM a detectar patrones de ataque.", "Aumentar el parámetro de temperatura en las solicitudes de invocación al LLM.", "Evite utilizar LLM que no estén listados en Amazon SageMaker.", "Disminuir el número de tokens de entrada en las invocaciones del LLM."], "correct": [0], "multi": false, "explanation": "Una plantilla de prompt bien diseñada que incluya instrucciones de seguridad ayuda al modelo a reconocer y rechazar intentos de manipulación o inyección de prompts."}, {"id": 30, "text": "Una empresa utiliza la Matriz de Alcance de Seguridad de IA Generativa para evaluar las responsabilidades de seguridad de sus soluciones. La empresa ha identificado cuatro alcances de solución diferentes según la matriz. ¿Qué alcance de solución le otorga a la empresa la MAYOR responsabilidad en materia de seguridad?", "options": ["Utilizar una aplicación empresarial de terceros que tenga funciones de IA generativa integradas.", "Crear una aplicación utilizando un modelo base de IA generativa de terceros existente (FM).", "Refinar un modelo base de IA generativa de terceros existente (FM) mediante el ajuste fino del modelo utilizando datos específicos del negocio.", "Crear y entrenar un modelo de IA generativa desde cero utilizando datos específicos propiedad del cliente."], "correct": [3], "multi": false, "explanation": "Crear un modelo desde cero implica responsabilidad total: datos, infraestructura, entrenamiento, seguridad y despliegue. En modelos de terceros, parte de la responsabilidad es del proveedor."}, {"id": 31, "text": "Un profesional de la IA dispone de una base de datos de fotos de animales. Desea identificar y categorizar automáticamente los animales en las fotos sin intervención humana. ¿Qué estrategia cumple con estos requisitos?", "options": ["Detección de objetos", "Detección de anomalías", "Reconocimiento de entidades nombradas", "Repintado"], "correct": [0], "multi": false, "explanation": "La detección de objetos identifica y localiza objetos específicos en imágenes — en este caso animales — y los clasifica automáticamente."}, {"id": 32, "text": "Una empresa desea crear una aplicación utilizando Amazon Bedrock. Cuenta con un presupuesto limitado y prefiere flexibilidad sin compromisos a largo plazo. ¿Qué modelo de precios de Amazon Bedrock cumple con estos requisitos?", "options": ["Bajo demanda", "Personalización del modelo", "Rendimiento aprovisionado", "Instancia de punto"], "correct": [0], "multi": false, "explanation": "El modelo bajo demanda (on-demand) cobra solo por lo que se usa, sin compromisos mínimos. El rendimiento aprovisionado requiere compromisos de tiempo y mayor costo base."}, {"id": 33, "text": "¿Qué servicio o función de AWS puede ayudar a un equipo de desarrollo de IA a implementar y consumir rápidamente un modelo base (FM) dentro de la VPC del equipo?", "options": ["Amazon Personalize", "Amazon SageMaker JumpStart", "PartyRock, un parque infantil de Amazon Bedrock", "Puntos de conexión de Amazon SageMaker"], "correct": [1], "multi": false, "explanation": "SageMaker JumpStart proporciona modelos base preentrenados, notebooks de ejemplo y plantillas de soluciones que permiten desplegar modelos rápidamente dentro de una VPC."}, {"id": 34, "text": "¿Cómo pueden las empresas utilizar modelos de lenguaje grandes (LLM, por sus siglas en inglés) de forma segura en Amazon Bedrock?", "options": ["Diseñe indicaciones claras y específicas. Configure los roles y las políticas de AWS Identity and Access Management (IAM) utilizando el acceso con privilegios mínimos.", "Habilitar AWS Audit Manager para trabajos de evaluación automática de modelos.", "Habilitar las tareas de evaluación automática de modelos de Amazon Bedrock.", "Utilice los registros de Amazon CloudWatch para que los modelos sean explicables y para detectar sesgos."], "correct": [0], "multi": false, "explanation": "La combinación de prompts bien diseñados con políticas IAM de privilegios mínimos es la práctica de seguridad fundamental para usar LLMs de forma segura."}, {"id": 35, "text": "Una empresa dispone de terabytes de datos en una base de datos que puede utilizar para el análisis empresarial. La empresa desea desarrollar una aplicación basada en IA que pueda generar consultas SQL a partir del texto introducido por los empleados. Estos empleados tienen poca experiencia con la tecnología. ¿Qué solución cumple con estos requisitos?", "options": ["Transformadores generativos preentrenados (GPT)", "Residual Neural Network", "Support Vector Machine (SVM)", "WaveNet"], "correct": [0], "multi": false, "explanation": "Los GPT (modelos de lenguaje basados en transformadores) pueden convertir lenguaje natural a SQL — exactamente lo que se necesita para usuarios sin conocimiento técnico."}, {"id": 36, "text": "Una empresa creó un modelo de aprendizaje profundo para la detección de objetos y lo implementó en producción. ¿Qué proceso de IA se produce cuando el modelo analiza una nueva imagen para identificar objetos?", "options": ["Formación", "Inferencia", "Despliegue del modelo", "Corrección de sesgo"], "correct": [1], "multi": false, "explanation": "La inferencia es el proceso de usar un modelo ya entrenado para hacer predicciones sobre datos nuevos. El entrenamiento ocurre antes del despliegue."}, {"id": 37, "text": "Un experto en IA está desarrollando un modelo para generar imágenes de personas en diversas profesiones. Descubrió que los datos de entrada están sesgados y que ciertos atributos afectan la generación de imágenes, creando sesgos en el modelo. ¿Qué técnica resolverá el problema?", "options": ["Data augmentation para clases desequilibradas", "Monitoreo del modelo para la distribución de clases", "Retrieval Augmented Generation (RAG) (RAG)", "Detección de marcas de agua para imágenes"], "correct": [0], "multi": false, "explanation": "El Data augmentation genera ejemplos sintéticos para las clases subrepresentadas, equilibrando el dataset y reduciendo el sesgo en el modelo."}, {"id": 38, "text": "Una empresa está implementando el modelo base Amazon Titan (FM) mediante Amazon Bedrock. La empresa necesita complementar el modelo con datos relevantes de sus fuentes de datos privadas. ¿Qué solución cumple con este requisito?", "options": ["Utilice una FM diferente.", "Elija un valor de temperatura más bajo.", "Crear una base de conocimientos de Amazon Bedrock."], "correct": [2], "multi": false, "explanation": "Las bases de conocimiento de Amazon Bedrock permiten conectar fuentes de datos privadas al FM usando RAG, sin necesidad de reentrenar el modelo."}, {"id": 39, "text": "Una empresa médica está personalizando un modelo base (MF) para fines diagnósticos. La empresa necesita que el modelo sea transparente y explicable para cumplir con los requisitos normativos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Configure la seguridad y el cumplimiento mediante Amazon Inspector.", "Genere métricas, informes y ejemplos sencillos utilizando Amazon SageMaker Clarify.", "Cifre y proteja los datos de entrenamiento utilizando Amazon Macie.", "Recopile más datos. Utilice Amazon Rekognition para agregar etiquetas personalizadas a los datos."], "correct": [1], "multi": false, "explanation": "SageMaker Clarify detecta sesgos y explica las predicciones del modelo, generando métricas e informes que satisfacen requisitos normativos de transparencia."}, {"id": 40, "text": "Una empresa desea implementar un chatbot conversacional para responder las preguntas de sus clientes. El chatbot se basa en un modelo optimizado de Amazon SageMaker JumpStart. La aplicación debe cumplir con múltiples marcos regulatorios. ¿Qué capacidades puede demostrar la empresa que cumplen? (Seleccione dos).", "options": ["Puntos finales de inferencia de escalado automático", "Detección de amenazas", "Protección de datos", "Optimización de costos", "Microservicios débilmente acoplados"], "correct": [1, 2], "multi": true, "explanation": "La detección de amenazas y la protección de datos son capacidades directamente relacionadas con marcos regulatorios de seguridad. Las otras opciones son características operativas pero no de cumplimiento normativo."}, {"id": 41, "text": "Una empresa está entrenando un modelo de base (FM). La empresa desea aumentar la precisión del modelo hasta un nivel de aceptación específico. ¿Qué solución cumplirá con estos requisitos?", "options": ["Disminuir el tamaño del lote.", "Aumentar las épocas.", "Disminuir las épocas.", "Aumentar el parámetro de temperatura."], "correct": [1], "multi": false, "explanation": "Aumentar las épocas permite al modelo ver los datos de entrenamiento más veces, mejorando su capacidad de aprender patrones y aumentando la precisión hasta el nivel deseado."}, {"id": 42, "text": "Una empresa está desarrollando un chatbot de preguntas y respuestas basado en un modelo de lenguaje natural (LLM, por sus siglas en inglés). La empresa busca reducir la cantidad de acciones que los empleados del centro de llamadas deben realizar para responder las preguntas de los clientes. ¿Qué objetivo empresarial debería utilizar la empresa para evaluar el impacto del chatbot LLM?", "options": ["Tasa de interacción con el sitio web", "Duración media de la llamada", "Responsabilidad social corporativa", "Cumplimiento normativo"], "correct": [1], "multi": false, "explanation": "La duración media de llamada mide directamente si el chatbot reduce el tiempo que los empleados dedican a cada interacción — el objetivo principal del caso de uso."}, {"id": 43, "text": "¿Qué funcionalidades ofrece Amazon SageMaker Clarify?", "options": ["Integra un flujo de trabajo de Retrieval Augmented Generation (RAG) (RAG).", "Supervisa la calidad de los modelos de aprendizaje automático en producción.", "Documenta detalles críticos sobre los modelos de aprendizaje automático.", "Identifica posibles sesgos durante la preparación de los datos."], "correct": [3], "multi": false, "explanation": "SageMaker Clarify está diseñado para detectar sesgos en datos y modelos, y para explicar predicciones. Model Monitor supervisa calidad, Model Cards documenta modelos."}, {"id": 44, "text": "Una empresa está desarrollando un nuevo modelo para predecir los precios de artículos específicos. El modelo tuvo un buen desempeño en el conjunto de datos de entrenamiento. Sin embargo, al implementarlo en producción, su rendimiento disminuyó significativamente. ¿Qué debería hacer la empresa para solucionar este problema?", "options": ["Reducir el volumen de datos que se utilizan en el entrenamiento.", "Añadir hiperparámetros al modelo.", "Aumentar el volumen de datos que se utilizan en el entrenamiento.", "Aumentar el tiempo de entrenamiento del modelo."], "correct": [2], "multi": false, "explanation": "Cuando un modelo funciona bien en entrenamiento pero mal en producción, generalmente hay Overfitting (overfitting). Más datos de entrenamiento diversos ayuda al modelo a generalizar mejor."}, {"id": 45, "text": "Una empresa de comercio electrónico desea desarrollar una solución para determinar la opinión de los clientes a partir de las reseñas escritas de los productos. ¿Qué servicios de AWS cumplen con estos requisitos? (Seleccione dos).", "options": ["Amazon Lex", "Amazon Comprehend", "Amazon Polly", "Amazon Bedrock -", "Amazon Rekognition"], "correct": [1, 3], "multi": true, "explanation": "Amazon Comprehend es el servicio nativo de AWS para análisis de sentimientos en texto. Amazon Bedrock con LLMs también puede realizar análisis de sentimientos con mayor flexibilidad."}, {"id": 46, "text": "Una empresa desea utilizar modelos de lenguaje a gran escala (LLM, por sus siglas en inglés) con Amazon Bedrock para desarrollar una interfaz de chat para los manuales de sus productos. Los manuales se almacenan como archivos PDF. ¿Qué solución cumple con estos requisitos de la manera más rentable?", "options": ["Utilice ingeniería de indicaciones para agregar un archivo PDF como contexto a la indicación del usuario cuando esta se envíe a Amazon Bedrock.", "Utilice ingeniería de indicaciones para agregar todos los archivos PDF como contexto a la indicación del usuario cuando esta se envíe a Amazon Bedrock.", "Utilice todos los documentos PDF para ajustar un modelo con Amazon Bedrock. Utilice el modelo ajustado para procesar las indicaciones del usuario.", "Cargue documentos PDF a una base de conocimientos de Amazon Bedrock. Utilice la base de conocimientos para proporcionar contexto cuando los usuarios envíen solicitudes a Amazon Bedrock."], "correct": [3], "multi": false, "explanation": "Las bases de conocimiento de Bedrock indexan los PDFs y recuperan solo el contexto relevante para cada pregunta (RAG), siendo más eficiente y rentable que incluir todos los documentos en cada prompt."}, {"id": 47, "text": "Una empresa de redes sociales desea utilizar un modelo de lenguaje extenso (LLM) para la moderación de contenido. La empresa quiere evaluar los resultados del LLM para detectar sesgos y posible discriminación contra grupos o individuos específicos. ¿Qué fuente de datos debería utilizar la empresa para evaluar los resultados del LLM con el mínimo esfuerzo administrativo?", "options": ["Contenido generado por el usuario", "Registros de moderación", "Directrices para la moderación de contenido", "Conjuntos de datos de referencia"], "correct": [3], "multi": false, "explanation": "Los conjuntos de datos de referencia son datasets estándar y pre-validados que permiten evaluar sesgos de forma sistemática y reproducible con mínimo esfuerzo."}, {"id": 48, "text": "Una empresa desea utilizar un modelo de IA generativa preentrenado para crear contenido para sus campañas de marketing. La empresa necesita asegurarse de que el contenido generado se ajuste a la identidad de marca y a los mensajes clave de la empresa. ¿Qué solución cumple con estos requisitos?", "options": ["Optimizar la arquitectura y los hiperparámetros del modelo para mejorar su rendimiento general.", "Aumentar la complejidad del modelo añadiendo más capas a su arquitectura.", "Crear indicaciones eficaces que proporcionen instrucciones claras y contexto para guiar la generación del modelo.", "Seleccionar un conjunto de datos amplio y diverso para preentrenar un nuevo modelo generativo."], "correct": [2], "multi": false, "explanation": "La ingeniería de prompts (indicaciones) es la forma más directa de guiar el estilo, tono e identidad de marca en el contenido generado sin necesidad de reentrenar el modelo."}, {"id": 49, "text": "Una empresa de préstamos está desarrollando una solución de IA generativa para ofrecer descuentos a los nuevos solicitantes según criterios comerciales específicos. La empresa desea crear y utilizar el modelo de IA de forma responsable para minimizar los sesgos que podrían afectar negativamente a algunos clientes. ¿Qué medidas debería tomar la empresa para cumplir con estos requisitos? (Seleccione dos).", "options": ["Detectar desequilibrios o disparidades en los datos.", "Asegúrese de que el modelo se ejecute con frecuencia.", "Evaluar el comportamiento del modelo para que la empresa pueda brindar transparencia a las partes interesadas.", "Utilice la técnica ROUGE (Recall-Oriented Understudy for Gisting Evaluation) para garantizar que el modelo sea 100% preciso.", "Asegúrese de que el tiempo de inferencia del modelo esté dentro de los límites aceptados."], "correct": [0, 2], "multi": true, "explanation": "Detectar desequilibrios en datos previene sesgos desde el origen. Evaluar y comunicar el comportamiento del modelo asegura transparencia y rendición de cuentas — pilares de IA responsable."}, {"id": 50, "text": "Una empresa utiliza un modelo base de Amazon Bedrock para resumir documentos para un caso de uso interno. La empresa entrenó un modelo personalizado para mejorar la calidad del resumen. ¿Qué acción debe realizar la empresa para utilizar el modelo personalizado a través de Amazon Bedrock?", "options": ["Adquiera el rendimiento aprovisionado para el modelo personalizado.", "Implemente el modelo personalizado en un punto final de Amazon SageMaker para realizar inferencias en tiempo real.", "Registre el modelo en el Amazon SageMaker Model Registry.", "Otorgar acceso al modelo personalizado en Amazon Bedrock."], "correct": [0], "multi": false, "explanation": "Los modelos personalizados en Amazon Bedrock requieren rendimiento aprovisionado para poder ser invocados. Sin este paso, el modelo personalizado no está disponible para inferencia."}, {"id": 51, "text": "Una empresa necesita elegir un modelo de Amazon Bedrock para usarlo internamente. Debe identificar un modelo que genere respuestas con el estilo que prefieren sus empleados. ¿Qué debe hacer la empresa para cumplir con estos requisitos?", "options": ["Evalúe los modelos utilizando conjuntos de datos de ejemplo integrados.", "Evaluar los modelos utilizando personal humano y conjuntos de datos personalizados.", "Utilice las clasificaciones públicas de modelos para identificar el modelo.", "Utilice las métricas de tiempo de ejecución InvocationLatency del modelo en Amazon CloudWatch al probar modelos."], "correct": [1], "multi": false, "explanation": "Para determinar qué modelo produce el estilo preferido, se necesita evaluación humana con datos representativos de los casos de uso reales de la empresa."}, {"id": 52, "text": "Un estudiante universitario copia contenido de una IA generativa para escribir ensayos. ¿Qué desafío para la IA generativa responsable representa este escenario?", "options": ["Toxicidad", "Alucinaciones", "Plagio", "Privacidad"], "correct": [2], "multi": false, "explanation": "El plagio ocurre cuando se usa contenido generado por IA como propio sin atribución. Es un desafío de IA responsable relacionado con la integridad académica y propiedad intelectual."}, {"id": 53, "text": "Una empresa necesita crear su propio modelo de lenguaje a gran escala (LLM, por sus siglas en inglés) utilizando únicamente sus datos privados. Le preocupa el impacto ambiental del proceso de entrenamiento. ¿Qué tipo de instancia de Amazon EC2 tiene el MENOR impacto ambiental al entrenar modelos LLM?", "options": ["Serie C de Amazon EC2", "Serie G de Amazon EC2", "Serie P de Amazon EC2", "Serie de transacciones de Amazon EC2"], "correct": [3], "multi": false, "explanation": "Las instancias de la serie T (transacciones) son las más eficientes energéticamente para cargas variables. Para entrenamiento de LLMs con menor impacto, se prefieren instancias más eficientes en energía."}, {"id": 54, "text": "Una empresa quiere crear una aplicación interactiva para niños que genere nuevas historias basadas en cuentos clásicos. La empresa desea utilizar Amazon Bedrock y necesita asegurarse de que los resultados y los temas sean apropiados para niños. ¿Qué servicio o función de AWS cumplirá con estos requisitos?", "options": ["Amazon Rekognition", "Amazon Bedrock PartyRock", "Amazon Bedrock Guardrails", "Amazon Bedrock Agents"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock Guardrails permite configurar filtros de contenido para asegurar que las respuestas sean apropiadas — en este caso, adecuadas para niños."}, {"id": 55, "text": "Una empresa está desarrollando una aplicación que necesita generar datos sintéticos a partir de datos existentes. ¿Qué tipo de modelo puede utilizar la empresa para cumplir con este requisito?", "options": ["Generative Adversarial Network (GAN) (GAN)", "XGBoost", "Residual Neural Network", "WaveNet"], "correct": [0], "multi": false, "explanation": "Las GANs están diseñadas específicamente para generar datos sintéticos realistas aprendiendo la distribución de los datos originales. Son el estándar para generación de datos sintéticos."}, {"id": 56, "text": "Una empresa de dispositivos digitales desea predecir la demanda de hardware de memoria por parte de sus clientes. La empresa carece de experiencia en programación y conocimientos de algoritmos de aprendizaje automático, por lo que necesita desarrollar un modelo predictivo basado en datos. Debe analizar datos internos y externos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Almacene los datos en Amazon S3. Cree modelos de aprendizaje automático y predicciones de previsión de la demanda utilizando los algoritmos integrados de Amazon SageMaker que utilizan los datos de Amazon S3.", "Importe los datos a Amazon SageMaker Data Wrangler. Cree modelos de aprendizaje automático y predicciones de previsión de la demanda utilizando los algoritmos integrados de SageMaker.", "Importe los datos a Amazon SageMaker Data Wrangler. Cree modelos de aprendizaje automático y predicciones de previsión de la demanda utilizando una receta de Amazon Personalize Trending-Now.", "Importa los datos a Amazon SageMaker Canvas. Crea modelos de aprendizaje automático y predicciones de previsión de la demanda seleccionando los valores de los datos de SageMaker Canvas."], "correct": [3], "multi": false, "explanation": "SageMaker Canvas ofrece una interfaz visual sin código (no-code) para crear modelos de ML, ideal para equipos sin experiencia en programación o algoritmos de ML."}, {"id": 57, "text": "Una empresa ha instalado una cámara de seguridad. La empresa utiliza un modelo de aprendizaje automático para evaluar las grabaciones de la cámara en busca de posibles robos. La empresa ha descubierto que el modelo identifica de forma desproporcionada a personas que pertenecen a un grupo étnico específico. ¿Qué tipo de sesgo está afectando el resultado del modelo?", "options": ["Sesgo de medición", "Sesgo de muestreo", "Sesgo del observador", "Sesgo de confirmación"], "correct": [1], "multi": false, "explanation": "El sesgo de muestreo ocurre cuando los datos de entrenamiento no representan equitativamente todos los grupos. Si el dataset tenía más imágenes de ciertos grupos étnicos, el modelo aprenderá ese sesgo."}, {"id": 58, "text": "Una empresa está desarrollando un chatbot de atención al cliente. La empresa desea que el chatbot mejore sus respuestas aprendiendo de interacciones anteriores y recursos en línea. ¿Qué estrategia de aprendizaje de IA proporciona esta capacidad de autoaprendizaje?", "options": ["Aprendizaje supervisado con un conjunto de datos seleccionado manualmente de respuestas buenas y malas.", "Aprendizaje por refuerzo con recompensas por comentarios positivos de los clientes.", "Aprendizaje no supervisado para encontrar grupos de consultas de clientes similares.", "Aprendizaje supervisado con una base de datos de preguntas frecuentes actualizada continuamente."], "correct": [1], "multi": false, "explanation": "El aprendizaje por refuerzo con retroalimentación (RLHF) permite al modelo mejorar continuamente basándose en recompensas positivas de las interacciones — ideal para chatbots que aprenden de usuarios."}, {"id": 59, "text": "Un experto en IA ha creado un modelo de aprendizaje profundo para clasificar los tipos de materiales en imágenes. Ahora quiere medir el rendimiento del modelo. ¿Qué métrica le ayudará a evaluar dicho rendimiento?", "options": ["Matriz de confusión", "Matriz de correlación", "R2", "Root Mean Square Error (RMSE) (ECM)"], "correct": [0], "multi": false, "explanation": "La matriz de confusión muestra los verdaderos positivos, falsos positivos, verdaderos negativos y falsos negativos para cada clase — la herramienta estándar para evaluar clasificadores."}, {"id": 60, "text": "Una empresa ha desarrollado un chatbot capaz de responder preguntas en lenguaje natural mediante imágenes. La empresa desea asegurarse de que el chatbot no muestre imágenes inapropiadas o no deseadas. ¿Qué solución cumplirá con estos requisitos?", "options": ["Implementar API de moderación.", "Reentrenar el modelo con un conjunto de datos público general.", "Realizar la validación del modelo.", "Automatizar la integración de los comentarios de los usuarios."], "correct": [0], "multi": false, "explanation": "Las APIs de moderación filtran contenido inapropiado en tiempo real antes de mostrar las imágenes a los usuarios, siendo la solución más directa para este caso."}, {"id": 61, "text": "Un profesional de la IA utiliza un modelo base de Amazon Bedrock para resumir las conversaciones de las sesiones del departamento de atención al cliente. Desea almacenar registros de invocación para monitorizar los datos de entrada y salida del modelo. ¿Qué estrategia debería utilizar?", "options": ["Configure AWS CloudTrail como destino de los registros para el modelo.", "Habilitar el registro de invocaciones en Amazon Bedrock.", "Configure AWS Audit Manager como destino de los registros para el modelo.", "Configure el registro de invocación de modelos en Amazon EventBridge."], "correct": [1], "multi": false, "explanation": "El registro de invocaciones de Amazon Bedrock captura específicamente los datos de entrada y salida de los modelos, siendo la herramienta correcta para monitorizar el uso del modelo."}, {"id": 62, "text": "Una empresa está desarrollando un modelo de aprendizaje automático para analizar datos archivados. Debe realizar inferencias en conjuntos de datos de gran tamaño, de varios gigabytes. La empresa no necesita acceder a las predicciones del modelo de inmediato. ¿Qué opción de inferencia de Amazon SageMaker cumple con estos requisitos?", "options": ["Transformación por lotes", "Inferencia en tiempo real", "Inferencia sin servidor", "Inferencia asíncrona"], "correct": [0], "multi": false, "explanation": "La transformación por lotes procesa grandes conjuntos de datos de forma eficiente sin necesidad de un endpoint activo, ideal cuando no se necesitan predicciones en tiempo real."}, {"id": 63, "text": "¿Qué término describe las representaciones numéricas de objetos y conceptos del mundo real que utilizan los modelos de IA y de procesamiento del lenguaje natural (PLN) para mejorar la comprensión de la información textual?", "options": ["Incrustaciones", "Fichas", "Modelos", "Binarios"], "correct": [0], "multi": false, "explanation": "Las incrustaciones (embeddings) son representaciones numéricas vectoriales de palabras o conceptos que capturan relaciones semánticas, permitiendo a los modelos entender el significado del texto."}, {"id": 64, "text": "Una empresa de investigación implementó un chatbot utilizando un modelo base (FM) de Amazon Bedrock. El chatbot busca respuestas a preguntas en una extensa base de datos de artículos de investigación. Tras varios intentos de ingeniería, la empresa observa que el FM tiene un rendimiento deficiente debido a la complejidad de la terminología científica presente en los artículos. ¿Cómo puede la empresa mejorar el rendimiento del chatbot?", "options": ["Utilice indicaciones con pocas opciones para definir cómo el FM puede responder a las preguntas.", "Utilice el ajuste fino de adaptación de dominio para adaptar el FM a términos científicos complejos.", "Modifique los parámetros de inferencia de FM.", "Limpie los datos del artículo de investigación para eliminar los términos científicos complejos."], "correct": [1], "multi": false, "explanation": "El ajuste fino de adaptación de dominio (domain adaptation fine-tuning) entrena el modelo con texto especializado del dominio, haciéndolo experto en esa terminología específica."}, {"id": 65, "text": "Una empresa desea utilizar un modelo de lenguaje grande (LLM, por sus siglas en inglés) en Amazon Bedrock para el análisis de sentimientos. La empresa necesita que el LLM genere respuestas más consistentes ante la misma solicitud de entrada. ¿Qué ajuste a un parámetro de inferencia debería realizar la empresa para cumplir con estos requisitos?", "options": ["Disminuir el valor de la temperatura.", "Aumentar el valor de la temperatura.", "Disminuir la longitud de los tokens de salida.", "Aumentar la duración máxima de la generación."], "correct": [0], "multi": false, "explanation": "La temperatura controla la aleatoriedad. Con temperatura baja (cercana a 0), el modelo es más determinista y consistente. Con temperatura alta, las respuestas son más variadas y creativas."}, {"id": 66, "text": "Una empresa desea desarrollar una aplicación de modelo de lenguaje (LLM) de gran tamaño utilizando Amazon Bedrock y datos de clientes almacenados en Amazon S3. La política de seguridad de la empresa establece que cada equipo solo puede acceder a los datos de sus propios clientes. ¿Qué solución cumple con estos requisitos?", "options": ["Cree un rol de servicio personalizado de Amazon Bedrock para cada equipo que tenga acceso únicamente a los datos de los clientes de ese equipo.", "Cree un rol de servicio personalizado que tenga acceso a Amazon S3. Pida a los equipos que especifiquen el nombre del cliente en cada solicitud de Amazon Bedrock.", "Oculte los datos personales en Amazon S3. Actualice la política del bucket de S3 para permitir el acceso del equipo a los datos de los clientes.", "Cree un rol de Amazon Bedrock con acceso completo a Amazon S3. Cree roles de IAM para cada equipo con acceso únicamente a las carpetas de clientes de cada equipo."], "correct": [0], "multi": false, "explanation": "Crear roles de servicio específicos por equipo con acceso solo a sus datos es el principio de privilegios mínimos — cada equipo solo puede acceder a lo que necesita."}, {"id": 67, "text": "Una empresa médica implementó un modelo de detección de enfermedades en Amazon Bedrock. Para cumplir con sus políticas de privacidad, la empresa desea evitar que el modelo incluya información personal de los pacientes en sus respuestas. Además, desea recibir notificaciones cuando se produzcan infracciones de las políticas. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon Macie para analizar la salida del modelo en busca de datos confidenciales y configure alertas para posibles infracciones.", "Configure AWS CloudTrail para supervisar las respuestas del modelo y crear alertas ante cualquier información personal detectada.", "Utilice las medidas de seguridad de Amazon Bedrock para filtrar el contenido. Configure las alarmas de Amazon CloudWatch para recibir notificaciones sobre infracciones de las políticas.", "Implementar Amazon SageMaker Model Monitor para detectar desviaciones de datos y recibir alertas cuando la calidad del modelo se degrade."], "correct": [2], "multi": false, "explanation": "Amazon Bedrock Guardrails filtra PII en tiempo real, y las alarmas de CloudWatch notifican cuando se detectan infracciones — combinación perfecta para este requisito."}, {"id": 68, "text": "Una empresa revisa manualmente todos los currículos recibidos en formato PDF. A medida que la empresa crece, prevé que el volumen de currículos superará su capacidad de revisión. La empresa necesita un sistema automatizado para convertir los currículos en formato PDF a texto plano para su posterior procesamiento. ¿Qué servicio de AWS cumple con este requisito?", "options": ["Amazon Textract", "Amazon Personalize", "Amazon Lex", "Amazon Transcribe"], "correct": [0], "multi": false, "explanation": "Amazon Textract extrae texto y datos de documentos escaneados y PDFs de forma automática, siendo el servicio ideal para procesar currículos en PDF."}, {"id": 69, "text": "Un proveedor educativo está desarrollando una aplicación de preguntas y respuestas que utiliza un modelo de IA generativa para explicar conceptos complejos. El proveedor desea que el estilo de respuesta del modelo cambie automáticamente según quién formule la pregunta. El proveedor proporcionará al modelo el rango de edad del usuario que realiza la pregunta. ¿Qué solución cumple con estos requisitos con el MENOR esfuerzo de implementación?", "options": ["Perfeccionar el modelo utilizando datos de entrenamiento adicionales que sean representativos de los distintos rangos de edad que admitirá la aplicación.", "Agregue una descripción del rol al contexto de la indicación que le indique al modelo el rango de edad al que debe dirigirse la respuesta.", "Utilice el razonamiento de cadena de pensamiento para deducir el estilo y la complejidad correctos para una respuesta adecuada para ese usuario.", "Resuma el texto de respuesta según la edad del usuario, de modo que los usuarios más jóvenes reciban respuestas más cortas."], "correct": [1], "multi": false, "explanation": "Incluir el rango de edad en el contexto del prompt (role prompting) es la forma más simple y eficiente de adaptar el estilo sin reentrenar el modelo."}, {"id": 70, "text": "¿Qué estrategia evalúa la precisión de un modelo base (FM) que se utiliza en tareas de clasificación de imágenes?", "options": ["Calcula el costo total de los recursos utilizados por el modelo.", "Medir la precisión del modelo comparándola con un conjunto de datos de referencia predefinido.", "Cuenta el número de capas en la red neuronal.", "Evaluar la precisión del color de las imágenes procesadas por el modelo."], "correct": [1], "multi": false, "explanation": "Comparar las predicciones del modelo con un dataset de referencia (benchmark) con respuestas conocidas es el método estándar para evaluar precisión en clasificación."}, {"id": 71, "text": "Una firma de contabilidad desea implementar un modelo de lenguaje extenso (LLM) para automatizar el procesamiento de documentos. La firma debe proceder de manera responsable para evitar posibles daños. ¿Qué debe hacer la firma al desarrollar e implementar el LLM? (Elija dos opciones).", "options": ["Incluir métricas de equidad para la evaluación del modelo.", "Ajustar el parámetro de temperatura del modelo.", "Modificar los datos de entrenamiento para mitigar el sesgo.", "Evite el Overfitting a los datos de entrenamiento.", "Aplicar técnicas de ingeniería rápidas."], "correct": [0, 2], "multi": true, "explanation": "Las métricas de equidad aseguran que el modelo trate a todos los grupos de forma justa. Modificar datos de entrenamiento para eliminar sesgos es fundamental para IA responsable en contextos legales."}, {"id": 72, "text": "Una empresa está desarrollando un modelo de aprendizaje automático (ML). La empresa recopiló nuevos datos y los analizó creando una matriz de correlación, calculando estadísticas y visualizando los datos. ¿En qué etapa del proceso de aprendizaje automático se encuentra actualmente la empresa?", "options": ["Preprocesamiento de datos", "Feature engineering", "Exploratory Data Analysis (EDA)", "Hyperparameter tuning"], "correct": [2], "multi": false, "explanation": "El análisis exploratorio de datos (EDA) es la fase donde se investigan los datos usando estadísticas, correlaciones y visualizaciones para entender su estructura antes de modelar."}, {"id": 73, "text": "Una empresa tiene documentos a los que les faltan algunas palabras debido a un error en la base de datos. La empresa quiere crear un modelo de aprendizaje automático que pueda sugerir palabras potenciales para completar el texto faltante. ¿Qué tipo de modelo cumple con este requisito?", "options": ["Modelado de temas", "Modelos de agrupamiento", "Modelos de aprendizaje automático prescriptivos", "Modelos basados en BERT"], "correct": [3], "multi": false, "explanation": "BERT (Bidirectional Encoder Representations from Transformers) fue diseñado específicamente para la tarea de predicción de palabras enmascaradas (masked language modeling), perfecta para este caso."}, {"id": 74, "text": "Una empresa quiere mostrar las ventas totales de sus productos más vendidos en sus diferentes puntos de venta durante los últimos 12 meses. ¿Qué solución de AWS debería usar para automatizar la generación de gráficos?", "options": ["Preguntas frecuentes de Amazon en Amazon EC2", "Amazon Q Developer", "Amazon Q en Amazon QuickSight", "Amazon Q en el chatbot de AWS"], "correct": [2], "multi": false, "explanation": "Amazon Q en QuickSight permite generar visualizaciones y análisis de datos de ventas usando lenguaje natural, automatizando la creación de gráficos directamente en la herramienta de BI."}, {"id": 75, "text": "Una empresa está desarrollando un chatbot para mejorar la experiencia del usuario. Para la detección de intenciones, utiliza un modelo de lenguaje grande (LLM) de Amazon Bedrock. La empresa desea emplear el aprendizaje con pocos ejemplos (few- shot learning) para mejorar la precisión de la detección de intenciones. ¿Qué datos adicionales necesita la empresa para cumplir con estos requisitos?", "options": ["Pares de respuestas del chatbot e intenciones correctas del usuario", "Pares de mensajes de usuario y respuestas correctas del chatbot", "Pares de mensajes de usuario e intenciones correctas del usuario", "Pares de intenciones del usuario y respuestas correctas del chatbot"], "correct": [2], "multi": false, "explanation": "Para few-shot learning en detección de intenciones, se necesitan ejemplos de mensajes de usuario emparejados con sus intenciones correctas — esto es lo que el modelo aprende a clasificar."}, {"id": 76, "text": "Una empresa utiliza la técnica de solicitud de ejemplos con pocos ejemplos en un modelo base alojado en Amazon Bedrock. El modelo actualmente utiliza 10 ejemplos en la solicitud. Se ejecuta una vez al día y su rendimiento es bueno. La empresa desea reducir el costo mensual. ¿Qué solución cumplirá con estos requisitos?", "options": ["Personalice el modelo mediante ajustes finos.", "Disminuya el número de tokens en la consigna.", "Aumentar el número de tokens en la solicitud.", "Utilice el rendimiento aprovisionado."], "correct": [1], "multi": false, "explanation": "En Bedrock se cobra por tokens. Reducir el número de tokens en el prompt (por ejemplo, usando menos ejemplos o prompts más concisos) disminuye directamente el costo por inferencia."}, {"id": 77, "text": "Un profesional de la IA utiliza un modelo de lenguaje complejo (LLM) para crear contenido para campañas de marketing. El contenido generado suena plausible y veraz, pero es incorrecto. ¿Qué problema presenta el LLM?", "options": ["Fuga de datos", "Alucinación", "Overfitting", "Underfitting"], "correct": [1], "multi": false, "explanation": "Las alucinaciones en LLMs son respuestas que suenan convincentes y plausibles pero contienen información incorrecta o inventada. Es uno de los principales desafíos de los modelos generativos."}, {"id": 78, "text": "Un profesional de la IA entrenó un modelo personalizado en Amazon Bedrock utilizando un conjunto de datos de entrenamiento que contiene información confidencial. El profesional desea asegurarse de que el modelo personalizado no genere respuestas de inferencia basadas en datos confidenciales. ¿Cómo puede el profesional de la IA evitar que se generen respuestas basadas en datos confidenciales?", "options": ["Elimine el modelo personalizado. Elimine los datos confidenciales del conjunto de datos de entrenamiento. Vuelva a entrenar el modelo personalizado.", "Oculte los datos confidenciales en las respuestas de inferencia mediante el uso de enmascaramiento dinámico de datos.", "Encriptar los datos confidenciales en las respuestas de inferencia mediante Amazon SageMaker.", "Encriptar los datos confidenciales en el modelo personalizado mediante el AWS Key Management Service (KMS) (AWS KMS)."], "correct": [0], "multi": false, "explanation": "La única forma de eliminar información que el modelo aprendió durante el entrenamiento es eliminar esos datos del dataset y reentrenar el modelo desde cero."}, {"id": 79, "text": "Una empresa ha desarrollado una solución mediante inteligencia artificial generativa. Esta solución utiliza modelos lingüísticos a gran escala (MLG) para traducir manuales de capacitación del inglés a otros idiomas. La empresa desea evaluar la precisión de la solución analizando el texto generado para los manuales. ¿Qué estrategia de evaluación de modelos cumple con estos requisitos?", "options": ["BLEU Score (BLEU)", "Root Mean Square Error (RMSE) (RMSE)", "ROUGE Score (ROUGE)"], "correct": [0], "multi": false, "explanation": "BLEU es la métrica estándar para evaluar calidad de traducciones automáticas, comparando la salida del modelo con traducciones de referencia humanas."}, {"id": 80, "text": "Una gran cadena minorista recibe miles de consultas de atención al cliente sobre sus productos cada día. Estas consultas deben procesarse y responderse con rapidez. La empresa desea implementar Amazon Bedrock Agents. ¿Cuáles son los principales beneficios de usar Amazon Bedrock Agents que podrían ayudar a esta cadena minorista?", "options": ["Generación de modelos de base perso
