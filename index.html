nalizados (FM) para predecir las necesidades del cliente.", "Automatización de tareas repetitivas y orquestación de flujos de trabajo complejos.", "Llamada automática a múltiples modelos de base (FM) y consolidación de los resultados.", "Selección del modelo de base (FM) en función de criterios y métricas predefinidos."], "correct": [1], "multi": false, "explanation": "Los Amazon Bedrock Agents automatizan tareas repetitivas y orquestan flujos de trabajo complejos de múltiples pasos, reduciendo el esfuerzo manual en atención al cliente."}, {"id": 81, "text": "¿Qué opción representa una ventaja del preentrenamiento continuo al ajustar un modelo base (FM)?", "options": ["Ayuda a disminuir la complejidad del modelo.", "Mejora el rendimiento del modelo con el tiempo.", "Disminuye el tiempo de capacitación requerido", "Optimiza el tiempo de inferencia del modelo."], "correct": [1], "multi": false, "explanation": "El preentrenamiento continuo actualiza el conocimiento del modelo con datos nuevos de forma gradual, mejorando su rendimiento a lo largo del tiempo sin necesidad de reentrenamiento completo."}, {"id": 82, "text": "¿Qué son los tokens en el contexto de los modelos de IA generativa?", "options": ["Los tokens son las unidades básicas de entrada y salida con las que opera un modelo de IA generativa, que representan palabras, subpalabras u otras unidades lingüísticas.", "Los tokens son las representaciones matemáticas de palabras o conceptos que se utilizan en los modelos de IA generativa.", "Los tokens son los pesos preentrenados de un modelo de IA generativa que se ajustan para tareas específicas.", "Los tokens son las indicaciones o instrucciones específicas que se le dan a un modelo de IA generativa para generar un resultado."], "correct": [0], "multi": false, "explanation": "Los tokens son las unidades básicas de procesamiento — pueden ser palabras completas, partes de palabras o caracteres. Los LLMs leen y generan texto token por token."}, {"id": 83, "text": "Una empresa quiere evaluar los costos asociados al uso de un modelo de lenguaje grande (LLM) para generar inferencias. La empresa desea utilizar Amazon Bedrock para desarrollar aplicaciones de IA generativa. ¿Qué factor determinará los costos de inferencia?", "options": ["Número de fichas consumidas", "Valor de temperatura", "Cantidad de datos utilizados para entrenar el LLM", "Tiempo total de entrenamiento"], "correct": [0], "multi": false, "explanation": "Amazon Bedrock cobra por token procesado (tanto entrada como salida). La temperatura y otros parámetros de inferencia no afectan el costo directamente."}, {"id": 84, "text": "Una empresa utiliza cuadernos de Amazon SageMaker Studio para crear y entrenar modelos de aprendizaje automático. Almacena los datos en un bucket de Amazon S3 y necesita gestionar el flujo de datos desde Amazon S3 a los cuadernos de SageMaker Studio. ¿Qué solución cumple con este requisito?", "options": ["Utilice Amazon Inspector para supervisar SageMaker Studio.", "Utilice Amazon Macie para monitorear SageMaker Studio.", "Configure SageMaker para que utilice una VPC con un punto final S3.", "Configure SageMaker para usar S3 Glacier Deep Archive."], "correct": [2], "multi": false, "explanation": "Configurar un endpoint de S3 dentro de la VPC permite que SageMaker Studio acceda a los datos de S3 de forma privada y segura sin pasar por internet."}, {"id": 85, "text": "Una empresa cuenta con un modelo base (FM) personalizado mediante Amazon Bedrock para responder a las consultas de los clientes sobre sus productos. La empresa desea validar las respuestas del modelo a nuevos tipos de consultas. Para ello, necesita cargar un nuevo conjunto de datos que Amazon Bedrock pueda utilizar para la validación. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon S3", "Amazon Elastic Block Store (EBS) (Amazon EBS)", "Amazon Elastic File System (EFS) (Amazon EFS)", "AWS Snowcone"], "correct": [0], "multi": false, "explanation": "Amazon S3 es el servicio de almacenamiento estándar para cargar y gestionar datasets en AWS, compatible con Amazon Bedrock para validación de modelos."}, {"id": 86, "text": "¿Qué ataque de inducción expone directamente el comportamiento configurado de un modelo de lenguaje grande (LLM)?", "options": ["Cambios de personalidad inducidos", "Explotar la amabilidad y la confianza", "Ignorar el system prompt", "Prompt template extraction"], "correct": [3], "multi": false, "explanation": "La extracción de plantilla de solicitud (prompt extraction) intenta que el modelo revele sus instrucciones del sistema o configuración interna, exponiendo el comportamiento configurado."}, {"id": 87, "text": "Una empresa quiere usar Amazon Bedrock. La empresa necesita revisar de qué aspectos de seguridad es responsable al usar Amazon Bedrock. ¿De qué aspecto de seguridad será responsable la empresa?", "options": ["Parcheo y actualización de las versiones de Amazon Bedrock", "Protección de la infraestructura que aloja Amazon Bedrock.", "Garantizar la seguridad de los datos de la empresa tanto en tránsito como en reposo.", "Aprovisionamiento de Amazon Bedrock dentro de la red de la empresa"], "correct": [2], "multi": false, "explanation": "Bajo el modelo de responsabilidad compartida de AWS, la empresa es responsable de la seguridad de sus propios datos (cifrado, acceso), mientras AWS es responsable de la infraestructura."}, {"id": 88, "text": "Una empresa de redes sociales desea utilizar un modelo de lenguaje extenso (LLM) para resumir mensajes. La empresa ha seleccionado algunos LLM disponibles en Amazon SageMaker JumpStart. Quiere comparar la toxicidad de los resultados generados por estos modelos. ¿Qué estrategia le permite evaluar los LLM con el menor costo operativo?", "options": ["Evaluación colaborativa", "Evaluación automática del modelo", "Evaluación del modelo con trabajadores humanos", "Reinforcement Learning from Human Feedback (RLHF) (RLHF)"], "correct": [1], "multi": false, "explanation": "La evaluación automática usa métricas computacionales para medir toxicidad de forma escalable y económica, sin necesitar revisores humanos para cada muestra."}, {"id": 89, "text": "Una empresa está probando la seguridad de un modelo de base (FM). Durante las pruebas, la empresa quiere eludir las medidas de seguridad y generar contenido dañino. ¿De qué técnica de seguridad es un ejemplo esto?", "options": ["Pruebas de fuzzing en los datos de entrenamiento para encontrar vulnerabilidades.", "Denegación de servicio (DoS)", "Pruebas de penetración con autorización", "Jailbreak"], "correct": [3], "multi": false, "explanation": "El jailbreak es la técnica de intentar eludir las medidas de seguridad de un modelo de IA para que genere contenido que normalmente rechazaría."}, {"id": 90, "text": "Una empresa necesita utilizar Amazon SageMaker para el entrenamiento e inferencia de modelos. La empresa debe cumplir con los requisitos normativos para ejecutar trabajos de SageMaker en un entorno aislado sin acceso a internet. ¿Qué solución cumple con estos requisitos?", "options": ["Ejecute el entrenamiento y la inferencia de SageMaker utilizando los experimentos de SageMaker.", "Ejecutar el entrenamiento y la inferencia de SageMaker utilizando el aislamiento de red.", "Encriptar los datos en reposo utilizando el cifrado para las capacidades geoespaciales de SageMaker.", "Asocie los roles apropiados de AWS Identity and Access Management (IAM) con los puestos de trabajo de SageMaker."], "correct": [1], "multi": false, "explanation": "El aislamiento de red en SageMaker configura los trabajos para ejecutarse dentro de una VPC sin acceso a internet, cumpliendo con requisitos de seguridad y cumplimiento estrictos."}, {"id": 91, "text": "Un equipo de investigación de aprendizaje automático (ML) desarrolla modelos de ML personalizados. Los artefactos del modelo se comparten con otros equipos para su integración en productos y servicios. El equipo de ML conserva el código de entrenamiento y los datos del modelo. El equipo de ML desea crear un mecanismo para auditar los modelos. ¿Qué solución debería utilizar el equipo de ML al publicar los modelos de ML personalizados?", "options": ["Cree documentos con la información pertinente. Almacene los documentos en Amazon S3.", "Utilice las tarjetas de servicio de IA de AWS para mayor transparencia y comprensión de los modelos.", "Cree tarjetas de modelo de Amazon SageMaker con los usos previstos y los detalles de entrenamiento e inferencia.", "Crear scripts de entrenamiento del modelo. Confirmar los scripts de entrenamiento del modelo en un repositorio Git."], "correct": [2], "multi": false, "explanation": "Las Model Cards de SageMaker son documentos estructurados que capturan información esencial del modelo (propósito, rendimiento, limitaciones) de forma estándar para auditoría."}, {"id": 92, "text": "Una empresa de software desarrolla herramientas para sus clientes. La empresa desea utilizar inteligencia artificial para aumentar la productividad en el desarrollo de software. ¿Qué solución cumplirá con estos requisitos?", "options": ["Utilice un modelo de clasificación binaria para generar revisiones de código.", "Instalar software de recomendación de código en las herramientas para desarrolladores de la empresa.", "Instale una herramienta de predicción de código para anticipar posibles problemas de código.", "Utilice una herramienta de procesamiento del lenguaje natural (PLN) para generar código."], "correct": [1], "multi": false, "explanation": "Un software de recomendación de código (como Amazon CodeWhisperer/Q Developer) integrado en las herramientas del desarrollador aumenta la productividad directamente en el flujo de trabajo."}, {"id": 93, "text": "Una tienda minorista quiere predecir la demanda de un producto específico para las próximas semanas utilizando el algoritmo de pronóstico DeepAR de Amazon SageMaker. ¿Qué tipo de datos cumplirá con este requisito?", "options": ["Datos de texto", "Datos de imagen", "Datos de series temporales", "Datos binarios"], "correct": [2], "multi": false, "explanation": "DeepAR es un algoritmo de pronóstico de series temporales — requiere datos históricos con marca de tiempo (como ventas diarias) para predecir valores futuros."}, {"id": 94, "text": "Un importante banco minorista desea desarrollar un sistema de aprendizaje automático (ML) para ayudar al equipo de gestión de riesgos a decidir la asignación de préstamos a diferentes grupos demográficos. ¿Qué debe hacer el banco para desarrollar un modelo de ML imparcial?", "options": ["Reduzca el tamaño del conjunto de datos de entrenamiento.", "Asegúrese de que las predicciones del modelo de aprendizaje automático sean coherentes con los resultados históricos.", "Cree un modelo de aprendizaje automático diferente para cada grupo demográfico.", "Medir el desequilibrio de clases en el conjunto de datos de entrenamiento. Adaptar el proceso de entrenamiento en consecuencia."], "correct": [3], "multi": false, "explanation": "Medir el desequilibrio de clases e identificar sesgos en los datos es el primer paso para desarrollar modelos de ML justos en decisiones de alto impacto como préstamos."}, {"id": 95, "text": "¿Qué técnica de aviso puede proteger contra los ataques de inyección de avisos?", "options": ["Adversarial prompting", "Zero-shot prompting", "Least-to-most prompting", "Chain-of-thought prompting"], "correct": [0], "multi": false, "explanation": "La incitación adversarial (adversarial prompting) prueba el sistema con inputs diseñados para explotar vulnerabilidades, ayudando a identificar y mitigar ataques de inyección antes de producción."}, {"id": 96, "text": "Una empresa ha optimizado un modelo de lenguaje natural (LLM) de gran tamaño para responder preguntas de su servicio de asistencia técnica. La empresa desea determinar si esta optimización ha mejorado la precisión del modelo. ¿Qué métrica debería utilizar para la evaluación?", "options": ["Precisión", "Tiempo hasta el primer token", "Puntuación F1", "Tasa de error de palabras"], "correct": [2], "multi": false, "explanation": "La puntuación F1 combina precisión y recall, siendo ideal para evaluar modelos de QA donde tanto los falsos positivos como los falsos negativos son importantes."}, {"id": 97, "text": "Una empresa utiliza la Retrieval Augmented Generation (RAG) (RAG) con Amazon Bedrock y Stable Diffusion para generar imágenes de productos a partir de descripciones de texto. Los resultados suelen ser aleatorios y carecen de detalles específicos. La empresa desea aumentar la especificidad de las imágenes generadas. ¿Qué solución cumple con estos requisitos?", "options": ["Aumentar el número de pasos de generación.", "Utilice la opción de origen de máscara MASK_IMAGE_BLACK.", "Aumentar la Classifier-Free Guidance (CFG) (CFG).", "Aumentar la fuerza del aviso."], "correct": [2], "multi": false, "explanation": "La escala CFG (Classifier-Free Guidance) controla qué tan fielmente el modelo sigue el prompt. Aumentarla produce imágenes más específicas y fieles a la descripción."}, {"id": 98, "text": "Una empresa desea implementar un chatbot basado en un modelo de lenguaje natural (LLM) para brindar a sus agentes de atención al cliente respuestas contextuales en tiempo real a las consultas de los clientes. La empresa utilizará sus propias políticas como base de conocimiento. ¿Qué solución cumplirá con estos requisitos de la manera más rentable?", "options": ["Reentrenar el modelo LLM con los datos de la política de la empresa.", "Ajustar el modelo LLM con los datos de la política de la empresa.", "Implementar la Retrieval Augmented Generation (RAG) (RAG) para respuestas en contexto.", "Utilizar el preentrenamiento y el Data augmentation en los datos de la política de la empresa."], "correct": [2], "multi": false, "explanation": "RAG es la forma más rentable de incorporar conocimiento específico — recupera el contexto relevante de las políticas en tiempo real sin necesidad de reentrenar el modelo."}, {"id": 99, "text": "Una empresa desea crear una nueva solución utilizando AWS Glue. La empresa tiene poca experiencia en programación con AWS Glue. ¿Qué servicio de AWS puede ayudar a la empresa a utilizar AWS Glue?", "options": ["Amazon Q Developer", "AWS Config", "Amazon Personalize", "Amazon Comprehend"], "correct": [0], "multi": false, "explanation": "Amazon Q Developer es el asistente de IA para desarrolladores que puede ayudar a escribir código, entender servicios y resolver problemas con AWS Glue y otros servicios."}, {"id": 100, "text": "Una empresa está desarrollando una aplicación móvil de aprendizaje automático que utiliza la cámara del teléfono para diagnosticar y tratar picaduras de insectos. La empresa quiere entrenar un modelo de clasificación de imágenes con un conjunto de datos diverso de fotos de picaduras de insectos de diferentes géneros, etnias y ubicaciones geográficas de todo el mundo. ¿Qué principio de IA responsable demuestra la empresa en este caso?", "options": ["Equidad", "Explicabilidad", "Gobernanza", "Transparencia"], "correct": [0], "multi": false, "explanation": "La equidad (fairness) en IA requiere que los modelos funcionen bien para todos los grupos demográficos. Usar datos diversos asegura que el modelo sea equitativo para todos los usuarios."}, {"id": 101, "text": "Una empresa está desarrollando un modelo de aprendizaje automático para la aprobación de préstamos. Debe implementar una solución para detectar sesgos en el modelo y explicar sus predicciones. ¿Qué solución cumple con estos requisitos?", "options": ["Amazon SageMaker Clarify", "Amazon SageMaker Data Wrangler", "Tarjetas de servicio de IA de AWS"], "correct": [0], "multi": false, "explanation": "SageMaker Clarify está diseñado específicamente para detectar sesgos en datos y modelos, y para generar explicaciones de las predicciones del modelo."}, {"id": 102, "text": "Una empresa ha desarrollado un modelo generativo de resumen de texto utilizando Amazon Bedrock. La empresa utilizará las capacidades de evaluación automática de modelos de Amazon Bedrock. ¿Qué métrica debería usar la empresa para evaluar la precisión del modelo?", "options": ["Puntuación del AUC-ROC (AUC)", "F1", "Puntuación BERTScore", "Puntuación de conocimientos del mundo real (RWK)."], "correct": [2], "multi": false, "explanation": "BERTScore evalúa la similitud semántica entre el texto generado y la referencia usando representaciones contextuales de BERT, ideal para tareas de resumen."}, {"id": 103, "text": "Un profesional de la IA desea predecir la clasificación de las flores basándose en la longitud y el ancho de los pétalos, así como en la longitud y el ancho de los sépalos. ¿Qué algoritmo cumple con estos requisitos?", "options": ["K vecinos más cercanos (k-NN)", "K-media", "Modelo autorregresivo integrado de media móvil (ARIMA)", "Regresión lineal"], "correct": [0], "multi": false, "explanation": "K-NN clasifica nuevas muestras basándose en la similitud con los ejemplos de entrenamiento más cercanos, siendo ideal para clasificación multiclase como tipos de flores."}, {"id": 104, "text": "Una empresa utiliza modelos personalizados en Amazon Bedrock para una aplicación de IA generativa. La empresa desea usar una clave de cifrado administrada por la empresa para cifrar los artefactos del modelo que generan los trabajos de personalización del modelo. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["AWS Key Management Service (KMS) (AWS KMS)", "Amazon Inspector", "Amazon Macie", "AWS Secrets Manager"], "correct": [0], "multi": false, "explanation": "AWS KMS permite crear y gestionar claves de cifrado propias para proteger datos en servicios de AWS, incluyendo los artefactos de modelos en Amazon Bedrock."}, {"id": 105, "text": "Una empresa quiere utilizar modelos de lenguaje grandes (LLM, por sus siglas en inglés) para generar código a partir de comentarios de código en lenguaje natural. ¿Qué característica de los LLM cumple con estos requisitos?", "options": ["Resumen de texto", "Generación de texto", "Completar el texto", "Clasificación de texto"], "correct": [1], "multi": false, "explanation": "La generación de texto es la capacidad fundamental de los LLMs para crear nuevo contenido — incluyendo código — a partir de instrucciones en lenguaje natural."}, {"id": 106, "text": "Una empresa está lanzando una aplicación móvil que ayuda a los usuarios a aprender idiomas extranjeros. La aplicación mejora la coherencia del texto mediante un modelo de lenguaje extenso (LLM). La empresa recopiló un conjunto de datos diverso de texto y lo complementó con ejemplos de versiones más legibles. La empresa desea que el resultado del LLM se asemeje a los ejemplos proporcionados. ¿Qué métrica debería utilizar la empresa para evaluar si el LLM cumple con estos requisitos?", "options": ["Valor de la función de pérdida", "Robustez semántica", "ROUGE Score (ROUGE)", "Latencia de la generación de texto"], "correct": [2], "multi": false, "explanation": "ROUGE mide la superposición entre el texto generado y textos de referencia, evaluando qué tan similar es el output del modelo a los ejemplos deseados."}, {"id": 107, "text": "Una empresa observa que su modelo base (FM) genera imágenes que no guardan relación con las indicaciones. La empresa desea modificar las técnicas de generación de indicaciones para reducir la cantidad de imágenes irrelevantes. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice indicaciones de disparo cero.", "Utilice indicaciones negativas.", "Utilice indicaciones positivas.", "Utilice indicaciones ambiguas."], "correct": [1], "multi": false, "explanation": "Las indicaciones negativas especifican explícitamente qué NO debe aparecer en la imagen generada, ayudando al modelo a evitar elementos irrelevantes o no deseados."}, {"id": 108, "text": "Una empresa desea utilizar un modelo de lenguaje extenso (LLM, por sus siglas en inglés) para generar descripciones concisas y específicas de las características de sus productos. ¿Qué técnica de ingeniería de indicaciones cumple con estos requisitos?", "options": ["Crea una pregunta que abarque todos los productos. Edita las respuestas para que sean más específicas, concisas y adaptadas a cada producto.", "Cree indicaciones para cada categoría de producto que resalten las características clave. Incluya el formato de salida y la longitud deseados para cada respuesta.", "Incluya una amplia gama de características del producto en cada indicación para generar descripciones creativas y únicas.", "Proporcione indicaciones detalladas y específicas del producto para garantizar descripciones precisas y personalizadas."], "correct": [1], "multi": false, "explanation": "Crear indicaciones estructuradas por categoría con formato definido y características clave produce descripciones consistentes, concisas y específicas para cada tipo de producto."}, {"id": 109, "text": "Una empresa está desarrollando un modelo de aprendizaje automático para predecir la deserción de clientes. El modelo funciona bien con el conjunto de datos de entrenamiento, pero no predice con precisión la deserción con datos nuevos. ¿Qué solución resolverá este problema?", "options": ["Disminuya el parámetro de regularización para aumentar la complejidad del modelo.", "Aumentar el parámetro de regularización para disminuir la complejidad del modelo.", "Agregar más características a los datos de entrada.", "Entrenar el modelo durante más épocas."], "correct": [1], "multi": false, "explanation": "El problema es Overfitting (overfitting). Aumentar la regularización penaliza la complejidad del modelo, forzándolo a generalizar mejor con datos nuevos."}, {"id": 110, "text": "Una empresa está implementando agentes inteligentes para ofrecer experiencias de búsqueda conversacional a sus clientes. Necesita un servicio de base de datos que permita almacenar y consultar los vectores generados por un modelo de IA generativa. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Athena", "Amazon Aurora PostgreSQL", "Amazon Redshift", "Amazon HealthLake"], "correct": [1], "multi": false, "explanation": "Amazon Aurora PostgreSQL soporta la extensión pgvector que permite almacenar y consultar embeddings vectoriales, siendo una solución robusta para bases de datos vectoriales."}, {"id": 111, "text": "Una institución financiera está desarrollando una solución de IA para la aprobación de préstamos mediante un modelo fundamental (MF). Por motivos de seguridad y auditoría, la empresa necesita que las decisiones de la solución de IA sean explicables. ¿Qué factor influye en la explicabilidad de dichas decisiones?", "options": ["Complejidad del modelo", "Tiempo de entrenamiento", "Número de hiperparámetros", "Tiempo de despliegue"], "correct": [0], "multi": false, "explanation": "La complejidad del modelo afecta directamente su explicabilidad — los modelos simples (regresión logística, árboles de decisión) son más interpretables que los modelos complejos (redes neuronales profundas)."}, {"id": 112, "text": "Una empresa farmacéutica desea analizar las opiniones de los usuarios sobre nuevos medicamentos y ofrecer una descripción concisa de cada uno. ¿Qué solución cumple con estos requisitos?", "options": ["Cree un modelo de pronóstico de series temporales para analizar las reseñas de medicamentos utilizando Amazon Personalize.", "Cree resúmenes de revisión de medicamentos utilizando los modelos de lenguaje grandes (LLM) de Amazon Bedrock.", "Cree un modelo de clasificación que categorice los medicamentos en diferentes grupos utilizando Amazon SageMaker.", "Cree resúmenes de revisión de medicamentos utilizando Amazon Rekognition."], "correct": [1], "multi": false, "explanation": "Los LLMs de Amazon Bedrock pueden analizar texto y generar resúmenes concisos de las reseñas de medicamentos, siendo la solución más directa para este caso de uso."}, {"id": 113, "text": "Una empresa desea desarrollar una aplicación de priorización de clientes potenciales para que sus empleados contacten a clientes potenciales. La aplicación debe permitir a los empleados visualizar y ajustar las ponderaciones asignadas a las diferentes variables del modelo según su conocimiento y experiencia en el sector. ¿Qué tipo de modelo de aprendizaje automático cumple con estos requisitos?", "options": ["Modelo de regresión logística", "Modelo de aprendizaje profundo construido sobre componentes principales", "Modelo de k vecinos más cercanos (k-NN)", "Red neuronal"], "correct": [0], "multi": false, "explanation": "La regresión logística es un modelo interpretable donde los coeficientes representan el peso de cada variable, permitiendo a los usuarios entender y ajustar la influencia de cada factor."}, {"id": 114, "text": "Una empresa desea desarrollar una aplicación de aprendizaje automático (ML). Seleccione y ordene los pasos correctos de la siguiente lista para crear una carga de trabajo de ML bien estructurada. Cada paso debe seleccionarse una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Definir objetivo de negocio → Desarrollar modelo → Desplegar modelo → Monitorear modelo", "Desarrollar modelo → Definir objetivo → Desplegar modelo → Monitorear modelo", "Monitorear modelo → Definir objetivo → Desarrollar modelo → Desplegar modelo", "Desplegar modelo → Monitorear modelo → Definir objetivo → Desarrollar modelo"], "correct": [0], "multi": false, "explanation": "El ciclo de vida del ML siempre comienza definiendo el objetivo de negocio, luego desarrollando el modelo, desplegándolo en producción, y finalmente monitoreando su rendimiento."}, {"id": 115, "text": "¿Qué estrategia determinará si un modelo de base (FM) cumple eficazmente con los objetivos empresariales?", "options": ["Evaluar el rendimiento del modelo en conjuntos de datos de referencia.", "Analizar la arquitectura y los hiperparámetros del modelo.", "Evaluar la adecuación del modelo a casos de uso específicos.", "Medir los recursos computacionales necesarios para la implementación del modelo."], "correct": [2], "multi": false, "explanation": "La adecuación a casos de uso específicos (task-specific evaluation) mide si el modelo realmente cumple los objetivos empresariales reales, no solo métricas genéricas de benchmark."}, {"id": 116, "text": "Una empresa necesita entrenar un modelo de aprendizaje automático para clasificar imágenes de diferentes tipos de animales. La empresa cuenta con un gran conjunto de datos de imágenes etiquetadas y no etiquetará más datos. ¿Qué tipo de aprendizaje debería utilizar la empresa para entrenar el modelo?", "options": ["Aprendizaje supervisado", "Aprendizaje no supervisado", "Aprendizaje por refuerzo", "Active learning"], "correct": [0], "multi": false, "explanation": "El aprendizaje supervisado requiere datos etiquetados — exactamente lo que la empresa tiene. Es el enfoque estándar para clasificación de imágenes con categorías definidas."}, {"id": 117, "text": "¿Qué fase del ciclo de vida del aprendizaje automático determina el cumplimiento de los requisitos normativos?", "options": ["Feature engineering", "Entrenamiento del modelo", "Recopilación de datos", "Identificación de objetivos empresariales"], "correct": [3], "multi": false, "explanation": "Durante la identificación de objetivos empresariales se deben considerar los requisitos normativos desde el inicio, ya que afectan el diseño completo de la solución de ML."}, {"id": 118, "text": "Una empresa de servicios de alimentación desea desarrollar un modelo de aprendizaje automático para reducir el desperdicio diario de alimentos y aumentar sus ingresos por ventas. La empresa necesita mejorar continuamente la precisión del modelo. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon SageMaker y realice iteraciones con datos más recientes.", "Utilice Amazon Personalize y realice iteraciones con datos históricos.", "Utilice Amazon CloudWatch para analizar los pedidos de los clientes.", "Utilice Amazon Rekognition para optimizar el modelo."], "correct": [0], "multi": false, "explanation": "SageMaker permite reentrenar modelos con datos nuevos de forma iterativa, mejorando continuamente la precisión a medida que se acumulan más datos recientes."}, {"id": 119, "text": "Una empresa ha desarrollado un modelo de aprendizaje automático para predecir los precios de venta de bienes raíces. La empresa desea implementar el modelo para realizar predicciones sin gestionar servidores ni infraestructura. ¿Qué solución cumple con estos requisitos?", "options": ["Implemente el modelo en una instancia de Amazon EC2.", "Implemente el modelo en un clúster de Amazon Elastic Kubernetes Service (Amazon EKS).", "Implemente el modelo utilizando Amazon CloudFront con una integración de Amazon S3.", "Implemente el modelo utilizando un punto final de Amazon SageMaker."], "correct": [0], "multi": false, "explanation": "Los endpoints de Amazon SageMaker son la forma estándar de desplegar modelos en producción, gestionando automáticamente la infraestructura subyacente."}, {"id": 120, "text": "Una empresa desea desarrollar una aplicación de IA para ayudar a sus empleados a revisar las reclamaciones de clientes pendientes, identificar los detalles de una reclamación específica y acceder a la documentación relacionada. ¿Qué solución cumple con estos requisitos?", "options": ["Utilice Amazon Bedrock Agents con Amazon Fraud Detector para crear la aplicación.", "Utilice agentes para Amazon Bedrock con bases de conocimiento de Amazon Bedrock para crear la aplicación.", "Utilice Amazon Personalize con las bases de conocimiento de Amazon Bedrock para crear la aplicación.", "Utilice Amazon SageMaker para crear la aplicación entrenando un nuevo modelo de aprendizaje automático."], "correct": [1], "multi": false, "explanation": "Los Agentes de Bedrock con Bases de Conocimiento permiten a la IA buscar en documentación específica y tomar acciones complejas de múltiples pasos para revisar reclamaciones."}, {"id": 121, "text": "Una empresa manufacturera utiliza IA para inspeccionar productos y detectar daños o defectos. ¿Qué tipo de aplicación de IA utiliza la empresa?", "options": ["Sistema de recomendación", "Procesamiento del lenguaje natural (PLN)", "Visión por computadora", "Procesamiento de imágenes"], "correct": [2], "multi": false, "explanation": "La visión por computadora es la rama de IA que permite a las máquinas interpretar y analizar imágenes y video — perfecta para inspección visual de defectos en manufactura."}, {"id": 122, "text": "Una empresa desea crear un modelo de aprendizaje automático para predecir la satisfacción del cliente. La empresa necesita una optimización del modelo totalmente automatizada. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Personalize", "Amazon SageMaker", "Amazon Athena", "Amazon Comprehend"], "correct": [1], "multi": false, "explanation": "Amazon SageMaker Autopilot automatiza el proceso completo de ML — desde preprocesamiento hasta selección de modelo y Hyperparameter tuning — sin intervención manual."}, {"id": 123, "text": "¿Qué técnica puede utilizar una empresa para reducir el sesgo y la toxicidad en las aplicaciones de IA generativa durante el ciclo de vida del aprendizaje automático posterior al procesamiento?", "options": ["Intervención humana", "Data augmentation", "Feature engineering", "Entrenamiento adversario"], "correct": [0], "multi": false, "explanation": "La intervención humana post-procesamiento (revisión humana de outputs) es la forma más efectiva de filtrar sesgo y toxicidad que el modelo pueda generar en producción."}, {"id": 124, "text": "Un banco ha optimizado un modelo de lenguaje natural (LLM) para agilizar el proceso de aprobación de préstamos. Durante una auditoría externa del modelo, la empresa descubrió que este aprobaba los préstamos con mayor rapidez para un grupo demográfico específico que para otros. ¿ Cuál es la solución más rentable para este problema?", "options": ["Incluya datos de entrenamiento más diversos. Ajuste nuevamente el modelo utilizando los nuevos datos.", "Utilice la Retrieval Augmented Generation (RAG) (RAG) con el modelo ajustado.", "Utilice las comprobaciones de AWS Trusted Advisor para eliminar sesgos.", "Preentrenar un nuevo modelo LLM con datos de entrenamiento más diversos."], "correct": [0], "multi": false, "explanation": "Reentrenar el modelo existente con datos más diversos y representativos es más rentable que crear uno nuevo desde cero, ya que aprovecha el conocimiento ya adquirido."}, {"id": 125, "text": "Una empresa ha desarrollado un modelo de lenguaje extenso (LLM) y desea ponerlo a disposición de varios equipos internos. La empresa necesita seleccionar el modo de inferencia adecuado para cada equipo. Seleccione el modo de inferencia correcto de la siguiente lista para cada caso de uso. Cada modo de inferencia debe seleccionarse una o más veces. si te das cuenta [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Tiempo real → Lotes → Tiempo real", "Asíncrona → Tiempo real → Lotes", "Tiempo real → Lotes → Asíncrona", "Lotes → Tiempo real → Asíncrona"], "correct": [0], "multi": false, "explanation": "Chatbot con latencia mínima = inferencia en tiempo real. Procesar gigabytes en fines de semana = transformación por lotes. API para texto pequeño con baja latencia = inferencia en tiempo real."}, {"id": 126, "text": "Una empresa necesita registrar todas las solicitudes realizadas a su API de Amazon Bedrock. La empresa debe conservar los registros de forma segura durante 5 años al menor coste posible. ¿Qué combinación de servicio de AWS y clase de almacenamiento cumple estos requisitos? (Seleccione dos).", "options": ["AWS CloudTrail", "Amazon CloudWatch", "AWS Audit Manager", "Sistema de niveles inteligentes de Amazon S3.", "Estándar Amazon S3"], "correct": [0, 3], "multi": true, "explanation": "CloudTrail registra todas las llamadas a la API de Bedrock. S3 Intelligent-Tiering mueve automáticamente los datos a clases de menor costo según el patrón de acceso, siendo la opción más rentable para retención a largo plazo."}, {"id": 127, "text": "Una empresa de comercio electrónico desea mejorar las recomendaciones de los motores de búsqueda personalizando los resultados para cada usuario de su plataforma. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Personalize", "Amazon Kendra", "Amazon Rekognition", "Amazon Transcribe"], "correct": [0], "multi": false, "explanation": "Amazon Personalize está diseñado específicamente para crear sistemas de recomendación personalizados en tiempo real basados en el comportamiento individual de cada usuario."}, {"id": 128, "text": "Un hospital está desarrollando un sistema de IA para ayudar a los médicos a diagnosticar enfermedades basándose en historiales clínicos e imágenes médicas. Para cumplir con la normativa, los datos confidenciales de los pacientes no deben salir del país donde se encuentran. ¿Qué estrategia de gobernanza de datos garantizará el cumplimiento y protegerá la privacidad de los pacientes?", "options": ["Residencia de datos", "Calidad de los datos", "Descubrimiento de datos", "Enriquecimiento de datos"], "correct": [0], "multi": false, "explanation": "La residencia de datos garantiza que los datos se almacenen y procesen únicamente en la región o país especificado, cumpliendo con regulaciones de privacidad de datos de salud."}, {"id": 129, "text": "Una empresa necesita supervisar el rendimiento de sus sistemas de aprendizaje automático mediante un servicio de AWS altamente escalable. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon CloudWatch", "AWS CloudTrail", "AWS Trusted Advisor", "AWS Config"], "correct": [0], "multi": false, "explanation": "Amazon CloudWatch es el servicio de monitoreo y observabilidad de AWS, altamente escalable, que permite supervisar métricas de rendimiento de sistemas ML en tiempo real."}, {"id": 130, "text": "Un profesional de IA está desarrollando una instrucción para un modelo Amazon Titan. El modelo está alojado en Amazon Bedrock. El profesional de IA utiliza el modelo para resolver problemas de razonamiento numérico. El profesional de IA añade la siguiente frase al final de la instrucción: «Pídele al modelo que muestre su trabajo explicando su razonamiento paso a paso». ¿Qué técnica de ingeniería de instrucciones está utilizando el profesional de IA?", "options": ["Chain-of-thought prompting", "Prompt injection", "Few-shot prompting", "Plantillas de indicaciones"], "correct": [0], "multi": false, "explanation": "Chain-of-thought prompting pide al modelo que explique su razonamiento paso a paso, mejorando la precisión en problemas complejos y haciendo el proceso más transparente."}, {"id": 131, "text": "¿Qué servicio de AWS pone a disposición modelos base (FM) para ayudar a los usuarios a crear y escalar aplicaciones de IA generativa?", "options": ["Amazon Q Developer", "Amazon Bedrock", "Amazon Kendra", "Amazon Comprehend"], "correct": [1], "multi": false, "explanation": "Amazon Bedrock es el servicio de AWS que proporciona acceso a una amplia variedad de modelos base (FMs) de IA generativa de alto rendimiento para crear aplicaciones."}, {"id": 132, "text": "Una empresa está desarrollando una aplicación móvil para usuarios con discapacidad visual. La aplicación debe poder escuchar lo que dicen los usuarios y proporcionar respuestas de voz. ¿Qué solución cumplirá con estos requisitos?", "options": ["Utilizar una red neuronal de aprendizaje profundo para realizar el reconocimiento de voz.", "Crear modelos de aprendizaje automático para buscar patrones en datos numéricos.", "Utilice la generación de resúmenes mediante IA para generar texto similar al humano.", "Crear modelos personalizados para la clasificación y el reconocimiento de imágenes."], "correct": [0], "multi": false, "explanation": "El reconocimiento de voz mediante redes neuronales profundas (como las usadas en Amazon Transcribe) es la tecnología necesaria para convertir habla en texto y luego generar respuestas de voz."}, {"id": 133, "text": "Una empresa desea mejorar la calidad de respuesta de un modelo de lenguaje extenso (LLM) para tareas complejas de resolución de problemas. Estas tareas requieren un razonamiento detallado y un proceso de explicación paso a paso. ¿Qué técnica de ingeniería de indicaciones cumple con estos requisitos?", "options": ["Few-shot prompting", "Zero-shot prompting", "Directional stimulus prompting", "Chain-of-thought prompting"], "correct": [3], "multi": false, "explanation": "Chain-of-thought prompting guía al modelo para desarrollar un razonamiento explícito y detallado paso a paso, mejorando la calidad en tareas complejas de resolución de problemas."}, {"id": 134, "text": "Una empresa desea mantener actualizado su modelo base (MF) utilizando los datos más recientes. Para ello, quiere implementar una estrategia de entrenamiento del modelo que incluya actualizaciones periódicas del MF. ¿Qué solución cumple con estos requisitos?", "options": ["Aprendizaje por lotes", "Entrenamiento previo continuo", "Entrenamiento estático", "Entrenamiento latente"], "correct": [1], "multi": false, "explanation": "El preentrenamiento continuo (continued pre-training) actualiza el modelo con nuevos datos de forma periódica, manteniendo su conocimiento actualizado sin reentrenamiento completo."}, {"id": 135, "text": "Una empresa desea desarrollar aplicaciones de aprendizaje automático (ML) para mejorar sus operaciones y eficiencia. Seleccione el paradigma de ML adecuado de la siguiente lista para cada caso de uso. Cada paradigma de ML debe seleccionarse una o más veces. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Clasificación binaria = Supervisado, Clasificación multiclase = Supervisado, K-means = No supervisado, Dimensionality reduction = No supervisado", "Clasificación binaria = No supervisado, K-means = Supervisado, Reducción = Supervisado", "Clasificación binaria = Refuerzo, K-means = Supervisado, Reducción = No supervisado", "Todos = Supervisado"], "correct": [0], "multi": false, "explanation": "Clasificación (binaria y multiclase) requiere datos etiquetados = supervisado. K-means agrupa datos sin etiquetas = no supervisado. La Dimensionality reduction transforma datos sin necesitar etiquetas = no supervisado."}, {"id": 136, "text": "¿Cuál de las siguientes opciones es una característica de los marcos de gobernanza de la IA para generar confianza e implementar tecnologías de IA centradas en el ser humano?", "options": ["Ampliar las iniciativas en todas las unidades de negocio para crear valor empresarial a largo plazo.", "Garantizar la alineación con los estándares comerciales, los objetivos de ingresos y las expectativas de las partes interesadas.", "Superar los desafíos para impulsar la transformación y el crecimiento empresarial.", "Desarrollar políticas y directrices para datos, transparencia, IA responsable y cumplimiento"], "correct": [3], "multi": false, "explanation": "Los marcos de gobernanza de IA se basan en políticas claras para el manejo de datos, transparencia en las decisiones, IA responsable y cumplimiento normativo — los pilares para generar confianza."}, {"id": 137, "text": "Una empresa de comercio electrónico utiliza un chatbot de IA generativa para responder a las consultas de los clientes. La empresa quiere medir el impacto financiero del chatbot en sus operaciones. ¿Qué métrica debería utilizar?", "options": ["Número de consultas de clientes atendidas", "Costo del entrenamiento de modelos de IA", "Coste por cada conversación con el cliente", "Tiempo medio de atención (TMA)"], "correct": [2], "multi": false, "explanation": "El costo por conversación es la métrica que directamente mide el impacto financiero operativo del chatbot, comparándolo con el costo de atención humana tradicional."}, {"id": 138, "text": "Una empresa quiere segmentar a sus clientes según sus datos demográficos y patrones de compra. ¿Qué algoritmo debería utilizar para cumplir con este requisito?", "options": ["K vecinos más cercanos (k-NN)", "K-medias", "Árbol de decisión", "Support Vector Machine (SVM)"], "correct": [1], "multi": false, "explanation": "K-medias es el algoritmo de clustering más usado para segmentación de clientes — agrupa automáticamente a los clientes en segmentos basándose en similitudes en sus características."}, {"id": 139, "text": "El modelo lingüístico principal (MLP) de una empresa está experimentando alucinaciones. ¿Cómo puede la empresa reducir estas alucinaciones?", "options": ["Configurar agentes para Amazon Bedrock que supervisen el entrenamiento del modelo.", "Utilice el preprocesamiento de datos y elimine cualquier dato que provoque alucinaciones.", "Disminuir el parámetro de inferencia de temperatura para el modelo.", "Utilice un modelo base (FM) que esté entrenado para no tener alucinaciones."], "correct": [2], "multi": false, "explanation": "Disminuir la temperatura hace que el modelo sea más determinista y conservador, reduciendo las alucinaciones al elegir tokens más probables y evitar generaciones creativas pero incorrectas."}, {"id": 140, "text": "Una empresa utiliza un modelo de lenguaje extenso (LLM) en Amazon Bedrock para crear un chatbot. El chatbot procesa las solicitudes de atención al cliente. Para resolver una solicitud, el cliente y el chatbot deben interactuar varias veces. ¿Qué solución permite que el LLM utilice el contenido de mensajes anteriores del cliente?", "options": ["Active el registro de invocación del modelo para recopilar mensajes.", "Agregue mensajes al mensaje del modelo.", "Utilice Amazon Personalize para guardar el historial de conversaciones.", "Utilice el rendimiento aprovisionado para el LLM."], "correct": [1], "multi": false, "explanation": "Incluir el historial de mensajes anteriores en el contexto del prompt permite al LLM mantener el contexto de la conversación multi-turno sin necesidad de servicios adicionales."}, {"id": 141, "text": "Los empleados de una empresa ofrecen descripciones de productos y recomendaciones a los clientes cuando estos llaman al centro de atención al cliente. Estas recomendaciones se basan en la ubicación de los clientes. La empresa desea utilizar modelos de base (FM) para automatizar este proceso. ¿Qué servicio de AWS cumple con estos requisitos?", "options": ["Amazon Macie", "Amazon Transcribe", "Amazon Bedrock", "Amazon Textract"], "correct": [2], "multi": false, "explanation": "Amazon Bedrock proporciona acceso a FMs que pueden generar descripciones y recomendaciones de productos contextualizadas, automatizando el proceso de atención al cliente."}, {"id": 142, "text": "Una empresa desea subir correos electrónicos de atención al cliente a Amazon S3 para desarrollar una aplicación de análisis de negocio. Estos mensajes a veces contienen datos confidenciales. La empresa quiere recibir una alerta cada vez que se detecte información confidencial. ¿Qué solución automatiza completamente el proceso de detección de información confidencial con el mínimo esfuerzo de desarrollo?", "options": ["Configure Amazon Macie para que detecte información confidencial en los documentos que se cargan en Amazon S3.", "Utilice los puntos de conexión de Amazon SageMaker para implementar un modelo de lenguaje extenso (LLM) para censurar datos confidenciales.", "Desarrollar múltiples patrones de expresiones regulares para detectar datos confidenciales. Mostrar los patrones de expresiones regulares en un cuaderno de Amazon SageMaker.", "Pida a los clientes que eviten compartir información confidencial en sus mensajes de correo electrónico."], "correct": [0], "multi": false, "explanation": "Amazon Macie usa ML para detectar automáticamente datos confidenciales (PII, financieros, etc.) en S3 y genera alertas, requiriendo mínima configuración y sin desarrollo personalizado."}, {"id": 143, "text": "Una empresa está capacitando a sus empleados sobre cómo estructurar las indicaciones para los modelos de cimentación. Seleccione la técnica de ingeniería de indicaciones correcta de la siguiente lista para cada plantilla de indicación. Cada técnica de ingeniería de indicaciones debe seleccionarse una sola vez. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["'Clasifica el texto como deportes/política/entretenimiento' = Zero-shot; '[imagen 1, 2, 3] son ejemplos, clasifica esta imagen' = Few-shot; 'Piensa paso a paso' = Chain-of-thought", "'Clasifica el texto' = Few-shot; '[imágenes ejemplos]' = Zero-shot; 'Paso a paso' = Chain-of-thought", "Todos son Zero-shot", "Todos son Chain-of-thought"], "correct": [0], "multi": false, "explanation": "Zero-shot = sin ejemplos, solo instrucción. Few-shot = con ejemplos de la tarea. Chain-of-thought = pide razonamiento paso a paso. Cada técnica tiene un propósito diferente."}, {"id": 144, "text": "Una empresa utiliza un modelo de IA generativa para desarrollar un asistente digital. Las respuestas del modelo a veces incluyen contenido indeseable y potencialmente dañino. Seleccione la política de filtrado de Amazon Bedrock correcta de la siguiente lista para cada acción de mitigación. Cada política de filtrado debe seleccionarse una sola vez. La imagen, que pertenece a la pregunta 144. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Bloquear contenido dañino = Filtros de contenido; Evitar temas ilegales = Temas denegados; Términos ofensivos = Filtros de palabras; Info no fundamentada = Verificación contextual", "Bloquear contenido = Temas denegados; Temas ilegales = Filtros de contenido; Términos = Verificación contextual", "Todos son Filtros de contenido", "Bloquear = Verificación contextual; Temas = Filtros de palabras"], "correct": [0], "multi": false, "explanation": "Filtros de contenido = odio/violencia. Temas denegados = áreas específicas como asesoría legal. Filtros de palabras = términos específicos. Verificación contextual = información no fundamentada en la fuente."}, {"id": 145, "text": "¿Qué opción supone una ventaja al utilizar las tarjetas de modelos de Amazon SageMaker para documentar modelos de IA?", "options": ["Proporcionar un resumen visualmente atractivo de las capacidades de un modo.", "Estandarizar la información sobre el propósito, el rendimiento y las limitaciones de un modelo.", "Reducir los requisitos computacionales generales de un modelo.", "Almacenamiento físico de modelos con fines de archivo."], "correct": [1], "multi": false, "explanation": "Las Model Cards estandarizan la documentación de modelos de ML, proporcionando un formato consistente para describir propósito, rendimiento, limitaciones y consideraciones éticas."}, {"id": 146, "text": "¿Qué mide una puntuación F1 en el contexto del rendimiento del modelo fundamental (FM)?", "options": ["Precisión y exhaustividad del modelo", "Velocidad del modelo en la generación de respuestas", "Costo financiero de operar el modelo", "Eficiencia energética de los cálculos del modelo"], "correct": [0], "multi": false, "explanation": "La puntuación F1 es la media armónica de precisión (precision) y exhaustividad (recall), proporcionando un balance entre ambas métricas para evaluar el rendimiento del modelo."}, {"id": 147, "text": "Una empresa implementó una solución de IA/aprendizaje automático para ayudar a sus agentes de atención al cliente a responder preguntas frecuentes. Estas preguntas pueden cambiar con el tiempo. La empresa desea que los agentes puedan formular preguntas y recibir respuestas generadas automáticamente a las preguntas más comunes de los clientes. ¿Qué estrategia cumplirá con estos requisitos de la manera más rentable?", "options": ["Ajustar el modelo periódicamente.", "Entrene el modelo utilizando datos de contexto.", "Preentrenar y evaluar el modelo utilizando datos de contexto.", "Utilice la Retrieval Augmented Generation (RAG) (RAG) con técnicas de ingeniería rápida."], "correct": [3], "multi": false, "explanation": "RAG con ingeniería de prompts es la opción más rentable para FAQs que cambian frecuentemente — solo se actualiza la base de conocimiento sin necesidad de reentrenar el modelo."}, {"id": 148, "text": "Una empresa desarrolló un sistema de selección de currículos basado en inteligencia artificial. Para entrenar el modelo, utilizó un amplio conjunto de datos que no representaba a todos los grupos demográficos. ¿Qué dimensión fundamental de la IA responsable se observa en este caso?", "options": ["Equidad", "Explicabilidad", "Privacidad y seguridad", "Transparencia"], "correct": [0], "multi": false, "explanation": "La equidad (fairness) en IA requiere que los sistemas funcionen bien para todos los grupos. Datos no representativos generan modelos sesgados que discriminan injustamente."}, {"id": 149, "text": "Una empresa financiera global ha desarrollado una aplicación de aprendizaje automático para analizar datos del mercado bursátil y proporcionar tendencias. La empresa desea supervisar continuamente las fases de desarrollo de la aplicación y garantizar el cumplimiento de sus políticas y las regulaciones del sector. ¿Qué servicios de AWS ayudarán a la empresa a evaluar los requisitos de cumplimiento? (Seleccione dos).", "options": ["AWS Audit Manager", "AWS Config", "Amazon Inspector", "Amazon CloudWatch", "AWS CloudTrail"], "correct": [0, 1], "multi": true, "explanation": "AWS Audit Manager automatiza la recopilación de evidencia para auditorías de cumplimiento. AWS Config registra y evalúa las configuraciones de recursos contra reglas de cumplimiento definidas."}, {"id": 150, "text": "Una empresa desea mejorar la precisión de las respuestas de una aplicación de IA generativa. La aplicación utiliza un modelo base (FM) en Amazon Bedrock. ¿Qué solución cumple con estos requisitos de la manera más rentable?", "options": ["Ajustar la FM.", "Recapacitar al FM.", "Capacitar a un nuevo FM.", "Utilice ingeniería rápida."], "correct": [3], "multi": false, "explanation": "La ingeniería de prompts es la forma más económica de mejorar la precisión — no requiere reentrenamiento ni infraestructura adicional, solo refinamiento de las instrucciones al modelo."}, {"id": 151, "text": "Una empresa quiere identificar lenguaje ofensivo en la sección de comentarios de publicaciones en redes sociales mediante un modelo de aprendizaje automático. La empresa no utilizará datos etiquetados para entrenar el modelo. ¿Qué estrategia debería emplear para identificar el lenguaje ofensivo?", "options": ["Utilice la moderación de Amazon Rekognition.", "Utilice la herramienta de detección de toxicidad Amazon Comprehend.", "Utilice los algoritmos integrados de Amazon SageMaker para entrenar el modelo.", "Utilice Amazon Polly para supervisar los comentarios."], "correct": [1], "multi": false, "explanation": "Amazon Comprehend tiene capacidades preentrenadas de detección de toxicidad que funcionan sin datos etiquetados propios, siendo la solución más directa para este caso."}, {"id": 152, "text": "Una empresa de medios quiere analizar el comportamiento y la demografía de los espectadores para recomendar contenido personalizado. La empresa desea implementar un modelo de aprendizaje automático personalizado en su entorno de producción. Además, quiere observar si la calidad del modelo varía con el tiempo. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon Rekognition", "Amazon SageMaker Clarify", "Amazon Comprehend"], "correct": [0], "multi": false, "explanation": "SageMaker Model Monitor detecta automáticamente la degradación del rendimiento del modelo y el data drift en producción, alertando cuando la calidad varía con el tiempo."}, {"id": 153, "text": "Una empresa está implementando modelos de IA/ML mediante los servicios de AWS. La empresa desea ofrecer transparencia en los procesos de toma de decisiones de los modelos y proporcionar explicaciones sobre sus resultados. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker Model Cards", "Amazon Rekognition", "Amazon Comprehend", "Amazon Lex"], "correct": [0], "multi": false, "explanation": "Las Model Cards de SageMaker documentan el propósito, rendimiento y limitaciones del modelo, proporcionando transparencia sobre cómo toma decisiones para usuarios y partes interesadas."}, {"id": 154, "text": "Una empresa manufacturera quiere crear descripciones de productos en varios idiomas. ¿Qué servicio de AWS automatizará esta tarea?", "options": ["Amazon Translate", "Amazon Transcribe", "Amazon Kendra", "Amazon Polly"], "correct": [0], "multi": false, "explanation": "Amazon Translate es el servicio de traducción automática de AWS que convierte texto entre idiomas de forma automática, ideal para crear descripciones multilingüe de productos."}, {"id": 155, "text": "Una empresa busca respuestas más personalizadas a las preguntas de sus modelos de IA generativa. Seleccione la metodología de personalización correcta de la siguiente lista para cada caso de uso. Cada caso de uso debe seleccionarse una sola vez. La imagen pertenece a la pregunta 155. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Enseñar nueva tarea específica = Fine-tuning; Pocos datos etiquetados, necesita más = Data augmentation; Solo datos sin etiquetar = Continued pre-training", "Fine-tuning para todo tipo de datos", "Continued pre-training para datos etiquetados", "RAG para todos los casos"], "correct": [0], "multi": false, "explanation": "Fine-tuning = datos etiquetados para tarea específica. Data augmentation = cuando hay pocos datos, se generan más. Continued pre-training = datos sin etiquetar para conocimiento de dominio general."}, {"id": 156, "text": "¿Qué función de AWS registra detalles sobre los datos de las instancias de aprendizaje automático para fines de gobernanza e informes?", "options": ["Amazon SageMaker Model Cards", "Amazon SageMaker Debugger", "Amazon SageMaker Model Monitor", "Amazon SageMaker JumpStart"], "correct": [0], "multi": false, "explanation": "Las Model Cards de SageMaker registran información detallada sobre el modelo (datos usados, métricas, limitaciones) para propósitos de gobernanza, auditoría e informes."}, {"id": 157, "text": "Una empresa financiera está utilizando el aprendizaje automático para ayudar con algunas de las tareas de la empresa. ¿Cuál de las siguientes opciones representa un uso de modelos de IA generativa?", "options": ["Resumen de las quejas de los clientes", "Clasificación de los clientes en función del uso del producto", "Segmentación de clientes en función del tipo de inversión", "Previsión de ingresos para determinados productos"], "correct": [0], "multi": false, "explanation": "El resumen de texto es una capacidad fundamental de la IA generativa (LLMs). Las otras opciones son casos de uso de ML tradicional (clasificación, segmentación, forecasting)."}, {"id": 158, "text": "Una empresa médica desea desarrollar una aplicación de IA que pueda acceder a historiales clínicos estructurados, extraer información relevante y generar resúmenes concisos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Utilice Amazon Comprehend Medical para extraer entidades y relaciones médicas relevantes. Aplique lógica basada en reglas para estructurar y formatear los resúmenes.", "Utilice Amazon Personalize para analizar los patrones de interacción de los pacientes. Integre los resultados con una herramienta de resumen de texto de uso general.", "Utilice Amazon Textract para convertir documentos escaneados en texto digital. Diseñe un sistema de extracción de palabras clave para generar resúmenes.", "Implementar Amazon Kendra para proporcionar un índice de búsqueda para los registros médicos. Utilizar un sistema basado en plantillas para formatear los resúmenes."], "correct": [0], "multi": false, "explanation": "Amazon Comprehend Medical extrae entidades médicas específicas (diagnósticos, medicamentos, síntomas) de historiales clínicos, siendo la herramienta más adecuada para este dominio."}, {"id": 159, "text": "¿Qué opción describe las incrustaciones en el contexto de la IA?", "options": ["Un método para comprimir grandes conjuntos de datos", "Un método de cifrado para proteger datos confidenciales", "Un método para visualizar datos de alta dimensión", "Un método numérico para la representación de datos en un espacio de dimensionalidad reducida."], "correct": [3], "multi": false, "explanation": "Las incrustaciones convierten datos de alta dimensionalidad (como palabras) en vectores numéricos de dimensionalidad reducida que capturan relaciones semánticas y son procesables por modelos de IA."}, {"id": 160, "text": "Una empresa está desarrollando una aplicación de IA para resumir libros de distinta extensión. Durante las pruebas, la aplicación no logra resumir algunos libros. ¿Por qué falla la aplicación en algunos casos?", "options": ["La temperatura está configurada demasiado alta.", "El modelo seleccionado no admite ajustes finos.", "El valor P superior es demasiado alto.", "Los tokens de entrada exceden el tamaño del contexto del modelo."], "correct": [3], "multi": false, "explanation": "Cada modelo tiene un límite de ventana de contexto (número máximo de tokens). Los libros más largos superan ese límite, causando que el modelo no pueda procesar toda la información."}, {"id": 161, "text": "Una aerolínea quiere crear un asistente de IA conversacional para responder las preguntas de los clientes sobre horarios de vuelos, reservas y pagos. La compañía desea utilizar modelos de lenguaje a gran escala (LLM) y una base de conocimiento para crear una interfaz de chatbot basada en texto. ¿Qué solución cumplirá con estos requisitos con el MENOR esfuerzo de desarrollo?", "options": ["Modelos de entrenamiento en Amazon SageMaker Autopilot.", "Desarrollar un agente de Retrieval Augmented Generation (RAG) (RAG) utilizando Amazon Bedrock.", "Crea una aplicación Python usando Amazon Q Developer.", "Ajuste los modelos en Amazon SageMaker Jumpstart."], "correct": [1], "multi": false, "explanation": "Bedrock Agents con bases de conocimiento implementa RAG de forma integrada, permitiendo crear chatbots conversacionales con mínimo esfuerzo de desarrollo sin gestionar infraestructura."}, {"id": 162, "text": "¿Para qué se utiliza la tokenización en el procesamiento del lenguaje natural (PLN)?", "options": ["Para cifrar datos de texto", "Para comprimir archivos de texto", "Dividir el texto en unidades más pequeñas para su procesamiento.", "Traducir texto entre idiomas"], "correct": [2], "multi": false, "explanation": "La tokenización divide el texto en unidades procesables (tokens) que pueden ser palabras, subpalabras o caracteres. Es el primer paso del procesamiento de texto en NLP."}, {"id": 163, "text": "¿Cuál de las siguientes opciones es una característica de los modelos de lenguaje basados en transformadores?", "options": ["Los modelos de lenguaje basados en transformadores utilizan capas convolucionales para aplicar filtros a través de una entrada y capturar patrones locales mediante vistas filtradas.", "Los modelos de lenguaje basados en transformadores solo pueden procesar datos de texto.", "Los modelos de lenguaje basados en transformadores utilizan mecanismos de autoatención para capturar relaciones contextuales.", "Los modelos de lenguaje basados en transformadores procesan secuencias de datos elemento por elemento en iteraciones cíclicas."], "correct": [2], "multi": false, "explanation": "El mecanismo de autoatención (self-attention) es la característica definitoria de los transformadores — permite al modelo entender las relaciones contextuales entre todas las palabras de una secuencia simultáneamente."}, {"id": 164, "text": "Una empresa financiera utiliza sistemas de IA para obtener la calificación crediticia de sus clientes como parte del proceso de solicitud de préstamos. La empresa desea expandirse a un nuevo mercado en una zona geográfica diferente. Debe asegurarse de poder operar en dicha zona. ¿Qué leyes de cumplimiento normativo debería revisar la empresa?", "options": ["Leyes locales de protección de datos sanitarios", "Leyes locales de protección de datos de tarjetas de pago", "Leyes locales de privacidad en materia de educación", "Leyes locales de responsabilidad sobre algoritmos"], "correct": [3], "multi": false, "explanation": "Las leyes de responsabilidad sobre algoritmos regulan el uso de IA en decisiones automatizadas que afectan a personas (como crédito). Son las más relevantes para sistemas de calificación crediticia."}, {"id": 165, "text": "Una empresa utiliza Amazon Bedrock para su aplicación de IA generativa. La empresa desea usar Amazon Bedrock Guardrails para detectar y filtrar entradas de usuario y salidas generadas por el modelo que sean perjudiciales. ¿Qué categorías de contenido puede filtrar Guardrails? (Seleccione dos).", "options": ["Odio", "Política", "Violencia", "Juegos de azar", "Religión"], "correct": [0, 2], "multi": true, "explanation": "Amazon Bedrock Guardrails filtra categorías de contenido dañino incluyendo odio (hate speech) y violencia. La política, los juegos de azar y la religión no son categorías predefinidas de filtrado de Guardrails."}, {"id": 166, "text": "¿Qué escenario describe un riesgo potencial y una limitación de la ingeniería rápida en el contexto de un modelo de IA generativa?", "options": ["La ingeniería rápida no garantiza que el modelo siempre produzca resultados consistentes y deterministas, eliminando la necesidad de validación.", "La ingeniería rápida podría exponer el modelo a vulnerabilidades como ataques de inyección rápida.", "Las indicaciones diseñadas correctamente reducen, pero no eliminan, el riesgo de contaminación de datos o secuestro de modelos.", "La ingeniería rápida no garantiza que el modelo genere resultados altamente confiables de manera consistente cuando se trabaja con datos del mundo real."], "correct": [1], "multi": false, "explanation": "Los ataques de inyección de prompts pueden explotar el sistema de ingeniería rápida para manipular el comportamiento del modelo, siendo el principal riesgo de seguridad de esta técnica."}, {"id": 167, "text": "Una editorial desarrolló una solución basada en Retrieval Augmented Generation (RAG) (RAG) para que sus usuarios pudieran interactuar con el contenido publicado. Se publica contenido nuevo a diario. La empresa desea ofrecer una experiencia casi en tiempo real. ¿Qué pasos del proceso RAG debería implementar la empresa mediante el procesamiento por lotes sin conexión para cumplir con estos requisitos? (Seleccione dos).", "options": ["Generación de incrustaciones de contenido", "Generación de incrustaciones para consultas de usuario", "Creación del índice de búsqueda", "Recuperación de contenido relevante", "Generación de respuesta para el usuario"], "correct": [0], "multi": false, "explanation": "Las incrustaciones del contenido y el índice de búsqueda se pueden pre-calcular en batch cuando se publica nuevo contenido. Las incrustaciones de consultas y la recuperación/generación ocurren en tiempo real."}, {"id": 168, "text": "¿Qué técnica divide una tarea compleja en subtareas más pequeñas que se envían secuencialmente a un modelo de lenguaje grande (LLM)?", "options": ["One-shot prompting", "Prompt chaining", "Tree-of-thought prompting", "Retrieval Augmented Generation (RAG) (RAG)"], "correct": [1], "multi": false, "explanation": "El encadenamiento de indicaciones (prompt chaining) divide tareas complejas en pasos secuenciales, donde el output de cada paso se convierte en input del siguiente, manejando problemas complejos."}, {"id": 169, "text": "Un profesional de la IA necesita mejorar la precisión de un modelo de generación de lenguaje natural. El modelo utiliza datos de inventario que cambian rápidamente. ¿Qué técnica mejorará la precisión del modelo?", "options": ["Transfer learning", "Federated learning", "Retrieval Augmented Generation (RAG) (RAG)", "One-shot prompting"], "correct": [2], "multi": false, "explanation": "RAG conecta el modelo a datos externos actualizados en tiempo real (como inventario), asegurando que las respuestas siempre reflejen la información más reciente sin necesitar reentrenamiento."}, {"id": 170, "text": "Una empresa desea colaborar con varios institutos de investigación para desarrollar un modelo de IA. Necesita documentación estandarizada para el seguimiento de versiones del modelo y un registro de su desarrollo. ¿Qué solución cumple con estos requisitos?", "options": ["Realice un seguimiento de los cambios del modelo utilizando Git.", "Realice un seguimiento de los cambios en el modelo utilizando Amazon Fraud Detector.", "Realice un seguimiento de los cambios del modelo utilizando las tarjetas de modelo de Amazon SageMaker.", "Realice un seguimiento de los cambios del modelo utilizando Amazon Comprehend."], "correct": [2], "multi": false, "explanation": "Las Model Cards de SageMaker proporcionan un formato estandarizado para documentar y versionar modelos, incluyendo información sobre entrenamiento, rendimiento y limitaciones para colaboración."}, {"id": 171, "text": "Una empresa que utiliza varios modelos de aprendizaje automático desea identificar cambios en la calidad del modelo original para poder resolver cualquier problema. ¿Qué servicio o función de AWS cumple con estos requisitos?", "options": ["Amazon SageMaker JumpStart", "Amazon SageMaker HyperPod", "Amazon SageMaker Data Wrangler"], "correct": [0], "multi": false, "explanation": "SageMaker Model Monitor supervisa continuamente los modelos en producción, detectando cambios en la calidad (data drift, degradación del rendimiento) y generando alertas automáticas."}, {"id": 172, "text": "¿Cuál es el propósito de la segmentación en la Retrieval Augmented Generation (RAG) (RAG)?", "options": ["Para evitar las limitaciones de almacenamiento de la base de datos para documentos de texto grandes, almacenando partes o fragmentos del texto.", "Mejorar la eficiencia evitando la necesidad de convertir textos extensos en incrustaciones vectoriales.", "Mejorar la relevancia contextual de los resultados obtenidos del índice vectorial.", "Disminuir el costo de almacenamiento almacenando partes o fragmentos del texto."], "correct": [2], "multi": false, "explanation": "Dividir documentos en chunks más pequeños permite recuperar solo las secciones más relevantes para cada consulta, mejorando la precisión y relevancia contextual de las respuestas RAG."}, {"id": 173, "text": "Una empresa está desarrollando una aplicación de asistente editorial que utiliza IA generativa. Durante la fase piloto, el uso es bajo y el rendimiento de la aplicación no es un problema. La empresa no puede predecir el uso de la aplicación una vez que esté completamente implementada y desea minimizar los costos. ¿Qué solución cumplirá con estos requisitos?", "options": ["Utilice instancias de Amazon EC2 con GPU.", "Utilice Amazon Bedrock con rendimiento aprovisionado.", "Utilice Amazon Bedrock con rendimiento bajo demanda.", "Utilice Amazon SageMaker JumpStart."], "correct": [2], "multi": false, "explanation": "El rendimiento bajo demanda (on-demand) en Bedrock cobra solo por uso real, sin compromisos. Ideal para uso impredecible o bajo — el rendimiento aprovisionado requiere pago mínimo garantizado."}, {"id": 174, "text": "Una empresa implementó una aplicación de Retrieval Augmented Generation (RAG) (RAG) en Amazon Bedrock que recopila noticias financieras para distribuirlas en boletines diarios. Recientemente, algunos usuarios han reportado ideas con sesgo político en dichos boletines. ¿Qué medida de seguridad de Amazon Bedrock puede identificar y filtrar este contenido?", "options": ["Filtros de palabras", "Temas rechazados", "Filtros de información sensible", "Filtros de contenido"], "correct": [1], "multi": false, "explanation": "Los temas rechazados (denied topics) en Bedrock Guardrails permiten configurar áreas temáticas específicas (como política) que el modelo debe evitar, bloqueando respuestas sobre esos temas."}, {"id": 175, "text": "Una empresa financiera está desarrollando un sistema de detección de fraude que identifica posibles casos de fraude en transacciones con tarjeta de crédito. Los empleados evaluarán los casos de fraude identificados. La empresa desea minimizar el tiempo que los empleados dedican a revisar casos de fraude que en realidad no son fraudulentos. ¿Qué métrica de evaluación cumple con estos requisitos?", "options": ["Recordatorio", "Precisión", "Precisión", "Tabla de elevación"], "correct": [2], "multi": false, "explanation": "La precisión (precision) mide qué porcentaje de los casos marcados como fraude son realmente fraudes. Alta precisión = menos falsos positivos = menos tiempo revisando casos que no son fraude."}, {"id": 176, "text": "Una empresa diseñó un agente con inteligencia artificial para responder a las consultas de los clientes basándose en los manuales de producto. ¿Qué estrategia puede mejorar la confianza de los clientes en las respuestas del agente con IA?", "options": ["Escribir el nivel de confianza en la respuesta", "Incluir enlaces a los manuales de productos mencionados en la respuesta.", "Diseñar un avatar de agente que parezca una computadora", "Capacitar al agente para que responda en el estilo de lenguaje de la empresa."], "correct": [1], "multi": false, "explanation": "Incluir referencias y enlaces a las fuentes (manuales) permite a los usuarios verificar la información, aumentando la confianza y la transparencia de las respuestas del agente."}, {"id": 177, "text": "Un hospital desarrolló un sistema de IA para brindar recomendaciones de tratamiento personalizadas a los pacientes. El sistema de IA debe explicar el fundamento de las recomendaciones y hacer que la información sea accesible tanto para médicos como para pacientes. ¿Qué principio de diseño centrado en el ser humano se observa en este escenario?", "options": ["Explicabilidad", "Privacidad y seguridad", "Equidad", "Gobernanza de datos"], "correct": [0], "multi": false, "explanation": "La explicabilidad (explainability) es el principio de IA responsable que requiere que los sistemas puedan explicar sus decisiones de forma comprensible tanto para médicos como para pacientes."}, {"id": 178, "text": "¿Qué afirmación presenta una ventaja del uso de la Retrieval Augmented Generation (RAG) (RAG) para tareas de procesamiento del lenguaje natural (PLN)?", "options": ["RAG puede utilizar fuentes de conocimiento externas para generar respuestas más precisas e informativas.", "RAG está diseñado para mejorar la velocidad de entrenamiento de los modelos de lenguaje.", "RAG se utiliza principalmente para tareas de reconocimiento de voz.", "RAG es una técnica para el Data augmentation en tareas de visión por computadora."], "correct": [0], "multi": false, "explanation": "La principal ventaja de RAG es que permite al modelo acceder a conocimiento externo actualizado en tiempo real, generando respuestas más precisas sin necesitar reentrenamiento."}, {"id": 179, "text": "Una empresa ha creado un modelo personalizado mediante el ajuste de un modelo de lenguaje natural (LLM) existente de gran tamaño de Amazon Bedrock. La empresa desea implementar el modelo en producción y utilizarlo para gestionar un flujo constante de solicitudes por minuto. ¿Qué solución cumple estos requisitos de la forma más rentable?", "options": ["Implemente el modelo utilizando una instancia de computación optimizada de Amazon EC2.", "Utilice el modelo con rendimiento bajo demanda en Amazon Bedrock.", "Almacene el modelo en Amazon S3 y alójelo utilizando AWS Lambda.", "Adquiera el rendimiento aprovisionado para el modelo en Amazon Bedrock."], "correct": [3], "multi": false, "explanation": "Para flujos constantes y predecibles de solicitudes, el rendimiento aprovisionado en Bedrock es más rentable que on-demand — ofrece capacidad garantizada y menor costo por solicitud a alto volumen."}, {"id": 180, "text": "¿Qué técnica consiste en entrenar modelos de IA con conjuntos de datos etiquetados para adaptarlos a la terminología y los requisitos específicos de la industria?", "options": ["Data augmentation", "Ajuste fino", "Cuantización del modelo", "Entrenamiento previo continuo"], "correct": [1], "multi": false, "explanation": "El fine-tuning adapta un modelo preentrenado a un dominio específico usando datos etiquetados del sector, mejorando su rendimiento en la terminología y casos de uso particulares de esa industria."}, {"id": 181, "text": "Una empresa está creando un agente para su aplicación utilizando Amazon Bedrock Agents. El agente funciona correctamente, pero la empresa desea mejorar su precisión proporcionándole ejemplos específicos. ¿Qué solución cumple con estos requisitos?", "options": ["Modifique las indicaciones avanzadas para el agente para incluir los ejemplos.", "Cree una línea de seguridad para el agente que incluya los ejemplos.", "Utilice Amazon SageMaker Ground Truth para etiquetar los ejemplos.", "Ejecuta un script en AWS Lambda que agregue los ejemplos al conjunto de datos de entrenamiento."], "correct": [0], "multi": false, "explanation": "Las indicaciones avanzadas (advanced prompts) en Bedrock Agents permiten personalizar el comportamiento del agente incluyendo ejemplos específicos y contexto adicional."}, {"id": 182, "text": "¿Qué opción representa una ventaja al utilizar la Infrastructure as Code (IaC) (IaC) en las operaciones de aprendizaje automático (MLOps)?", "options": ["IaC elimina la necesidad de ajustar los hiperparámetros.", "IaC siempre proporciona instancias de computación potentes, lo que contribuye al entrenamiento de modelos más precisos.", "IaC simplifica la implementación de cargas de trabajo de aprendizaje automático escalables y consistentes en entornos de nube.", "IaC minimiza los gastos generales al desplegar únicamente instancias de bajo coste."], "correct": [2], "multi": false, "explanation": "IaC (como CloudFormation o Terraform) permite definir y versionar la infraestructura ML de forma reproducible, facilitando despliegues consistentes en múltiples entornos con mínimo esfuerzo."}, {"id": 183, "text": "Una empresa desea optimizar un modelo base (FM) para responder preguntas específicas de un dominio concreto. La empresa quiere utilizar el ajuste fino basado en instrucciones. ¿Cómo debería preparar los datos de entrenamiento?", "options": ["Reúna los documentos internos de la empresa y los materiales específicos del sector. Combine los documentos y materiales en un único archivo.", "Recopile reseñas externas de la empresa de diversas fuentes en línea. Etiquete manualmente cada reseña como positiva o negativa.", "Cree pares de preguntas y respuestas que aborden específicamente temas relacionados con el sector de actividad de la empresa.", "Crear indicaciones con pocos ejemplos para instruir al modelo a responder únicamente sobre conocimientos del dominio."], "correct": [2], "multi": false, "explanation": "El fine-tuning basado en instrucciones requiere pares de instrucción-respuesta (prompt-completion) específicos del dominio. Los pares de preguntas y respuestas del sector son exactamente este formato."}, {"id": 184, "text": "¿Qué técnica de aprendizaje automático garantiza el cumplimiento y la privacidad de los datos al entrenar modelos de IA en AWS?", "options": ["Aprendizaje por refuerzo", "Transfer learning", "Federated learning", "Aprendizaje no supervisado"], "correct": [2], "multi": false, "explanation": "El Federated learning entrena modelos en los datos localmente sin mover los datos a un servidor central, garantizando la privacidad y cumplimiento al mantener los datos en su origen."}, {"id": 185, "text": "Una empresa necesita personalizar un modelo base alojado en Amazon Bedrock. Seleccione el método de personalización de modelo correcto de la siguiente lista de requisitos de la empresa. Cada método de personalización de modelo debe seleccionarse una o más veces. [Pregunta de ordenamiento — ver imagen de respuesta]", "options": ["Mejorar rendimiento en tareas específicas con datos etiquetados = Fine-tuning; Conocimiento de dominio con documentos sin etiquetar = Continued pre-training; Reentrenar con datos sin etiquetar = Continued pre-training", "Fine-tuning para todo; RAG para conocimiento de dominio", "Continued pre-training para todo", "Destilación para datos etiquetados"], "correct": [0], "multi": false, "explanation": "Fine-tuning = datos etiquetados para tarea específica. Continued pre-training = datos sin etiquetar para conocimiento de dominio general. Ambos son métodos de personalización según el tipo de datos disponibles."}, {"id": 186, "text": "Una empresa manufacturera cuenta con una aplicación que recopila quejas de consumidores de fuentes públicas. La aplicación utiliza una lógica compleja y predefinida para procesar las quejas. La empresa desea escalar esta lógica a diferentes mercados y líneas de productos. ¿Qué ventajas ofrecen los modelos de IA generativa en este caso?", "options": ["Previsibilidad de los resultados", "Adaptabilidad", "Menor sensibilidad a los cambios en las entradas", "Explicabilidad"], "correct": [1], "multi": false, "explanation": "La adaptabilidad es la ventaja clave de la IA generativa — puede manejar variaciones en el lenguaje, mercados y tipos de quejas sin necesitar reglas específicas para cada caso."}, {"id": 187, "text": "Una empresa financiera desea clasificar toda la actividad con tarjetas de crédito como potencialmente fraudulenta o no fraudulenta basándose en los datos de las transacciones. ¿Qué tipo de modelo de aprendizaje automático cumple con estos requisitos?", "options": ["Regresión", "Difusión", "Clasificación binaria", "Clasificación multiclase"], "correct": [2], "multi": false, "explanation": "La clasificación binaria tiene exactamente dos clases de salida: fraude / no fraude. Es el modelo estándar para detección de fraude en transacciones."}, {"id": 188, "tex
